name: Sync ROME data

on:
  workflow_dispatch:
    inputs:
      rome_codes:
        description: "Codes ROME a synchroniser, separes par des virgules"
        required: false
        default: "M1607,M1805,K1303,A1203"
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  sync-rome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/sync-france-travail-rome.mjs
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          FT_SCOPE: "nomenclatureRome api_rome-fiches-metiersv1"
          FT_TOKEN_URL: ${{ vars.FT_TOKEN_URL }}
          FT_ROME_FICHES_METIERS_URL: ${{ vars.FT_ROME_FICHES_METIERS_URL }}
          FT_ROME_TEST_CODES: ${{ inputs.rome_codes || vars.FT_ROME_TEST_CODES || 'M1607,M1805,K1303,A1203' }}
      - name: Commit generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add creations/boussolepro/data/generated
          git commit -m "Update generated ROME data" || echo "No changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
