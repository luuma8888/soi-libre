name: Sync ROME data

on:
  workflow_dispatch:
    inputs:
      rome_codes:
        description: "Codes ROME a synchroniser, separes par des virgules. Laisser vide pour utiliser ROME_CODES ou la liste v0.3 par defaut."
        required: false
        default: ""
      raw_debug:
        description: "Generer debug/raw-structure-report.json pour auditer la structure brute sans valeurs sensibles."
        required: false
        default: "false"
      endpoint_diagnostic:
        description: "Tester plusieurs variantes d'appel fiche-metier sur quelques codes et generer debug/fiche-endpoint-diagnostic.json."
        required: false
        default: "false"
      endpoint_diagnostic_only:
        description: "Si true, lance seulement le diagnostic endpoint sans regenerer jobs.rome.json."
        required: false
        default: "false"
      diagnostic_codes:
        description: "Codes ROME pour le diagnostic endpoint, separes par des virgules."
        required: false
        default: "M1607,G1202,A1203"
      relations_diagnostic:
        description: "Generer debug/rome-relations-endpoint-diagnostic.json pour tester les routes de relations configurees."
        required: false
        default: "false"
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  sync-rome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node scripts/sync-france-travail-rome.mjs
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          FT_SCOPE: "nomenclatureRome api_rome-fiches-metiersv1"
          FT_SCOPE_METIERS: ${{ vars.FT_SCOPE_METIERS }}
          FT_SCOPE_COMPETENCES: ${{ vars.FT_SCOPE_COMPETENCES }}
          FT_SCOPE_CONTEXTES: ${{ vars.FT_SCOPE_CONTEXTES }}
          FT_TOKEN_URL: ${{ vars.FT_TOKEN_URL }}
          FT_ROME_FICHES_METIERS_URL: ${{ vars.FT_ROME_FICHES_METIERS_URL }}
          FT_ROME_METIERS_URL: ${{ vars.FT_ROME_METIERS_URL }}
          FT_ROME_COMPETENCES_URL: ${{ vars.FT_ROME_COMPETENCES_URL }}
          FT_ROME_CONTEXTES_URL: ${{ vars.FT_ROME_CONTEXTES_URL }}
          FT_RATE_LIMIT_MS: ${{ vars.FT_RATE_LIMIT_MS || '1100' }}
          ROME_CODES: ${{ inputs.rome_codes || vars.ROME_CODES || '' }}
          ROME_DEBUG_CODES: ${{ vars.ROME_DEBUG_CODES || 'M1607,M1805,K1303,A1203' }}
          ROME_RAW_DEBUG: ${{ inputs.raw_debug || vars.ROME_RAW_DEBUG || 'false' }}
          ROME_ENDPOINT_DIAGNOSTIC: ${{ inputs.endpoint_diagnostic || 'false' }}
          ROME_ENDPOINT_DIAGNOSTIC_ONLY: ${{ inputs.endpoint_diagnostic_only || 'false' }}
          ROME_DIAGNOSTIC_CODES: ${{ inputs.diagnostic_codes || 'M1607,G1202,A1203' }}
      - name: Diagnostic relations ROME
        if: ${{ inputs.relations_diagnostic == 'true' }}
        run: node scripts/diagnose-rome-relations-endpoints.mjs
        continue-on-error: true
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          FT_SCOPE: "nomenclatureRome api_rome-fiches-metiersv1"
          FT_SCOPE_METIERS: ${{ vars.FT_SCOPE_METIERS }}
          FT_SCOPE_CONTEXTES: ${{ vars.FT_SCOPE_CONTEXTES }}
          FT_TOKEN_URL: ${{ vars.FT_TOKEN_URL }}
          FT_ROME_FICHES_METIERS_URL: ${{ vars.FT_ROME_FICHES_METIERS_URL }}
          FT_ROME_METIERS_URL: ${{ vars.FT_ROME_METIERS_URL }}
          FT_ROME_CONTEXTES_URL: ${{ vars.FT_ROME_CONTEXTES_URL }}
          FT_RATE_LIMIT_MS: ${{ vars.FT_RATE_LIMIT_MS || '1100' }}
          ROME_RELATIONS_DIAGNOSTIC_CODES: ${{ inputs.diagnostic_codes || 'M1607,G1202,A1203' }}
      - name: Commit generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add creations/boussolepro/data/generated
          git commit -m "Update generated ROME data" || echo "No changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
