name: Generate market data

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = structure seule, false = appel réel. L’échec sur résultat vide dépend de MARKET_FAIL_ON_EMPTY."
        required: false
        default: ""
      territory:
        description: "Territoires cibles, ex. FR,REG-76,DEP-11. Vide = variable MARKET_TERRITORIES."
        required: false
        default: ""
      rome_codes:
        description: "Codes ROME cibles, ex. G1202,K1207,M1607. Vide = MARKET_ROME_CODES puis ROME_CODES."
        required: false
        default: ""
      period_type:
        description: "Type de période, ex. TRIMESTRE. Vide = variable MARKET_PERIOD_TYPE."
        required: false
        default: ""
      source:
        description: "Sources prévues, ex. api_marche_travail,bmo. Vide = variable MARKET_SOURCE."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Generate static market data
        run: node scripts/generate-market-data.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run || vars.MARKET_DRY_RUN || 'true' }}
          MARKET_TERRITORIES: ${{ inputs.territory || vars.MARKET_TERRITORIES || 'FR,REG-76,DEP-11' }}
          MARKET_SOURCE: ${{ inputs.source || vars.MARKET_SOURCE || 'api_marche_travail,bmo' }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          FT_MARKET_SCOPE: ${{ vars.FT_MARKET_SCOPE }}
          FT_MARKET_TOKEN_URL: ${{ vars.FT_MARKET_TOKEN_URL }}
          FT_MARKET_API_URL: ${{ vars.FT_MARKET_API_URL }}
          MARKET_EXTRA_QUERY: ${{ vars.MARKET_EXTRA_QUERY }}
          MARKET_ROME_CODES: ${{ inputs.rome_codes || vars.MARKET_ROME_CODES || vars.ROME_CODES || '' }}
          MARKET_ACTIVITY_TYPE: ${{ vars.MARKET_ACTIVITY_TYPE || 'ROME' }}
          MARKET_PERIOD_TYPE: ${{ inputs.period_type || vars.MARKET_PERIOD_TYPE || 'TRIMESTRE' }}
          MARKET_NOMENCLATURE_TYPE: ${{ vars.MARKET_NOMENCLATURE_TYPE || 'ORIGINEOFF' }}
          MARKET_USE_GLOBAL_TERRITORY_CALL: ${{ vars.MARKET_USE_GLOBAL_TERRITORY_CALL || 'false' }}
          MARKET_FAIL_ON_EMPTY: ${{ vars.MARKET_FAIL_ON_EMPTY || 'false' }}
          MARKET_DEBUG_SAMPLE: ${{ vars.MARKET_DEBUG_SAMPLE || 'false' }}
          MARKET_REQUEST_DELAY_MS: ${{ vars.MARKET_REQUEST_DELAY_MS || '250' }}
          BMO_DATA_URL: ${{ vars.BMO_DATA_URL }}
          FAP_ROME_MAPPING_URL: ${{ vars.FAP_ROME_MAPPING_URL }}
      - name: Commit generated market data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add creations/boussolepro/data/generated/market
          git commit -m "Update generated market data" || echo "No changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
