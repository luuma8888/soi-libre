    const output = target.parentElement?.querySelector("[data-range-output]");
    if (output) output.textContent = target.value;
  }
  scheduleSaveAndMatch();
}

function handleActionClick(event) {
  const target = event.target.closest("button");
  if (!target) return;
  const stepGo = target.dataset.stepGo;
  if (stepGo !== undefined) {
    App.state.stepIndex = Number(stepGo);
    renderAll();
    return;
  }
  if (target.dataset.importType) {
    App.state.pendingImportType = target.dataset.importType;
    App.dom.datasetFileInput.click();
    return;
  }
  const action = target.dataset.action;
  if (target.dataset.mainView) {
    App.state.mainView = target.dataset.mainView;
    renderAll();
    return;
  }
  if (action === "launch-results") {
    App.state.profile.hasRequestedResults = true;
    App.state.profile.completedBoussole = canLaunchResults(App.state.profile);
    saveProfile();
    calculateAndStoreResults();
    App.state.mainView = "results";
    renderAll();
    return;
  }
  if (action === "import-profile") App.dom.profileFileInput.click();
  if (action === "theme-toggle") toggleTheme();
  if (action === "export-profile") exportProfile();
  if (action === "export-results-json") exportResults("json");
  if (action === "export-results-md") exportResults("markdown");
  if (action === "reset-profile") resetProfile();
  if (action === "reset-weights") applyWeightPreset("default");
  if (action === "preset-fast-access") applyWeightPreset("fast_access");
  if (action === "preset-values") applyWeightPreset("values");
  if (action === "export-corpus") downloadFile(`boussole-pro-corpus-${dateStamp()}.json`, JSON.stringify(App.state.dataset, null, 2), "application/json");
  if (action === "export-quality") downloadFile(`boussole-pro-rapport-qualite-${dateStamp()}.json`, JSON.stringify(generateDataQualityReport(App.state.dataset), null, 2), "application/json");
  if (action === "load-generated-rome") loadGeneratedRomeDataset();
  if (action === "clear-api-test") clearApiTestConfig();
  if (action === "test-ft-token") testFranceTravailToken();
  if (action === "test-rome-metiers") testRomeMetiers();
  if (action === "test-rome-competences") testRomeCompetences();
  if (action === "test-rome-contextes") testRomeContextes();
  if (action === "test-rome-fiches") testRomeFichesMetiers();
  if (action === "build-api-corpus") buildApiCorpusFromManualTest();
  if (action === "reset-sample") resetToSampleData();
  if (action === "print") window.print();
  if (action === "remove-compare") {
    App.state.compareIds = App.state.compareIds.filter(id => id !== target.dataset.jobId);
    renderResults();
    showToast("Métier retiré du comparatif.");
    document.querySelector("[data-compare-panel]")?.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  const resultAction = target.dataset.resultAction;
  if (!resultAction) return;
  const card = target.closest("[data-job-id]");
  const jobId = card?.dataset.jobId;
  const result = findResult(jobId);
  if (!result) return;
  if (resultAction === "details") {
    card.querySelector("[data-details-panel]")?.classList.toggle("is-open");
  }
  if (resultAction === "variants") openJobDialog(result, "variants");
  if (resultAction === "why") openJobDialog(result, "why");
  if (resultAction === "trainings") openJobDialog(result, "trainings");
  if (resultAction === "compare") addToCompare(jobId);
}

function updateProfileFromTarget(target) {
  const profile = App.state.profile;
  if (target.dataset.array) {
    const key = target.dataset.array;
    const set = new Set(toArray(profile[key]));
    if (target.checked) set.add(target.value);
    else set.delete(target.value);
    profile[key] = Array.from(set);
    return;
  }
  if (target.dataset.constraint) {
    setConstraintSeverity(profile, target.dataset.constraint, target.value);
    return;
  }
  if (target.dataset.weight) {
    profile.criterionWeights[target.dataset.weight] = Number(target.value);
    return;
  }
  const field = target.dataset.field;
  if (!field) return;
  const value = target.type === "number" ? Number(target.value) : target.value;
  if (field === "experiencesText") {
    profile.experiences = textToExperiences(target.value);
  } else if (field === "diplomasText") {
    profile.diplomas = lines(target.value);
  } else if (field === "customSkillsText") {
    profile.customSkills = splitLooseList(target.value);
  } else if (field === "exclusionsDomainsText") {
    profile.exclusions = profile.exclusions || { jobIds: [], domains: [], tags: [] };
    profile.exclusions.domains = lines(target.value);
  } else {
    setDeep(profile, field, value);
  }
}

function evaluateConstraintAgainstJob(value, job, criteria) {
  const physicalTags = toArray(job.physicalConstraints?.tags);
  const schedule = job.scheduleConstraints || {};
  const mobility = job.mobilityConstraints || {};
  const labels = Object.fromEntries(CONSTRAINT_OPTIONS.map(item => [item.value, item.label]));
  const base = { label: labels[value] || value, category: "constraint", status: "compatible", message: "" };
  if (value === "nightWork") return scheduleStatus(schedule.nightWork, base, "horaire", "Ce metier semble impliquer du travail de nuit.");
  if (value === "weekendWork") return scheduleStatus(schedule.weekendWork, base, "horaire", "Ce metier semble impliquer du travail le week-end.");
  if (value === "heavyLoad") return tagStatus(physicalTags.includes("load") || job.physicalConstraints?.level === "high", base, "intensite physique", "Ce metier semble impliquer du port de charges ou une intensite physique forte.");
  if (value === "standing") return tagStatus(physicalTags.includes("standing") || physicalTags.includes("movement") || job.physicalConstraints?.level === "high", base, "intensite physique", "Ce metier semble demander une station debout importante.");
  if (value === "noise") return tagStatus(physicalTags.includes("noise") || job.workContexts.includes("ctx-noise") || job.workContexts.includes("ctx-factory"), base, "environnement", "Ce metier peut se derouler dans un environnement bruyant.");
  if (value === "publicContact") return levelStatus(["medium", "high"].includes(job.publicContactLevel), base, "relationnel", "Ce metier implique un contact public notable.");
  if (value === "travel") return levelStatus(["medium", "high"].includes(mobility.travelFrequency), base, "mobilite", "Ce metier semble demander des deplacements reguliers.");
  if (value === "driverLicenseRequired") return levelStatus(Boolean(mobility.driverLicenseRequired) && !criteria.mobility.driverLicenses.includes("B"), base, "permis", "Ce metier semble demander le permis B, absent du profil.");
  if (value === "longTraining") {
    const gap = (job.requiredDiplomaLevel || job.recommendedDiplomaLevel || 0) - (criteria.education.highestLevel || 0);
    return levelStatus(gap >= 2 || toArray(job.requiredCertifications).length > 0, base, "formation", "Cette piste demande probablement une formation ou certification significative.");
  }
  if (value === "screenWork") return tagStatus(physicalTags.includes("screen") || job.workContexts.includes("ctx-office") || job.remoteCompatibility !== "none", base, "environnement", "Ce metier peut impliquer un travail sur ecran prolonge.");
  if (value === "remoteNeeded") return levelStatus(job.remoteCompatibility === "none" || job.remoteCompatibility === "low", base, "lieu", "Ce metier semble surtout presentiel.");
  return { ...base, status: "unknown", message: "Donnee non disponible dans le corpus." };
}

function scheduleStatus(value, base, category, message) {
  if (!value || value === "unknown") return { ...base, status: "unknown", category };
  if (["required", "frequent"].includes(value)) return { ...base, status: "confirmed_incompatible", category, message };
  if (value === "possible") return { ...base, status: "confirmed_incompatible", category, message: `${message} selon les postes.` };
  return { ...base, status: "compatible", category };
}

function tagStatus(condition, base, category, message) {
  return condition ? { ...base, status: "confirmed_incompatible", category, message } : { ...base, status: "compatible", category };
}

function levelStatus(condition, base, category, message) {
  return condition ? { ...base, status: "confirmed_incompatible", category, message } : { ...base, status: "compatible", category };
}

function calculateConfidence(criteria, job, details = [], unknown = []) {
  const requiredFields = ["title", "domain", "family", "description", "requiredSkills", "workContexts", "sourceRefs"];
  const present = requiredFields.filter(field => {
    const value = job[field];
    return Array.isArray(value) ? value.length > 0 : Boolean(value);
  }).length;
  const jobDataCompleteness = present / requiredFields.length;
  const profileCompleteness = criteria.completeness || 0.2;
  const sourceConfidence = job.confidence ?? job.dataQuality?.confidence ?? 0.4;
  const mappingConfidence = job.sourceRefs?.length ? 0.6 : 0.35;
  const freshnessScore = job.provenance === "sample" ? 0.65 : 0.8;
  const penalties = details.reduce((sum, item) => sum + (item.confidencePenalty || 0), 0) + unknown.length * 0.04;
  return Math.round(clamp((jobDataCompleteness * 0.3 + profileCompleteness * 0.25 + sourceConfidence * 0.2 + mappingConfidence * 0.15 + freshnessScore * 0.1 - penalties) * 100, 20, 98));
}

function computeJobSimilarity(jobA, jobB) {
  const skillScore = jaccard([...jobA.requiredSkills, ...jobA.optionalSkills], [...jobB.requiredSkills, ...jobB.optionalSkills]);
  const tagScore = jaccard([...jobA.interestTags, ...jobA.transitionTags], [...jobB.interestTags, ...jobB.transitionTags]);
  const familyScore = jobA.family === jobB.family ? 0.28 : 0;
  const relatedScore = jobA.relatedJobs.includes(jobB.id) || jobB.relatedJobs.includes(jobA.id) ? 0.3 : 0;
  const romeScore = jobA.romeCode && jobA.romeCode === jobB.romeCode ? 0.3 : 0;
  return clamp(skillScore * 0.3 + tagScore * 0.25 + familyScore + relatedScore + romeScore, 0, 1);
}

function isVariantOf(candidate, selected) {
  const jobA = candidate.job;
  const jobB = selected.job;
  if (!jobA || !jobB) return false;
  if (jobA.romeCode && jobA.romeCode === jobB.romeCode) return true;
  if (jobA.relatedJobs.includes(jobB.id) || jobB.relatedJobs.includes(jobA.id)) return true;
  return computeJobSimilarity(jobA, jobB) >= 0.76;
}

function calculateDiversityScore(candidate, selected) {
  if (!selected.length) return candidate.globalScore + 5;
  let score = candidate.globalScore;
  selected.forEach(item => {
    if (item.job.family === candidate.job.family) score -= 12;
    if (item.job.domain === candidate.job.domain) score -= 6;
    if (jaccard(item.job.requiredSkills, candidate.job.requiredSkills) > 0.45) score -= 5;
  });
  const directions = new Set(selected.flatMap(item => item.job.transitionTags || []));
  const newTags = (candidate.job.transitionTags || []).filter(tag => !directions.has(tag)).length;
  score += Math.min(newTags, 2) * 3;
  return score;
}

function weightedGlobalScore(scores, criterionWeights = CONFIG.baseWeights) {
  const weights = { ...CONFIG.baseWeights, ...(criterionWeights || {}) };
  const totalWeight = Object.values(weights).reduce((sum, value) => sum + Number(value || 0), 0) || 100;
  const weighted = Object.entries(CONFIG.baseWeights).reduce((sum, [key, baseMax]) => {
    const ratio = baseMax ? (scores[key] || 0) / baseMax : 0;
    return sum + ratio * Number(weights[key] || 0);
  }, 0);
  return Math.round(clamp((weighted / totalWeight) * 100, 0, 100));
}

function findSuggestedTrainings(job, datasets) {
  return (datasets.trainings || []).filter(training =>

function detectDatasetType(data, forcedType) {
  if (forcedType && forcedType !== "corpus") return forcedType;
  const payload = data.data || data;
  const explicitType = payload.datasetType || payload.sourceType || payload.type;
  if (Object.values(DATASET_TYPES).includes(explicitType)) return explicitType;
  if (Array.isArray(payload)) {
    const first = payload[0] || {};
    const source = normalizeText(first.source || first.provenance || first.type || "");
    if (source.includes("onisep") && (first.durationMonths || first.dureeMois || first.niveauSortie)) return DATASET_TYPES.onisepFormations;
    if (source.includes("onisep")) return DATASET_TYPES.onisepMetiers;
    if (first.rncpCode || first.rsCode) return DATASET_TYPES.rncp;
    if (first.certifInfo || first.codeCertifInfo) return DATASET_TYPES.certifInfo;
    if (first.codeRome || first.romeCode || first.code) return DATASET_TYPES.romeMetiers;
    if (first.requiredSkills || first.romeCode) return "jobs";
    if (first.label && first.type) return "skills";
    if (first.trainingType || first.durationMonths) return "trainings";
  }
  if (payload.metiers || payload.romeMetiers) return DATASET_TYPES.romeMetiers;
  if (payload.competences || payload.romeCompetences) return DATASET_TYPES.romeCompetences;
  if (payload.contextes || payload.contextesTravail) return DATASET_TYPES.romeContextes;
  if (payload.fichesMetiers) return DATASET_TYPES.romeFichesMetiers;
  if (payload.formations && normalizeText(payload.source || payload.provenance).includes("onisep")) return DATASET_TYPES.onisepFormations;
  if (payload.rncp || payload.rs) return DATASET_TYPES.rncp;
  if (payload.certifInfo) return DATASET_TYPES.certifInfo;
  if (payload.jobs) return "corpus";
  if (payload.skills) return "skills";
  if (payload.trainings) return "trainings";
  return forcedType || "corpus";
}

function getDatasetRows(data, keys = []) {
  const payload = data.data || data;
  if (Array.isArray(payload)) return payload;
  for (const key of keys) {
    if (Array.isArray(payload[key])) return payload[key];
  }
  return extractArrayFromApiResponse(payload);
}

function calculateProfileCompleteness(profile) {
  if (!profile) return 0;
  const skillCount = toArray(profile.skills).length + toArray(profile.customSkills).length + getSkillSignalCount(profile);
  const parts = [
    Boolean(profile.profileName),
    profile.ageRange && profile.ageRange !== "not_specified",
    Number(profile.diplomaLevel) > 0,
    profile.trainingOpenness && profile.trainingOpenness !== "not_specified",
    skillCount > 0,
    toArray(profile.interests).length > 0,
    toArray(profile.values).length > 0,
    toArray(profile.constraints).some(item => item.severity && item.severity !== "open"),
    toArray(profile.preferredWorkStyles).length > 0 || toArray(profile.preferredEnvironments).length > 0,
    profile.availability?.hoursPerWeek && profile.availability.hoursPerWeek !== "not_specified",
    toArray(profile.experienceDomains).length > 0 || toArray(profile.experiences).length > 0,
    profile.searchHorizon && profile.searchHorizon !== "not_specified"
  ];
  return parts.filter(Boolean).length / parts.length;
}

function getProfileReadiness(profile) {
  const missingItems = [];
  if (!profile.profileName) missingItems.push("Donner un nom au profil.");
  if (!profile.ageRange || profile.ageRange === "not_specified") missingItems.push("Choisir une tranche d’âge ou indiquer que vous préférez ne pas répondre.");
  if (!profile.availability?.hoursPerWeek || profile.availability.hoursPerWeek === "not_specified") missingItems.push("Préciser une disponibilité approximative.");
  if (!profile.trainingOpenness || profile.trainingOpenness === "not_specified") missingItems.push("Indiquer votre ouverture à la formation.");
  if (toArray(profile.skills).length + toArray(profile.customSkills).length + getSkillSignalCount(profile) === 0) missingItems.push("Cocher au moins un test rapide de compétence ou une compétence avancée.");
  if (toArray(profile.interests).length === 0 && toArray(profile.values).length === 0) missingItems.push("Choisir au moins une envie ou une valeur.");
  if (toArray(profile.preferredWorkStyles).length === 0 && toArray(profile.preferredEnvironments).length === 0) missingItems.push("Choisir au moins un repère de cadre idéal.");
  return {
    ok: missingItems.length <= 2,
    missing: missingItems.slice(0, 6)
  };
}

function canLaunchResults(profile) {
  return getProfileReadiness(profile).ok;
}

function getSkillSignalCount(profile) {
  return toArray(profile?.skillSignals).length;
}

function getSkillIdsFromSignals(profile) {
  const selected = new Set(toArray(profile?.skillSignals));
  const skillIds = [];
  SKILL_TESTS.forEach(group => {
    group.questions.forEach((question, index) => {
      if (!selected.has(`${group.id}:${index}`)) return;
      skillIds.push(...toArray(group.mapsToSkills));
    });
  });
  return unique(skillIds);
}

function migrateTrainingOpenness(value) {
  if (value === "short") return "short_2_weeks_3_months";
  if (value === "long") return "long_1_3_years";
  if (value === "maybe") return "open_if_meaningful";
  return value || "not_specified";
}

function allowsShortTraining(value) {
  return ["micro_0_2_weeks", "short_2_weeks_3_months", "medium_3_12_months", "long_1_3_years", "very_long_3_years_plus", "open_if_meaningful"].includes(migrateTrainingOpenness(value));
}

function allowsLongTraining(value) {
  return ["medium_3_12_months", "long_1_3_years", "very_long_3_years_plus", "open_if_meaningful"].includes(migrateTrainingOpenness(value));
}

function buildIssue(severity, type, entityType, entityId, message, recommendation) {
  return { id: `${type}-${slug(entityId || "dataset")}`, severity, type, entityType, entityId, message, recommendation };
}

function exclusion(code, label, category, message) {
  return { schemaVersion: CONFIG.schemaVersion, id: `exclusion-${code}`, code, label, category, severity: "hard", message };
}

function missing(field, impact, message) {
  return { field, impact, message };
}

function metric(label, value) {
  return `<div class="metric"><strong>${h(String(value))}</strong><span>${h(label)}</span></div>`;
}

function inputField(label, field, value = "", type = "text", placeholder = "") {
  return `<label class="form-row"><span>${h(label)}</span><input type="${h(type)}" data-field="${h(field)}" value="${h(value ?? "")}" placeholder="${h(placeholder)}"></label>`;
}

function textareaField(label, field, value = "", placeholder = "") {
  return `<label class="form-row full"><span>${h(label)}</span><textarea data-field="${h(field)}" placeholder="${h(placeholder)}">${h(value || "")}</textarea></label>`;
}

function selectField(label, field, value, options) {
  return `<label class="form-row"><span>${h(label)}</span><select data-field="${h(field)}">${options.map(option => `<option value="${h(String(option[0]))}" ${String(value) === String(option[0]) ? "selected" : ""}>${h(option[1])}</option>`).join("")}</select></label>`;
}

function checkboxTag(arrayName, value, label, meta, checked) {
  return `<label class="tag-option"><input type="checkbox" data-array="${h(arrayName)}" value="${h(value)}" ${checked ? "checked" : ""}><span><span class="tag-name">${h(label)}</span><span class="tag-meta">${h(meta || "")}</span></span></label>`;
}

function constraintSelect(option, value) {
  return `<label class="constraint-item"><span>${h(option.label)}</span><select data-constraint="${h(option.value)}">${[
    ["open", "Ouvert"],
    ["conditional", "Sous conditions"],
    ["avoid", "A eviter"],
    ["excluding", "Excluant"]
  ].map(item => `<option value="${item[0]}" ${value === item[0] ? "selected" : ""}>${item[1]}</option>`).join("")}</select></label>`;
}

function weightSlider(label, key) {
  const value = App.state.profile.criterionWeights?.[key] ?? CONFIG.baseWeights[key];
  return `<label class="form-row"><span>${h(label)}</span><span class="range-row"><input type="range" min="0" max="35" step="1" data-weight="${h(key)}" value="${h(value)}"><strong data-range-output>${h(value)}</strong></span></label>`;
}

function stepButtons() {
  const prev = Math.max(0, App.state.stepIndex - 1);
  const next = Math.min(BOUSSOLE_STEPS.length - 1, App.state.stepIndex + 1);
  if (App.state.stepIndex >= BOUSSOLE_STEPS.length - 1) {
    return `<div class="button-row" style="margin-top:16px">
      <button class="ghost-button" type="button" data-step-go="${prev}">Étape précédente</button>
    </div>`;
  }
  return `<div class="button-row" style="margin-top:16px">
    <button class="ghost-button" type="button" data-step-go="${prev}">Étape précédente</button>
    <button class="primary-button" type="button" data-step-go="${next}">Passer / continuer</button>
  </div>`;
}

function diplomaOptions(dataset) {
  return (dataset.diplomaLevels || []).map(item => [String(item.level), item.label]);
}

function getConstraintSeverity(profile, value) {
  return (profile.constraints || []).find(item => item.value === value)?.severity || "open";
}

function setConstraintSeverity(profile, value, severity) {
  profile.constraints = mergeConstraints(profile.constraints || []);
  const item = profile.constraints.find(constraint => constraint.value === value);
  if (item) item.severity = severity;
}

function mergeConstraints(existing) {
  return CONSTRAINT_OPTIONS.map(option => {
    const found = toArray(existing).find(item => item.value === option.value || item.id === `constraint-${option.value}`);
    return {
      id: found?.id || `constraint-${option.value}`,
      type: found?.type || option.type,
      label: found?.label || option.label,
      value: option.value,
      severity: found?.severity || "open"
    };
  });
}

function collectJobContextTags(job) {
  const contextRows = (App.state.dataset?.workContexts || []).filter(ctx => job.workContexts.includes(ctx.id));
  return unique(contextRows.flatMap(ctx => ctx.constraintTags || []));
}

function contextPreferenceMatches(pref, job, tags) {
  if (pref === "quiet") return tags.includes("quiet") || job.workContexts.includes("ctx-quiet");
  if (pref === "outdoor") return tags.includes("outdoor");
  if (pref === "office") return job.workContexts.includes("ctx-office");
  if (pref === "remote") return job.remoteCompatibility === "high" || job.remoteCompatibility === "partial";
  if (pref === "human-scale") return job.publicContactLevel !== "unknown";
  if (pref === "movement") return tags.includes("standing") || tags.includes("field") || tags.includes("outdoor");
  if (pref === "children") return tags.includes("children");
  if (pref === "animals") return tags.includes("animals");
  if (pref === "structured") return job.transitionTags.includes("organisation") || job.valueTags.includes("stability");
  if (pref === "autonomous") return job.autonomyLevel === "high";
  if (pref === "team") return job.workContexts.includes("ctx-team");
  if (pref === "relational") return ["medium", "high"].includes(job.publicContactLevel);
  if (pref === "manual") return job.transitionTags.includes("manuel") || tags.includes("manual");
  if (pref === "creative") return job.transitionTags.includes("creation") || job.interestTags.includes("creer");
  if (pref === "analytical") return job.interestTags.includes("analyser") || job.transitionTags.includes("analyse");
  if (pref === "field") return tags.includes("field") || tags.includes("travel");
  if (pref === "day") return !["frequent", "required"].includes(job.scheduleConstraints?.nightWork);
  if (pref === "flexible") return !["required"].includes(job.scheduleConstraints?.nightWork);
  return false;
}

function hasRelatedCustomSkill(customSkills, skillId, datasets) {
  const skill = (datasets.skills || []).find(item => item.id === skillId);
  if (!skill) return false;
  const haystack = [skill.label, ...(skill.aliases || []), skill.category].map(normalizeText);
  return customSkills.some(input => haystack.some(text => text.includes(input) || input.includes(text)));
}

function weightedTagScore(inputs, tags, max) {
  if (!inputs.length) return max / 2;
  const matches = inputs.filter(input => tagMatches(input, tags)).length;
  return (matches / inputs.length) * max;
}

function tagMatches(input, tags) {
  const normalized = normalizeText(input);
  return toArray(tags).some(tag => {
    const t = normalizeText(tag);
    return t === normalized || t.includes(normalized) || normalized.includes(t);
  });
}

function jaccard(a, b) {
  const setA = new Set(toArray(a));
  const setB = new Set(toArray(b));
  if (!setA.size && !setB.size) return 0;
  let intersection = 0;
  setA.forEach(item => { if (setB.has(item)) intersection += 1; });
  return intersection / new Set([...setA, ...setB]).size;
}

function findJob(jobId) {
  return (App.state.dataset?.jobs || []).find(job => job.id === jobId);
}

function findResult(jobId) {
  return (App.state.results?.completeList || []).find(result => result.jobId === jobId);
}

function getSkillLabel(skillId, datasets = App.state.dataset) {
  return (datasets.skills || []).find(skill => skill.id === skillId)?.label || skillId;
}

function getDiplomaLabel(level) {
  const item = (App.state.dataset?.diplomaLevels || []).find(row => Number(row.level) === Number(level));
  return item?.label || "Non renseigne";
}

function scoreLabel(key) {
  return {
    skills: "Competences",
    training: "Formation",
    constraints: "Contraintes",
    values: "Envies / valeurs",
    context: "Contexte",
    market: "Marche"
  }[key] || key;
}

function statusLabel(status) {
  return I18N.fr[status] || status;
}

function statusBadgeClass(status) {
  if (status === "possible_now") return "sage";
  if (status.includes("training")) return "gold";
  if (status === "excluded_for_now" || status === "discouraged") return "rose";
  return "opal";
}

function levelCoefficient(level) {
  return { beginner: 0.4, practiced: 0.6, autonomous: 0.85, confirmed: 1 }[level] || 0.85;
}

function setDeep(object, path, value) {
  const parts = path.split(".");
  let current = object;
  parts.slice(0, -1).forEach(part => {
    current[part] = current[part] || {};
    current = current[part];
  });
  current[parts.at(-1)] = value;
}

function getDeep(object, path) {
  return String(path || "").split(".").reduce((current, part) => current && current[part] !== undefined ? current[part] : undefined, object);
}

function deepMerge(target, source) {
  Object.entries(source || {}).forEach(([key, value]) => {
    if (value && typeof value === "object" && !Array.isArray(value)) {
      target[key] = target[key] || {};
      deepMerge(target[key], value);
    } else if (value !== undefined) {
      target[key] = value;
    }
  });
  return target;
}

function extractArrayFromApiResponse(response) {
  if (!response) return [];
  if (Array.isArray(response)) return response;
  return response.resultats || response.results || response.data || response.items || response.liste || [];
}

function sleep(ms) {
  return new Promise(resolve => window.setTimeout(resolve, ms));
}

function isProfileFieldFilled(profile, field) {
  const value = field === "mobilityRadius" ? profile.mobility?.radiusKm : getDeep(profile, field);
  if (field === "skillTests") return toArray(profile.skillSignals).length > 0;
  if (field === "directSkills") return toArray(profile.skills).length > 0 || toArray(profile.customSkills).length > 0;
  if (Array.isArray(value)) return value.length > 0;
  if (field === "constraints") return toArray(profile.constraints).some(item => item.severity && item.severity !== "open");
  if (value && typeof value === "object") return Object.values(value).some(Boolean);
  return value !== undefined && value !== null && value !== "" && value !== "not_specified" && value !== "unknown";
}

function experiencesToText(experiences) {
  return toArray(experiences).map(item => typeof item === "string" ? item : `${item.domain || ""}${item.years ? " - " + item.years + " ans" : ""}`).join("\n");
}

function textToExperiences(text) {
  return lines(text).map(line => {
    const parts = line.split("-").map(part => part.trim()).filter(Boolean);
    const yearsMatch = line.match(/(\d+)/);
    return { domain: parts[0] || line, years: yearsMatch ? Number(yearsMatch[1]) : null };
  });
}

function splitLooseList(text) {
  return unique(String(text || "").split(/[\n,;]/).map(item => item.trim()).filter(Boolean));
}

function lines(text) {
  return String(text || "").split(/\n/).map(item => item.trim()).filter(Boolean);
}

function toArray(value) {
  if (Array.isArray(value)) return value.filter(item => item !== undefined && item !== null && item !== "");
  if (value === undefined || value === null || value === "") return [];
  return [value];
}

function unique(values) {
  return Array.from(new Set(toArray(values)));
}

function uniqueBy(items, key) {
  const seen = new Set();
  return items.filter(item => {
    const value = item[key];
    if (seen.has(value)) return false;
    seen.add(value);
    return true;
  });
}

function uniqueObjectsBy(items, key) {
  const seen = new Set();
  return items.filter(item => {
    const value = item[key] || JSON.stringify(item);
    if (seen.has(value)) return false;
    seen.add(value);
    return true;
  });
}

function take(items, count) {
  return toArray(items).slice(0, count);
}

function numberOrNull(value) {
  if (value === undefined || value === null || value === "") return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function ratio(part, total) {
  return total ? Number((part / total).toFixed(2)) : 0;
}

function percent(value) {
  return `${Math.round((value || 0) * 100)}%`;
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function slug(value) {
  return normalizeText(value).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || cryptoRandom();
}

function normalizeText(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function frText(value) {
  const replacements = [
    ["Developpeur", "Développeur"], ["developpeur", "développeur"], ["developpement", "développement"], ["developpe", "développe"],
    ["Donnees", "Données"], ["donnees", "données"], ["Competences", "Compétences"], ["competences", "compétences"],
    ["Metier", "Métier"], ["metier", "métier"], ["Metiers", "Métiers"], ["metiers", "métiers"],
    ["Deplacements", "Déplacements"], ["deplacements", "déplacements"], ["prolongee", "prolongée"], ["prolonge", "prolongé"],
    ["Presentiel", "Présentiel"], ["presentiel", "présentiel"], ["Teletravail", "Télétravail"], ["teletravail", "télétravail"],
    ["Securite", "Sécurité"], ["securite", "sécurité"], ["Liberte", "Liberté"], ["liberte", "liberté"],
    ["Precision", "Précision"], ["precision", "précision"], ["Beaute", "Beauté"], ["beaute", "beauté"],
    ["Qualite", "Qualité"], ["qualite", "qualité"], ["Mediateur", "Médiateur"], ["mediateur", "médiateur"],
    ["Redacteur", "Rédacteur"], ["redacteur", "rédacteur"], ["Secretaire", "Secrétaire"], ["secretaire", "secrétaire"],
    ["Sante", "Santé"], ["sante", "santé"], ["Numerique", "Numérique"], ["numerique", "numérique"],
    ["Batiment", "Bâtiment"], ["batiment", "bâtiment"], ["Equipe", "Équipe"], ["equipe", "équipe"],
    ["Ecrire", "Écrire"], ["ecrire", "écrire"], ["Ecouter", "Écouter"], ["ecouter", "écouter"],
    ["Exterieur", "Extérieur"], ["exterieur", "extérieur"], ["etudes", "études"], ["Etudes", "Études"],
    ["redaction", "rédaction"], ["Redaction", "Rédaction"], ["hygiene", "hygiène"], ["Hygiene", "Hygiène"],
    ["a verifier", "à vérifier"], ["A verifier", "À vérifier"], ["a domicile", "à domicile"], ["a la", "à la"],
    ["a l'", "à l'"], ["taches", "tâches"], ["sequences", "séquences"], ["activites", "activités"], ["Activites", "Activités"]
  ];
  return replacements.reduce((text, pair) => text.replaceAll(pair[0], pair[1]), String(value || ""));
}

function h(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function emptyState(message) {
  return `<div class="empty-state">${h(message)}</div>`;
}

function clone(value) {
  return typeof structuredClone === "function" ? structuredClone(value) : JSON.parse(JSON.stringify(value));
}

function cryptoRandom() {
  return Math.random().toString(36).slice(2, 10);
}

function dateStamp() {
  return new Date().toISOString().slice(0, 10);
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

function downloadFile(filename, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function showToast(message) {
  if (!App.dom.toast) return;
  App.dom.toast.textContent = message;
  App.dom.toast.classList.add("is-visible");
  window.clearTimeout(App.dom.toastTimer);
  App.dom.toastTimer = window.setTimeout(() => App.dom.toast.classList.remove("is-visible"), 3600);
}

function toggleTheme() {
  const next = document.body.dataset.theme === "dark" ? "light" : "dark";
  document.body.dataset.theme = next;
  const button = document.getElementById("themeToggle");
  if (button) button.textContent = next === "dark" ? "Mode jour" : "Mode nuit";
  localStorage.setItem(CONFIG.storageKeys.settings, JSON.stringify({ theme: next }));
}

function applyStoredTheme() {
  const theme = document.body.dataset.theme || "light";
  const button = document.getElementById("themeToggle");
  if (button) button.textContent = theme === "dark" ? "Mode jour" : "Mode nuit";
}

document.addEventListener("DOMContentLoaded", initApp);

  </script>
</body>
