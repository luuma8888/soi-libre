<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Boussole Pro - Boussole métier vivante, réaliste et offline</title>
  <style>
/* =========================================================
   1. Design tokens
   2. Reset leger
   3. Layout general
   4. Composants
   5. Formulaires
   6. Etats / dialog / toasts
   7. Responsive
   8. Mode sombre
   9. Impression
   ========================================================= */

:root {
  --page-bg: #f7f1e6;
  --page-bg-soft: #fbf7ef;
  --header-bg: #fffdf8;
  --header-border: #eadfcf;
  --sidebar-bg: #f3ecff;
  --sidebar-bg-soft: #f8f4ff;
  --sidebar-border: #d9c9f2;
  --content-bg: #fffdf9;
  --content-card: #ffffff;
  --content-card-soft: #fffaf2;
  --read-bg: #ffffff;
  --read-bg-warm: #fffdf8;
  --ink: #322960;
  --ink-soft: #4f4777;
  --muted: #756b91;
  --line: #e1d6ed;
  --line-soft: #eee6f5;
  --line-warm: #eadfcf;
  --line-strong: #cdbfe5;
  --lavender: #efe7ff;
  --lavender-strong: #d8c8f7;
  --opal: #e9f7f7;
  --opal-strong: #bee5e8;
  --gold: #fff1bd;
  --gold-soft: #fff8dd;
  --sage: #e8f3df;
  --rose: #fde7ec;
  --primary: #322960;
  --primary-soft: #5d4fa0;
  --accent: #7f67d8;
  --bg: var(--page-bg);
  --bg-soft: var(--content-card-soft);
  --surface: var(--content-card);
  --surface-strong: var(--read-bg);
  --warning: #8b5e19;
  --danger: #90354f;
  --success: #3d6d50;
  --shadow: 0 16px 34px rgba(50, 41, 96, 0.07);
  --shadow-soft: 0 7px 18px rgba(50, 41, 96, 0.05);
  --radius: 16px;
  --radius-sm: 11px;
  --focus: 0 0 0 3px rgba(127, 103, 216, 0.28);
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100%;
  margin: 0;
  color: var(--ink);
  background: var(--page-bg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  min-height: 42px;
  border: 0;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

a {
  color: inherit;
}

:focus-visible {
  outline: none;
  box-shadow: var(--focus);
}

.skip-link {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 20;
  transform: translateY(-150%);
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--ink);
  color: #fff;
}

.skip-link:focus {
  transform: translateY(0);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 14px clamp(16px, 4vw, 42px);
  border-bottom: 1px solid var(--header-border);
  background: var(--header-bg);
  box-shadow: 0 2px 12px rgba(50, 41, 96, 0.04);
}

.brand-block {
  max-width: 760px;
}

.eyebrow {
  margin: 0 0 3px;
  color: #5d4d9e;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  overflow-wrap: anywhere;
}

h1 {
  margin: 0;
  color: var(--ink);
  font-size: clamp(1.45rem, 2.2vw, 2.1rem);
  line-height: 1.12;
  letter-spacing: 0;
}

.subtitle {
  max-width: 720px;
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 0.95rem;
}

.main-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.nav-button {
  min-height: 38px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--read-bg);
  color: var(--ink);
  font-weight: 800;
}

.nav-button[aria-current="page"],
.nav-button:hover {
  border-color: var(--lavender-strong);
  background: var(--lavender);
}

.nav-button.nav-secondary {
  min-height: 34px;
  padding: 7px 10px;
  font-size: 0.84rem;
  opacity: 0.78;
}

.nav-button.nav-action {
  border-color: var(--opal-strong);
  background: var(--opal);
}

.header-actions,
.button-row,
.inline-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.header-actions {
  justify-content: flex-end;
}

.app-shell {
  display: grid;
  grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  gap: 18px;
  padding: 18px clamp(16px, 4vw, 42px) 32px;
}

.app-shell.is-wide {
  grid-template-columns: minmax(0, 1fr);
}

.left-panel {
  position: sticky;
  top: 16px;
  align-self: start;
  max-height: calc(100vh - 32px);
  overflow: auto;
  padding: 14px;
  border: 1px solid var(--sidebar-border);
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg-soft));
  box-shadow: var(--shadow-soft);
}

.workspace {
  min-width: 0;
}

.workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}

.panel,
.results-panel {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--content-bg);
  box-shadow: var(--shadow-soft);
}

.step-panel {
  padding: 18px;
}

.step-panel.is-hidden,
.results-panel.is-hidden,
.left-panel.is-hidden {
  display: none;
}

.results-panel {
  padding: 0;
  background: transparent;
  border: 0;
  box-shadow: none;
}

.status-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.step-list {
  display: grid;
  gap: 8px;
  margin: 0 0 14px;
  padding: 0;
  list-style: none;
}

.step-button {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 10px;
  width: 100%;
  padding: 9px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  text-align: left;
}

.step-button:hover,
.step-button[aria-current="step"] {
  border-color: var(--line);
  background: var(--lavender);
}

.step-index {
  display: inline-grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 50%;
  background: var(--opal);
  color: var(--ink);
  font-weight: 800;
}

.step-title {
  display: block;
  font-weight: 800;
}

.step-hint {
  display: block;
  color: var(--muted);
  font-size: 0.86rem;
}

.summary-box {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--read-bg);
}

.summary-box h2,
.summary-box h3 {
  margin: 0 0 8px;
  font-size: 1rem;
}

.summary-list {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
  color: var(--muted);
  font-size: 0.92rem;
}

.hero-panel {
  display: grid;
  gap: 16px;
}

.intro-strip {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--read-bg);
}

.intro-strip p {
  margin: 0;
}

.section-title {
  margin: 0 0 8px;
  font-size: 1.45rem;
  line-height: 1.2;
}

.section-lead {
  margin: 0 0 16px;
  color: var(--muted);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.form-row {
  display: grid;
  gap: 7px;
}

.form-row.full {
  grid-column: 1 / -1;
}

label,
.field-label {
  font-weight: 800;
}

.field-help {
  color: var(--muted);
  font-size: 0.88rem;
}

input,
select,
textarea {
  width: 100%;
  min-height: 42px;
  padding: 10px 11px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface-strong);
  color: var(--ink);
}

textarea {
  min-height: 106px;
  resize: vertical;
}

.tag-grid,
.constraint-grid,
.choice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
}

.tag-option,
.choice-option,
.constraint-item {
  position: relative;
  display: grid;
  gap: 8px;
  min-height: 76px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--read-bg);
  transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
}

.tag-option {
  grid-template-columns: auto 1fr;
  align-items: start;
}

.tag-option input {
  width: 18px;
  min-height: 18px;
  margin-top: 3px;
  accent-color: var(--accent);
}

.tag-option:hover,
.choice-option:hover {
  border-color: var(--lavender-strong);
  background: #fffefd;
}

.tag-option:has(input:checked),
.choice-option:has(input:checked) {
  border-color: var(--accent);
  background: var(--lavender);
  box-shadow: 0 8px 18px rgba(50, 41, 96, 0.06);
}

.tag-option:has(input:checked)::after,
.choice-option:has(input:checked)::after {
  content: "✓";
  position: absolute;
  top: 8px;
  right: 10px;
  font-weight: 900;
  color: #6750b4;
}

details.advanced-box {
  grid-column: 1 / -1;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--read-bg-warm);
  padding: 12px;
}

details.advanced-box summary {
  cursor: pointer;
  font-weight: 900;
}

.launch-box {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--read-bg);
}

.launch-box.warning {
  background: var(--gold);
}

.tag-name {
  display: block;
  font-weight: 800;
}

.tag-meta {
  display: block;
  color: var(--muted);
  font-size: 0.84rem;
}

.constraint-item select {
  min-height: 38px;
}

.range-row {
  display: grid;
  grid-template-columns: 1fr 58px;
  gap: 10px;
  align-items: center;
}

.range-row input[type="range"] {
  padding: 0;
}

.primary-button,
.secondary-button,
.ghost-button,
.danger-button,
.tiny-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius);
  font-weight: 800;
  text-decoration: none;
}

.primary-button {
  padding: 10px 16px;
  background: var(--primary);
  color: #fff;
}

.secondary-button {
  padding: 10px 16px;
  border: 1px solid var(--opal-strong);
  background: var(--opal);
  color: var(--ink);
}

.ghost-button {
  padding: 10px 14px;
  border: 1px solid var(--line);
  background: var(--read-bg);
  color: var(--ink);
}

.danger-button {
  padding: 10px 14px;
  border: 1px solid rgba(144, 53, 79, 0.35);
  background: var(--rose);
  color: var(--danger);
}

.tiny-button {
  min-height: 34px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.88rem;
}

.tiny-button.is-active {
  border-color: var(--accent);
  background: var(--lavender);
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--lavender);
  color: var(--ink);
  font-size: 0.82rem;
  font-weight: 800;
}

.badge.opal {
  background: var(--opal);
}

.badge.gold {
  background: var(--gold);
}

.badge.sage {
  background: var(--sage);
}

.badge.rose {
  background: var(--rose);
}

.badge.outline {
  border-color: var(--line-strong);
  background: transparent;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin: 12px 0;
}

.metric {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--read-bg);
}

.metric strong {
  display: block;
  font-size: 1.55rem;
  line-height: 1.1;
}

.metric span {
  color: var(--muted);
  font-size: 0.86rem;
}

.results-section {
  margin-bottom: 16px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--content-bg);
  box-shadow: var(--shadow-soft);
}

.results-section h2 {
  margin: 0 0 8px;
  font-size: 1.28rem;
}

.results-section > p {
  margin: 0 0 12px;
  color: var(--muted);
}

.job-list {
  display: grid;
  gap: 12px;
}

.job-card {
  display: grid;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--read-bg);
  box-shadow: 0 8px 16px rgba(50, 41, 96, 0.04);
}

.job-card.excluded {
  border-color: rgba(144, 53, 79, 0.24);
}

.job-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
}

.job-title {
  margin: 0;
  font-size: 1.1rem;
}

.job-subtitle {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.score-pill {
  display: inline-grid;
  width: 68px;
  min-height: 58px;
  place-items: center;
  border-radius: var(--radius);
  background: var(--ink);
  color: #fff;
  font-weight: 900;
}

.score-pill small {
  display: block;
  margin-top: -10px;
  font-size: 0.68rem;
  opacity: 0.82;
}

.reason-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.reason-box {
  padding: 10px;
  border-radius: var(--radius);
  background: var(--read-bg-warm);
}

.reason-box h4 {
  margin: 0 0 6px;
  font-size: 0.95rem;
}

.reason-box ul,
.data-list,
.compact-list {
  margin: 0;
  padding-left: 18px;
}

.reason-box li,
.data-list li,
.compact-list li {
  margin: 4px 0;
}

.details-panel {
  display: none;
  padding: 11px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: var(--read-bg);
}

.details-panel.is-open {
  display: block;
}

.score-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
}

.score-line {
  padding: 8px;
  border-radius: var(--radius);
  background: var(--read-bg-warm);
}

.score-line strong {
  display: block;
}

.empty-state {
  padding: 18px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: var(--read-bg);
  color: var(--muted);
}

.compare-table-wrapper {
  overflow-x: auto;
}

.compare-table {
  width: 100%;
  min-width: 620px;
  border-collapse: collapse;
}

.compare-table th,
.compare-table td {
  padding: 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.data-page-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.api-box {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--read-bg);
}

.toast {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 30;
  display: none;
  max-width: min(420px, calc(100vw - 36px));
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--ink);
  color: #fff;
  box-shadow: var(--shadow);
}

.toast.is-visible {
  display: block;
}

.job-dialog {
  max-width: min(780px, calc(100vw - 32px));
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

.job-dialog::backdrop {
  background: rgba(50, 41, 96, 0.28);
}

.dialog-close {
  float: right;
  min-height: 36px;
  padding: 7px 10px;
  border-radius: var(--radius);
  background: var(--lavender);
  color: var(--ink);
}

.noscript {
  margin: 16px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--rose);
  color: var(--ink);
}

@media (max-width: 1180px) {
  .workspace-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 860px) {
  .app-header {
    align-items: stretch;
    flex-direction: column;
  }

  .header-actions {
    justify-content: flex-start;
  }

  .app-shell {
    grid-template-columns: 1fr;
  }

  .left-panel {
    position: static;
    max-height: none;
  }

  .step-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .step-button {
    grid-template-columns: 1fr;
  }

  .step-index {
    display: none;
  }

  .form-grid,
  .reason-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 560px) {
  body {
    font-size: 15px;
  }

  .app-header,
  .app-shell {
    padding-left: 12px;
    padding-right: 12px;
  }

  .header-actions,
  .button-row,
  .inline-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .header-actions button,
  .button-row button,
  .inline-actions button {
    width: 100%;
  }

  .step-list {
    grid-template-columns: 1fr;
  }

  .job-head {
    grid-template-columns: 1fr;
  }

  .score-pill {
    width: 100%;
    min-height: 46px;
  }
}

body[data-theme="dark"] {
  --page-bg: #151323;
  --page-bg-soft: #211f31;
  --header-bg: #1c1a2b;
  --header-border: #403858;
  --sidebar-bg: #211d35;
  --sidebar-bg-soft: #27223e;
  --sidebar-border: #4a4268;
  --content-bg: #1b192b;
  --content-card: #222038;
  --content-card-soft: #28243c;
  --read-bg: #252239;
  --read-bg-warm: #29253d;
  --ink: #f4efff;
  --muted: #c6bddb;
  --line: #4a4268;
  --line-soft: #37304f;
  --line-warm: #403858;
  --line-strong: #675c88;
  --lavender: #332d4c;
  --lavender-strong: #463d67;
  --opal: #203f46;
  --opal-strong: #2d6872;
  --gold: #5f542a;
  --sage: #294535;
  --rose: #55303b;
  --warning: #f7d37a;
  --danger: #ffb2c2;
  --success: #b9efc7;
  --bg: var(--page-bg);
  --bg-soft: var(--content-card-soft);
  --surface: var(--content-card);
  --surface-strong: var(--read-bg);
  background: var(--page-bg);
}

body[data-theme="dark"] input,
body[data-theme="dark"] select,
body[data-theme="dark"] textarea {
  color-scheme: dark;
}

body[data-theme="dark"] .primary-button,
body[data-theme="dark"] .score-pill,
body[data-theme="dark"] .toast {
  background: #f4efff;
  color: #211a42;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}

@media print {
  .no-print,
  .skip-link,
  .toast,
  dialog,
  button,
  input[type="file"] {
    display: none !important;
  }

  body {
    background: #fff !important;
    color: #111 !important;
  }

  .app-shell,
  .workspace-grid {
    display: block !important;
    padding: 0 !important;
  }

  .panel,
  .results-section,
  .job-card,
  .reason-box,
  .metric {
    break-inside: avoid;
    page-break-inside: avoid;
    border-color: #bbb !important;
    box-shadow: none !important;
    background: #fff !important;
    color: #111 !important;
  }

  .results-section {
    margin-bottom: 12px;

    datasetFileInput: document.getElementById("datasetFileInput")

  const loaded = loadStoredData();
  if (!loaded || !App.state.dataset) {
    App.state.dataset = loadSampleData();
    saveDataset(App.state.dataset);

}

function loadStoredData() {
  let loaded = false;
  try {
    const datasetEnvelope = localStorage.getItem(CONFIG.storageKeys.dataset);
    if (datasetEnvelope) {
      const parsed = JSON.parse(datasetEnvelope);
      const candidate = parsed.data || parsed;
      const validation = validateDataset(candidate, "corpus");
      if (validation.valid) {
        App.state.dataset = validation.normalized;
        loaded = true;
      }
    }
  } catch (error) {
    console.warn("Dataset local illisible", error);
  }

  try {
    const profileEnvelope = localStorage.getItem(CONFIG.storageKeys.profile);
    if (profileEnvelope) {
      const parsed = JSON.parse(profileEnvelope);
      App.state.profile = normalizeProfile(parsed.data || parsed);
      loaded = true;
    }
  } catch (error) {
    console.warn("Profil local illisible", error);
  }

  try {
    const settings = JSON.parse(localStorage.getItem(CONFIG.storageKeys.settings) || "{}");
    if (settings.theme) document.body.dataset.theme = settings.theme;
  } catch (error) {
    console.warn("Preferences locales illisibles", error);
  }
  return loaded;
}

function saveDataset(dataset = App.state.dataset) {
  try {
    const envelope = {
      app: CONFIG.appName,
      version: CONFIG.version,
      updatedAt: new Date().toISOString(),
      data: dataset
    };
    localStorage.setItem(CONFIG.storageKeys.dataset, JSON.stringify(envelope));
    App.state.lastSavedAt = envelope.updatedAt;
    return true;
  } catch (error) {
    showToast("Sauvegarde du corpus impossible. Exportez vos donnees si besoin.");
    return false;
  }
}

function saveProfile(profile = App.state.profile) {
  if (!profile) return false;
  profile.updatedAt = new Date().toISOString();
  try {
    const envelope = {
      app: "boussole-pro-profile",
      version: CONFIG.version,
      updatedAt: profile.updatedAt,
      data: profile
    };
    localStorage.setItem(CONFIG.storageKeys.profile, JSON.stringify(envelope));
    App.state.lastSavedAt = envelope.updatedAt;
    renderStatusBar();
    return true;
  } catch (error) {
    showToast("Sauvegarde du profil impossible. Vous pouvez exporter le profil en JSON.");
    return false;
  }
}

function exportProfile() {
  const profile = App.state.profile || createEmptyProfile();
  downloadFile(`boussole-pro-profil-${dateStamp()}.json`, JSON.stringify(profile, null, 2), "application/json");
  showToast("Profil exporte en JSON.");
}

function importProfile(fileOrText) {
  const handleText = text => {
    try {
      const parsed = JSON.parse(text);
      const profile = normalizeProfile(parsed.data || parsed.profile || parsed);
      App.state.profile = profile;
      saveProfile(profile);
      calculateAndStoreResults();
      renderAll();
      showToast("Profil importe et resultats recalcules.");
    } catch (error) {
      showImportError("Le profil JSON n'a pas pu etre lu. Verifiez le fichier exporte.");
    }
  };
  if (typeof fileOrText === "string") {
    handleText(fileOrText);
    return;
  }
  if (!fileOrText) return;
  readFileAsText(fileOrText).then(handleText).catch(() => showImportError("Lecture du fichier profil impossible."));
}

function exportResults(format = "json") {
  if (!App.state.results) calculateAndStoreResults();
  const results = prepareResultsForExport(App.state.results);
  if (format === "markdown") {
    downloadFile(`boussole-pro-resultats-${dateStamp()}.md`, resultsToMarkdown(results), "text/markdown");
    showToast("Resultats exportes en Markdown.");
    return;
  }
  downloadFile(`boussole-pro-resultats-${dateStamp()}.json`, JSON.stringify(results, null, 2), "application/json");
  showToast("Resultats exportes en JSON.");
}

function exportResultsMarkdown() {
  exportResults("markdown");
}

function handleSaveBoussole() {
  exportProfile();
}

function importDatasetFile(file, forcedType = App.state.pendingImportType || "corpus") {
  if (!file) return;
  readFileAsText(file)
    .then(text => {
      let parsed;
      try {
        parsed = JSON.parse(text);
      } catch (error) {
        showImportError("JSON invalide. Aucun changement n'a ete applique.");
        return;
      }
      const validation = validateDataset(parsed, forcedType);
      if (!validation.valid) {
        showImportError(validation.errors.join(" "));
        return;
      }
      App.state.dataset = validation.normalized;
      App.state.dataset.qualityReport = generateDataQualityReport(App.state.dataset);
      saveDataset(App.state.dataset);
      calculateAndStoreResults();
      renderAll();
      showToast("Import termine. Le rapport qualite a ete regenere.");
    })
    .catch(() => showImportError("Lecture du fichier impossible."));
}

function validateDataset(data, type = "corpus") {
  const errors = [];
  const warnings = [];
  const current = App.state.dataset || loadSampleData();
  let normalized = clone(current);

  if (!data || typeof data !== "object") {
    return { valid: false, errors: ["Le fichier ne contient pas un objet ou tableau JSON exploitable."], warnings, normalized: current };
  }

  const detectedType = detectDatasetType(data, type);
  try {
    if (detectedType === "corpus") {
      const corpus = data.data || data;
      const jobs = Array.isArray(corpus.jobs) ? corpus.jobs.map(normalizeJob) : [];
      if (jobs.length === 0) errors.push("Un corpus complet doit contenir un tableau jobs non vide.");
      normalized = {
        ...current,
        ...corpus,
        jobs,
        skills: Array.isArray(corpus.skills) ? corpus.skills.map(normalizeSkill) : current.skills,
        trainings: Array.isArray(corpus.trainings) ? corpus.trainings.map(normalizeTraining) : current.trainings,
        workContexts: Array.isArray(corpus.workContexts) ? corpus.workContexts : current.workContexts,
        certifications: Array.isArray(corpus.certifications) ? corpus.certifications : current.certifications,
        diplomaLevels: Array.isArray(corpus.diplomaLevels) ? corpus.diplomaLevels : current.diplomaLevels,
        marketIndicators: Array.isArray(corpus.marketIndicators) ? corpus.marketIndicators : current.marketIndicators,
        mappings: Array.isArray(corpus.mappings) ? corpus.mappings : current.mappings,
        jobAppellations: Array.isArray(corpus.jobAppellations) ? corpus.jobAppellations : current.jobAppellations,
        importedAt: new Date().toISOString(),
        provenance: corpus.provenance || "imported"
      };
    } else if (detectedType === "jobs") {
      const rows = Array.isArray(data) ? data : data.jobs;
      if (!Array.isArray(rows) || rows.length === 0) errors.push("Le fichier metiers doit contenir un tableau non vide.");
      normalized.jobs = (rows || []).map(normalizeJob);
      normalized.importedAt = new Date().toISOString();
      warnings.push("Seuls les metiers ont ete remplaces. Les autres referentiels restent actifs.");
    } else if (detectedType === "skills") {
      const rows = Array.isArray(data) ? data : data.skills;
      if (!Array.isArray(rows)) errors.push("Le fichier competences doit contenir un tableau.");
      normalized.skills = (rows || []).map(normalizeSkill);
    } else if (detectedType === "trainings") {
      const rows = Array.isArray(data) ? data : data.trainings;
      if (!Array.isArray(rows)) errors.push("Le fichier formations doit contenir un tableau.");
      normalized.trainings = (rows || []).map(normalizeTraining);
    } else if (detectedType === DATASET_TYPES.romeMetiers || detectedType === DATASET_TYPES.romeFichesMetiers) {
      const rows = getDatasetRows(data, ["jobs", "metiers", "fichesMetiers"]);
      if (!rows.length) errors.push("Le fichier ROME métiers ne contient aucun tableau exploitable.");
      normalized = mergeOfficialDatasetParts({ jobs: rows.map(detectedType === DATASET_TYPES.romeFichesMetiers ? normalizeRomeApiFicheMetier : normalizeRomeApiJob) });
      normalized.provenance = "official_rome_file";
    } else if (detectedType === DATASET_TYPES.romeCompetences) {
      const rows = getDatasetRows(data, ["skills", "competences"]);
      if (!rows.length) errors.push("Le fichier ROME compétences ne contient aucun tableau exploitable.");
      normalized = mergeOfficialDatasetParts({ skills: rows.map(normalizeRomeApiSkill) });
      normalized.provenance = "official_rome_file";
    } else if (detectedType === DATASET_TYPES.romeContextes) {
      const rows = getDatasetRows(data, ["workContexts", "contextes", "contextesTravail"]);
      if (!rows.length) errors.push("Le fichier ROME contextes ne contient aucun tableau exploitable.");
      normalized = mergeOfficialDatasetParts({ workContexts: rows.map(normalizeRomeApiContext) });
      normalized.provenance = "official_rome_file";
    } else if (detectedType === DATASET_TYPES.onisepMetiers) {
      const rows = getDatasetRows(data, ["jobs", "metiers"]);
      normalized = mergeOfficialDatasetParts({ jobs: rows.map(normalizeOnisepJob) });
      normalized.provenance = "onisep_import";
    } else if (detectedType === DATASET_TYPES.onisepFormations) {
      const rows = getDatasetRows(data, ["trainings", "formations"]);
      normalized = mergeOfficialDatasetParts({ trainings: rows.map(normalizeOnisepTraining) });
      normalized.provenance = "onisep_import";
    } else if (detectedType === DATASET_TYPES.rncp) {
      const rows = getDatasetRows(data, ["certifications", "rncp", "rs"]);
      normalized = mergeOfficialDatasetParts({ certifications: rows.map(normalizeRncpCertification) });
      normalized.provenance = "rncp_rs";
    } else if (detectedType === DATASET_TYPES.certifInfo) {
      const rows = getDatasetRows(data, ["certifications", "certifInfo"]);
      normalized = mergeOfficialDatasetParts({ certifications: rows.map(normalizeCertifInfo) });
      normalized.provenance = "certif_info";
    } else {
      errors.push("Type de dataset non reconnu pour cette version.");
    }
  } catch (error) {
    errors.push("Erreur pendant la normalisation du dataset.");
  }

  const missingSchema = !data.schemaVersion && !data.data && !Array.isArray(data);
  if (missingSchema) warnings.push("schemaVersion absent : import accepte avec prudence.");
  const report = generateDataQualityReport(normalized);
  normalized.qualityReport = report;
  if (report.issues.some(issue => issue.severity === "blocking")) {
    errors.push("Le rapport qualite contient une erreur bloquante.");
  }
  return { valid: errors.length === 0, errors, warnings, normalized };
}

function generateDataQualityReport(datasets) {
  const jobs = datasets.jobs || [];
  const skills = datasets.skills || [];
  const contexts = datasets.workContexts || [];
  const trainings = datasets.trainings || [];
  const certifications = datasets.certifications || [];
  const mappings = datasets.mappings || [];
  const market = datasets.marketIndicators || [];
  const appellations = datasets.jobAppellations || [];
  const issues = [];
  const warnings = [];
  const jobIds = new Set();
  let duplicateCount = 0;
  jobs.forEach(job => {
    if (jobIds.has(job.id)) duplicateCount += 1;
    jobIds.add(job.id);
    if (!job.title) issues.push(buildIssue("blocking", "missing_title", "Job", job.id || "unknown", "Metier sans titre.", "Corriger le titre avant import."));
    if (!job.romeCode) warnings.push(buildIssue("warning", "missing_rome_code", "Job", job.id, "Metier sans code ROME.", "Conserver un identifiant local clair."));
    if (!job.requiredSkills || job.requiredSkills.length === 0) warnings.push(buildIssue("warning", "missing_skills", "Job", job.id, `${job.title} n'a pas de competences requises.`, "Importer ou completer les competences."));
    if (!job.workContexts || job.workContexts.length === 0) warnings.push(buildIssue("warning", "missing_contexts", "Job", job.id, `${job.title} n'a pas de contexte de travail.`, "Ajouter ou importer les contextes."));
    if (!job.sourceRefs || job.sourceRefs.length === 0) warnings.push(buildIssue("warning", "missing_source", "Job", job.id, `${job.title} n'a pas de source.`, "Ajouter une source et une licence."));
  });
  if (duplicateCount > 0) issues.push(buildIssue("critical", "duplicate_job", "Dataset", "jobs", `${duplicateCount} doublon(s) d'identifiant metier.`, "Dedoublonner avant usage reel."));

  const jobsWithTraining = jobs.filter(job => trainings.some(training => (training.targetJobIds || []).includes(job.id))).length;
  const jobsWithMarket = jobs.filter(job => (job.marketIndicators || []).some(id => market.some(item => item.id === id))).length;
  const hasSampleSource = datasets.provenance === "sample" || (datasets.sources || []).some(source => source.id === "sample_non_official" || source.provenance === "sample");
  const baseWarnings = hasSampleSource ? [
    buildIssue("warning", "sample_data", "Dataset", datasets.datasetName || "dataset", "Les donnees actives sont des exemples ou contiennent des enrichissements manuels.", "Importer un corpus officiel normalise pour un usage professionnel.")
  ] : [
    buildIssue("info", "imported_data", "Dataset", datasets.datasetName || "dataset", "Corpus importe : verifier sources, dates, licences et transformations.", "Conserver le manifeste et le rapport qualite avec le corpus.")
  ];

  return {
    schemaVersion: CONFIG.schemaVersion,
    reportId: `quality-${dateStamp()}`,
    generatedAt: new Date().toISOString(),
    datasetVersion: datasets.datasetVersion || CONFIG.version,
    status: issues.some(issue => issue.severity === "blocking") ? "blocked" : warnings.length ? "completed_with_warnings" : "completed",
    summary: {
      jobs: jobs.length,
      appellations: appellations.length,
      skills: skills.length,
      workContexts: contexts.length,
      trainings: trainings.length,
      certifications: certifications.length,
      mappings: mappings.length,
      marketIndicators: market.length
    },
    coverage: {
      jobsWithSkills: ratio(jobs.filter(job => (job.requiredSkills || []).length > 0).length, jobs.length),
      jobsWithContexts: ratio(jobs.filter(job => (job.workContexts || []).length > 0).length, jobs.length),
      jobsWithTraining: ratio(jobsWithTraining, jobs.length),
      jobsWithDiplomaLevel: ratio(jobs.filter(job => job.recommendedDiplomaLevel !== undefined).length, jobs.length),
      jobsWithMarketData: ratio(jobsWithMarket, jobs.length)
    },
    issues,
    warnings: [...baseWarnings, ...warnings].slice(0, 80),
    licenseAlerts: datasets.provenance === "sample" ? [{
      id: "license-sample",
      severity: "info",
      type: "sample_data",
      message: "Les donnees sample ne sont pas officielles."
    }] : [],
    recommendations: [
      "Verifier les URLs, dates et licences avant import reel.",
      "Ne jamais exclure un metier sur une donnee manquante.",
      "Conserver sources, provenance et confiance pour chaque corpus."
    ]
  };
}

    raw.scheduleConstraints?.weekendWork || "unknown",

  ];

    raw.mobilityConstraints?.travelFrequency || "unknown",

    mobilityConstraints: raw.mobilityConstraints || { travelFrequency: mobility[0], driverLicenseRequired: mobility[1], driverLicenseTypes: mobility[1] ? ["B"] : [], source: "manualEnrichment", confidence: 0.4 },

    marketIndicators: toArray(raw.marketIndicators).length ? toArray(raw.marketIndicators) : (romeCode ? [`market-${romeCode}-FR`] : []),
    sourceRefs: toArray(raw.sourceRefs).length ? toArray(raw.sourceRefs) : ["sample_non_official"],

function mapUserProfileToCriteria(profile) {
  const constraints = {};
  toArray(profile.constraints).forEach(constraint => {
    constraints[constraint.value] = constraint.severity || "open";
  });
  const derivedSkillIds = getSkillIdsFromSignals(profile);
  const directSkillIds = unique([...toArray(profile.skills), ...derivedSkillIds]);
  const excludedDomains = unique([...toArray(profile.exclusions?.domains), ...toArray(profile.excludedDomains)]);
  const trainingOpenness = profile.trainingOpenness || "not_specified";
  return {
    profileId: profile.id,
    ageRange: profile.ageRange || "not_specified",
    searchHorizon: profile.searchHorizon || "open_exploration",
    education: {
      highestLevel: Number(profile.diplomaLevel || 0),
      diplomas: toArray(profile.diplomas),
      certificationIds: toArray(profile.certifications),
      trainingOpenness,
      canDoShortTraining: allowsShortTraining(trainingOpenness),
      canDoLongTraining: allowsLongTraining(trainingOpenness),
      trainingBudget: profile.trainingBudget || "unknown",
      trainingFamilies: toArray(profile.trainingFamilies)
    },
    certifications: {
      held: toArray(profile.certifications),
      licenses: toArray(profile.driverLicenses),
      willingToObtain: trainingOpenness === "none" ? [] : ["short_certification", allowsLongTraining(trainingOpenness) ? "long_certification" : ""].filter(Boolean)
    },
    experience: {
      raw: toArray(profile.experiences),
      domains: unique([...toArray(profile.experiences).map(item => normalizeText(item.domain || item)).filter(Boolean), ...toArray(profile.experienceDomains)]),
      duration: profile.experienceDuration || "not_specified"
    },
    skills: Object.fromEntries(directSkillIds.map(id => [id, { level: toArray(profile.skills).includes(id) ? "autonomous" : "basic", confidence: toArray(profile.skills).includes(id) ? 0.8 : 0.55 }])),
    customSkills: toArray(profile.customSkills).map(normalizeText),
    softSkills: toArray(profile.softSkills),
    interests: Object.fromEntries(toArray(profile.interests).map(id => [id, "important"])),
    values: Object.fromEntries(toArray(profile.values).map(id => [id, "important"])),
    constraints,
    exclusions: { ...(profile.exclusions || { jobIds: [], domains: [], tags: [] }), domains: excludedDomains },
    mobility: {
      radiusKm: Number(profile.mobility?.radiusKm || 20),
      relocation: profile.mobility?.relocation || "no",
      travelAccepted: constraints.travel === "excluding" ? "none" : constraints.travel === "avoid" ? "low" : "medium",
      driverLicenses: toArray(profile.driverLicenses),
      remotePreference: constraints.remoteNeeded === "excluding" ? "essential" : "neutral"
    },
    availability: profile.availability || {},
    preferredWorkStyles: toArray(profile.preferredWorkStyles),
    preferredEnvironments: toArray(profile.preferredEnvironments),
    preferredSchedule: profile.preferredSchedule || "not_specified",
    needForSecurity: profile.needForSecurity || "not_specified",
    needForAutonomy: profile.needForAutonomy || "not_specified",
    needForMeaning: profile.needForMeaning || "not_specified",
    criterionWeights: profile.criterionWeights || clone(CONFIG.baseWeights),
    completeness: calculateProfileCompleteness(profile)
  };
}

function calculateAllMatches(profile = App.state.profile, datasets = App.state.dataset) {
  const criteria = mapUserProfileToCriteria(profile);
  const results = (datasets.jobs || []).map(job => calculateMatch(criteria, job, datasets));
  const sorted = results.slice().sort((a, b) => b.globalScore - a.globalScore);
  const compatible = sorted.filter(result => result.status !== "excluded_for_now");
  const excluded = sorted.filter(result => result.status === "excluded_for_now");
  const diversified = diversifyTopResults(compatible);
  return {
    schemaVersion: CONFIG.schemaVersion,
    generatedAt: new Date().toISOString(),
    profileId: profile.id,
    datasetVersion: datasets.datasetVersion,
    top5: diversified.top5,
    variantsByJob: diversified.variantsByJob,
    diversityExplanation: diversified.diversityExplanation,
    recommended: compatible.filter(result => result.globalScore >= 75),
    possibleAfterTraining: compatible.filter(result => result.status === "possible_after_short_training" || result.status === "possible_after_long_training"),
    weakButInteresting: compatible.filter(result => result.globalScore >= 45 && result.globalScore < 75),
    compatibleWeak: compatible.filter(result => result.globalScore < 45),
    excluded,
    completeList: sorted,
    stats: {
      total: results.length,
      compatible: compatible.length,
      excluded: excluded.length,
      strong: compatible.filter(result => result.globalScore >= 75).length,
      afterTraining: compatible.filter(result => result.status.includes("training")).length
    }
  };
}

function calculateMatch(criteria, job, datasets = App.state.dataset) {
  const hardCheck = applyHardExclusions(criteria, job);
  if (hardCheck.confirmed.length > 0) {
    const scores = { skills: 0, training: 0, constraints: 0, values: 0, context: 0, market: 0 };
    const result = {
      schemaVersion: CONFIG.schemaVersion,
      id: `match-${criteria.profileId}-${job.id}`,
      jobId: job.id,
      romeCode: job.romeCode,
      title: job.title,
      globalScore: 0,
      confidenceScore: calculateConfidence(criteria, job, [], hardCheck.unknown),
      status: "excluded_for_now",
      scores,
      positiveReasons: [],
      negativeReasons: [],
      exclusionReasons: hardCheck.confirmed,
      missingData: hardCheck.unknown,
      actionsToImprove: ["Modifier la contrainte excluante si elle est negociable, ou explorer une variante proche."],
      suggestedTrainings: findSuggestedTrainings(job, datasets),
      relatedVariants: findRelatedVariants(job, datasets),
      sourceRefs: job.sourceRefs,
      job
    };
    result.negativeReasons = explainMatch(criteria, job, scores, result.status, { hardCheck }).negative;
    return result;
  }

  const skill = calculateSkillScore(criteria, job, datasets);
  const training = calculateTrainingScore(criteria, job, datasets);
  const constraint = calculateConstraintScore(criteria, job, datasets);
  const value = calculateValueScore(criteria, job);
  const context = calculateContextScore(criteria, job, datasets);
  const market = calculateMarketScore(job, datasets);
  const scores = {
    skills: skill.score,
    training: training.score,
    constraints: constraint.score,
    values: value.score,
    context: context.score,
    market: market.score
  };
  const globalScore = weightedGlobalScore(scores, criteria.criterionWeights);
  const status = determineFeasibilityStatus(globalScore, scores, criteria, job, { training, constraint, hardCheck });
  const explanation = explainMatch(criteria, job, scores, status, { skill, training, constraint, value, context, market, hardCheck });
  return {
    schemaVersion: CONFIG.schemaVersion,
    id: `match-${criteria.profileId}-${job.id}`,
    jobId: job.id,
    romeCode: job.romeCode,
    title: job.title,
    globalScore,
    confidenceScore: calculateConfidence(criteria, job, [skill, training, constraint, value, context, market], hardCheck.unknown),
    status,
    scores,
    positiveReasons: explanation.positive,
    negativeReasons: explanation.negative,
    exclusionReasons: [],
    missingData: uniqueObjectsBy([...skill.missingData, ...training.missingData, ...constraint.missingData, ...context.missingData, ...market.missingData, ...hardCheck.unknown], "field"),
    actionsToImprove: explanation.actions,
    suggestedTrainings: findSuggestedTrainings(job, datasets),
    relatedVariants: findRelatedVariants(job, datasets),
    sourceRefs: job.sourceRefs,
    job
  };
}

function explainMatch(criteria, job, scores, status, details = {}) {
  const positive = [];
  const negative = [];
  const actions = [];
  if (scores.skills >= 18) positive.push("Plusieurs competences declarees correspondent aux competences attendues.");
  if (scores.training >= 15) positive.push("Le niveau de formation ou les certifications semblent proches de votre profil actuel.");
  if (scores.constraints >= 20) positive.push("Les contraintes principales semblent compatibles avec ce metier.");
  if (scores.values >= 10) positive.push("Cette piste rejoint plusieurs envies ou valeurs que vous avez indiquees.");
  if (scores.context >= 7) positive.push("Le contexte de travail semble proche de vos preferences.");
  if (job.remoteCompatibility === "high" && criteria.preferredEnvironments.includes("remote")) positive.push("Le teletravail semble plus envisageable que dans d'autres pistes.");
  if (positive.length === 0 && status !== "excluded_for_now") positive.push("Cette piste reste presente car aucune incompatibilite dure n'a ete confirmee.");

  if (details.skill?.missingSkills?.length) negative.push("Certaines competences importantes ne sont pas encore declarees.");
  if (details.training?.statusHint === "short") negative.push("Une formation ou certification courte pourrait etre necessaire.");
  if (details.training?.statusHint === "long") negative.push("Le parcours d'acces semble plus long que votre niveau actuel.");
  if (details.constraint?.warnings?.length) negative.push("Certaines contraintes sont a verifier dans les conditions reelles d'emploi.");
  if (details.market?.missingData?.length) negative.push("Les donnees marche sont sample ou incompletes dans ce corpus.");
  if (scores.context < 5) negative.push("Le contexte de travail semble moins proche de vos preferences.");
  if (status === "excluded_for_now") {
    negative.push("Cette piste est ecartee pour l'instant a cause d'un critere non negociable.");
  }
  if (negative.length === 0) negative.push("Aucune vigilance majeure n'est ressortie dans le corpus sample.");

  if (details.skill?.missingSkills?.length) actions.push("Ajouter ou renforcer les competences suivantes : " + details.skill.missingSkillLabels.slice(0, 3).join(", ") + ".");
  if (details.training?.missingCertifications?.length) actions.push("Explorer la certification associee avant de considerer cette piste comme accessible.");
  if (details.constraint?.warnings?.length) actions.push("Verifier les conditions concretes du poste : " + details.constraint.warnings.slice(0, 3).join(", ") + ".");
  if (details.market?.missingData?.length) actions.push("Importer plus tard des indicateurs marche fiables pour mieux evaluer le realisme local.");
  if (actions.length === 0) actions.push("Comparer cette piste avec ses variantes proches et verifier les conditions reelles du territoire.");

  return { positive: positive.slice(0, 5), negative: negative.slice(0, 5), actions: actions.slice(0, 5) };
}

function applyHardExclusions(criteria, job) {
  const confirmed = [];
  const unknown = [];
  const exclusions = criteria.exclusions || {};
  if (toArray(exclusions.jobIds).includes(job.id)) {
    confirmed.push(exclusion("voluntary_job", "Metier exclu volontairement.", "secteur", "Ce metier fait partie de vos exclusions."));
  }
  const excludedDomains = toArray(exclusions.domains).map(normalizeText);
  if (excludedDomains.some(domain => normalizeText(job.domain).includes(domain) || normalizeText(job.family).includes(domain))) {
    confirmed.push(exclusion("voluntary_domain", "Domaine exclu volontairement.", "secteur", "Ce domaine fait partie de vos exclusions."));
  }

  Object.entries(criteria.constraints || {}).forEach(([value, severity]) => {
    if (severity !== "excluding") return;
    const compatibility = evaluateConstraintAgainstJob(value, job, criteria);
    if (compatibility.status === "confirmed_incompatible") {
      confirmed.push(exclusion(`constraint_${value}`, compatibility.label, compatibility.category, compatibility.message));
    } else if (compatibility.status === "unknown") {
      unknown.push(missing(`job.${value}`, "medium", `A verifier : le corpus ne precise pas clairement ${compatibility.label.toLowerCase()} pour ce metier.`));
    }
  });

  const missingRequiredCerts = toArray(job.requiredCertifications).filter(cert => !criteria.certifications.held.includes(cert));
  if (missingRequiredCerts.length && criteria.education.trainingOpenness === "none") {
    confirmed.push(exclusion("certification_required", "Certification obligatoire manquante.", "certification", "Une certification semble obligatoire et vous indiquez ne pas vouloir de formation pour l'instant."));
  }
  return { confirmed, unknown };
}

function calculateSkillScore(criteria, job, datasets = App.state.dataset) {
  const required = toArray(job.requiredSkills);
  const optional = [...toArray(job.optionalSkills), ...toArray(job.softSkills)];
  const missingData = [];
  const missingSkills = [];
  const missingSkillLabels = [];
  if (required.length === 0) {
    return { score: 13, missingData: [missing("job.requiredSkills", "medium", "Competences requises absentes du corpus.")], missingSkills, missingSkillLabels, confidencePenalty: 0.15 };
  }
  let matched = 0;
  required.forEach(skillId => {
    if (criteria.skills[skillId]) {
      matched += levelCoefficient(criteria.skills[skillId].level);
    } else if (hasRelatedCustomSkill(criteria.customSkills, skillId, datasets)) {
      matched += 0.45;
    } else {
      missingSkills.push(skillId);
      missingSkillLabels.push(getSkillLabel(skillId, datasets));
    }
  });
  let optionalMatched = 0;
  optional.forEach(skillId => {
    if (criteria.skills[skillId] || hasRelatedCustomSkill(criteria.customSkills, skillId, datasets)) optionalMatched += 1;
  });
  const experienceBonus = criteria.experience?.domains?.some(domain =>
    normalizeText(job.domain).includes(domain) ||
    normalizeText(job.family).includes(domain) ||
    toArray(job.transitionTags).map(normalizeText).includes(domain)
  ) ? 2 : 0;
  const requiredScore = (matched / required.length) * 20;
  const optionalScore = optional.length ? (optionalMatched / optional.length) * 5 : 2.5;
  return {
    score: Math.round(clamp(requiredScore + optionalScore + experienceBonus, 0, 25)),
    missingData,
    missingSkills,
    missingSkillLabels,
    confidencePenalty: missingSkills.length / Math.max(required.length, 1) * 0.1
  };
}

function calculateTrainingScore(criteria, job) {
  const missingData = [];
  const heldCerts = criteria.certifications.held;
  const requiredCerts = toArray(job.requiredCertifications);
  const missingCertifications = requiredCerts.filter(certId => !heldCerts.includes(certId));
  if (requiredCerts.length && missingCertifications.length === 0) {
    return { score: 20, missingData, missingCertifications: [], statusHint: "now" };
  }
  if (missingCertifications.length > 0) {
    if (criteria.education.canDoShortTraining) return { score: 12, missingData, missingCertifications, statusHint: "short" };
    if (criteria.education.canDoLongTraining) return { score: 8, missingData, missingCertifications, statusHint: "long" };
    return { score: 0, missingData, missingCertifications, statusHint: "blocked" };
  }

  const userLevel = Number(criteria.education.highestLevel || 0);
  const requiredLevel = numberOrNull(job.requiredDiplomaLevel);
  const recommendedLevel = numberOrNull(job.recommendedDiplomaLevel);
  const targetLevel = requiredLevel ?? recommendedLevel;
  if (targetLevel === null || targetLevel === 0) {
    missingData.push(missing("job.requiredDiplomaLevel", "low", "Niveau de diplome requis absent ou non obligatoire dans le corpus."));
    return { score: 16, missingData, missingCertifications: [], statusHint: "now" };
  }
  const gap = targetLevel - userLevel;
  if (gap <= 0) return { score: 19, missingData, missingCertifications: [], statusHint: "now" };
  const budgetPenalty = ["none", "under_300"].includes(criteria.education.trainingBudget) ? 2 : 0;
  if (gap === 1 && criteria.education.trainingOpenness !== "none") return { score: Math.max(8, 14 - budgetPenalty), missingData, missingCertifications: [], statusHint: "short" };
  if (gap <= 3 && criteria.education.canDoLongTraining) return { score: 9, missingData, missingCertifications: [], statusHint: "long" };
  if (gap <= 2 && criteria.education.canDoShortTraining) return { score: Math.max(5, 8 - budgetPenalty), missingData, missingCertifications: [], statusHint: "short" };
  return { score: 5, missingData, missingCertifications: [], statusHint: criteria.education.trainingOpenness === "none" ? "blocked" : "long" };
}

function calculateConstraintScore(criteria, job) {
  let score = 25;
  const missingData = [];
  const warnings = [];
  Object.entries(criteria.constraints || {}).forEach(([value, severity]) => {
    if (severity === "open") return;
    const compatibility = evaluateConstraintAgainstJob(value, job, criteria);
    if (compatibility.status === "unknown") {
      missingData.push(missing(`job.${value}`, "medium", `Contrainte a verifier : ${compatibility.label}.`));
      warnings.push(compatibility.label);
      return;
    }
    if (compatibility.status === "confirmed_incompatible") {
      if (severity === "avoid") score -= 13;
      if (severity === "conditional") score -= 6;
      if (severity === "excluding") score -= 25;
      warnings.push(compatibility.label);
    }
  });
  return { score: Math.round(clamp(score, 0, 25)), missingData, warnings };
}

function calculateValueScore(criteria, job) {
  const interests = Object.keys(criteria.interests || {});
  const values = Object.keys(criteria.values || {});
  const needValues = [];
  if (criteria.needForSecurity === "high") needValues.push("stability", "security");
  if (criteria.needForAutonomy === "high") needValues.push("autonomy", "freedom");
  if (criteria.needForMeaning === "high") needValues.push("meaning", "service", "solidarity");
  if (!interests.length && !values.length && !needValues.length) {
    return { score: 8, missingData: [missing("profile.interests", "low", "Envies et valeurs peu renseignees.")], matched: [] };
  }
  const interestScore = weightedTagScore(interests, job.interestTags, 8);
  const valueInputs = unique([...values, ...needValues]);
  const valueScore = weightedTagScore(valueInputs, job.valueTags, 7);
  const matched = [...interests.filter(item => tagMatches(item, job.interestTags)), ...valueInputs.filter(item => tagMatches(item, job.valueTags))];
  return { score: Math.round(clamp(interestScore + valueScore, 0, 15)), missingData: [], matched };
}

function calculateContextScore(criteria, job) {
  const preferences = [...toArray(criteria.preferredWorkStyles), ...toArray(criteria.preferredEnvironments)];
  if (criteria.preferredSchedule === "day") preferences.push("day");
  if (criteria.preferredSchedule === "flexible") preferences.push("flexible");
  if (criteria.needForAutonomy === "high") preferences.push("autonomous");
  if (criteria.needForSecurity === "high") preferences.push("structured");
  if (!preferences.length) return { score: 5, missingData: [], matched: [] };
  let score = 0;
  const matched = [];
  const jobContextTags = collectJobContextTags(job);
  preferences.forEach(pref => {
    const ok = contextPreferenceMatches(pref, job, jobContextTags);
    if (ok) {
      score += 1;
      matched.push(pref);
    }
  });
  return {
    score: Math.round(clamp((score / preferences.length) * 10, 0, 10)),
    missingData: job.workContexts.length ? [] : [missing("job.workContexts", "medium", "Contextes de travail absents du corpus.")],
    matched
  };
}

function calculateMarketScore(job, datasets = App.state.dataset) {
  const indicators = toArray(job.marketIndicators)
    .map(id => (datasets.marketIndicators || []).find(item => item.id === id || item.romeCode === job.romeCode))
    .filter(Boolean);
  if (indicators.length === 0) {
    return { score: 3, missingData: [missing("job.marketIndicators", "low", "Donnees marche non disponibles dans ce corpus local.")] };
  }
  const tension = indicators[0].tensionScore;
  if (typeof tension !== "number") return { score: 3, missingData: [missing("market.tensionScore", "low", "Indicateur marche partiel.")] };
  return { score: Math.round(clamp(1 + tension * 4, 1, 5)), missingData: [] };
}

function determineFeasibilityStatus(globalScore, scores, criteria, job, details = {}) {
  if (details.hardCheck?.confirmed?.length) return "excluded_for_now";
  if (details.training?.statusHint === "blocked") return globalScore >= 45 ? "discouraged" : "excluded_for_now";
  if (criteria.searchHorizon === "now" && details.training?.statusHint === "long") return "explore_with_caution";
  if (criteria.searchHorizon === "now" && details.training?.statusHint === "short" && globalScore < 68) return "difficult_but_possible";
  if (criteria.searchHorizon === "2_3_years" && details.training?.statusHint === "long" && globalScore >= 38) return "possible_after_long_training";
  if (details.training?.statusHint === "short" && globalScore >= 45) return "possible_after_short_training";
  if (details.training?.statusHint === "long" && globalScore >= 40) return "possible_after_long_training";
  if (scores.constraints <= 8) return "discouraged";
  const confidenceRisk = details.hardCheck?.unknown?.length || (job.missingFields || []).length > 5;
  if (confidenceRisk && globalScore < 65) return "explore_with_caution";
  if (globalScore >= 78 && scores.skills >= 15 && scores.training >= 15 && scores.constraints >= 18) return "possible_now";
  if (globalScore >= 65) return "possible_with_small_adjustment";
  if (globalScore >= 45) return "difficult_but_possible";
  return "discouraged";
}

function diversifyTopResults(results) {
  const compatible = results
    .filter(result => result.status !== "excluded_for_now" && result.globalScore >= 50)
    .sort((a, b) => b.globalScore - a.globalScore);
  const selected = [];
  const variantsByJob = {};
  for (const candidate of compatible) {
    if (selected.length === 5) break;
    const variantParent = selected.find(item => isVariantOf(candidate, item));
    if (variantParent) {
      variantsByJob[variantParent.jobId] = variantsByJob[variantParent.jobId] || [];
      variantsByJob[variantParent.jobId].push(candidate);
      continue;
    }
    const diversityScore = calculateDiversityScore(candidate, selected);
    if (diversityScore >= 45 || selected.length < 3) {
      candidate.diversityScore = diversityScore;
      selected.push(candidate);
    }
  }
  if (selected.length < 5) {
    compatible.forEach(candidate => {
      if (selected.length >= 5) return;
      if (!selected.some(item => item.jobId === candidate.jobId)) selected.push(candidate);
    });
  }
  return {
    top5: selected.slice(0, 5),
    variantsByJob,
    diversityExplanation: "Le Top 5 evite les repetitions de famille, domaine et metiers trop proches. Les pistes proches sont rangees en variantes."
  };
}

function findRelatedVariants(job, datasets = App.state.dataset) {
  const jobs = datasets.jobs || [];
  const direct = toArray(job.relatedJobs)
    .map(id => jobs.find(candidate => candidate.id === id))
    .filter(Boolean);
  const similar = jobs
    .filter(candidate => candidate.id !== job.id && !direct.some(item => item.id === candidate.id))
    .map(candidate => ({ job: candidate, similarity: computeJobSimilarity(job, candidate) }))
    .filter(item => item.similarity >= 0.48)
    .sort((a, b) => b.similarity - a.similarity)
    .slice(0, 4)
    .map(item => item.job);
  return uniqueBy([...direct, ...similar], "id").slice(0, 5).map(item => ({
    jobId: item.id,
    title: item.title,
    romeCode: item.romeCode,
    family: item.family
  }));
}

        <div class="tag-grid">${INTEREST_OPTIONS.map(item => checkboxTag("interests", item[0], item[1], "envie", profile.interests.includes(item[0]))).join("")}</div>
      </div>
      <div class="form-row full">
        <span class="field-label">Valeurs</span>
        <div class="tag-grid">${VALUE_OPTIONS.map(item => checkboxTag("values", item[0], item[1], "valeur", profile.values.includes(item[0]))).join("")}</div>
      </div>
      <div class="form-grid" style="margin-top:14px">
        ${selectField("Besoin de sécurité", "needForSecurity", profile.needForSecurity, [["not_specified", "Non renseigné"], ["low", "Faible"], ["medium", "Moyen"], ["high", "Fort"]])}
        ${selectField("Besoin d'autonomie", "needForAutonomy", profile.needForAutonomy, [["not_specified", "Non renseigné"], ["low", "Faible"], ["medium", "Moyen"], ["high", "Fort"]])}
        ${selectField("Besoin de sens", "needForMeaning", profile.needForMeaning, [["not_specified", "Non renseigné"], ["low", "Faible"], ["medium", "Moyen"], ["high", "Fort"]])}
        <div class="form-row full field-help">Sécurité = revenu stable et cadre clair. Autonomie = marge de décision. Sens = utilité ressentie et cohérence avec vos valeurs.</div>
      </div>
      ${stepButtons()}`;
  }
  if (step === 5) {
    return `
      <h2 class="section-title">Cadre idéal</h2>
      <p class="section-lead">Le contexte compte autant que le métier lui-même : rythme, environnement, relationnel, calme, autonomie.</p>
      <div class="form-grid">
        <div class="form-row full">
          <span class="field-label">Styles préférés</span>
          <div class="tag-grid">${WORK_STYLE_OPTIONS.map(item => checkboxTag("preferredWorkStyles", item[0], item[1], "style", profile.preferredWorkStyles.includes(item[0]))).join("")}</div>
        </div>
        <div class="form-row full">
          <span class="field-label">Environnements préférés</span>
          <div class="tag-grid">${ENVIRONMENT_OPTIONS.map(item => checkboxTag("preferredEnvironments", item[0], item[1], "contexte", profile.preferredEnvironments.includes(item[0]))).join("")}</div>
        </div>
        <div class="form-row full">
          <span class="field-label">Domaines que je veux éviter</span>
          <div class="tag-grid">${EXCLUDED_DOMAIN_OPTIONS.map(item => checkboxTag("excludedDomains", item[0], item[1], "à éviter", profile.excludedDomains.includes(item[0]))).join("")}</div>
        </div>
        <details class="advanced-box">
          <summary>Exclusion libre avancée</summary>
          ${textareaField("Autres domaines à exclure", "exclusionsDomainsText", toArray(profile.exclusions?.domains).join("\\n"), "Un domaine par ligne")}
        </details>
      </div>
      ${stepButtons()}`;
  }
  if (step === 6) {
    const readiness = getProfileReadiness(profile);
    const stats = App.state.results?.stats || {};
    return `
      <h2 class="section-title">Validation</h2>
      <p class="section-lead">Relisez la boussole avant de lancer les pistes. Vous pourrez modifier vos réponses ensuite.</p>
      <div class="metric-grid">
        ${metric("Profil rempli", `${Math.round(calculateProfileCompleteness(profile) * 100)}%`)}
        ${metric("Métiers analysés", stats.total || dataset.jobs.length)}
        ${metric("Contraintes actives", toArray(profile.constraints).filter(item => item.severity && item.severity !== "open").length)}
        ${metric("Signaux compétences", getSkillSignalCount(profile))}
      </div>
      <div class="launch-box ${readiness.ok ? "" : "warning"}">
        <strong>${readiness.ok ? "La boussole est prête." : "Profil encore exploratoire."}</strong>
        <ul class="compact-list">${readiness.missing.map(item => `<li>${h(item)}</li>`).join("") || "<li>Les repères essentiels sont présents.</li>"}</ul>
        <p>Vous pouvez lancer une première lecture même si tout n’est pas rempli. Le résultat indiquera sa confiance.</p>
      </div>
      <div class="button-row" style="margin-top:16px">
        <button class="ghost-button" type="button" data-step-go="5">Modifier le cadre</button>
        <button class="primary-button" type="button" data-action="launch-results">Voir mes pistes</button>
      </div>
      ${stepButtons()}`;
  }
  return emptyState("Étape indisponible.");
}

function renderResults() {
  const results = App.state.results;
  const profile = App.state.profile;
  if (!profile?.hasRequestedResults) {
    App.dom.resultsContainer.innerHTML = `
      <section class="results-section print-section">
        <h2>Résultats non lancés</h2>
        <p>Les métiers ne sont pas affichés pendant le remplissage, pour éviter de donner une impression de verdict trop tôt.</p>
        <div class="empty-state">
          Passez par Ma Boussole, vérifiez le résumé, puis utilisez le bouton “Voir mes pistes”.
        </div>
        <div class="button-row no-print" style="margin-top:14px">
          <button class="primary-button" type="button" data-main-view="boussole">Remplir Ma Boussole</button>
        </div>
      </section>`;
    return;
  }
  if (!results) {
    App.dom.resultsContainer.innerHTML = `<div class="results-section"><div class="empty-state">Complétez le profil pour lancer une première analyse.</div></div>`;
    return;
  }
  const top5 = results.top5 || [];
  const afterTraining = results.possibleAfterTraining.filter(result => !top5.some(top => top.jobId === result.jobId)).slice(0, 8);
  const recommended = results.recommended.filter(result => !top5.some(top => top.jobId === result.jobId) && !afterTraining.some(item => item.jobId === result.jobId)).slice(0, 8);
  const exploratory = [...results.weakButInteresting, ...results.compatibleWeak]
    .filter((result, index, array) => array.findIndex(item => item.jobId === result.jobId) === index)
    .filter(result => !top5.some(top => top.jobId === result.jobId) && !afterTraining.some(item => item.jobId === result.jobId) && !recommended.some(item => item.jobId === result.jobId))
    .slice(0, 10);
  const excluded = results.excluded.slice(0, 10);
  App.dom.resultsContainer.innerHTML = `
    <section class="results-section print-section">
      <h2>Vue d’ensemble</h2>
      <p>${h(results.diversityExplanation)}</p>
      <div class="metric-grid">
        ${metric("Corpus", results.stats.total)}
        ${metric("Compatibles", results.stats.compatible)}
        ${metric("Après formation", results.stats.afterTraining)}
        ${metric("Exclus", results.stats.excluded)}
      </div>
      ${renderComparePanel()}
    </section>
    <section class="results-section print-section">
      <h2>Top 5 diversifié</h2>
      <p>Ces pistes représentent des directions différentes. Les métiers trop proches sont rangés en variantes.</p>
      <div class="job-list">${top5.map(result => renderJobCard(result, { featured: true })).join("") || emptyState("Aucun top 5 disponible avec le profil actuel.")}</div>
    </section>
    <section class="results-section print-section">
      <h2>Possibles après formation</h2>
      <div class="job-list">${afterTraining.map(renderJobCard).join("") || emptyState("Aucune piste classée après formation pour l’instant.")}</div>
    </section>
    ${recommended.length ? `<details class="results-section print-section" open><summary><strong>Métiers recommandés complémentaires</strong></summary><div class="job-list" style="margin-top:12px">${recommended.map(renderJobCard).join("")}</div></details>` : ""}
    ${exploratory.length ? `<details class="results-section print-section"><summary><strong>Pistes compatibles plus faibles ou à vérifier</strong></summary><p>Ces pistes restent visibles, mais elles demandent plus de prudence ou de données.</p><div class="job-list">${exploratory.map(renderJobCard).join("")}</div></details>` : ""}
    ${renderExcludedJobs(excluded)}
    <section class="results-section print-section">
      <h2>Exports</h2>
      <p>Les résultats restent sur cet appareil. Vous pouvez les exporter en JSON ou Markdown.</p>
      <div class="button-row no-print">
        <button class="secondary-button" type="button" data-action="export-results-json">Exporter résultats JSON</button>
        <button class="secondary-button" type="button" data-action="export-results-md">Exporter résultats Markdown</button>
        <button class="ghost-button" type="button" data-action="print">Imprimer la vue</button>
      </div>
      <details style="margin-top:12px">
        <summary><strong>Liste complète classée</strong></summary>
        <p>${results.completeList.length} métiers classés, exclusions incluses.</p>
        <div class="job-list">${results.completeList.slice(0, 18).map(renderJobCard).join("")}</div>
      </details>
    </section>`;
}

function renderJobCard(result) {
  const job = result.job || findJob(result.jobId);
  const variants = (App.state.results?.variantsByJob?.[result.jobId] || result.relatedVariants || []).slice(0, 4);
  const vigilances = result.status === "excluded_for_now" ? result.exclusionReasons.map(item => item.message) : result.negativeReasons;
  const isCompared = App.state.compareIds.includes(result.jobId);
  return `
    <article class="job-card ${result.status === "excluded_for_now" ? "excluded" : ""}" data-job-id="${h(result.jobId)}">
      <div class="job-head">
        <div>
          <h3 class="job-title">${h(result.title)}</h3>
          <p class="job-subtitle">${h(result.romeCode || "Code local")} - ${h(job?.domain || "")} - ${h(job?.family || "")}</p>
          <div class="badge-row">
            <span class="badge ${statusBadgeClass(result.status)}">${h(statusLabel(result.status))}</span>
            <span class="badge outline">Confiance ${Math.round(result.confidenceScore)}%</span>
            <span class="badge gold">${h((job?.provenance || "sample") === "sample" ? "Corpus sample" : job?.provenance)}</span>
          </div>
        </div>
        <div class="score-pill"><span>${Math.round(result.globalScore)}</span><small>/100</small></div>
      </div>
      <div class="reason-grid">
        <div class="reason-box">
          <h4>Raisons positives</h4>
          <ul>${take(result.positiveReasons, 3).map(item => `<li>${h(item)}</li>`).join("") || "<li>Piste à explorer avec plus de données.</li>"}</ul>
        </div>
        <div class="reason-box">
          <h4>Points de vigilance</h4>
          <ul>${take(vigilances, 3).map(item => `<li>${h(item)}</li>`).join("") || "<li>Aucune vigilance majeure dans ce corpus.</li>"}</ul>
        </div>
      </div>
      <div class="button-row no-print">
        <button class="tiny-button" type="button" data-result-action="details">Détails</button>
        <button class="tiny-button" type="button" data-result-action="variants">Variantes</button>
        <button class="tiny-button" type="button" data-result-action="why">Pourquoi</button>
        <button class="tiny-button" type="button" data-result-action="trainings">Formations</button>
        <button class="tiny-button ${isCompared ? "is-active" : ""}" type="button" data-result-action="compare" aria-pressed="${isCompared ? "true" : "false"}">${isCompared ? "Retirer du comparatif" : "Comparer"}</button>
      </div>
      <div class="details-panel" data-details-panel>
        <div class="score-grid">${Object.entries(result.scores).map(([key, value]) => `<div class="score-line"><strong>${h(scoreLabel(key))}</strong>${Math.round(value)}</div>`).join("")}</div>
        <p><strong>Variantes proches :</strong> ${variants.map(item => h(item.title)).join(", ") || "Aucune variante classée."}</p>
        <p><strong>Données manquantes :</strong> ${result.missingData.map(item => h(item.message)).join(" ") || "Aucune donnée manquante majeure."}</p>
      </div>
    </article>`;
}

function getDatasetStatusLabels(dataset) {
  const provenance = dataset.provenance || "sample";
  if (provenance === "sample") return { corpus: "sample", jobs: "test", trainings: "test" };
  if (["generated_rome", "official_rome", "official_rome_file", "api_rome_manual"].includes(provenance)) return { corpus: "officiel / ROME", jobs: "alignées ROME", trainings: hasOfficialTraining(dataset) ? "officielles" : "à vérifier" };
  if (provenance === "onisep_import") return { corpus: "Onisep import", jobs: "à vérifier", trainings: "Onisep" };
  if (["rncp_rs", "certif_info"].includes(provenance)) return { corpus: provenance, jobs: "à vérifier", trainings: provenance };
  if (provenance === "mixed_official") return { corpus: "mixte officiel", jobs: "mixte", trainings: "mixte" };
  return { corpus: "custom_import", jobs: "importées", trainings: "à vérifier" };
}

function hasOfficialTraining(dataset) {
  return toArray(dataset.trainings).some(item => ["onisep_import", "rncp_rs", "certif_info", "official"].includes(item.provenance || item.source));
}

async function loadGeneratedRomeDataset() {
  const basePath = "data/generated/";
  const files = {
    manifest: "import-manifest.rome.json",
    jobs: "jobs.rome.json",
    skills: "skills.rome.json",
    workContexts: "work-contexts.rome.json",
    jobAppellations: "job-appellations.rome.json",
    mappings: "mappings.rome.json",
    qualityReport: "data-quality-report.rome.json"
  };
  try {
    App.state.generatedDataStatus = "chargement en cours";
    App.state.generatedDataMessage = "Recherche de fichiers JSON générés dans data/generated/, relatif à Boussole Pro.";
    renderAll();
    const generated = {};
    for (const [key, filename] of Object.entries(files)) {
      generated[key] = await fetchJsonIfExists(basePath + filename);
    }
    const hasUsefulData = ["jobs", "skills", "workContexts", "jobAppellations", "mappings"].some(key => Array.isArray(generated[key]) && generated[key].length);
    if (!hasUsefulData) {
      App.state.generatedDataStatus = "non configuré";
      App.state.generatedDataMessage = "Aucun fichier exploitable trouvé dans data/generated/ à côté de Boussole Pro. L’application reste sur le corpus local ou sample.";
      renderAll();
      showToast("Données générées absentes. Le corpus actuel est conservé.");
      return;
    }
    const replace = window.confirm("Remplacer le corpus actif par les données ROME générées ? Choisissez Annuler pour fusionner avec le corpus actuel.");
    App.state.dataset = mergeGeneratedDatasetIntoApp(generated, { replace });
    markDatasetAsOfficialRome(App.state.dataset, generated.manifest);
    saveDataset(App.state.dataset);
    calculateAndStoreResults();
    App.state.generatedDataStatus = "disponible via données générées";
    App.state.generatedDataMessage = "Les fichiers creations/boussolepro/data/generated ont été chargés sans secret dans le navigateur.";
    renderAll();
    showToast("Données générées chargées.");
  } catch (error) {
    App.state.generatedDataStatus = "erreur";
    App.state.generatedDataMessage = error.message || "Chargement impossible. Le corpus actuel reste actif.";
    renderAll();
    showImportError(App.state.generatedDataMessage);
  }
}

async function fetchJsonIfExists(url) {
  try {
    const response = await fetch(url, { cache: "no-store" });
    if (response.status === 404) return null;
    if (!response.ok) throw new Error(`Fichier ${url} indisponible (${response.status}).`);
    return response.json();
  } catch (error) {
    if (location.protocol === "file:") {
      throw new Error("Le chargement de data/generated peut être bloqué en ouverture file://. Utilisez l’import JSON manuel ou GitHub Pages.");
    }
    throw new Error(`Impossible de lire ${url}. ${error.message || ""}`.trim());
  }
}

function mergeGeneratedDatasetIntoApp(generated, options = {}) {
  const base = options.replace ? loadSampleData() : clone(App.state.dataset || loadSampleData());
  const manifest = generated.manifest || {};
  const importedAt = new Date().toISOString();
  const merged = {
    ...base,
    datasetName: manifest.datasetName || "Boussole Pro - données ROME générées",
    datasetVersion: manifest.datasetVersion || `rome-generated-${dateStamp()}`,
    sourceDate: manifest.sourceDate || dateStamp(),
    importedAt,
    provenance: "generated_rome",
    confidence: 0.75,
    manifest: { ...(base.manifest || {}), ...manifest, provenance: "generated_rome", importedAt },
    jobs: Array.isArray(generated.jobs) && generated.jobs.length ? generated.jobs.map(normalizeJob) : base.jobs,
    skills: Array.isArray(generated.skills) && generated.skills.length ? generated.skills.map(normalizeSkill) : base.skills,
    workContexts: Array.isArray(generated.workContexts) && generated.workContexts.length ? generated.workContexts : base.workContexts,
    jobAppellations: Array.isArray(generated.jobAppellations) && generated.jobAppellations.length ? generated.jobAppellations : base.jobAppellations,
    mappings: Array.isArray(generated.mappings) && generated.mappings.length ? generated.mappings : base.mappings
  };
  merged.qualityReport = generated.qualityReport || generateDataQualityReport(merged);
  return merged;
}

async function requestFranceTravailToken(config) {
  const clientId = config.clientId;
  const clientSecret = config.clientSecret;
  if (!clientId || !clientSecret || !config.tokenUrl) {
    throw new Error("Client ID, Client Secret et Token URL sont requis pour tester l’API.");
  }
  const params = new URLSearchParams();
  params.set("grant_type", "client_credentials");
  params.set("client_id", clientId);
  params.set("client_secret", clientSecret);
  if (config.scopes) params.set("scope", config.scopes);
  const response = await fetch(config.tokenUrl, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params
  });
  if (!response.ok) {
    const body = await response.text();
    throw new Error(`Échec token France Travail : ${response.status} ${body}`);
  }
  return response.json();
}

async function fetchFranceTravailApi(endpointUrl, accessToken, params = {}) {
  if (!endpointUrl) throw new Error("Endpoint API non configuré.");
  const url = new URL(endpointUrl, window.location.href);
  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null && value !== "") url.searchParams.set(key, value);
  });
  const response = await fetch(url.toString(), {
    headers: {
      Authorization: `Bearer ${accessToken}`,
      Accept: "application/json"
    }
  });
  if (!response.ok) {
    const body = await response.text();
    throw new Error(`Échec API France Travail : ${response.status} ${body}`);
  }
  return response.json();
}

  const choice = (window.prompt("Corpus API prêt. Tapez : utiliser, fusionner, exporter ou annuler.", "utiliser") || "annuler").trim().toLowerCase();
  if (choice.startsWith("util")) {
    App.state.dataset = dataset;
    saveDataset(dataset);

    renderAll();

function normalizeProfile(raw) {
  const base = createEmptyProfile();
  const merged = { ...base, ...raw };
  merged.id = raw.id || raw.normalizedId || base.id;
  merged.ageRange = raw.ageRange === "adult" ? "not_specified" : (raw.ageRange || base.ageRange);
  merged.diplomaLevel = Number(raw.diplomaLevel || 0);
  merged.diplomas = toArray(raw.diplomas);
  merged.certifications = toArray(raw.certifications);
  merged.experiences = Array.isArray(raw.experiences) ? raw.experiences : [];
  merged.experienceDomains = toArray(raw.experienceDomains);
  merged.experienceDuration = raw.experienceDuration || base.experienceDuration;
  merged.skills = toArray(raw.skills);
  merged.skillSignals = toArray(raw.skillSignals);
  merged.softSkills = toArray(raw.softSkills);
  merged.customSkills = toArray(raw.customSkills);
  merged.interests = toArray(raw.interests);
  merged.values = toArray(raw.values);
  merged.constraints = mergeConstraints(raw.constraints || []);
  merged.exclusions = raw.exclusions || { jobIds: [], domains: [], tags: [] };
  merged.excludedDomains = toArray(raw.excludedDomains);
  merged.mobility = { ...base.mobility, ...(raw.mobility || {}) };
  merged.driverLicenses = toArray(raw.driverLicenses);
  merged.availability = { ...base.availability, ...(raw.availability || {}) };
  if (merged.availability.hoursPerWeek === "fullTime") merged.availability.hoursPerWeek = "full_time";
  merged.trainingOpenness = migrateTrainingOpenness(raw.trainingOpenness || base.trainingOpenness);
  merged.trainingFamilies = toArray(raw.trainingFamilies);
  merged.searchHorizon = raw.searchHorizon || raw.objective || base.searchHorizon;
  merged.preferredSchedule = raw.preferredSchedule || base.preferredSchedule;
  merged.needForSecurity = raw.needForSecurity || base.needForSecurity;
  merged.needForAutonomy = raw.needForAutonomy || base.needForAutonomy;
  merged.needForMeaning = raw.needForMeaning || base.needForMeaning;
  merged.hasRequestedResults = Boolean(raw.hasRequestedResults);
  merged.completedBoussole = Boolean(raw.completedBoussole);
  merged.preferredWorkStyles = toArray(raw.preferredWorkStyles);
  merged.preferredEnvironments = toArray(raw.preferredEnvironments);
  merged.criterionWeights = { ...CONFIG.baseWeights, ...(raw.criterionWeights || {}) };
  return merged;
}
