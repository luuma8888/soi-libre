:"diagnosis_or_condition","description":"Tics moteurs ou vocaux pouvant fluctuer et devenir plus coûteux lorsqu’ils sont retenus.","aliases":["tics","Tourette","syndrome de Gilles de la Tourette"],"domain_ids":["domain.body","domain.attention"],"mechanism_ids":["mechanism.tic_suppression_cost","mechanism.social_exposure"]},{"id":"particularity.ocd","label":"TOC / pensées obsessionnelles","kind":"diagnosis_or_condition","description":"Pensées intrusives et/ou rituels pouvant occuper une part importante de l’attention.","aliases":["TOC","trouble obsessionnel compulsif","obsessions"],"domain_ids":["domain.emotional","domain.attention"],"mechanism_ids":["mechanism.intrusive_thought_load","mechanism.ritual_need","mechanism.reassurance_loop"]},{"id":"particularity.low_mood","label":"Humeur dépressive / perte d’élan","kind":"functional_trait","description":"Humeur basse, perte d’intérêt ou baisse d’énergie pouvant réduire fortement l’engagement.","aliases":["dépression","humeur basse","perte de motivation"],"domain_ids":["domain.emotional","domain.motivation"],"mechanism_ids":["mechanism.low_mood_energy","mechanism.low_energy"]},{"id":"particularity.trauma_reactions","label":"Réactions liées à un vécu traumatique","kind":"functional_trait","description":"Réactions observées ou connues pouvant inclure hypervigilance, figement, évitement ou forte sensibilité à certains déclencheurs ; ne vaut pas diagnostic de psychotraumatisme.","aliases":["trauma","psychotrauma","stress post-traumatique"],"domain_ids":["domain.emotional","domain.body"],"mechanism_ids":["mechanism.threat_alarm","mechanism.school_threat_association","mechanism.post_crisis_recovery"]},{"id":"particularity.intellectual_disability","label":"Déficience intellectuelle / fonctionnement intellectuel limité","kind":"diagnosis_or_condition","description":"Peut demander davantage de concrétisation, répétition, temps, généralisation guidée et soutien de l’autonomie.","aliases":["déficience intellectuelle","trouble du dé iases":["cherche à bouger","cherche la pression","besoin sensoriel"],"domain_ids":["domain.sensory","domain.body"],"mechanism_ids":["mechanism.proprioceptive_need","mechanism.vestibular_need","mechanism.oral_sensory_need"]},{"id":"particularity.light_sensitive","label":"Sensibilité à la lumière observée","kind":"sensory_profile","description":"La lumière forte, les néons ou certains contrastes augmentent visiblement l’inconfort.","aliases":["photophobie","sensible aux néons"],"domain_ids":["domain.sensory"],"mechanism_ids":["mechanism.light_sensitivity"]},{"id":"particularity.grief_context","label":"Deuil ou perte récente","kind":"contextual_factor","description":"Une perte récente ou significative peut modifier temporairement disponibilité, émotions et besoin de retrait.","aliases":["deuil","perte d’un proche"],"domain_ids":["domain.emotional","domain.social_context"],"mechanism_ids":["mechanism.grief_load"]},{"id":"particularity.newcomer","label":"Nouvel établissement / nouveaux repères","kind":"contextual_factor","description":"L’élève découvre encore les lieux, adultes, règles et habitudes de fonctionnement.","aliases":["nouveau dans l’école","nouvelle école"],"domain_ids":["domain.environment","domain.autonomy"],"mechanism_ids":["mechanism.new_environment_load","mechanism.implicit_rules"]},{"id":"particularity.low_boundary_awareness","label":"Difficulté observée à poser ses limites","kind":"functional_trait","description":"L’élève repère tardivement ou exprime difficilement ce qu’il ne veut pas ou ce qui devient trop.","aliases":["n’ose pas dire stop","limites difficiles"],"domain_ids":["domain.relational","domain.body"],"mechanism_ids":["mechanism.boundary_awareness","mechanism.people_pleasing"]}],"mechanisms":[{"id":"mechanism.task_initiation","label":"Difficulté d'initiation","description":"Savoir globalement quoi faire sans parvenir à déclencher la première action.","aliases":["ne sait pas commencer","démarrage difficile"],"domain_ids":["domain.executive"],"clues":["Reste devant la tâche sans agir"]},{"id":"mechanism.mental_dispersion","label":"Dispersion attentionnelle ou mentale","description":"L'attention se disperse entre plusieurs stimuli, pensées ou actions.","aliases":["ailleurs","part dans tous les sens"],"domain_ids":["domain.executive"],"clues":["Change souvent de cible","Oublie rapidement ce qu'il faisait"]},{"id":"mechanism.inhibition_cost","label":"Coût d'inhibition","description":"Freiner un geste, une parole ou une impulsion demande un effort important.","aliases":["agit avant de réfléchir"],"domain_ids":["domain.executive"],"clues":["Interrompt","Se lève ou agit très vite"]},{"id":"mechanism.graphomotor_cost","label":"Coût graphomoteur élevé","description":"Écrire mobilise beaucoup d'attention ou d'énergie.","aliases":["écriture coûteuse","fatigue à écrire"],"domain_ids":["domain.motor"],"clues":["Écriture lente","Évitement de la copie"]},{"id":"mechanism.visual_spatial_load","label":"Charge visuospatiale élevée","description":"La disposition spatiale ou la densité visuelle gêne l'accès à la tâche.","aliases":["page trop chargée","se perd dans la feuille"],"domain_ids":["domain.motor"],"clues":["Saute des lignes","Ne retrouve pas l'information"]},{"id":"mechanism.reading_cost","label":"Coût de lecture élevé","description":"Décoder et lire mobilise beaucoup de ressources.","aliases":["lecture lente","fatigue à lire"],"domain_ids":["domain.learning"],"clues":["Compréhension baisse sur texte long"]},{"id":"mechanism.language_load","label":"Charge langagière élevée","description":"La quantité ou complexité du langage dépasse ce qui est facilement traité.","aliases":["consigne trop longue"],"domain_ids":["domain.communication"],"clues":["Demande souvent de répéter","Commence autre chose que ce qui était demandé"]},{"id":"mechanism.expression_block","label":"Expression difficile sous charge","description":"L'élève sait ou ressent quelque chose mais ne parvient pas à l'exprimer facilement.","aliases":["mots bloqués","ne répond plus"],"domain_ids":["domain.communication"],"clues":["Utilise gestes ou silence"]},{"id":"mechanism.sensory_overload","label":"Surcharge sensorielle","description":"La quantité ou l'intensité des stimulations devient difficile à traiter.","aliases":["trop de bruit","trop de lumière"],"domain_ids":["domain.sensory"],"clues":["Se bouche les oreilles","Cherche à fuir"]},{"id":"mechanism.transition_uncertainty","label":"Incertitude face au changement","description":"Le passage d'une activité ou d'un lieu à l'autre crée une charge importante.","aliases":["n'aime pas les changements"],"domain_ids":["domain.environment"],"clues":["Demande sans cesse ce qui vient après"]},{"id":"mechanism.implicit_rules","label":"Règles implicites difficiles à inférer","description":"Les attentes sociales ou scolaires non dites ne sont pas évidentes.","aliases":["ne comprend pas les règles invisibles"],"domain_ids":["domain.environment"],"clues":["Réagit de façon jugée décalée"]},{"id":"mechanism.threat_alarm","label":"État d'alarme / menace ressentie","description":"Le système de protection prend le dessus sur réflexion et apprentissage.","aliases":["panique","se sent en danger"],"domain_ids":["domain.emotional"],"clues":["Respiration rapide","Fuite, agitation ou figement"]},{"id":"mechanism.error_fear","label":"Peur de l'erreur ou du jugement","description":"L'erreur potentielle devient suffisamment menaçante pour bloquer l'action.","aliases":["peur de se tromper"],"domain_ids":["domain.emotional"],"clues":["Efface beaucoup","Refuse de commencer"]},{"id":"mechanism.social_exposure","label":"Coût d'exposition sociale","description":"Être observé, interrogé ou mis en avant augmente fortement la charge.","aliases":["peur du regard des autres"],"domain_ids":["domain.relational"],"clues":["Évite de passer au tableau"]},{"id":"mechanism.frustration_overload","label":"Surcharge de frustration","description":"Une contrariété dépasse momentanément les capacités disponibles de régulation.","aliases":["explose quand ça ne marche pas"],"domain_ids":["domain.emotional"],"clues":["Crie, jette, argumente fortement"]},{"id":"mechanism.rumination_injustice","label":"Rumination d'injustice","description":"Le sentiment d'injustice maintient l'attention bloquée sur l'événement.","aliases":["c'est pas juste"],"domain_ids":["domain.emotional"],"clues":["Revient longtemps sur la même situation"]},{"id":"mechanism.help_dependency","label":"Dépendance à l'aide / faible tolérance à l'essai seul","description":"L'aide arrive si vite ou semble si nécessaire que l'essai autonome diminue.","aliases":["demande toujours que je fasse"],"domain_ids":["domain.executive"],"clues":["Sollicite avant d'essayer"]},{"id":"mechanism.fatigue_load","label":"Charge de fatigue","description":"Les ressources disponibles diminuent sous l'effet de fatigue ou d'effort accumulé.","aliases":["épuisé","plus rien en fin de journée"],"domain_ids":["domain.emotional"],"clues":["Lenteur","Irritabilité","Décrochage"]},{"id":"mechanism.social_uncertainty","label":"Incertitude relationnelle","description":"La lecture des intentions, des codes ou de sa place dans le groupe est difficile.","aliases":["ne sait pas comment rejoindre les autres"],"domain_ids":["domain.relational"],"clues":["Reste en périphérie"]},{"id":"mechanism.conflict_activation","label":"Activation liée au conflit","description":"La tension relationnelle réduit la capacité à écouter, expliquer ou réparer.","aliases":["dispute","provocation"],"domain_ids":["domain.relational"],"clues":["Parle plus fort","Interprète rapidement l'autre"]},{"id":"mechanism.working_memory_load","label":"Charge de mémoire de travail","description":"Trop d'éléments doivent être gardés en tête simultanément.","aliases":["oublie la consigne"],"domain_ids":["domain.executive"],"clues":["Commence puis perd le fil"]},{"id":"mechanism.processing_speed","label":"Temps de traitement lent","description":"L’élève a besoin de davantage de temps pour traiter une information et produire une réponse.","aliases":["latence","réponse lente"],"domain_ids":["domain.learning","domain.executive"],"clues":["Répond après un long délai","Comprend mieux quand on attend"]},{"id":"mechanism.memory_retrieval","label":"Récupération en mémoire difficile","description":"L’information peut être apprise mais difficile à retrouver au moment demandé.","aliases":["trou de mémoire","sait mais ne retrouve pas"],"domain_ids":["domain.memory"],"clues":["Réussit avec un indice","Retrouve plus tard ce qu’il ne pouvait rappeler"]},{"id":"mechanism.decoding_cost","label":"Coût du décodage","description":"Lire mobilise tellement de ressources que la compréhension ou l’endurance diminue.","aliases":["lecture coûteuse","déchiffrage lent"],"domain_ids":["domain.literacy"],"clues":["Lit lentement","Comprend mieux quand on lui lit le texte"]},{"id":"mechanism.spelling_cost","label":"Coût orthographique","description":"Produire l’orthographe capte une part importante des ressources disponibles.","aliases":["orthographe coûteuse"],"domain_ids":["domain.literacy"],"clues":["Écrit peu malgré des idées riches","Se bloque sur chaque mot"]},{"id":"mechanism.number_sense","label":"Sens du nombre fragile","description":"Les quantités, magnitudes ou relations numériques restent difficiles à représenter.","aliases":["sens du nombre","dyscalculie"],"domain_ids":["domain.math"],"clues":["Confond des quantités","S’appuie excessivement sur le comptage"]},{"id":"mechanism.multi_step_load","label":"Charge des consignes multiples","description":"Plusieurs étapes simultanées dépassent la capacité momentanée de maintien et d’organisation.","aliases":["trop d’étapes","consigne longue"],"domain_ids":["domain.executive","domain.memory"],"clues":["Oublie le début en entendant la fin","Fait une étape sur plusieurs"]},{"id":"mechanism.abstract_language","label":"Langage abstrait difficile","description":"Les formulations implicites, abstraites ou figurées sont difficiles à interpréter.","aliases":["second degré","implicite difficile"],"domain_ids":["domain.communication","domain.language"],"clues":["Prend une expression au pied de la lettre","Demande ce que veut dire une consigne vague"]},{"id":"mechanism.auditory_access","label":"Accès auditif incomplet","description":"Une partie du message oral n’est pas perçue ou distinguée dans le contexte sonore.","aliases":["malentendance","n’entend pas tout"],"domain_ids":["domain.communication","domain.sensory"],"clues":["Réussit mieux face à face","Décroche en groupe bruyant"]},{"id":"mechanism.visual_access","label":"Accès visuel incomplet","description":"Le support visuel est difficile à percevoir, explorer ou discriminer.","aliases":["voit mal","support peu lisible"],"domain_ids":["domain.learning","domain.orientation"],"clues":["Se rapproche beaucoup","Perd sa ligne ou des informations"]},{"id":"mechanism.motor_planning","label":"Planification motrice coûteuse","description":"Organiser et enchaîner certains gestes demande un effort conscient important.","aliases":["praxies","geste difficile"],"domain_ids":["domain.motor"],"clues":["Lenteur dans les gestes nouveaux","Difficulté avec outils et matériel"]},{"id":"mechanism.interoception_unclear","label":"Signaux corporels difficiles à identifier","description":"La faim, la soif, la tension, la douleur ou la montée émotionnelle peuvent être perçues tardivement ou confusément.","aliases":["interoception","ne sent pas venir"],"domain_ids":["domain.body"],"clues":["Repère la crise seulement au dernier moment","Difficulté à dire ce qui se passe dans le corps"]},{"id":"mechanism.low_energy","label":"Réserve d’énergie basse","description":"L’effort scolaire ou social devient coûteux plus rapidement.","aliases":["fatigue rapide","énergie basse"],"domain_ids":["domain.health","domain.body"],"clues":["Baisse nette en fin de journée","Ralentissement après un effort"]},{"id":"mechanism.performance_anxiety","label":"Anxiété de performance","description":"La peur d’être évalué, vu ou comparé perturbe l’accès aux compétences.","aliases":["peur du tableau","peur du contrôle"],"domain_ids":["domain.emotional"],"clues":["Réussit seul mais bloque devant les autres","Somatisation avant évaluation"]},{"id":"mechanism.selective_speech_block","label":"Blocage contextuel de la parole","description":"La parole disponible dans certains contextes devient inaccessible dans d’autres.","aliases":["mutisme sélectif","ne parle qu’à certains endroits"],"domain_ids":["domain.communication","domain.emotional"],"clues":["Parle ailleurs mais pas ici","Communique par gestes lorsque la parole bloque"]},{"id":"mechanism.peer_pressure","label":"Pression des pairs","description":"Le comportement est influencé par le besoin d’appartenance, le regard ou la norme du groupe.","aliases":["pression du groupe","faire comme les autres"],"domain_ids":["domain.relational"],"clues":["Change fortement en groupe","Accepte des choses pour ne pas être exclu"]},{"id":"mechanism.shame_exposure","label":"Honte / peur d’être exposé","description":"Le risque d’être remarqué pour une difficulté devient lui-même un obstacle.","aliases":["honte","peur qu’on voie"],"domain_ids":["domain.emotional","domain.relational"],"clues":["Refuse une aide visible","Cache sa difficulté"]},{"id":"mechanism.unpredictability","label":"Imprévisibilité difficile","description":"L’absence de repères sur ce qui va se passer augmente la charge ou l’anxiété.","aliases":["imprévu","besoin de savoir"],"domain_ids":["domain.environment","domain.emotional"],"clues":["Questionne beaucoup sur la suite","Réagit fortement aux changements"]},{"id":"mechanism.choice_overload","label":"Trop de choix","description":"Un nombre élevé d’options rend la décision difficile ou paralysante.","aliases":["indécision","trop de choix"],"domain_ids":["domain.executive"],"clues":["Demande à l’adulte de choisir","Change plusieurs fois d’avis"]},{"id":"mechanism.low_self_efficacy","label":"Sentiment de ne pas être capable","description":"L’élève anticipe l’échec et réduit son engagement avant même d’essayer.","aliases":["je suis nul","j’y arriverai pas"],"domain_ids":["domain.motivation","domain.emotional"],"clues":["Abandon immédiat","Refuse avant d’essayer"]},{"id":"mechanism.boredom_underload","label":"Sous-stimulation / ennui","description":"La tâche apporte trop peu de défi, de nouveauté ou de sens pour maintenir l’engagement.","aliases":["ennui","trop facile"],"domain_ids":["domain.motivation","domain.attention"],"clues":["Fin rapide puis agitation","Décroche sur tâches répétitives"]},{"id":"mechanism.social_repair_gap","label":"Compétence de réparation sociale insuffisamment disponible","description":"Après un conflit, l’élève ne sait pas comment revenir vers l’autre ou réparer.","aliases":["ne sait pas s’excuser","conflit reste bloqué"],"domain_ids":["domain.relational"],"clues":["Évite l’autre après conflit","Repart immédiatement dans l’accusation"]},{"id":"mechanism.group_entry_gap","label":"Difficulté à entrer dans une interaction","description":"L’élève ne sait pas comment rejoindre un jeu ou une conversation déjà commencée.","aliases":["entrer dans le groupe","rejoindre les autres"],"domain_ids":["domain.relational"],"clues":["Reste à côté sans entrer","Interrompt brusquement pour participer"]},{"id":"mechanism.school_threat_association","label":"École associée à une menace","description":"Certains éléments de l’école déclenchent anticipation anxieuse ou évitement.","aliases":["refus scolaire anxieux","peur de l’école"],"domain_ids":["domain.emotional","domain.environment"],"clues":["Détresse à l’arrivée","Soulagement marqué en repartant"]},{"id":"mechanism.digital_overstimulation","label":"Stimulation numérique difficile à quitter","description":"Le niveau de stimulation ou l’engagement numérique rend la transition vers une activité moins stimulante coûteuse.","aliases":["sortie écran difficile","hyperstimulation écran"],"domain_ids":["domain.digital","domain.attention"],"clues":["Irritabilité à l’arrêt","Difficulté à revenir à une tâche lente"]},{"id":"mechanism.body_pain","label":"Douleur ou inconfort corporel","description":"Une douleur ou gêne physique détourne l’attention et réduit la disponibilité.","aliases":["douleur","inconfort"],"domain_ids":["domain.health","domain.body"],"clues":["Change souvent de posture","Se concentre moins lors des épisodes douloureux"]},{"id":"mechanism.food_stress","label":"Stress lié au repas ou à l’alimentation","description":"Le contexte alimentaire peut être source d’anxiété, de surcharge sensorielle ou de contrôle.","aliases":["cantine difficile","manger devant les autres"],"domain_ids":["domain.health","domain.sensory","domain.emotional"],"clues":["Évite le repas","Stress avant la cantine"]},{"id":"mechanism.caregiving_load","label":"Charge de jeune aidant","description":"Des responsabilités envers un proche peuvent consommer énergie, sommeil et attention.","aliases":["jeune aidant","s’occupe d’un proche"],"domain_ids":["domain.social_context","domain.health"],"clues":["Fatigue inexpliquée","Retards ou préoccupations familiales récurrentes"]},{"id":"mechanism.language_learning_load","label":"Charge liée à l’apprentissage du français","description":"Comprendre la langue scolaire ajoute une couche de traitement sans refléter le niveau conceptuel réel.","aliases":["allophone","français langue seconde"],"domain_ids":["domain.language","domain.learning"],"clues":["Comprend mieux avec gestes/visuels","Connaît le concept dans une autre langue"]},{"id":"mechanism.turn_taking","label":"Tours de rôle difficiles","description":"Attendre, repérer son tour ou inhiber une intervention peut être coûteux.","aliases":["coupe la parole","attendre son tour"],"domain_ids":["domain.executive","domain.relational"],"clues":["Interrompt souvent","Réagit avant la fin de la consigne"]},{"id":"mechanism.touch_sensitivity","label":"Sensibilité au toucher","description":"Certains contacts ou proximités physiques provoquent inconfort ou surcharge.","aliases":["n’aime pas être touché"],"domain_ids":["domain.sensory","domain.body"],"clues":["Se retire au contact","Réagit aux frôlements"]},{"id":"mechanism.smell_sensitivity","label":"Sensibilité aux odeurs","description":"Certaines odeurs prennent une place sensorielle très importante.","aliases":["odeurs insupportables"],"domain_ids":["domain.sensory"],"clues":["Évite certains lieux","Nausée ou agitation avec certaines odeurs"]},{"id":"mechanism.repetitive_regulation","label":"Mouvement répétitif autorégulateur","description":"Un mouvement répétitif peut participer à la régulation sensorielle ou émotionnelle.","aliases":["stimming","stéréotypie"],"domain_ids":["domain.sensory","domain.body"],"clues":["Mouvement augmente avec stress","Semble aider à rester présent"]},{"id":"mechanism.copying_load","label":"Copie fortement coûteuse","description":"Copier depuis le tableau ou un autre support mobilise simultanément vision, mémoire, orientation et geste.","aliases":["copie du tableau difficile"],"domain_ids":["domain.literacy","domain.motor","domain.memory"],"clues":["Perd souvent sa place","Copie très lente"]},{"id":"mechanism.time_blindness","label":"Repérage temporel fragile","description":"La durée, l’anticipation ou le temps restant sont difficiles à représenter.","aliases":["notion du temps difficile"],"domain_ids":["domain.executive"],"clues":["Surpris par la fin","Sous-estime fortement la durée"]},{"id":"mechanism.social_attention","label":"Attention captée par le regard social","description":"La présence ou le regard des autres mobilise fortement l’attention.","aliases":["se sent observé"],"domain_ids":["domain.relational","domain.emotional"],"clues":["Travaille mieux seul","Se désorganise quand observé"]},{"id":"mechanism.self_harm_regulation","label":"Recherche de régulation par douleur ou sensation intense","description":"Un geste auto-agressif peut remplir une fonction momentanée de régulation ou de sensation.","aliases":["scarification","se fait mal pour se calmer"],"domain_ids":["domain.emotional","domain.body"],"clues":["Parle d’un soulagement après le geste","Recherche une sensation intense"]},{"id":"mechanism.body_image_stress","label":"Stress lié au corps ou à l’apparence","description":"Le regard sur le corps ou les commentaires corporels deviennent une source de tension.","aliases":["image du corps","peur de grossir"],"domain_ids":["domain.emotional","domain.health"],"clues":["Évite certains repas ou vestiaires","Réagit fortement aux commentaires sur l’apparence"]},{"id":"mechanism.bullying_ecology","label":"Dynamique de groupe de moqueries ou harcèlement","description":"Le problème s’inscrit dans des rôles et renforcements de groupe, pas seulement entre deux élèves.","aliases":["harcèlement de groupe"],"domain_ids":["domain.relational"],"clues":["Rires ou relais de plusieurs pairs","Évitement de certains lieux ou groupes"]},{"id":"mechanism.sustained_attention","label":"Attention soutenue coûteuse","description":"Maintenir l’attention sur une même activité pendant la durée demandée devient progressivement difficile.","aliases":["décroche avec le temps","attention qui chute"],"clues":["Reste engagé au début puis décroche","Besoin fréquent de relances après quelques minutes"]},{"id":"mechanism.task_persistence","label":"Persistance fragile","description":"La difficulté est moins de commencer que de continuer malgré effort, lenteur ou obstacle.","aliases":["abandon rapide","ne tient pas la tâche"],"clues":["Commence puis arrête","Change d’activité au premier obstacle"]},{"id":"mechanism.sequencing","label":"Séquençage difficile","description":"Les étapes sont connues isolément mais leur ordre est difficile à maintenir.","aliases":["saute des étapes","ordre des étapes"],"clues":["Fait les étapes dans le désordre","Oublie une étape intermédiaire"]},{"id":"mechanism.planning_load","label":"Charge de planification","description":"Construire un plan d’action avant d’agir demande un effort important.","aliases":["ne sait pas organiser","planification difficile"],"clues":["Commence par un détail secondaire","Ne sait pas répartir une tâche longue"]},{"id":"mechanism.task_switching","label":"Changement de tâche coûteux","description":"Passer d’une activité ou d’une règle à une autre demande un temps d’ajustement important.","aliases":["reste bloqué sur l’activité précédente","switch difficile"],"clues":["Continue l’ancienne consigne","Se désorganise après interruption"]},{"id":"mechanism.self_monitoring","label":"Auto-vérification peu disponible","description":"Repérer ses propres erreurs ou vérifier une production n’est pas spontané ou coûte beaucoup.","aliases":["ne se relit pas","ne voit pas ses erreurs"],"clues":["Rend immédiatement sans vérifier","Corrige seulement quand l’adulte pointe l’erreur"]},{"id":"mechanism.reassurance_loop","label":"Boucle de réassurance","description":"Le besoin de confirmation revient rapidement même après une réponse rassurante.","aliases":["demande si c’est bon","besoin de validation"],"clues":["Demande confirmation à chaque étape","Répète la même question rassurante"]},{"id":"mechanism.waiting_tolerance","label":"Tolérance à l’attente faible","description":"Attendre une réponse, un tour ou un événement devient rapidement inconfortable.","aliases":["n’arrive pas à attendre","impatience"],"clues":["Interrompt pendant l’attente","Monte en tension quand il faut patienter"]},{"id":"mechanism.word_retrieval","label":"Accès lexical difficile","description":"Le mot connu est difficile à retrouver au moment voulu.","aliases":["mot sur le bout de la langue","cherche ses mots"],"clues":["Utilise des périphrases","Temps long pour trouver un mot familier"]},{"id":"mechanism.formulation_load","label":"Formulation du message coûteuse","description":"Transformer une pensée en phrase compréhensible demande beaucoup d’effort.","aliases":["sait mais n’arrive pas à dire","phrase difficile"],"clues":["Commence puis abandonne sa phrase","Message très réduit malgré une idée riche"]},{"id":"mechanism.inference_load","label":"Inférences difficiles","description":"Comprendre ce qui n’est pas dit explicitement demande un effort important.","aliases":["comprend le texte mais pas le sous-entendu","inférence"],"clues":["Répond seulement à ce qui est écrit mot à mot","Ne relie pas des indices dispersés"]},{"id":"mechanism.math_language_load","label":"Langage mathématique coûteux","description":"Le vocabulaire ou la syntaxe d’un énoncé masque parfois une compétence mathématique disponible.","aliases":["problème écrit difficile","langage des maths"],"clues":["Réussit une opération isolée mais pas le problème verbal"]},{"id":"mechanism.procedure_memory","label":"Procédure fragile en mémoire","description":"Une procédure apprise est difficile à rappeler ou maintenir dans le bon ordre.","aliases":["oublie comment poser","procédure oubliée"],"clues":["Demande à nouveau les étapes d’un calcul connu"]},{"id":"mechanism.geometry_spatial_load","label":"Charge spatiale en géométrie","description":"Repérage, alignement, orientation et manipulation spatiale peuvent masquer la compréhension mathématique.","aliases":["géométrie très difficile","repérage spatial"],"clues":["Perd les repères sur une figure","Difficulté à aligner règle ou équerre"]},{"id":"mechanism.divided_attention","label":"Attention divisée coûteuse","description":"Écouter et écrire, regarder et manipuler ou traiter deux sources simultanément surcharge rapidement.","aliases":["écouter et écrire impossible","double tâche"],"clues":["Perd la consigne en prenant des notes","Arrête d’écouter lorsqu’il copie"]},{"id":"mechanism.light_sensitivity","label":"Sensibilité à la lumière","description":"Une lumière forte, clignotante ou très contrastée augmente l’inconfort ou la surcharge.","aliases":["lumière gênante","néons difficiles"],"clues":["Plisse les yeux","Évite certaines zones très éclairées"]},{"id":"mechanism.visual_motion_load","label":"Charge visuelle liée au mouvement","description":"Les mouvements nombreux autour de l’élève captent ou saturent l’attention.","aliases":["trop de monde qui bouge","mouvement visuel"],"clues":["Regarde chaque déplacement","Se désorganise dans un espace très animé"]},{"id":"mechanism.proprioceptive_need","label":"Besoin proprioceptif","description":"Une pression musculaire ou un effort bref peut aider à retrouver des repères corporels.","aliases":["besoin de pousser","cherche la pression"],"clues":["S’appuie fortement","Cherche à porter, pousser ou serrer"]},{"id":"mechanism.vestibular_need","label":"Besoin de mouvement vestibulaire","description":"Bouger, se balancer ou changer de position peut participer à l’autorégulation.","aliases":["besoin de bouger","se balance"],"clues":["Se balance fréquemment","Cherche les rotations ou déplacements"]},{"id":"mechanism.oral_sensory_need","label":"Besoin sensoriel oral","description":"Mâcher ou solliciter la bouche peut contribuer à la régulation ou à l’attention.","aliases":["mâchouille","porte à la bouche"],"clues":["Mâche stylos ou vêtements","Cherche souvent une stimulation orale"]},{"id":"mechanism.hydration_hunger_signal","label":"Signal de faim ou soif peu repéré","description":"Le besoin corporel peut être identifié tardivement et se manifester par irritabilité ou baisse d’attention.","aliases":["oublie de boire","faim tardive"],"clues":["Ne boit presque pas sans rappel","Irritabilité avant de reconnaître la faim"]},{"id":"mechanism.social_comparison","label":"Comparaison sociale","description":"La comparaison avec les autres influence fortement confiance, motivation ou émotions.","aliases":["se compare","les autres sont meilleurs"],"clues":["Observe les résultats des autres avant le sien","Se dévalorise après comparaison"]},{"id":"mechanism.people_pleasing","label":"Suradaptation relationnelle","description":"Dire oui, céder ou masquer son inconfort peut servir à préserver la relation.","aliases":["n’ose pas dire non","veut faire plaisir"],"clues":["Accepte alors qu’il semble mal à l’aise","S’excuse de manière excessive"]},{"id":"mechanism.boundary_awareness","label":"Limites personnelles difficiles à repérer ou exprimer","description":"Identifier puis communiquer son inconfort ou ses limites n’est pas toujours disponible.","aliases":["ne sait pas poser ses limites","espace personnel"],"clues":["Tolère puis explose brusquement","Ne sait pas dire stop"]},{"id":"mechanism.peer_rejection","label":"Expérience de rejet par les pairs","description":"Des expériences de rejet rendent l’entrée en relation plus coûteuse et peuvent entraîner évitement ou hypervigilance.","aliases":["rejet du groupe","peur d’être rejeté"],"clues":["Observe sans rejoindre","Interprète rapidement les échanges comme rejetants"]},{"id":"mechanism.anticipatory_anxiety","label":"Anxiété anticipatoire","description":"La difficulté augmente avant même l’événement redouté.","aliases":["angoisse avant","anticipe le pire"],"clues":["Pose de nombreuses questions longtemps avant","Symptômes corporels avant l’événement"]},{"id":"mechanism.separation_distress","label":"Difficulté de séparation","description":"Quitter une figure de sécurité ou franchir l’entrée du lieu peut déclencher une forte activation.","aliases":["séparation difficile","ne veut pas quitter parent"],"clues":["Reste au portail","Détresse au moment du départ du proche"]},{"id":"mechanism.post_crisis_recovery","label":"Besoin de récupération après débordement","description":"Après une crise ou une forte activation, les capacités ne reviennent pas immédiatement.","aliases":["épuisé après crise","récupération"],"clues":["Semble très fatigué après l’épisode","Tolère mal les demandes juste après"]},{"id":"mechanism.post_crisis_shame","label":"Honte après débordement","description":"Après un comportement visible ou une crise, la honte peut empêcher le retour vers le groupe ou l’activité.","aliases":["honte après crise","n’ose pas revenir"],"clues":["Évite le regard des autres","Refuse de retourner dans la pièce"]},{"id":"mechanism.grief_load","label":"Charge liée à une perte ou un deuil","description":"La pensée et l’émotion liées à une perte peuvent fluctuer et réduire momentanément la disponibilité scolaire.","aliases":["deuil","perte"],"clues":["Décrochage soudain à certains moments","Besoin de parler ou au contraire de ne pas parler"]},{"id":"mechanism.new_environment_load","label":"Charge d’un environnement nouveau","description":"Les repères spatiaux, humains et implicites ne sont pas encore automatisés.","aliases":["nouvelle école","nouveaux repères"],"clues":["Se perd ou hésite fréquemment","Observe les autres avant d’agir"]},{"id":"mechanism.tic_suppression_cost","label":"Coût de suppression des tics","description":"Retenir volontairement des tics peut mobiliser fortement l’attention et augmenter la tension.","aliases":["retient ses tics","tic"],"clues":["Tics plus forts après une période de contrôle","Fatigue liée à l’effort de suppression"]},{"id":"mechanism.intrusive_thought_load","label":"Pensées intrusives","description":"Des pensées répétitives non souhaitées captent l’attention et peuvent pousser à demander réassurance ou ritualiser.","aliases":["pensée intrusive","obsession"],"clues":["Semble bloqué sur une pensée","Demande répétitivement une confirmation"]},{"id":"mechanism.ritual_need","label":"Besoin de ritualisation","description":"Une action répétée ou une vérification peut être ressentie comme nécessaire pour réduire l’inconfort.","aliases":["rituel","doit refaire"],"clues":["Recommence une action jusqu’à ce qu’elle semble correcte"]},{"id":"mechanism.low_mood_energy","label":"Humeur basse et faible élan","description":"Une humeur basse peut réduire initiative, intérêt et énergie sans produire forcément de comportement perturbateur.","aliases":["plus envie de rien","triste et passif"],"clues":["Activités auparavant appréciées délaissées","Réponses très brèves et faible initiative"]},{"id":"mechanism.generalization_gap","label":"Généralisation difficile","description":"Une compétence acquise dans un contexte ne se transfère pas automatiquement dans un autre.","aliases":["sait ici mais pas ailleurs","ne généralise pas"],"clues":["Réussit avec une personne puis pas avec une autre"]},{"id":"mechanism.note_taking_load","label":"Prise de notes coûteuse","description":"Sélectionner l’essentiel, écouter et écrire simultanément dépasse les ressources disponibles.","aliases":["notes impossibles","copier et écouter"],"clues":["Copie tout sans comprendre","Rate une partie de l’explication"]},{"id":"mechanism.identity_difference_stress","label":"Stress lié à une différence visible ou commentée","description":"Être renvoyé à une différence, un accent, une identité ou une particularité peut augmenter vigilance et retrait.","aliases":["se sent différent","peur des remarques"],"clues":["Évite une activité où la différence devient visible"]}],"situations":[{"id":"situation.cannot_start_task","title":"Il reste devant son travail sans réussir à commencer","short_label":"N'arrive pas à commencer","description":"L'élève semble bloqué avant même la première action.","aliases":["il ne commence pas","il reste devant sa feuille","il attend que je fasse","il dit je sais pas avant d'essayer"],"observable_signs":["Regarde la feuille sans agir","Manipule son matériel","Demande immédiatement de l'aide"],"group_ids":["group.task_start"],"domain_ids":["domain.executive"],"mechanism_ids":["mechanism.task_initiation","mechanism.working_memory_load","mechanism.error_fear","mechanism.mental_dispersion"],"particularity_ids":["particularity.adhd","particularity.anxiety","particularity.perfectionism"],"context_ids":["context.classroom","context.study"],"constraints":{"age_min":5,"age_max":null,"requires_capability_ids":[],"forbids_capability_ids":[],"environment_requirement_ids":[],"requires_materials":[],"requires_consent":false,"requires_touching_other_person":false,"notes":[]}},{"id":"situation.refuses_writing","title":"Il refuse ou évite une tâche écrite","short_label":"Refuse d'écrire","description":"L'élève retarde, évite ou refuse une activité demandant d'écrire.","aliases":["il ne veut pas écrire","il bloque dès qu'il faut écrire","veut que j'écrive à sa place"],"observable_signs":["Retarde le moment d'écrire","Demande que l'adulte écrive","Se plaint rapidement de fatigue"],"group_ids":["group.writing"],"domain_ids":["domain.motor","domain.learning","domain.emotional"],"mechanism_ids":["mechanism.graphomotor_cost","mechanism.error_fear","mechanism.task_initiation"],"particularity_ids":["particularity.dcd","particularity.dyslexia","particularity.perfectionism"],"context_ids":["context.classroom","context.study"],"constraints":{"age_min":5,"age_max":null,"requires_capability_ids":[],"forbids_capability_ids":[],"environment_requirement_ids":[],"requires_materials":[],"requires_consent":false,"requires_touching_other_person":false,"notes":[]}},{"id":"situation.noise_overload","title":"Le bruit semble devenir trop difficile à supporter","short_label":"Trop de bruit","description":"Le niveau sonore ou la multiplicité des sons paraît contribuer au débordement.","aliases":["il se bouche les oreilles","la cantine est trop bruyante","le bruit le fait exploser"],"observable_signs":["Se bouche les oreilles","Cherche à s'éloigner","Agitation croissante avec le bruit"],"group_ids":["group.sensory"],"domain_ids":["domain.sensory","domain.environment"],"mechanism_ids":["mechanism.sensory_overload"],"particularity_ids":["particularity.autism","particularity.auditory_hypersensitivity"],"context_ids":["context.classroom","context.canteen","context.corridor"]},{"id":"situation.motor_restlessness","title":"Il bouge beaucoup, se lève ou gigote et a du mal à rester physiquement avec la tâche","short_label":"Agité / bouge beaucoup","description":"L’activité motrice est importante : l’élève se lève, gigote, change souvent de posture ou cherche à bouger. Cela ne signifie pas à lui seul qu eaning":"Le statut décrit la nature de l’information, pas sa valeur de vérité.","guidance":{"known":"Information connue/établie dans le contexte de l'élève.","suspected":"Hypothèse de travail ou particularité suspectée ; elle ne vaut pas diagnostic.","observed_trait":"Trait fonctionnel directement observé. Pour ce statut, préférer si possible une entrée fonctionnelle, sensorielle ou communicationnelle plutôt qu'un diagnostic comme simple étiquette."}},"situation_particularities":{"meaning":"Les particularity_ids indiquent des profils ou traits pouvant être pertinents pour explorer cette situation. Leur présence n'implique ni causalité ni bonus automatique.","ranking_rule":"Seules les fit_rules portées par une recommandation modifient le classement."},"recommendation_contexts":{"empty_context_ids":"Aucune restriction supplémentaire au niveau de la recommandation ; utiliser la compatibilité de la situation et de l'outil.","context_any":"context.any signifie utilisable dans tout contexte et doit être utilisé seul dans context_ids.","multiple_facets":"Lieu, activité et moment peuvent être actifs simultanément."},"fit_rules":{"principle":"Une fit_rule sert à distinguer réellement une piste ou à expliquer une exception ; elle ne doit pas dupliquer uniformément le même bonus sur toutes les recommandations d'une situation.","missing_rule":"L'absence de règle pour une particularité est neutre et peut signifier que les pistes restent communes quelle que soit cette lecture."},"practice_categories":{"principle":"Catégories descriptives multi-étiquettes, sans hiérarchie de valeur.","reserved_categories":["practice.reflexology","practice.spiritual_mystical"]},"taxonomy_statuses":{"default":"active","reserved":"Valeur prévue pour un enrichissement futur mais à ne pas proposer comme filtre principal tant qu’aucun contenu actif ne l’utilise.","deprecated":"Valeur conservée uniquement pour migration ; ne pas proposer dans l’interface."},"diversity_families":{"purpose":"Éviter que les premières propositions soient trois variantes de la même logique.","rule":"Ces familles sont volontairement larges et contrôlées ; elles ne remplacent pas les practice_category_ids plus détaillés."},"age_constraints":{"default_mode":"guidance","meaning":"age_min et age_max sont des repères de présentation/dépriorisation sauf si age_is_hard=true. Ils ne doivent pas masquer un outil à eux seuls par défaut.","priority":"Les capacités fonctionnelles, le contexte, le consentement et les contraintes concrètes priment sur l’âge chronologique."},"provenance":{"principle":"La provenance informe sur l’origine d’un principe ; elle n’attribue ni score de vérité ni hiérarchie entre familles de pratique.","recommendations":"Les associations situation→outil sont des synthèses éditoriales sauf mention explicite contraire."}},"curation":{"version":"1.0","audit_date":"2026-09-16","method":["Conserver comme noyau les principes récurrents dans le corpus étudié : entrée par besoins observables, adaptation de l’environnement, autonomie, communication accessible, réduction de charge et pluralité des voies de régulation.","Distinguer les liens directement soutenus par une ressource des adaptations inspirées et des synthèses éditoriales de terrain.","Ne pas créer une relation situation→outil uniquement pour augmenter la couverture ; toute relation doit avoir une justification fonctionnelle explicite.","Pour les thèmes sensibles (mutisme sélectif, bégaiement, refus scolaire, TCA, automutilation, rituels/vérifications), privilégier les formulations à faible risque compatibles avec le rôle AESH et éviter de transformer l’application en outil thérapeutique.","Les pratiques corporelles, méditatives, énergétiques ou spirituelles restent optionnelles, volontaires, réversibles et clairement catégorisées."],"provenance_relations":{"supports":"La ressource soutient directement le principe pratique retenu.","inspired_by":"La ressource soutient un principe plus large dont l’outil est une adaptation AESH.","describes":"La ressource décrit le phénomène ou le vécu utile pour comprendre l’outil.","field_practice":"La piste est une adaptation pratique de terrain ; elle ne doit pas être présentée comme une prescription de la source."},"recommendation_mapping":"Les relations situation→outil sont des synthèses éditoriales. Le fait qu’un outil possède une source ne signifie pas que cette source a publié exactement cette association situation→outil."}}</script>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('aesh-referential').textContent);
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const normalize = s => String(s ?? '')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/[’']/g,"'").replace(/[^a-z0-9' -]+/g,' ')
  .replace(/\s+/g,' ').trim();
const tokenArray = n => n.split(' ').filter(x => x.length > 1);
const tokens = s => tokenArray(normalize(s));
const maps = {};
for (const key of ['situations','tools','particularities','mechanisms','sources']) maps[key] = new Map(DATA[key].map(x => [x.id,x]));
const tax = {};
for (const [key,arr] of Object.entries(DATA.taxonomies)) tax[key] = new Map(arr.map(x => [x.id,x]));
const recBySituation = new Map(), recByTool = new Map();
for (const r of DATA.recommendations) {
  if (!recBySituation.has(r.situation_id)) recBySituation.set(r.situation_id,[]);
  if (!recByTool.has(r.tool_id)) recByTool.set(r.tool_id,[]);
  recBySituation.get(r.situation_id).push(r); recByTool.get(r.tool_id).push(r);
}
const situationToolIds=new Map();
for(const s of DATA.situations) situationToolIds.set(s.id,new Set((recBySituation.get(s.id)||[]).map(r=>r.tool_id)));
const TIER_BASE = {first_try:300,good_option:200,alternative:100};
const FIT_DELTA = {mild:10,moderate:20,strong:30};
const HIST_DELTA = {very_helpful:50,helpful:25,mixed:0,no_effect:-15,worse:-80,not_evaluable:0};
function makeField(text){const n=normalize(text);return{n,t:new Set(tokenArray(n))}}
function scoreN(qn,qt,f){
  const b=f?.n||''; if(!qn||!b)return 0;
  if(qn===b)return 1000;
  if(b.startsWith(qn))return 780;
  if(b.includes(qn))return 630;
  if(!qt.length)return 0;
  let hit=0,prefix=0;
  for(const x of qt){if(f.t.has(x))hit++;else{for(const y of f.t){if(y.startsWith(x)||x.startsWith(y)){prefix++;break}}}}

function renderReference(focus=false){syncNav('reference');const c=child();main.innerHTML=`<section class="pageHead"><div><div class="eyebrow">Référentiel commun${c?' · profil actif':''}</div><h1>${c?`Chercher pour ${C.esc(c.display_name)}`:'Situations et outils'}</h1><p class="lead">${c?'Sélectionne une situation : les pistes utilisent son âge, ses particularités, ses capacités et les essais déjà réalisés. Tu peux ensuite ajouter cette situation à son suivi.':`Les ${D.situations.length} situations sont toutes accessibles ici. Tape pour filtrer ou passe à la boîte à outils.`}</p></div>${c?`<button class="btnGhost" id="backChild">Retour à ${C.esc(c.display_name)}</button>`:''}</section>

function updateReferenceContextNote(){const root=$('#contextNote');if(!root)return;const c=child();if(!c){root.innerHTML='<strong>Consultation générale.</strong> Aucun profil enfant n’influence les propositions.';return}const n=c.particularities.length,age=ageOf(c);root.innerHTML=`<strong>Profil actif : ${C.esc(c.display_name)}</strong>${age?` · environ ${age} ans`:''}${n?` · ${n} particularité${n>1?'s':''}`:''}. Les repères choisis dans une situation affinent les pistes et sont enregistrés si tu ajoutes cette situation au suivi.`}

function renderSituationDetail(){const root=$('#situationDetail'),s=C.maps.situations.get(ui.selectedSituationId);if(!root)return;if(!s){root.innerHTML='<div class="empty">Sélectionne une situation pour voir les pistes concrètes.</div>';return}const ranked=rank(s.id),top=C.diversifiedTop(ranked,3),topIds=new Set(top.map(x=>x.r.id)),more=ranked.filter(x=>!topIds.has(x.r.id)),mechs=C.mechanismLabels(s).slice(0,5),c=child(),obsCount=c?c.observations.filter(o=>o.situation_id===s.id).length:0;

  ${top.length?`<div class="section"><div class="sectionTitle"><h2>À essayer d’abord</h2><span>${top.length} pistes diversifiées</span></div><div class="top3">${top.map(toolHTML).join('')}</div></div>`:`<div class="empty" style="margin-top:16px">Aucune piste compatible avec les repères actuels.</div>`}

  $$('[data-ctx]',root).forEach(b=>b.onclick=()=>{const id=b.dataset.ctx;ui.contextIds.has(id)?ui.contextIds.delete(id):ui.contextIds.add(id);renderSituationDetail()});$('#reg').onchange=e=>{ui.stateId=e.target.value||null;renderSituationDetail()};$('#compare')?.addEventListener('click',()=>{ui.view='compare';render()});$('#addFollow')?.addEventListener('click',e=>addSituationToFollowup(s,e.currentTarget));$$('.openTool',root).forEach(b=>b.onclick=()=>openTool(b.dataset.tool));$$('.planTool',root).forEach(b=>b.onclick=()=>planTrial(b.dataset.tool,b.dataset.rec,s.id));}
function addSituationToFollowup(s,button){const c=child();if(!c)return;const now=new Date().toISOString();c.observations.push({id:uuid('obs'),text:s.title,situation_id:s.id,context_ids:[...ui.contextIds],created_at:now,updated_at:now});c.updated_at=now;persist();if(button){button.textContent='Ajouté ✓';button.disabled=true;setTimeout(()=>renderSituationDetail(),700)}}
function toolHTML(x){const planned=child()?.trials?.some(t=>t.status==='planned'&&t.tool_id===x.t.id&&t.situation_id===ui.selectedSituationId),infl=influenceTags(x);return`<article class="tool primaryTool"><h3>${C.esc(x.t.title)}</h3><p>${C.esc(x.t.summary)}</p><div class="whyVisible"><strong>Pourquoi ici</strong>${C.esc(x.r.reason_short||x.t.why_it_may_help||'')}${x.reasons.length?`<br>${C.esc(x.reasons[0])}`:''}</div>${infl.length?`<div class="influenceTags">${infl.map(v=>`<span class="influenceTag">${C.esc(v)}</span>`).join('')}</div>`:''}<div class="actions"><button class="btnGhost small openTool" data-tool="${C.esc(x.t.id)}">Détail</button>${child()?`<button class="btn small planTool" ${planned?'disabled':''} data-tool="${C.esc(x.t.id)}" data-rec="${C.esc(x.r.id)}">${planned?'Déjà prévu':'À essayer'}</button>`:''}</div></article>`}
function moreToolHTML(x){const planned=child()?.trials?.some(t=>t.status==='planned'&&t.tool_id===x.t.id&&t.situation_id===ui.selectedSituationId),infl=influenceTags(x);return`<article class="moreCard"><h4>${C.esc(x.t.title)}</h4><p>${C.esc(x.t.summary)}</p><div class="whyVisible"><strong>Pourquoi ici</strong>${C.esc(x.r.reason_short||x.t.why_it_may_help||'')}</div>${infl.length?`<div class="influenceTags">${infl.map(v=>`<span class="influenceTag">${C.esc(v)}</span>`).join('')}</div>`:''}<div class="actions"><button class="btnGhost small openTool" data-tool="${C.esc(x.t.id)}">Détail</button>${child()?`<button class="btn small planTool" ${planned?'disabled':''} data-tool="${C.esc(x.t.id)}" data-rec="${C.esc(x.r.id)}">${planned?'Déjà prévu':'À essayer'}</button>`:''}</div></article>`}
function planTrial(toolId,recId,sid){const c=child();if(!c)return;if(c.trials.some(t=>t.status==='planned'&&t.tool_id===toolId&&t.situation_id===sid))return;c.trials.push({id:uuid('trial'),tool_id:toolId,situation_id:sid,recommendation_id:recId,context_ids:[...ui.contextIds],status:'planned',result:null,note:'',planned_at:new Date().toISOString(),occurred_at:null,updated_at:new Date().toISOString()});c.updated_at=new Date().toISOString();persist();renderSituationDetail()}
function renderChildren(){syncNav('children');main.innerHTML=`<section class="pageHead"><div><div class="eyebrow">Profils locaux</div><h1>Enfants</h1><p class="lead">Des repères fonctionnels pour apprendre ce qui aide chaque enfant, sans construire un dossier administratif.</p></div><button class="btn" id="newChild">Nouvel enfant</button></section><div class="cards">${db.children.map(c=>`<button class="childCard" data-child="${C.esc(c.id)}"><h3>${C.esc(c.display_name)}</h3><p>${C.esc(c.label||'')}${c.birth_year?` · env. ${ageOf(c)} ans`:''}</p><div class="meta"><span class="tag">${c.particularities.length} particularité${c.particularities.length>1?'s':''}</span><span class="tag">${c.trials.length} essai${c.trials.length>1?'s':''}</span></div></button>`).join('')||`<div class="empty">Aucun enfant créé. Commence par un prénom ou un alias.</div>`}</div>`;$('#newChild').onclick=()=>editChild();$$('[data-child]').forEach(b=>b.onclick=()=>{ui.currentChildId=b.dataset.child;ui.view='child';render()})}
function editChild(existing=null){const isNew=!existing,c=existing||normalizeChild({id:uuid('child'),display_name:'',created_at:new Date().toISOString()});openModal(`<div class="dialogHead"><h2>${isNew?'Nouvel':'Modifier'} enfant</h2><button class="close" aria-label="Fermer">✕</button></div><div class="form"><div class="field"><label for="cn">Prénom ou alias</label><input id="cn" value="${C.esc(c.display_name)}"></div><div class="field"><label for="cl">Repère libre</label><input id="cl" value="${C.esc(c.label||'')}" placeholder="Ex. CM1 — Mme Martin"></div><div class="field"><label for="cy">Année de naissance</label><input id="cy" type="number" min="1990" max="2100" value="${c.birth_year||''}"></div><div class="field"><label for="cnotes">Notes générales facultatives</label><textarea id="cnotes">${C.esc(c.notes||'')}</textarea></div></div><div class="dialogActions">${!isNew?`<button class="btnDanger" id="deleteChild">Supprimer ce profil</button>`:''}<button class="btnGhost close2">Annuler</button><button class="btn" id="saveChild">Enregistrer</button></div>`,close=>{
  $('.close2',modalRoot).onclick=close;$('#saveChild',modalRoot).onclick=()=>{const name=$('#cn',modalRoot).value.trim();if(!name){$('#cn',modalRoot).focus();return}const y=parseInt($('#cy',modalRoot).value,10);c.display_name=name;c.label=$('#cl',modalRoot).value.trim();c.birth_year=Number.isFinite(y)?y:null;c.notes=$('#cnotes',modalRoot).value.trim();c.updated_at=new Date().toISOString();if(isNew)db.children.push(c);persist();ui.currentChildId=c.id;ui.view='child';close();render()};$('#deleteChild',modalRoot)?.addEventListener('click',()=>{if(confirm(`Supprimer le profil local de ${c.display_name} ?`)){db.children=db.children.filter(x=>x.id!==c.id);if(ui.currentChildId===c.id)ui.currentChildId=null;persist();ui.view='children';close();render()}})

function trialInsights(c){const scores=new Map();for(const tr of c.trials.filter(x=>x.status==='completed'&&x.result)){const delta={very_helpful:2,helpful:1,mixed:0,no_effect:-1,worse:-2,not_evaluable:0}[tr.result]||0;scores.set(tr.tool_id,(scores.get(tr.tool_id)||0)+delta)}const arr=[...scores].map(([id,score])=>({tool:C.maps.tools.get(id),score})).filter(x=>x.tool);return{positive:arr.filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5),negative:arr.filter(x=>x.score<0).sort((a,b)=>a.score-b.score).slice(0,5)}}
function renderChild(){syncNav('children');const c=child();if(!c){ui.view='children';return renderChildren()}const planned=c.trials.filter(x=>x.status==='planned'),completed=c.trials.filter(x=>x.status==='completed'),ins=trialInsights(c),caps=c.capabilities.filter(x=>x.status!=='unknown');main.innerHTML=`<div class="profileHead"><div><div class="eyebrow">Accompagnement</div><h1>${C.esc(c.display_name)}</h1><div class="profileMeta">${C.esc(c.label||'')}${c.birth_year?` · environ ${ageOf(c)} ans`:''}</div></div><div class="actions"><button class="btnGhost" id="editC">Modifier</button><button class="btn" id="searchC">Ajouter / chercher une situation</button></div></div>
  ${(ins.positive.length||ins.negative.length)?`<div class="insights">${ins.positive.length?`<div class="insight"><h3>Semble souvent aider</h3><ul>${ins.positive.map(x=>`<li>${C.esc(x.tool.title)}</li>`).join('')}</ul></div>`:''}${ins.negative.length?`<div class="insight"><h3>À reconsidérer pour cet enfant</h3><ul>${ins.negative.map(x=>`<li>${C.esc(x.tool.title)}</li>`).join('')}</ul></div>`:''}</div>`:''}
  <div class="profileGrid"><section class="panel"><div class="panelHead"><h2>Particularités</h2><button class="btnGhost small" id="addPart">Ajouter</button></div><div class="panelBody"><div class="list">${c.particularities.map((x,i)=>particularityItem(x,i)).join('')||`<div class="empty">Aucune particularité renseignée.</div>`}</div></div></section><section class="panel"><div class="panelHead"><h2>Capacités utiles</h2><button class="btnGhost small" id="manageCaps">Gérer</button></div><div class="panelBody"><div class="list">${caps.map(x=>`<div class="item"><div class="itemHead"><strong>${C.esc(C.tax.capabilities.get(x.capability_id)?.label||x.capability_id)}</strong><span class="status">${x.status==='present'?'présent':'absent'}</span></div>${x.note?`<small>${C.esc(x.note)}</small>`:''}</div>`).join('')||`<div class="empty">Aucune capacité précisée. Une donnée inconnue reste neutre.</div>`}</div></div></section></div>
  <div class="profileGrid"><section class="panel"><div class="panelHead"><h2>Observations</h2><button class="btnGhost small" id="addObs">Ajouter</button></div><div class="panelBody"><div class="list">${c.observations.slice().reverse().map((x,ri)=>observationItem(x,c.observations.length-1-ri)).join('')||`<div class="empty">Aucune observation.</div>`}</div></div></section><section class="panel"><div class="panelHead"><h2>À essayer</h2><span class="saveState">${planned.length}</span></div><div class="panelBody"><div class="list">${planned.map(x=>trialItem(x,true)).join('')||`<div class="empty">Aucun essai planifié.</div>`}</div></div></section></div>

  $('#editC').onclick=()=>editChild(c);$('#searchC').onclick=()=>{ui.view='reference';ui.refType='situations';ui.query='';ui.selectedSituationId=null;ui.contextIds=new Set();ui.stateId=null;renderReference(true)};$('#addPart').onclick=()=>editParticularity(c,null);$('#manageCaps').onclick=()=>manageCapabilities(c);$('#addObs').onclick=()=>editObservation(c,null);$$('[data-editpart]').forEach(b=>b.onclick=()=>editParticularity(c,+b.dataset.editpart));$$('[data-delpart]').forEach(b=>b.onclick=()=>{c.particularities.splice(+b.dataset.delpart,1);persist();renderChild()});$$('[data-editobs]').forEach(b=>b.onclick=()=>editObservation(c,+b.dataset.editobs));$$('[data-openobs]').forEach(b=>b.onclick=()=>{const o=c.observations[+b.dataset.openobs];if(!o?.situation_id)return;ui.selectedSituationId=o.situation_id;ui.contextIds=new Set(o.context_ids||[]);ui.stateId=null;ui.query='';ui.refType='situations';ui.view='reference';renderReference()});$$('[data-delobs]').forEach(b=>b.onclick=()=>{c.observations.splice(+b.dataset.delobs,1);persist();renderChild()});$$('[data-evaltrial]').forEach(b=>b.onclick=()=>evaluateTrial(c,b.dataset.evaltrial));$$('[data-deltrial]').forEach(b=>b.onclick=()=>{c.trials=c.trials.filter(x=>x.id!==b.dataset.deltrial);persist();renderChild()});$$('[data-toolopen]').forEach(b=>b.onclick=()=>openTool(b.dataset.toolopen));

function observationItem(x,i){const s=x.situation_id?C.maps.situations.get(x.situation_id):null,ctx=(x.context_ids||[]).map(id=>C.tax.contexts.get(id)?.label).filter(Boolean);return`<div class="item"><div class="itemHead"><div>${C.esc(x.text)}${s?`<br><small>Situation : ${C.esc(s.short_label||s.title)}</small>`:''}${ctx.length?`<br><small>${C.esc(ctx.join(' · '))}</small>`:''}</div><div class="itemActions">${s?`<button class="iconBtn" data-openobs="${i}">Voir</button>`:''}<button class="iconBtn" data-editobs="${i}">Modifier</button><button class="iconBtn" data-delobs="${i}">Suppr.</button></div></div></div>`}
function trialItem(x,planned){const t=C.maps.tools.get(x.tool_id),s=x.situation_id?C.maps.situations.get(x.situation_id):null;return`<div class="item"><div class="itemHead"><div><button class="iconBtn" data-toolopen="${C.esc(x.tool_id)}" style="padding:0;font-weight:750;color:var(--ink)">${C.esc(t?.title||x.tool_id)}</button>${s?`<br><small>${C.esc(s.short_label||s.title)}</small>`:''}${x.note?`<br><small>${C.esc(x.note)}</small>`:''}</div>${!planned&&x.result?`<span class="status trialResult ${['very_helpful','helpful'].includes(x.result)?'positive':x.result==='worse'?'negative':''}">${C.esc(resultLabels[x.result]||x.result)}</span>`:''}</div><div class="trialActions">${planned?`<button class="btn small" data-evaltrial="${C.esc(x.id)}">Évaluer</button>`:`<button class="btnGhost small" data-evaltrial="${C.esc(x.id)}">Modifier l’évaluation</button>`}<button class="btnGhost small" data-deltrial="${C.esc(x.id)}">Retirer</button></div></div>`}
function editParticularity(c,index){const existing=index!=null?c.particularities[index]:null,selected=new Set(c.particularities.map((x,i)=>i===index?null:x.particularity_id).filter(Boolean));openModal(`<div class="dialogHead"><h2>${existing?'Modifier':'Ajouter'} une particularité</h2><button class="close" aria-label="Fermer">✕</button></div><div class="form"><div class="field"><label for="pid">Particularité</label><select id="pid">${D.particularities.filter(p=>!selected.has(p.id)).sort((a,b)=>a.label.localeCompare(b.label,'fr')).map(p=>`<option value="${C.esc(p.id)}" ${existing?.particularity_id===p.id?'selected':''}>${C.esc(p.label)}</option>`).join('')}</select></div><div class="field"><label for="pst">Statut</label><select id="pst"><option value="known" ${existing?.status==='known'?'selected':''}>Connu</option><option value="suspected" ${existing?.status==='suspected'?'selected':''}>Suspecté</option><option value="observed_trait" ${existing?.status==='observed_trait'?'selected':''}>Observé</option></select></div><div class="field"><label for="pnote">Note facultative</label><input id="pnote" value="${C.esc(existing?.note||'')}"></div></div><div class="dialogActions"><button class="btnGhost close2">Annuler</button><button class="btn" id="saveP">Enregistrer</button></div>`,close=>{$('.close2',modalRoot).onclick=close;$('#saveP',modalRoot).onclick=()=>{const now=new Date().toISOString(),val={particularity_id:$('#pid',modalRoot).value,status:$('#pst',modalRoot).value,note:$('#pnote',modalRoot).value.trim(),created_at:existing?.created_at||now,updated_at:now};if(index==null)c.particularities.push(val);else c.particularities[index]=val;persist();close();renderChild()}})}
function manageCapabilities(c){const current=new Map(c.capabilities.map(x=>[x.capability_id,x]));openModal(`<div class="dialogHead"><div><h2>Capacités utiles</h2><p class="lead">Précise seulement ce qui aide vraiment à filtrer les outils. « Inconnu » reste neutre.</p></div><button class="close" aria-label="Fermer">✕</button></div><div class="capList" style="margin-top:12px">${D.taxonomies.capabilities.map(cap=>{const st=current.get(cap.id)?.status||'unknown';return`<div class="capRow"><label for="cap-${C.esc(cap.id)}">${C.esc(cap.label)}</label><select id="cap-${C.esc(cap.id)}" data-cap="${C.esc(cap.id)}"><option value="unknown" ${st==='unknown'?'selected':''}>Inconnu</option><option value="present" ${st==='present'?'selected':''}>Présent</option><option value="absent" ${st==='absent'?'selected':''}>Absent</option></select></div>`}).join('')}</div><div class="dialogActions"><button class="btnGhost close2">Annuler</button><button class="btn" id="saveCaps">Enregistrer</button></div>`,close=>{$('.close2',modalRoot).onclick=close;$('#saveCaps',modalRoot).onclick=()=>{c.capabilities=$$('[data-cap]',modalRoot).map(sel=>({capability_id:sel.dataset.cap,status:sel.value,note:''})).filter(x=>x.status!=='unknown');persist();close();renderChild()}})}
function editObservation(c,index){const existing=index!=null?c.observations[index]:null,selectedCtx=new Set(existing?.context_ids||[]);const ctxButtons=ids=>ids.map(id=>{const x=C.tax.contexts.get(id);return x?`<button type="button" class="ctxBtn obsCtx ${selectedCtx.has(id)?'active':''}" data-obsctx="${C.esc(id)}">${C.esc(x.label)}</button>`:''}).join('');openModal(`<div class="dialogHead"><h2>${existing?'Modifier':'Nouvelle'} observation</h2><button class="close" aria-label="Fermer">✕</button></div><div class="form"><div class="field"><label for="ot">Ce que tu observes</label><textarea id="ot">${C.esc(existing?.text||'')}</textarea></div><div class="field"><label for="os">Situation liée, facultative</label><select id="os"><option value="">Aucune</option>${D.situations.slice().sort((a,b)=>(a.short_label||a.title).localeCompare(b.short_label||b.title,'fr')).map(s=>`<option value="${C.esc(s.id)}" ${existing?.situation_id===s.id?'selected':''}>${C.esc(s.short_label||s.title)}</option>`).join('')}</select></div><div class="field"><label>Repères facultatifs</label><small>Tu peux combiner un lieu et une activité.</small><div class="obsContextGroup"><strong>Lieu</strong><div class="contextChoices">${ctxButtons(CONTEXT_PLACE_IDS)}</div></div><div class="obsContextGroup"><strong>Activité / moment</strong><div class="contextChoices">${ctxButtons(CONTEXT_ACTIVITY_IDS)}</div></div></div></div><div class="dialogActions"><button class="btnGhost close2">Annuler</button><button class="btn" id="saveObs">Enregistrer</button></div>`,close=>{$$('.obsCtx',modalRoot).forEach(b=>b.onclick=()=>{const id=b.dataset.obsctx;selectedCtx.has(id)?selectedCtx.delete(id):selectedCtx.add(id);b.classList.toggle('active',selectedCtx.has(id))});$('.close2',modalRoot).onclick=close;$('#saveObs',modalRoot).onclick=()=>{const text=$('#ot',modalRoot).value.trim();if(!text){$('#ot',modalRoot).focus();return}const now=new Date().toISOString(),val={id:existing?.id||uuid('obs'),text,situation_id:$('#os',modalRoot).value||null,context_ids:[...selectedCtx],created_at:existing?.created_at||now,updated_at:now};if(index==null)c.observations.push(val);else c.observations[index]=val;persist();close();renderChild()}})}
function evaluateTrial(c,id){const tr=c.trials.find(x=>x.id===id);if(!tr)return;let chosen=tr.result||'helpful';openModal(`<div class="dialogHead"><div><h2>Évaluer l’essai</h2><p class="lead">${C.esc(C.maps.tools.get(tr.tool_id)?.title||tr.tool_id)}</p></div><button class="close" aria-label="Fermer">✕</button></div><div class="choiceGrid" style="margin-top:14px">${[['very_helpful','Très aidant'],['helpful','Aidant'],['mixed','Mitigé'],['no_effect','Sans effet'],['worse','Aggravant'],['not_evaluable','Non évaluable']].map(([v,l])=>`<button class="choice ${chosen===v?'active':''}" data-result="${v}">${l}</button>`).join('')}</div><div class="field" style="margin-top:13px"><label for="tnote">Note facultative</label><textarea id="tnote">${C.esc(tr.note||'')}</textarea></div><div class="dialogActions"><button class="btnGhost close2">Annuler</button><button class="btn" id="saveTrial">Enregistrer</button></div>`,close=>{$$('.choice',modalRoot).forEach(b=>b.onclick=()=>{chosen=b.dataset.result;$$('.choice',modalRoot).forEach(x=>x.classList.toggle('active',x===b))});$('.close2',modalRoot).onclick=close;$('#saveTrial',modalRoot).onclick=()=>{tr.status='completed';tr.result=chosen;tr.note=$('#tnote',modalRoot).value.trim();tr.occurred_at=tr.occurred_at||new Date().toISOString();tr.updated_at=new Date().toISOString();persist();close();renderChild()}})}
function renderCompare(){syncNav('reference');const c=child(),s=C.maps.situations.get(ui.selectedSituationId);if(!c||!s){ui.view='reference';return renderReference()}const sets={all:['known','suspected','observed_trait'],known:['known'],suspected:['suspected'],observed:['observed_trait']},rankings={};for(const[k,v]of Object.entries(sets))rankings[k]=rank(s.id,{statuses:v,history:false});const ids=[...new Set(Object.values(rankings).flatMap(a=>a.slice(0,10).map(x=>x.t.id)))],topSets=Object.values(rankings).map(a=>new Set(a.slice(0,3).map(x=>x.t.id))),common=ids.filter(id=>topSets.every(set=>set.has(id))),counts={known:c.particularities.filter(x=>x.status==='known').length,suspected:c.particularities.filter(x=>x.status==='suspected').length,observed:c.particularities.filter(x=>x.status==='observed_trait').length};
  const cell=(arr,id)=>{const i=arr.findIndex(x=>x.t.id===id);if(i<0)return'—';const x=arr[i],priority=i<3,reason=(x.reasons||[])[0]||'';return`<span class="compareState ${priority?'priority':'proposed'}">${priority?'Prioritaire':'Proposé'}</span>${reason?`<span class="compareReason">${C.esc(reason)}</span>`:''}`};
  main.innerHTML=`<section class="pageHead"><div><div class="eyebrow">Comparaison des lectures</div><h1>${C.esc(s.short_label||s.title)}</h1><p class="lead">Cette vue ne montre plus un rang chiffré : <strong>« Prioritaire » signifie seulement que l’outil entre dans les trois premières pistes de cette lecture</strong>. Ce n’est ni un score d’efficacité ni un pourcentage d’adaptation.</p></div><button class="btnGhost" id="backS">Retour à la situation</button></section><div class="legendBox"><span class="legendPill"><span class="compareState priority">Prioritaire</span> dans le top 3</span><span class="legendPill"><span class="compareState proposed">Proposé</span> autre piste compatible</span></div><div class="matrixIntro"><div><strong>Pistes fortes communes</strong><div class="commonTools">${common.length?common.map(id=>`<button data-tool="${C.esc(id)}">${C.esc(C.maps.tools.get(id)?.title||id)}</button>`).join(''):`<span class="lead">Aucune piste n’est prioritaire dans les quatre lectures à la fois.</span>`}</div></div><div class="lead">Connus ${counts.known} · Suspectés ${counts.suspected} · Observés ${counts.observed}</div></div><div class="matrixWrap"><table class="matrix"><thead><tr><th>Outil et raison de base</th><th>Tous</th><th>Connus</th><th>Suspectés</th><th>Observés</th></tr></thead><tbody>${ids.map(id=>{const any=rankings.all.find(x=>x.t.id===id)||rankings.known.find(x=>x.t.id===id)||rankings.suspected.find(x=>x.t.id===id)||rankings.observed.find(x=>x.t.id===id);return`<tr><td><button class="iconBtn" data-tool="${C.esc(id)}" style="font-weight:750;color:var(--ink)">${C.esc(C.maps.tools.get(id)?.title||id)}</button><div class="toolCompareWhy">${C.esc(any?.r?.reason_short||any?.t?.why_it_may_help||'')}</div></td>${['all','known','suspected','observed'].map(k=>`<td>${cell(rankings[k],id)}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`;$('#backS').onclick=()=>{ui.view='reference';renderReference()};$$('[data-tool]').forEach(b=>b.onclick=()=>openTool(b.dataset.tool))}
function renderExplore(){syncNav('explore');main.innerHTML=`<section class="pageHead"><div><div class="eyebrow">Référentiel commun</div><h1>Explorer</h1><p class="lead">Parcourir situations et outils sans partir d’un enfant.</p></div></section><div class="exploreBar"><div class="toggle"><button data-et="situations" class="${ui.exploreType==='situations'?'active':''}">Situations</button><button data-et="tools" class="${ui.exploreType==='tools'?'active':''}">Outils</button></div><input id="exploreQ" type="search" placeholder="Filtrer…" value="${C.esc(ui.exploreQuery)}"></div><div id="exploreCards" class="cards"></div>`;$$('[data-et]').forEach(b=>b.onclick=()=>{ui.exploreType=b.dataset.et;renderExplore()});$('#exploreQ').oninput=e=>{ui.exploreQuery=e.target.value;updateExploreCards()};updateExploreCards()}
function updateExploreCards(){const root=$('#exploreCards');if(!root)return;let items;if(ui.exploreType==='situations')items=ui.exploreQuery?C.searchSituations(ui.exploreQuery,{limit:120}).map(x=>x.item):D.situations;else items=ui.exploreQuery?C.searchTools(ui.exploreQuery,120).map(x=>x.item):D.tools;root.innerHTML=items.slice(0,180).map(x=>`<button class="childCard" ${ui.exploreType==='tools'?`data-tool="${C.esc(x.id)}"`:`data-situation="${C.esc(x.id)}"`}><h3>${C.esc(x.short_label||x.title)}</h3><p>${C.esc(x.summary||x.description||'')}</p></button>`).join('')||`<div class="empty">Aucun résultat.</div>`;$$('[data-tool]',root).forEach(b=>b.onclick=()=>openTool(b.dataset.tool));$$('[data-situation]',root).forEach(b=>b.onclick=()=>{ui.view='reference';ui.refType='situations';ui.selectedSituationId=b.dataset.situation;ui.query='';renderReference()})}
function renderData(){syncNav('data');main.innerHTML=`<section class="pageHead"><div><div class="eyebrow">Données locales</div><h1>Sauvegarder et restaurer</h1><p class="lead">Les profils restent dans ce navigateur. L’export JSON est la sauvegarde portable entre appareils ou navigateurs.</p></div></section><div class="dataBox"><div class="dataFacts"><div class="fact"><strong>${db.children.length}</strong><span>profil${db.children.length>1?'s':''} enfant</span></div><div class="fact"><strong>${D.referential_version}</strong><span>référentiel</span></div><div class="fact"><strong>${C.esc(storageMode)}</strong><span>stockage local</span></div></div><div class="actions"><button class="btn" id="export">Exporter JSON</button><label class="btnGhost" style="cursor:pointer">Importer JSON<input id="import" type="file" accept="application/json,.json" hidden></label><button class="btnDanger" id="reset">Réinitialiser</button></div><p class="lead" style="margin-top:12px;font-size:.82rem">L’import valide la structure, applique les migrations d’anciens IDs connues puis te laisse choisir entre remplacer ou fusionner.</p></div>`;$('#export').onclick=exportData;$('#import').onchange=readImport;$('#reset').onclick=()=>{if(confirm('Effacer toutes les données locales de suivi ?')){db=emptyData();ui.currentChildId=null;persist();renderData()}}}
function exportData(){const out={...db,referential_version:D.referential_version,exported_at:new Date().toISOString()};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='accompagnement-aesh-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function readImport(e){const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text());if(!raw||typeof raw!=='object'||!Array.isArray(raw.children)||!raw.schema_version)throw Error('Format non reconnu : enfants ou version absents.');if(!['1.0.0','1.1.0'].includes(String(raw.schema_version)))throw Error('Version de sauvegarde non prise en charge.');const incoming=normalizeDb(raw),warnings=migrateIds(incoming);openImportChoice(incoming,warnings)}catch(err){alert('Import impossible : '+err.message)}finally{e.target.value=''}}
function openImportChoice(incoming,warnings){openModal(`<div class="dialogHead"><div><h2>Importer une sauvegarde</h2><p class="lead">${incoming.children.length} profil${incoming.children.length>1?'s':''} trouvé${incoming.children.length>1?'s':''}.</p></div><button class="close" aria-label="Fermer">✕</button></div>${warnings.length?`<div class="notice" style="margin-top:12px">${warnings.length} référence${warnings.length>1?'s':''} ancienne${warnings.length>1?'s':''} ou inconnue${warnings.length>1?'s':''}. Elles ont été migrées quand une redirection existe.</div>`:''}<div class="dialogActions"><button class="btnGhost" id="mergeImport">Fusionner</button><button class="btn" id="replaceImport">Remplacer mes données</button></div>`,close=>{$('#replaceImport',modalRoot).onclick=()=>{db=incoming;persist();close();renderData()};$('#mergeImport',modalRoot).onclick=()=>{const map=new Map(db.children.map(c=>[c.id,c]));for(const c of incoming.children)map.set(c.id,c);db.children=[...map.values()];db.favorites=[...new Set([...db.favorites,...incoming.favorites])];persist();close();renderData()}})}
function openTool(id){const t=C.maps.tools.get(id);if(!t)return;const sourceEntries=(t.source_links||[]).map(x=>({link:x,src:C.maps.sources.get(x.source_id)})).filter(x=>x.src),cats=C.practiceLabels(t),constraints=C.constraintSummary(t),prefStates=C.labels(t.preferred_regulation_state_ids,C.tax.regulation_states),excludedStates=C.labels(t.excluded_regulation_state_ids,C.tax.regulation_states);openModal(`<div class="dialogHead"><div><div class="eyebrow">Outil</div><h2>${C.esc(t.title)}</h2></div><button class="close" aria-label="Fermer">✕</button></div><p class="lead" style="margin-top:8px">${C.esc(t.summary)}</p>${t.instructions?.length?`<div class="detailSection"><h3>Comment faire</h3><ol>${t.instructions.map(x=>`<li>${C.esc(x)}</li>`).join('')}</ol></div>`:''}${t.sample_phrases?.length?`<div class="detailSection"><h3>Formulations possibles</h3>${t.sample_phrases.map(x=>`<p>« ${C.esc(x)} »</p>`).join('')}</div>`:''}${t.why_it_may_help?`<div class="detailSection"><h3>Pourquoi essayer</h3><p>${C.esc(t.why_it_may_help)}</p></div>`:''}${t.adult_adjustments?.length?`<div class="detailSection"><h3>Ce que l’adulte peut modifier</h3><ul>${t.adult_adjustments.map(x=>`<li>${C.esc(x)}</li>`).join('')}</ul></div>`:''}${(t.cautions?.length||t.stop_if?.length)?`<div class="detailSection"><h3>À garder en tête</h3>${[...(t.cautions||[]),...(t.stop_if||[]).map(x=>'Arrêter si : '+x)].map(x=>`<div class="notice">${C.esc(x)}</div>`).join('')}</div>`:''}<div class="detailSection"><h3>Repères</h3><div class="meta">${cats.map(x=>`<span class="tag">${C.esc(x)}</span>`).join('')}${constraints.map(x=>`<span class="tag">${C.esc(x)}</span>`).join('')}${t.duration?`<span class="tag">${C.esc(C.durationLabel(t.duration))}</span>`:''}</div></div>${(prefStates.length||excludedStates.length)?`<div class="detailSection"><h3>État de régulation</h3>${prefStates.length?`<p><strong>Particulièrement adapté :</strong> ${C.esc(prefStates.join(' · '))}</p>`:''}${excludedStates.length?`<p><strong>À éviter dans cet état :</strong> ${C.esc(excludedStates.join(' · '))}</p>`:''}</div>`:''}${sourceEntries.length?`<div class="detailSection"><h3>Provenance</h3>${sourceEntries.slice(0,6).map(({src,link})=>`<p><strong>${C.esc(src.title)}</strong>${src.authors?.length?' — '+C.esc(src.authors.join(', ')):''}${link.relation?`<br><small>${C.esc(({supports:'Soutient directement',inspired_by:'Inspire cette adaptation',describes:'Décrit le phénomène',field_practice:'Synthèse de terrain'})[link.relation]||link.relation)}${link.note?' · '+C.esc(link.note):''}</small>`:''}</p>`).join('')}</div>`:''}`)}

function initThemeToggle(key){
  const root=document.documentElement,btn=document.getElementById('themeToggle');
  let saved=null;try{saved=localStorage.getItem(key)}catch(_){ }
  const initial=saved||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const apply=mode=>{root.dataset.theme=mode;if(btn){btn.textContent=mode==='dark'?'Clair':'Sombre';btn.setAttribute('aria-label',mode==='dark'?'Passer au thème clair':'Passer au thème sombre');btn.setAttribute('aria-pressed',String(mode==='dark'))}};
  apply(initial);
  btn?.addEventListener('click',()=>{const mode=root.dataset.theme==='dark'?'light':'dark';apply(mode);try{localStorage.setItem(key,mode)}catch(_){ }});
}

initThemeToggle('aesh_accompagnement_theme_v1');
load();
})();
