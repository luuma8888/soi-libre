e_phrase_10_7","category":"développer le discernement","context":"développer le discernement","pillarId":"discernement","text":"Penser par soi-même demande aussi d’écouter avec humilité.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_10_8","category":"développer le discernement","context":"développer le discernement","pillarId":"discernement","text":"Ce n’est pas parce que le groupe le répète que c’est vrai.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_11_1","category":"nourrir la joie","context":"nourrir la joie","pillarId":"joie","text":"Ta joie est belle ; aidons-la à rester respectueuse du groupe.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_11_2","category":"nourrir la joie","context":"nourrir la joie","pillarId":"joie","text":"Qu’est-ce qui a allumé cette lumière en toi ?","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_11_3","category":"nourrir la joie","context":"nourrir la joie","pillarId":"joie","text":"On peut célébrer sans comparer.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_11_4","category":"nourrir la joie","context":"nourrir la joie","pillarId":"joie","text":"La gratitude rend visible ce qui nourrit.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_11_5","category":"nourrir la joie","context":"nourrir la joie","pillarId":"joie","text":"La joie peut être calme, profonde ou pétillante.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_11_6","category":"nourrir la joie","context":"nourrir la joie","pillarId":"joie","text":"Merci d’avoir remarqué cette beauté.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_11_7","category":"nourrir la joie","context":"nourrir la joie","pillarId":"joie","text":"Partage ta joie comme une invitation, pas comme une obligation pour les autres.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_11_8","category":"nourrir la joie","context":"nourrir la joie","pillarId":"joie","text":"Une petite joie quotidienne peut devenir une grande force intérieure.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_12_1","category":"inviter à contribuer","context":"inviter à contribuer","pillarId":"responsabilite","text":"Quel petit geste utile peux-tu offrir aujourd’hui ?","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_12_2","category":"inviter à contribuer","context":"inviter à contribuer","pillarId":"responsabilite","text":"Ta contribution compte, même si elle est discrète.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_12_3","category":"inviter à contribuer","context":"inviter à contribuer","pillarId":"responsabilite","text":"Servir ne signifie pas te sacrifier.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_12_4","category":"inviter à contribuer","context":"inviter à contribuer","pillarId":"responsabilite","text":"Nous cherchons une responsabilité claire, pas un poids trop grand.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_12_5","category":"inviter à contribuer","context":"inviter à contribuer","pillarId":"responsabilite","text":"Ce qui dépend de e besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"rel52_avoid_002","avoid":"Il l’a bien cherché.","instead":"Nous regardons les faits et l’impact, sans justifier une blessure.","pillarId":"discernement","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"rel52_avoid_003","avoid":"Excuse-toi et c’est fini.","instead":"Une excuse peut ouvrir la réparation, mais nous vérifions aussi ce qui restaure le lien.","pillarId":"relation","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"rel52_avoid_004","avoid":"Tu fais ton chef.","instead":"Ta force d’organisation a besoin d’apprendre l’écoute.","pillarId":"responsabilite","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"rel52_avoid_005","avoid":"Tu es trop effacé.","instead":"Nous allons chercher une petite place sûre pour ta voix.","pillarId":"dignite","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"rel52_avoid_006","avoid":"Ignore-les.","instead":"Nous allons protéger la dignité et donner une voie d’action.","pillarId":"discernement","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"rel52_avoid_007","avoid":"Arrête de te défendre.","instead":"Tu auras un temps pour expliquer ; d’abord, écoutons l’impact.","pillarId":"relation","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"rel52_avoid_008","avoid":"Tout le monde doit être ami.","instead":"On peut respecter et coopérer sans forcer une proximité.","pillarId":"relation","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"ado52_avoid_001","avoid":"Tu es manipulé.","instead":"Regardons quelles influences sont présentes et ce que tu veux choisir consciemment.","pillarId":"discernement","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"ado52_avoid_002","avoid":"Tu fais ta crise d’ado.","instead":"Il y a peut-être une vérité ou une intensité qui cherche une forme.","pillarId":"authenticite","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"ado52_avoid_003","avoid":"C’est vrai parce que tu le sens.","instead":"Ton ressenti est précieux ; cherchons aussi comment le vérifier.","pillarId":"discernement","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"ado52_avoid_004","avoid":"Les écrans sont mauvais.","instead":"Observons ce qui nourrit ton attention et ce qui l’aspire.","pillarId":"discernement","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"ado52_avoid_005","avoid":"Tu dois être toi-même.","instead":"L’authenticité peut être progressive et protégée.","pillarId":"authenticite","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"ado52_avoid_006","avoid":"Tu as tort.","instead":"Je veux comprendre ton raisonnement avant de répondre.","pillarId":"relation","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"ado52_avoid_007","avoid":"Tu réfléchis trop.","instead":"Ta réflexion cherche peut-être une sécurité ; posons une question claire.","pillarId":"discernement","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"ado52_avoid_008","avoid":"Tu dois choisir maintenant.","instead":"Si ce n’est pas urgent, donnons à ton intérieur le temps de devenir clair.","pillarId":"presence","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_001","avoid":"Tu es trop sensible.","instead":"Tu ressens beaucoup ; apprenons à protéger ton espace sans fermer ton cœur.","pillarId":"emotions","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_002","avoid":"Tu n’écoutes jamais.","instead":"Ton attention semble partir loin ; cherchons ce qui peut t’aider à revenir.","pillarId":"presence","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_003","avoid":"Arrête de faire ton chef.","instead":"Je vois une force d’organisation ; aidons-la à devenir coopération.","pillarId":"responsabilite","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_004","avoid":"Tu fais exprès.","instead":"Je vois un comportement difficile ; cherchons le besoin ou l’obstacle derrière.","pillarId":"discernement","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_005","avoid":"Ce n’est rien.","instead":"Je vois que dedans, cela a de l’importance. Je t’écoute.","pillarId":"emotions","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_006","avoid":"Les autres y arrivent.","instead":"Nous cherchons ta prochaine marche, pas la comparaison.","pillarId":"dignite","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_007","avoid":"Tu dois avoir honte.","instead":"L’acte demande réparation ; ta valeur reste intacte.","pillarId":"dignite","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_008","avoid":"Tu es paresseux.","instead":"Ton élan semble bloqué ; cherchons ce qui manque : sens, sécurité, énergie ou clarté.","pillarId":"presence","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_009","avoid":"Tu es immature.","instead":"Cette compétence est encore en croissance ; donnons-lui un entraînement adapté.","pillarId":"courage","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"phr52_avoid_010","avoid":"Je n’ai pas le temps pour ça.","instead":"Je te donne une petite place maintenant, puis nous y reviendrons si besoin.","pillarId":"relation","why":"La reformulation décrit le besoin ou la prochaine marche au lieu de définir l’enfant."},{"id":"miroirs_avoid_1","category":"miroirs symboliques","avoid":"Tu es comme ça parce que ton profil le dit.","instead":"Ce profil propose une piste. Observons ensemble ce qui est vrai pour toi dans la réalité."},{"id":"miroirs_avoid_2","category":"miroirs symboliques","avoid":"Ton type doit faire exactement cela.","instead":"Cette lecture invite à observer ton rythme naturel, sans t’enfermer."},{"id":"miroirs_avoid_3","category":"miroirs symboliques","avoid":"Cette blessure explique tout ton comportement.","instead":"Il y a peut-être une zone sensible à protéger. Regardons les faits avec douceur."},{"id":"v01_symbolic_avoid_1","avoid":"Tu es comme ça, c’est ton profil.","instead":"Ce profil invite à observer une piste. Nous allons vérifier ce qui t’aide vraiment.","context":"miroirs symboliques"},{"id":"v01_symbolic_avoid_2","avoid":"Ton thème dit que tu dois fonctionner ainsi.","instead":"Cette lecture propose une hypothèse. Le vivant et ton ressenti restent prioritaires.","context":"miroirs symboliques"},{"id":"v01_symbolic_avoid_3","avoid":"Tu as cette blessure, donc…","instead":"Cette zone demande peut-être de la délicatesse. Nous observons sans t’enfermer.","context":"miroirs symboliques"}],"teacherTraining":[{"id":"socle_train_observer","title":"Observer sans conclure trop vite","body":"Apprendre à séparer le fait observé, l’interprétation et la prochaine question utile.","example":"Un enfant quitte le cercle : fait. “Il rejette le groupe” : interprétation. “De quoi avait-il besoin à ce moment-là ?” : question utile.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_besoin","title":"Différencier comportement, besoin et identité","body":"Ne jamais transformer un comportement en définition de l’enfant.","example":"“Il coupe la parole” décrit un fait ; “il est impoli” enferme ; “son élan a besoin d’un cadre d’attente” ouvre une piste.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_formulation","title":"Formuler sans étiqueter","body":"Choisir des mots qui guident l’action sans coller une identité.","example":"Dire “ta force sort très vite” plutôt que “tu es agressif”.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_marche","title":"Transformer une difficulté en prochaine marche","body":"Passer de la correction globale à une étape concrète, petite et observable.","example":"Au lieu de “sois plus respectueux”, proposer “attendre un tour avec un objet repère pendant trois minutes”.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_piliers","title":"Utiliser les 12 piliers sans moraliser","body":"Employer les piliers comme repères de croissance, pas comme notes de vertu.","example":"Un pilier à nourrir n’est pas une faute : c’est une graine qui cherche une meilleure terre.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_emotion","title":"Accompagner une émotion","body":"Accueillir l’émotion tout en gardant le cadre protecteur.","example":"“Ta colère est entendue, et je ne laisse pas les objets voler.”","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_limite","title":"Poser une limite sans domination","body":"Protéger l’espace commun sans humiliation ni rapport de force inutile.","example":"“Je bloque ce geste parce que je protège chacun, puis nous chercherons ce qui s’est passé.”","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_reparation","title":"Aider à réparer sans humilier","body":"Faire de la réparation un acte de soin du lien, non une punition déguisée.","example":"La réparation peut être une phrase, un geste utile, un dessin, une aide ou un temps de remise en lien.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_conseil","title":"Faire vivre un Conseil de Sages","body":"Structurer un cercle où la parole, le silence, la décision et la réparation ont chacun une place.","example":"Les rôles évitent que l’adulte porte tout : gardien de la parole, du temps, du cœur, de la solution.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_symbolique","title":"Utiliser les profils symboliques avec prudence","body":"Employer Design Humain, numérologie ou astrologie comme questions d’observation, jamais comme verdict.","example":"Le profil dit : “observe cette piste”. L’enfant vivant confirme, nuance ou contredit.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_confidentialite","title":"Protéger les données sensibles","body":"Garder en tête que notes, profils et observations d’enfants demandent une grande sobriété de partage.","example":"Un export famille n’a pas besoin des notes libres, citations sensibles ou profils symboliques.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"socle_train_packs","title":"Créer ses propres packs pédagogiques","body":"Transformer l’expérience de terrain en contenus réutilisables, partageables et ajustables.","example":"Une activité qui fonctionne peut devenir une fiche, puis une séquence, puis un pack.","steps":["Décrire le fait observable.","Nommer l’hypothèse comme hypothèse.","Chercher le besoin possible.","Choisir une petite marche concrète.","Observer l’effet avant de conclure."],"exercise":"Choisir une situation réelle de la semaine et écrire trois formulations : fait, hypothèse, prochaine marche.","remember":"Voir sans enfermer, guider sans imposer, ajuster selon le vivant.","avoid":"Les phrases définitives comme “il est…”, “elle est toujours…”, “ce profil prouve que…”."},{"id":"miroirs_training_1","title":"Utiliser les miroirs symboliques sans enfermer","body":"Un miroir symbolique sert à formuler une question d’observation. Il ne remplace jamais l’enfant vivant, sa parole, ni les faits observés.","steps":["Commencer par l’observation réelle.","Écouter la voix de l’enfant.","Lire le miroir comme hypothèse.","Relier toute piste à une prochaine marche concrète."],"remember":"Le profil symbolique n’est pas une case. C’est une question posée au vivant.","avoid":"Présenter un profil comme une vérité définitive."},{"id":"miroirs_training_2","title":"Astrologie classique et sidérale : deux angles complémentaires","body":"La lecture classique/tropicale et la lecture sidérale peuvent mettre en lumière des aspects différents : expression incarnée, sécurité émotionnelle, manière d’entrer dans le monde.","steps":["Renseigner les deux lectures si elles sont disponibles.","Comparer sans opposer.","Chercher les convergences avec l’observation.","Garder les divergences comme questions ouvertes."],"remember":"Deux cartes peuvent donner deux angles ; seul le vivant donne la justesse.","avoid":"Dire qu’une version annule l’autre."},{"id":"miroirs_training_3","title":"Design Humain : observer rythme, décision et conditionnement","body":"Les éléments utiles pour l’enseignant sont surtout : type, autorité, profil, centres définis / ouverts, et grands axes Soleil/Terre si connus.","steps":["Renseigner seulement ce qui est fiable.","Observer le rapport à l’action et au groupe.","Noter ce qui confirme ou nuance.","Éviter les injonctions liées au type."],"remember":"Type et autorité invitent à observer le rythme juste, pas à imposer une méthode.","avoid":"Forcer un enfant à agir selon une phrase de manuel."},{"id":"miroirs_training_4","title":"Numérologie par date : dynamique de fond, jamais verdict","body":"Le chemin de vie calculé depuis la date de naissance peut offrir un axe d’observation : autonomie, lien, expression, structure, exploration, soin, profondeur, puissance ou empathie.","steps":["Calculer par date seulement.","Lire la dynamique comme question.","Observer si elle nourrit ou surcharge.","Relier à des besoins concrets."],"remember":"La vibration peut inspirer une observation ; elle ne définit pas la valeur de l’enfant.","avoid":"Associer un chiffre à une étiquette de caractère."},{"id":"v01_training_symbolic_ethics","title":"Utiliser les miroirs symboliques sans enfermer","category":"miroirs symboliques","intention":"Apprendre à transformer un profil en question d’observation, puis en prochaine marche concrète.","explanation":"Un miroir symbolique sert à ouvrir une hypothèse : besoin de sécurité, rythme de décision, forme d’expression, relation au groupe. Il ne remplace jamais l’observation ni la voix de l’enfant.","steps":["Renseigner seulement les données fiables ou utiles.","Formuler une hypothèse en langage prudent.","Chercher une observation concrète qui confirme, nuance ou contredit.","Créer une petite marche et observer son effet.","Relire régulièrement pour éviter de figer l’enfant."],"exercise":"Choisir un miroir renseigné et écrire trois observations possibles sans utiliser le verbe “être”.","remember":"Le profil symbolique n’est pas une case ; c’est une question posée au vivant.","avoid":"Dire function uid(p='id'){return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function unsafeIdentifierPaths(value,path='racine',out=[]){if(Array.isArray(value)){value.forEach((item,i)=>unsafeIdentifierPaths(item,`${path}[${i}]`,out));return out}if(!value||typeof value!=='object')return out;Object.entries(value).forEach(([key,item])=>{const itemPath=`${path}.${key}`,isIdentifier=key==='id'||key.endsWith('Id');if(isIdentifier&&item!==''&&item!=null&&(typeof item!=='string'||/[&<>"'\\\r\n\u2028\u2029]/.test(item)||item.length>240))out.push(itemPath);if(key==='_packIds'&&Array.isArray(item)&&item.some(id=>typeof id!=='string'||/[&<>"'\\\r\n\u2028\u2029]/.test(id)||id.length>240))out.push(itemPath);unsafeIdentifierPaths(item,itemPath,out)});return out}
function validateBackupData(data){if(!data||typeof data!=='object'||Array.isArray(data))return{ok:false,message:'Le fichier ne contient pas une sauvegarde Sève reconnue.'};if(String(data.schema||'').startsWith('seve.contentPack.')||data.modules)return{ok:false,message:'Ce fichier est un pack pédagogique. Importe-le depuis « Packs », pas depuis la restauration complète.'};const required=['classes','children','observations'];if(!required.every(key=>Array.isArray(data[key])))return{ok:false,message:'Sauvegarde incomplète : les groupes, enfants et observations ne sont pas tous présents.'};const unsafe=unsafeIdentifierPaths(data);if(unsafe.length)return{ok:false,message:'Sauvegarde refusée : un ou plusieurs identifiants contiennent des caractères non autorisés.'};return{ok:true,message:`Sauvegarde reconnue : ${data.classes.length} groupe(s), ${data.children.length} enfant(s), ${data.observations.length} observation(s).`}}

function setup(){const done=state.data.settings.setupDone;const checks=[!!state.data.settings.mode,state.data.classes.length>0,state.data.packs.length>0||state.data.content.activities.length>0,activeChildren().length>0];const progress=checks.filter(Boolean).length;return `${title('Première installation','Quatre choix concrets suffisent. Rien n’est importé ni créé à ta place.')}<section class="setup-progress"><div class="setup-head"><div><strong>${progress}/4 étapes essentielles</strong><p class="muted tiny" style="margin:.2rem 0 0">${done?'Installation marquée comme terminée.':'Tu peux quitter et revenir : Sève sauvegarde localement.'}</p></div><button class="secondary small" onclick="App.finishSetup()">${done?'Installation terminée':'Marquer comme terminé'}</button></div><div class="setup-bar" aria-label="Progression de l’installation">${checks.map(v=>`<span class="setup-segment ${v?'done':''}"></span>`).join('')}</div></section><div class="setup-steps"><section class="setup-step ${checks[0]?'done':''}"><div class="setup-step-index">1</div><div><h3>Choisir le cadre d’usage</h3><p class="muted">${esc(modeDescription(state.data.settings.mode||'neutre'))}</p><div class="step-actions"><label for="setupMode">Mode d’usage</label><select id="setupMode" onchange="App.setMode(this.value)"><option value="neutre" ${state.data.settings.mode==='neutre'?'selected':''}>Neutre pédagogique</option><option value="symbolique" ${state.data.settings.mode==='symbolique'?'selected':''}>Symbolique doux</option><option value="avance" ${state.data.settings.mode==='avance'?'selected':''}>Symbolique avancé</option></select></div></div></section><section class="setup-step ${checks[1]?'done':''}"><div class="setup-step-index">2</div><div><h3>Créer le premier groupe</h3><p class="muted">Le groupe sert de contexte de travail. Il n’ajoute aucune donnée enfant automatiquement.</p><div class="step-actions"><label for="setupClass">Nom du groupe ou de la classe</label><div class="inline-form"><input id="setupClass" placeholder="Ex. Groupe des graines"><button class="secondary" onclick="App.addClassFromSetup()">Créer</button></div></div></div></section><section class="setup-step ${checks[2]?'done':''}"><div class="setup-step-index">3</div><div><h3>Planter une bibliothèque</h3><p class="muted">La bibliothèque complète du ZIP est incluse dans ce fichier, mais reste entièrement optionnelle et prévisualisable avant import.</p><div class="step-actions"><button class="secondary" onclick="App.setTab('packs')">Choisir les contenus</button></div></div></section><section class="setup-step ${checks[3]?'done':''}"><div class="setup-step-index">4</div><div><h3>Ajouter un enfant… ou essayer sans engagement</h3><p class="muted">Commence avec le minimum utile. La cartographie détaillée pourra venir plus tard.</p><div class="step-actions row"><button class="secondary" onclick="App.setTab('children')">Ajouter un enfant</button><button class="ghost" onclick="App.enterDemo()">Démo temporaire</button></div></div></section></div><section class="optional-panel"><div><strong>Besoin d’un tour guidé ?</strong><p class="muted tiny" style="margin:.15rem 0 0">Le didacticiel explique les familles d’outils et les garde-fous sans modifier tes données.</p></div><button class="ghost" onclick="App.startTutorial()">Ouvrir le didacticiel</button></section>`}

function humanKey(k){const map={
  germination:'Germination',fragility:'Fragilité',fragilite:'Fragilité',expansion:'Expansion',radiance:'Rayonnement',rayonnement:'Rayonnement',
  hypersensitive:'Enfant hypersensible',hypersensible:'Enfant hypersensible',active:'Enfant très moteur',moteur:'Enfant très moteur',discreet:'Enfant discret',discret:'Enfant discret',agitatedGroup:'Groupe agité',groupeAgite:'Groupe agité',
  pedagogicalIntention:'Intention pédagogique',centralQuestion:'Question centrale',questionsForChild:'Questions à poser à l’enfant',adultPhrases:'Phrases adultes utiles',frequentSituations:'Situations fréquentes',nextSteps:'Prochaines marches',ageAdaptations:'Adaptations par âge',protects:'Ce que ce pilier protège',develops:'Ce que ce pilier développe',practices:'Pratiques simples',links:'Liens avec les autres piliers',needs:'Besoins',avoid:'À éviter',
  interests:'Passions / intérêts',strengths:'Forces',keywords:'Mots-clés',contexts:'Contextes',triggers:'Déclencheurs possibles',supports:'Soutiens',formats:'Formats',lessonDurations:'Durées de leçon',councilRoles:'Rôles du Conseil',symbolicGuides:'Guides symboliques',birth:'Naissance',date:'Date',time:'Heure',place:'Lieu',reliability:'Fiabilité',usage:'Usage',numerology:'Numérologie',lifePath:'Chemin de vie',birthDay:'Jour de naissance',personalYear:'Année personnelle',astrology:'Astrologie',tropical:'Astrologie classique / tropicale',sidereal:'Astrologie sidérale',sun:'Soleil',moon:'Lune',asc:'Ascendant',mercury:'Mercure',venus:'Vénus',mars:'Mars',earth:'Terre',elements:'Éléments dominants',modalities:'Modalités',houses:'Maisons importantes',aspects:'Aspects marquants',humanDesign:'Design Humain',type:'Type',strategy:'Stratégie',authority:'Autorité',profile:'Profil',cross:'Croix d’incarnation',definedCenters:'Centres définis',openCenters:'Centres ouverts / non définis',channels:'Canaux',gates:'Portes',consciousSun:'Soleil conscient',consciousEarth:'Terre consciente',unconsciousSun:'Soleil inconscient',unconsciousEarth:'Terre inconsciente',variables:'Variables',environment:'Environnement',determination:'Détermination',wounds:'Blessures de l’âme',enneagram:'Ennéagramme',mbti:'MBTI',confirmations:'Confirmation par observation',status:'Statut',notes:'Notes',
  neutre:'Neutre pédagogique',symbolique:'Symbolique doux',avance:'Symbolique avancé'
};return map[k]||String(k).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function modeDescription(mode){return mode==='symbolique'?'Quelques profils ou symboles peuvent servir d’hypothèses à vérifier dans le vivant : numérologie par date, astrologie, Design Humain ou autres miroirs.':mode==='avance'?'Lecture symbolique plus complète : astrologie tropicale/sidérale, Design Humain, blessures, ennéagramme ou MBTI, toujours sans étiqueter.':'Usage scolaire classique : observation, besoins, piliers, leçons, sans profils symboliques.'}

function usageMap(){return `<div class="usage-map"><div class="usage-group"><h4>1. Démarrer</h4><p>Accueil · Installation · Packs</p></div><div class="usage-group"><h4>2. Comprendre</h4><p>Référentiel · Formation · Recherche</p></div><div class="usage-group"><h4>3. Suivre</h4><p>Enfants · Miroirs · Observations · Voix · Marches</p></div><div class="usage-group"><h4>4. Agir</h4><p>Bibliothèque · Leçons · Conseil</p></div><div class="usage-group"><h4>5. Protéger</h4><p>Rapports · Listes · Données</p></div></div>`}
function itemTitle(k,it,i){if(!it||typeof it!=='object')return 'Élément '+(i+1);if(k==='avoidPhrases')return (it.avoid||it.text)?('À éviter : '+String(it.avoid||it.text).slice(0,95)):(it.instead?('Dire plutôt : '+String(it.instead).slice(0,95)):('Reformulation '+(i+1)));if(k==='phrases')return it.context?String(it.context):String(it.title||it.text||it.body||('Phrase '+(i+1))).slice(0,110);if(k==='pillarReferentials')return it.title||pillar(it.id).title||('Pilier détaillé '+(i+1));if(k==='pillarsInfo')return it.title||pillar(it.id).title||('Pilier '+(i+1));if(k==='teacherTraining')return it.title||it.name||('Module de formation '+(i+1));if(k==='symbolicGuides')return it.title||it.name||((it.system?humanKey(it.system)+' · ':'')+'Guide symbolique '+(i+1));if(k==='activities'||k==='sequences'||k==='situations')return it.title||it.name||('Élément '+(i+1));return it.title||it.name||it.text||it.id||('Élément '+(i+1))}
function itemSummary(k,it){if(!it||typeof it!=='object')return '';if(k==='avoidPhrases')return [it.instead?('Dire plutôt : '+it.instead):'',it.pillarId?('Pilier : '+pillar(it.pillarId).title):''].filter(Boolean).join(' · ');if(k==='phrases')return it.text||it.body||it.intention||'';if(k==='pillarReferentials')return it.centralQuestion||it.essence||it.short||'';if(k==='teacherTraining')return it.remember||it.body||it.description||it.intention||'';if(k==='symbolicGuides')return (it.observe||[]).slice(0,2).join(' · ')||it.description||it.body||'';return it.essence||it.intention||it.body||it.description||it.centralQuestion||it.reading||it.pillarId||''}
function packs(){const m=BUILTIN_PACK.modules||{};return `${title('Packs & bibliothèques','Choisir ce que tu plantes : prévisualisation, import sélectif, désinstallation et export restent sous ton contrôle.')}<section class="pack-hero"><div><span class="eyebrow">Bibliothèque complète incluse</span><h3>${esc(BUILTIN_PACK.name)}</h3><p class="muted">Le pack tout-en-un fourni dans ton ZIP est embarqué dans cette refonte pour rester utilisable hors ligne. Il n’est <strong>jamais importé automatiquement</strong>.</p><div class="row"><button onclick="App.previewBuiltInPack()">Prévisualiser la bibliothèque</button><span class="tag">${esc(BUILTIN_PACK.version)}</span></div></div><div class="pack-stats" aria-label="Contenu du pack intégré"><div class="pack-stat"><strong>${(m.activities||[]).length}</strong><span>activités</span></div><div class="pack-stat"><strong>${(m.sequences||[]).length}</strong><span>séquences</span></div><div class="pack-stat"><strong>${(m.phrases||[]).length}</strong><span>phrases</span></div><div class="pack-stat"><strong>${(m.symbolicGuides||[]).length}</strong><span>guides miroirs</span></div></div></section><div class="grid two"><section class="card"><h3>Importer un autre pack JSON</h3><p class="muted">Tu peux toujours ajouter un pack externe compatible. Sève le valide et te laisse choisir les modules ou éléments à importer.</p><div class="pack-zone"><label for="packFile">Fichier JSON de contenu</label><input id="packFile" type="file" accept="application/json,.json" onchange="App.previewPack(this.files[0])"><p class="tiny muted" style="margin:.55rem 0 0">Aucune donnée enfant n’est créée par un pack pédagogique.</p></div></section><section class="card"><h3>Packs installés</h3>${state.data.packs.length?state.data.packs.map(p=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="split"><div><strong>${esc(p.name)}</strong><p class="muted tiny" style="margin:.2rem 0">${esc(p.version||'')} · importé le ${esc(p.date||'')}</p><div>${tags((p.modules||[]).map(k=>moduleLabels[k]||k))}</div></div><button class="danger small" onclick="App.uninstallPack('${p.id}')">Désinstaller</button></div></div>`).join(''):'<div class="empty">Aucun pack installé. La bibliothèque intégrée reste disponible ci-contre.</div>'}<div class="divider"></div><h4>Créer mon propre pack</h4><p class="muted tiny">Exporte uniquement les contenus pédagogiques, sans enfants, observations ni métadonnées internes.</p><button class="secondary" onclick="App.exportCustomPack()">Exporter mes contenus</button></section></div><section id="packPreview" aria-live="polite"></section>`}
const moduleLabels={lists:'Listes',pillarsInfo:'Contenus courts des piliers',pillarReferentials:'Référentiel complet des 12 piliers',activities:'Activités',sequences:'Séquences',situations:'Situations',phrases:'Phrases adultes',avoidPhrases:'À éviter / reformuler',teacherTraining:'Formation enseignant',symbolicGuides:'Guides miroirs symboliques',demo:'Données démo'};
const visiblePackModules=['lists','pillarsInfo','pillarReferentials','activities','sequences','situations','phrases','avoidPhrases','teacherTraining','symbolicGuides','demo'];
const arrayPackModules=['pillarsInfo','pillarReferentials','activities','sequences','situations','phrases','avoidPhrases','teacherTraining','symbolicGuides'];
function packCount(k,m){return k==='lists'?(m.lists?Object.values(m.lists).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0):0):k==='demo'?(m.demo?1:0):(Array.isArray(m[k])?m[k].length:0)}
function packSummary(pack){const m=pack.modules||{};const out={};visiblePackModules.forEach(k=>{const c=packCount(k,m);if(c)out[k]=c});return out}
function validatePack(pack){const m=pack&&typeof pack==='object'?(pack.modules||{}):{};const warnings=[];const errors=[];if(!pack||typeof pack!=='object'||Array.isArray(pack))errors.push('Le fichier ne contient pas un objet JSON utilisable.');if(!pack?.modules||typeof pack.modules!=='object'||Array.isArray(pack.modules))errors.push('Le pack ne contient pas de champ modules utilisable.');if(pack?.schema&&!String(pack.schema).startsWith('seve.contentPack.v'))warnings.push('Schéma inhabituel : '+pack.schema);if(pack&&!pack.schema)warnings.push('Schéma non indiqué : import possible, mais moins traçable.');const unsafe=unsafeIdentifierPaths(pack);if(unsafe.length)errors.push('Un ou plusieurs identifiants contiennent des caractères non autorisés.');const unknown=Object.keys(m).filter(k=>!visiblePackModules.includes(k)&&k!=='cards');if(unknown.length)warnings.push('Modules non reconnus ignorés : '+unknown.join(', '));if(Array.isArray(m.cards)&&m.cards.length)warnings.push('Module cartes détecté mais masqué/ignoré dans cette branche de Sève.');arrayPackModules.forEach(k=>{if(m[k]!==undefined&&!Array.isArray(m[k]))errors.push(`Le module ${moduleLabels[k]||k} doit être une liste.`)});if(m.lists&&typeof m.lists!=='object')errors.push('Le module Listes doit être un objet de listes.');const seen={};arrayPackModules.forEach(k=>{(Array.isArray(m[k])?m[k]:[]).forEach((it,i)=>{if(!it||typeof it!=='object'){warnings.push(`${moduleLabels[k]} élément ${i+1} n’est pas un objet.`);return}if(!it.id){warnings.push(`${moduleLabels[k]} : un élément sans id recevra un identifiant automatique.`);return}const key=k+'::'+it.id;if(seen[key])warnings.push(`Doublon interne dans ${moduleLabels[k]} : ${it.id}`);seen[key]=true;const existing=(state.data.content[k]||[]).find(x=>x.id===it.id);if(existing)warnings.push(`ID déjà présent localement dans ${moduleLabels[k]} : ${it.id}. Sève gardera les sources multiples pour éviter une désinstallation destructrice.`)})});return{errors:[...new Set(errors)],warnings,summary:packSummary(pack||{})}}
function validationHtml(v){const summary=Object.entries(v.summary).map(([k,c])=>`<span class="tag good">${esc(moduleLabels[k]||k)} : ${c}</span>`).join(' ');return `<div class="callout ${v.errors.length?'danger':(v.warnings.length?'warn':'good')}"><strong>Validation du pack</strong><p>${summary||'Aucun module importable détecté.'}</p>${v.errors.length?`<p><strong>Erreurs :</strong><br>${v.errors.map(esc).join('<br>')}</p>`:''}${v.warnings.length?`<p><strong>Points d’attention :</strong><br>${v.warnings.slice(0,12).map(esc).join('<br>')}${v.warnings.length>12?'<br>…':''}</p>`:''}</div>`}
function showPackPreview(pack){state.pendingPack=pack;state.packElementSelection={};const m=pack.modules||{};const validation=validatePack(pack);state.pendingPackValidation=validation;let html=`<div class="pack-preview-shell"><div class="pack-preview-head"><div class="split"><div><span class="eyebrow">Prévisualisation avant import</span><h4>${esc(pack.name||'Pack JSON')}</h4><p class="muted" style="margin-bottom:0">${esc(pack.description||pack.usageNote||'')}</p></div><span class="tag">${esc(pack.version||'sans version')}</span></div></div>${validationHtml(validation)}<div class="row"><button class="secondary small" onclick="App.packSelectAll(true)">Tout cocher</button><button class="ghost small" onclick="App.packSelectAll(false)">Tout décocher</button><span class="muted tiny">Décoche les modules ou éléments que tu ne veux pas planter.</span></div>`;visiblePackModules.forEach(k=>{const count=packCount(k,m);if(!count)return;html+=`<details class="card"><summary><label class="chip selected"><input type="checkbox" id="imp_${k}" checked onchange="this.parentElement.classList.toggle('selected',this.checked)"> ${moduleLabels[k]||k} <span class="tag">${count}</span></label></summary>${packModuleItems(k,m[k])}</details>`});html+=validation.errors.length?`<button disabled>Import impossible : corriger le pack</button>`:`<div class="row"><button onclick="App.importSelectedPack()">Importer la sélection</button><button class="ghost" onclick="document.getElementById('packPreview').innerHTML='';state.pendingPack=null">Annuler</button></div>`;html+=`</div>`;const target=document.getElementById('packPreview');if(target){target.innerHTML=html;target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}}
function previewBuiltInPack(){showPackPreview(BUILTIN_PACK)}
function previewPack(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{showPackPreview(JSON.parse(r.result))}catch(e){toast('Pack JSON illisible.')}};r.readAsText(file)}
function packModuleItems(k,val){if(k==='demo')return '<p class="muted">Importe des données de démonstration si le pack en contient.</p>';if(k==='lists'){return Object.entries(val||{}).map(([name,arr])=>`<details class="card"><summary><strong>${esc(humanKey(name))}</strong> <span class="tag">${(arr||[]).length}</span></summary>${tags(arr)}</details>`).join('')}const arr=Array.isArray(val)?val:[];return `<div class="pack-items">${arr.map((it,i)=>{const title=itemTitle(k,it,i);const summary=itemSummary(k,it);return `<label class="pack-item"><input type="checkbox" id="item_${k}_${i}" checked><span><strong>${esc(title)}</strong>${summary?`<span class="muted tiny">${esc(String(summary).slice(0,240))}</span>`:''}</span></label>`}).join('')}</div>`}
function packSelectAll(v){document.querySelectorAll('#packPreview input[type=checkbox]').forEach(x=>{x.checked=v;x.closest('label')?.classList.toggle('selected',v)})}
function selectedItems(k,arr){return (arr||[]).filter((_,i)=>document.getElementById('item_'+k+'_'+i)?.checked)}
function itemWithSource(it,packId,k){const clone={...it};if(!clone.id)clone.id=uid(k);const prev=Array.isArray(clone._packIds)?clone._packIds:(clone._packId?[clone._packId]:[]);clone._packIds=[...new Set([...prev,packId])];delete clone._packId;return clone}
function importSelectedPack(){const pack=state.pendingPack;if(!pack)return;const validation=validatePack(pack);if(validation.errors.length){toast('Import impossible : pack invalide.');return}const m=pack.modules||{};const packId=uid('pack');const contrib={lists:{}};const chosen=id=>document.getElementById('imp_'+id)?.checked;if(chosen('lists')&&m.lists){Object.entries(m.lists).forEach(([k,arr])=>{if(!state.data.content.lists[k])state.data.content.lists[k]=[];contrib.lists[k]=[];(arr||[]).forEach(v=>{if(!state.data.content.lists[k].includes(v)){state.data.content.lists[k].push(v);contrib.lists[k].push(v)}})})}arrayPackModules.forEach(k=>{if(chosen(k)&&Array.isArray(m[k])){const items=selectedItems(k,m[k]).map(it=>itemWithSource(it,packId,k));contrib[k]=items.map(it=>it.id).filter(Boolean);mergeById(state.data.content[k],items,packId)}});if(chosen('demo')&&m.demo){importDemo(m.demo,false);contrib.demo=true}state.data.packs.push({id:packId,name:pack.name||'pack',version:pack.version||'',schema:pack.schema||'',date:today(),modules:Object.keys(contrib).filter(k=>k!=='lists'||Object.keys(contrib.lists).length),warnings:validation.warnings.length});state.data.packContributions[packId]=contrib;save();state.pendingPack=null;toast(validation.warnings.length?'Import terminé avec points d’attention.':'Import terminé.');render()}
function mergeById(target,items,packId){items.forEach(it=>{const i=target.findIndex(x=>x.id&&it.id&&x.id===it.id);if(i>=0){const old=target[i];const ids=Array.isArray(old._packIds)?old._packIds:(old._packId?[old._packId]:[]);target[i]={...old,...it,_packIds:[...new Set([...ids,...(it._packIds||[]),packId])]};delete target[i]._packId}else target.push(it)})}
function uninstallPack(id){if(!confirm('Désinstaller ce pack ? Les contenus ajoutés uniquement par ce pack seront retirés. Les contenus partagés par plusieurs packs seront conservés.'))return;const c=state.data.packContributions[id]||{};Object.entries(c.lists||{}).forEach(([k,arr])=>{state.data.content.lists[k]=list(k).filter(v=>!arr.includes(v))});arrayPackModules.forEach(k=>{state.data.content[k]=state.data.content[k].flatMap(x=>{const ids=Array.isArray(x._packIds)?x._packIds:(x._packId?[x._packId]:[]);if(ids.includes(id)){const remaining=ids.filter(pid=>pid!==id);if(remaining.length){const y={...x,_packIds:remaining};delete y._packId;return[y]}return[]}return[x]})});state.data.packs=state.data.packs.filter(p=>p.id!==id);delete state.data.packContributions[id];save();render();toast('Pack désinstallé.')}

function renderRefValue(v){
