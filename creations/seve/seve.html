nte","nommer une peur sans lui obéir totalement"],"practices":["échelle des petites marches","rituel du premier essai","carnet des erreurs utiles","défi doux choisi"],"links":[{"pillarId":"dignite","reason":"Ce pilier soutient courage, résilience et traversée des difficultés dans les situations où l’enfant a besoin d’intégrer plusieurs dimensions à la fois."},{"pillarId":"presence","reason":"Ce pilier soutient courage, résilience et traversée des difficultés dans les situations où l’enfant a besoin d’intégrer plusieurs dimensions à la fois."},{"pillarId":"responsabilite","reason":"Ce pilier soutient courage, résilience et traversée des difficultés dans les situations où l’enfant a besoin d’intégrer plusieurs dimensions à la fois."}]},{"id":"reliance","icon":"🌌","title":"Reliance au vivant, au sacré et au mystère","short":"Honorer la nature, la beauté, le silence et les grandes questions.","essence":"Ouvrir un espace libre de contemplation, de gratitude et de respect du vivant, sans imposer de croyance ni transformer le mystère en dogme.","pedagogicalIntention":"Nourrir le lien à la nature, au silence, aux symboles, aux saisons, à la beauté et aux grandes questions de sens.","centralQuestion":"À quoi suis-je relié quand je me sens vivant, calme et respectueux du mystère ?","protects":["l’émerveillement profond","le respect du vivant","la liberté spirituelle","la contemplation","le silence intérieur"],"develops":["gratitude au vivant","humilité","écoute symbolique","sens du sacré non dogmatique","responsabilité écologique"],"signs":{"germination":["L’enfant commence à percevoir reliance au vivant, au sacré et au mystère dans une situation simple.","Il accepte une aide adulte ou un support symbolique.","Il peut nommer un indice, même très bref."],"fragilite":["La qualité se ferme sous pression, fatigue ou comparaison.","Le comportement visible peut masquer un besoin de nature.","L’enfant a besoin d’un cadre plus doux avant d’intégrer la qualité."],"expansion":["L’enfant utilise la qualité dans plusieurs contextes avec moins d’aide.","Il commence à ajuster son comportement sans perdre sa dignité.","Il peut expliquer ce qui l’aide ou ce qui le ferme."],"rayonnement":["L’enfant peut offrir cette qualité au groupe sans se sacrifier.","Il devient ressource ponctuelle, tout en restant libre de ne pas porter les autres.","La qualité reste présente même dans une situation plus chargée."]},"needs":["nature","calme","beauté","sens","protection"],"frequentSituations":["besoin de silence","perte de lien à la nature","questions existentielles","enfant très connecté mais peu ancré","groupe coupé du vivant"],"adultPhrases":["Tu n’as pas besoin de croire comme quelqu’un d’autre pour respecter le mystère.","La nature peut être une enseignante silencieuse.","Nous contemplons sans forcer une réponse.","Ce qui est sacré demande douceur et liberté."],"avoid":["Tu dois croire ceci.","Ce ressenti prouve tout.","La science ne sert à rien.","Ne pose pas ces questions."],"questionsForChild":["Qu’est-ce que la nature t’apprend aujourd’hui ?","Quel symbole te parle sans que tu aies besoin de l’expliquer ?","Quelle gratitude veux-tu offrir au vivant ?"],"ageAdaptations":{"3-6 ans":["Passer par le corps, l’image, le jeu et une phrase très courte.","Utiliser un objet, un animal symbolique ou une couleur pour représenter reliance au vivant, au sacré et au mystère.","Observer surtout les gestes, le tonus, le retrait ou l’élan."],"6-9 ans":["Relier la qualité à un conte, un jeu coopératif ou une situation de classe.","Proposer une phrase outil simple et répétable.","Clôturer par un dessin, un geste ou un mot."],"9-12 ans":["Confier un rôle, un mini-défi ou une mission concrète.","Faire verbaliser besoin, effet et prochaine marche.","Relier la qualité au groupe sans transformer l’enfant en responsable du groupe."],"12-15 ans":["Traiter la qualité avec respect, sans infantiliser.","Utiliser débat, journal, théâtre, cercle de vérité ou projet.","Laisser une part de choix et de retrait possible."],"15-18 ans":["Relier la qualité à l’intégrité, à la contribution et aux choix de vie.","Proposer mentorat, projet personnel, service concret ou transmission aux plus jeunes.","Éviter la morale ; privilégier responsabilité, discernement et cohérence."]},"adaptations":{"enfant hypersensible":["Réduire l’exposition publique.","Prévoir une sortie douce ou une alternative non verbale.","Valoriser les micro-signes de progression."],"enfant très moteur":["Intégrer mouvement, manipulation ou rôle actif.","Faire court, concret, observable.","Offrir une décharge corporelle avant la parole."],"enfant discret":["Permettre de répondre par écrit, dessin ou duo.","Ne pas confondre silence et absence d’évolution.","Créer de petites prises de place sécurisées."],"groupe agité":["Commencer par le corps et le rythme avant la parole.","Réduire la durée du cercle.","Nommer le cadre sans moraliser."]},"nextSteps":["observer un élément naturel en silence","écrire une question de mystère","créer un rituel de gratitude libre","relier un symbole à un geste concret"],"practices":["minute d’arbre","cercle des saisons","gratitude à l’eau","carnet des signes et questions"],"links":[{"pillarId":"joie","reason":"Ce pilier soutient reliance au vivant, au sacré et au mystère dans les situations où l’enfant a besoin d’intégrer plusieurs dimensions à la fois."},{"pillarId":"discernement","reason":"Ce pilier soutient reliance au vivant, au sacré et au mystère dans les situations où l’enfant a besoin d’intégrer plusieurs dimensions à la fois."},{"pillarId":"responsabilite","reason":"Ce pilier soutient reliance au vivant, au sacré et au mystère dans les situations où l’enfant a besoin d’intégrer plusieurs dimensions à la fois."}]}],"activities":[{"id":"emo52_act_01","title":"La météo du volcan intérieur","pillarId":"emotions","age":"6-9","duration":"25 min","format":"conte + dessin","needs":["expression","calme","sécurité"],"intention":"Aider l’enfant à reconnaître une émotion intense avant qu’elle n’explose.","steps":["Raconter l’image d’un volcan qui envoie d’abord de petits signaux.","Inviter chaque enfant à dessiner son volcan calme, tiède ou en éruption.","Nommer les signaux corporels : chaleur, mains, ventre, envie de crier.","Choisir une action de sécurité avant l’éruption : respirer, dessiner, sortir, demander aide.","Clôturer par une phrase personnelle : “Quand mon volcan chauffe, je peux…”"],"adultPhrases":["Ton émotion a le droit d’exister, et nous allons l’aider à sortir sans blesser.","Je cherche le signal avant l’explosion, pas un coupable."],"avoid":["Tu exagères.","Calme-toi tout de suite."],"trace":"Noter si l’enfant repère un signal corporel avant débordement.","nextStep":"repérer un signal d’alerte avant l’action"},{"id":"emo52_act_02","title":"Le nuage qui traverse","pillarId":"presence","age":"3-6","duration":"15 min","format":"rituel doux","needs":["calme","ancrage"],"intention":"Présenter l’émotion comme un passage, non comme une identité.","steps":["Montrer avec les mains un nuage qui arrive, passe devant le soleil puis continue.","Faire choisir une couleur de nuage.","Respirer trois fois en regardant le nuage imaginaire passer.","Dire : “Le nuage est là, je reste le ciel.”","Dessiner le ciel après le passage."],"adultPhrases":["Tu n’es pas ton émotion ; elle traverse ton ciel intérieur.","Nous pouvons attendre que le nuage bouge un peu."],"avoid":["Arrête d’être triste.","Ce n’est rien."],"trace":"Observer si l’enfant accepte un temps de passage avant la parole.","nextStep":"nommer l’émotion comme un passage"},{"id":"emo52_act_03","title":"La rivière de la colère","pillarId":"emotions","age":"9-12","duration":"35 min","format":"jeu corporel + cercle","needs":["mouvement","limite claire","réparation"],"intention":"Canaliser la colère par le mouvement puis la transformer en message clair.","steps":["Installer un parcours au sol : source, courant, rochers, embouchure.","Marcher la colère avec le corps, sans contact avec les autres.","Identifier le “rocher” : injustice, frustration, non entendu.","Transformer la phrase brute en phrase besoin : “J’ai besoin de…”","Choisir une réparation si la colère a touché quelqu’un."],"adultPhrases":["Ta colère montre qu’une limite ou une valeur a été touchée. Écoutons-la sans la laisser gouverner.","La force peut devenir message."],"avoid":["Tu es violent.","Ta colère est mauvaise."],"trace":"Observer si l’enfant passe d’une accusation à une phrase de besoin.","nextStep":"transformer une colère en message"},{"id":"emo52_act_04","title":"La boîte des peurs apprivoisées","pillarId":"emotions","age":"6-12","duration":"30 min","format":"création","needs":["sécurité","expression","confiance"],"intention":"Donner une forme symbolique aux peurs pour qu’elles deviennent parlables.","steps":["Chaque enfant crée ou dessine une petite boîte.","Écrire ou dessiner une peur sous forme de symbole, sans obligation de partager.","Ajouter une ressource dans la boîte : phrase, image, être de confiance, geste.","Partager seulement si c’est choisi.","Finir par : “Quand la peur parle, je peux chercher…”"],"adultPhrases":["Tu peux garder cela pour toi ou le partager ; les deux sont respectables.","La peur cherche souvent à protéger quelque chose."],"avoid":["Allez, ce n’est pas grave.","Tu n’as aucune raison d’avoir peur."],"trace":"Observer si l’enfant choisit une ressource face à une peur.","nextStep":"identifier une ressource face à une peur"},{"id":"emo52_act_05","title":"Le feu rouge, orange, vert","pillarId":"presence","age":"6-9","duration":"20 min","format":"jeu symbolique","needs":["prévisibilité","ancrage","limite claire"],"intention":"Créer un langage simple pour dire son niveau de disponibilité intérieure.","steps":["Présenter trois états : vert disponible, orange fragile, rouge stop.","Donner des exemples de classe.","Faire mimer les trois états.","Associer à chaque état une aide : continuer, ralentir, pause.","Utiliser le code pendant une vraie transition."],"adultPhrases":["Ton rouge est une information ; il nous aide à ajuster.","Orange veut dire : je peux continuer avec douceur."],"avoid":["Tu es encore compliqué.","On n’a pas le temps pour ça."],"trace":"Observer si l’enfant utilise le code avant saturation.","nextStep":"utiliser un code simple de disponibilité"},{"id":"emo52_act_06","title":"Le dessin qui parle avant les mots","pillarId":"creativite","age":"3-9","duration":"20 min","format":"dessin","needs":["expression","lenteur","sécurité"],"intention":"Offrir une voie non verbale quand la parole est trop difficile.","steps":["Donner une feuille avec trois zones : dedans, dehors, besoin.","Laisser dessiner sans commentaire pendant quelques minutes.","Demander : “Veux-tu que je regarde, que tu m’expliques, ou que je garde le silence ?”","Aider à nommer un besoin si l’enfant le souhaite.","Choisir une petite action de soutien."],"adultPhrases":["Ton dessin peut parler doucement avant les mots.","Je ne vais pas interpréter à ta place ; tu me diras ce qui est juste."],"avoid":["Je sais ce que ton dessin veut dire.","Tu dois expliquer."],"trace":"Observer si le dessin ouvre une parole ou apaise.","nextStep":"utiliser un canal non verbal"},{"id":"emo52_act_07","title":"Le théâtre des besoins cachés","pillarId":"relation","age":"9-15","duration":"45 min","format":"mise en scène","needs":["expression","réparation","écoute"],"intention":"Différencier comportement visible et besoin caché dans une situation de tension.","steps":["Jouer une scène courte : quelqu’un claque une porte, se moque, s’isole.","Le groupe nomme seulement ce qui est observable.","Chercher trois besoins possibles, sans conclure.","Rejouer la scène avec une phrase de besoin.","Écrire une phrase adulte qui guide sans étiquette."],"adultPhrases":["Nous observons un comportement, pas une identité.","Cherchons le besoin possible avant de coller une étiquette."],"avoid":["Il fait exprès.","Elle est comme ça."],"trace":"Observer si les enfants distinguent fait, hypothèse et jugement.","nextStep":"distinguer comportement et besoin"},{"id":"emo52_act_08","title":"La tasse trop pleine","pillarId":"emotions","age":"9-15","duration":"25 min","format":"expérience symbolique","needs":["calme","prévisibilité","protection"],"intention":"Comprendre la surcharge émotionnelle et prévenir le débordement.","steps":["Remplir un verre ou une tasse avec des gouttes symboliques : bruit, fatigue, frustration.","Observer le moment où cela déborde.","Demander : “Quelle goutte arrive souvent en trop ?”","Lister des manières de vider un peu la tasse.","Choisir une stratégie individuelle."],"adultPhrases":["Le débordement ne dit pas tout de toi ; il dit que la tasse était trop pleine.","Cherchons comment vider avant que ça déborde."],"avoid":["Tu fais toujours des crises.","Tu devrais supporter."],"trace":"Observer si l’enfant identifie une goutte de surcharge.","nextStep":"identifier une source de surcharge"},{"id":"emo52_act_09","title":"La marche du retour au calme","pillarId":"presence","age":"6-15","duration":"15 min","format":"marche consciente","needs":["ancrage","nature","calme"],"intention":"Utiliser le mouvement lent pour revenir dans son corps après une émotion.","steps":["Marcher en silence pendant une minute.","Sentir les pieds, le souffle, les sons.","Choisir un mot : lourd, léger, chaud, froid, ouvert, fermé.","Revenir et noter le mot.","Décider si l’enfant est prêt à parler ou a besoin d’un autre temps."],"adultPhrases":["Nous n’allons pas parler tout de suite ; d’abord, revenons au corps.","Le calme peut revenir par les pieds."],"avoid":["Explique-toi maintenant.","Pourquoi tu as fait ça ?"],"trace":"Observer si le corps s’apaise avant dialogue.","nextStep":"passer par le corps avant la parole"},{"id":"emo52_act_10","title":"Le carnet des petites victoires émotionnelles","pillarId":"dignite","age":"9-15","duration":"10 min","format":"journal","needs":["reconnaissance","confiance","lenteur"],"intention":"Reconnaître les micro-progrès dans la traversée émotionnelle.","steps":["Chaque fin de semaine, noter une situation traversée un peu mieux.","Nommer ce qui a aidé.","Identifier la qualité utilisée : courage, pause, parole, demande d’aide.","Choisir une prochaine micro-marche.","Relire une ancienne victoire quand la confiance baisse."],"adultPhrases":["Une petite victoire reste une vraie victoire.","Nous cherchons la progression, pas la perfection."],"avoid":["Ce n’est pas grand-chose.","Tu devrais déjà savoir faire."],"trace":"Observer si l’enfant repère une progression concrète.","nextStep":"nommer une micro-progression"},{"id":"emo52_act_11","title":"Le cercle des mots qui réparent après débordement","pillarId":"relation","age":"9-15","duration":"35 min","format":"cercle guidé","needs":["réparation","écoute","responsabilité"],"intention":"Apprendre à réparer sans humiliation après un débordement émotionnel.","steps":["Rappeler que réparer n’est pas se punir.","Nommer les faits sans accusation.","Chacun dit l’impact ressenti, si c’est sécurisant.","Chercher un geste de réparation proportionné.","Planifier un suivi doux."],"adultPhrases":["Réparer, c’est aider le lien à respirer de nouveau.","Tu n’es pas réduit à ce qui s’est passé."],"avoid":["Tu dois avoir honte.","Excuse-toi tout de suite sinon…"],"trace":"Observer si la réparation restaure le lien sans écraser l’enfant.","nextStep":"choisir un geste de réparation"},{"id":"emo52_act_12","title":"Le mandala de retour à soi","pillarId":"creativite","age":"6-15","duration":"30 min","format":"création calme","needs":["calme","créativité","intégration"],"intention":"Intégrer une émotion en création apaisante.","steps":["Choisir une émotion vécue récemment.","Associer une couleur, une forme, un rythme.","Créer un mandala libre sans chercher le beau.","Ajouter au centre une ressource.","Clôturer par une phrase : “Je peux revenir à…”"],"adultPhrases":["La création peut aider l’émotion à trouver une forme douce.","Nous ne cherchons pas un beau dessin, mais un chemin de retour."],"avoid":["C’est mal dessiné.","Ça ne sert à rien."],"trace":"Observer si la création aide l’enfant à se stabiliser.","nextStep":"transformer en création"},{"id":"lim52_act_01","title":"Le territoire du hérisson","pillarId":"limites","age":"6-9","duration":"25 min","format":"conte + jeu corporel","needs":["limite claire","sécurité","choix"],"intention":"Sentir son espace personnel, dire oui/non/pas maintenant, et respecter la réponse de l’autre.","steps":["Raconter le hérisson qui ouvre ou ferme ses piquants selon son ressenti.","Chaque enfant matérialise son espace avec corde, cerceau ou ligne imaginaire.","Un autre demande : “Puis-je entrer ?”","Réponses possibles : oui, non, pas maintenant, jusqu’ici.","Inverser les rôles et verbaliser le ressenti corporel."],"adultPhrases":["Ton non est une information précieuse.","Respecter le non d’un autre protège la confiance."],"avoid":["Allez, laisse-le entrer.","Ce n’est qu’un jeu."],"trace":"Observer si l’enfant ose dire non et respecte celui des autres.","nextStep":"dire non dans un jeu symbolique"},{"id":"lim52_act_02","title":"Oui, non, pas maintenant","pillarId":"limites","age":"3-6","duration":"15 min","format":"jeu symbolique","needs":["choix","sécurité"],"intention":"Donner trois réponses simples et légitimes au jeune enfant.","steps":["Montrer trois cartes ou gestes : oui, non, pas maintenant.","Proposer des micro-choix non intrusifs.","Faire répéter les trois réponses avec le corps.","Montrer que l’adulte respecte chaque réponse.","Clôturer : “Mon oui et mon non comptent.”"],"adultPhrases":["Tu peux choisir oui, non ou pas maintenant.","Je respecte ta réponse."],"avoid":["Tu dois dire oui.","Tu changes toujours d’avis."],"trace":"Observer si l’enfant utilise “pas maintenant” au lieu de subir.","nextStep":"choisir parmi trois réponses"},{"id":"lim52_act_03","title":"Le feu du stop","pillarId":"limites","age":"6-12","duration":"20 min","format":"jeu corporel","needs":["protection","limite claire","courage"],"intention":"S’entraîner à dire stop avec une voix claire, sans agressivité.","steps":["Créer une ligne au sol.","Un enfant avance lentement, l’autre dit stop quand son corps le sent.","Varier le ton : trop faible, trop dur, juste clair.","Inverser les rôles.","Nommer la différence entre force claire et attaque."],"adultPhrases":["Un stop peut être ferme et respectueux.","Ta limite n’a pas besoin de crier pour exister."],"avoid":["Ne sois pas si dur.","Tu n’as pas le droit de refuser."],"trace":"Observer la clarté du stop et la réaction au stop de l’autre.","nextStep":"dire stop avec voix claire"},{"id":"lim52_act_04","title":"Mon corps me parle","pillarId":"presence","age":"9-12","duration":"30 min","format":"journal + cercle","needs":["ancrage","protection","lenteur"],"intention":"Repérer les signaux corporels du oui, du non et du doute.","steps":["Tracer trois colonnes : oui, non, je ne sais pas encore.","Lister ou dessiner les sensations associées.","Partager volontairement une sensation.","Relier à des situations non sensibles de classe.","Choisir une phrase : “Mon corps me donne une information.”"],"adultPhrases":["Ton corps peut donner une information avant les mots.","Le doute a aussi le droit d’avoir du temps."],"avoid":["Tu sais très bien ce que tu veux.","Arrête d’hésiter."],"trace":"Observer si l’enfant différencie oui/non/doute.","nextStep":"repérer un signal corporel"},{"id":"lim52_act_05","title":"La porte avec poignée intérieure","pillarId":"authenticite","age":"9-15","duration":"35 min","format":"métaphore + écriture","needs":["autonomie","choix","vérité"],"intention":"Comprendre qu’on peut ouvrir ou fermer son espace intérieur selon la relation et le moment.","steps":["Dessiner une porte symbolique.","Écrire ce qui peut entrer : aide, respect, joie.","Écrire ce qui reste dehors : moquerie, pression, secret lourd.","Créer une phrase de protection.","Partager une règle personnelle si choisi."],"adultPhrases":["Tu as le droit d’avoir une poignée intérieure.","Tout le monde n’a pas accès à tout ton monde."],"avoid":["Tu dois tout raconter.","Si tu ne partages pas, tu n’es pas gentil."],"trace":"Observer la capacité à choisir ce qui se partage.","nextStep":"formuler une règle personnelle"},{"id":"lim52_act_06","title":"Secret léger, secret lourd","pillarId":"discernement","age":"9-15","duration":"40 min","format":"débat guidé","needs":["protection","discernement","sécurité"],"intention":"Distinguer surprise joyeuse, intimité respectée et secret qui pèse.","steps":["Présenter trois paniers : surprise, intimité, secret lourd.","Lire des situations fictives adaptées à l’âge.","Classer ensemble sans nommer de vécus personnels.","Identifier les adultes ressources.","Formuler : “Un secret lourd mérite de l’aide.”"],"adultPhrases":["Un secret qui pèse n’a pas besoin d’être porté seul.","Demander de l’aide peut être un acte de protection."],"avoid":["Ne le dis à personne jamais.","Tu dois garder tous les secrets."],"trace":"Observer si les enfants savent nommer un adulte ressource.","nextStep":"identifier un secret lourd"},{"id":"lim52_act_07","title":"Le contrat de jeu vivant","pillarId":"relation","age":"6-12","duration":"25 min","format":"jeu coopératif","needs":["cadre clair","choix","relation"],"intention":"Comprendre qu’un jeu juste repose sur un accord clair et révisable.","steps":["Choisir un jeu simple.","Avant de jouer, construire trois accords : ce qui est permis, stop, réparation.","Tester une manche.","Ajuster les règles si un besoin apparaît.","Conclure sur le cadre qui protège le plaisir."],"adultPhrases":["Une règle juste protège le jeu et les êtres.","On peut ajuster un accord si un besoin apparaît."],"avoid":["Les règles, c’est comme ça, point.","Tu gâches le jeu."],"trace":"Observer si l’enfant participe à l’accord et le respecte.","nextStep":"co-créer une règle juste"},{"id":"lim52_act_08","title":"La pression du groupe","pillarId":"discernement","age":"12-15","duration":"45 min","format":"mise en scène","needs":["liberté intérieure","courage","appartenance"],"intention":"Repérer quand le groupe pousse à trahir son ressenti.","steps":["Jouer une scène fictive de pression : “allez, fais-le”.","Nommer les mécanismes : peur du rejet, rire, défi, culpabilisation.","Créer trois réponses possibles : non clair, humour, demande d’aide.","Rejouer la scène avec une réponse choisie.","Débriefer : qu’est-ce qui aide à rester libre ?"],"adultPhrases":["Tu peux vouloir appartenir sans abandonner ton axe.","Un vrai groupe respecte le non."],"avoid":["Si tu refuses, tu n’es pas drôle.","Tu dois suivre les autres."],"trace":"Observer si l’ado trouve une phrase de sortie.","nextStep":"répondre à une pression"},{"id":"lim52_act_09","title":"Le cercle des distances justes","pillarId":"limites","age":"6-12","duration":"20 min","format":"corps + espace","needs":["sécurité","respect","ancrage"],"intention":"Explorer les distances physiques confortables selon les relations et les moments.","steps":["Créer des cercles au sol : proche, moyen, loin.","Nommer des relations fictives : ami, adulte, inconnu, groupe.","Se placer dans la distance ressentie.","Rappeler que la distance peut changer.","Associer une phrase de demande : “J’ai besoin de plus d’espace.”"],"adultPhrases":["La bonne distance est celle qui permet à ton corps de respirer.","Tu peux demander plus d’espace sans rejeter l’autre."],"avoid":["Tu es froid.","Viens faire un câlin."],"trace":"Observer si l’enfant demande un ajustement de distance.","nextStep":"demander plus d’espace"},{"id":"lim52_act_10","title":"Choisir un adulte ressource","pillarId":"limites","age":"6-15","duration":"20 min","format":"carte mentale","needs":["protection","confiance","sécurité"],"intention":"Identifier les êtres vers qui demander de l’aide.","steps":["Dessiner trois cercles : moi, proches sûrs, aides possibles.","Lister des qualités d’un adulte ressource.","Ne pas forcer à donner des noms devant le groupe.","Créer une phrase de demande d’aide.","Rappeler que demander aide n’est pas trahir."],"adultPhrases":["Tu n’as pas à porter seul ce qui te pèse.","Chercher de l’aide est une force."],"avoid":["Débrouille-toi.","Tu vas créer des problèmes."],"trace":"Observer si l’enfant sait nommer une voie d’aide.","nextStep":"identifier une aide sûre"},{"id":"lim52_act_11","title":"La charte des espaces respectés","pillarId":"responsabilite","age":"9-15","duration":"50 min","format":"mission de groupe","needs":["responsabilité","cadre clair","relation"],"intention":"Créer collectivement des règles de respect du corps, de la parole et de l’espace.","steps":["Recueillir ce qui aide chacun à se sentir respecté.","Distinguer règle, besoin, interdiction et réparation.","Écrire 5 accords simples.","Prévoir que faire si un accord est dépassé.","Signer symboliquement comme engagement vivant, révisable."],"adultPhrases":["Une charte n’est pas un mur, c’est un cadre qui protège la vie du groupe.","Nous écrivons ce que nous voulons faire vivre."],"avoid":["On fait une liste de punitions.","Les règles viennent seulement de l’adulte."],"trace":"Observer l’appropriation collective du cadre.","nextStep":"co-créer une charte"},{"id":"lim52_act_12","title":"Le non qui reste relié","pillarId":"authenticite","age":"12-15","duration":"35 min","format":"jeu de rôle","needs":["vérité","relation","courage"],"intention":"Dire non sans humilier l’autre ni s’excuser d’exister.","steps":["Écrire des situations fictives de refus.","Tester trois styles : fuite, attaque, clarté reliée.","Construire une phrase : “Je ne veux pas…, et je respecte…”","Observer le corps dans chaque style.","Choisir une phrase personnelle de non relié."],"adultPhrases":["Tu peux refuser sans casser le lien.","Un non clair peut être une forme de respect."],"avoid":["Tu es égoïste.","Si tu m’aimes, tu dois dire oui."],"trace":"Observer si l’ado formule un refus clair et respectueux.","nextStep":"dire non sans attaque"},{"id":"rel52_act_01","title":"Réparer le fil du lien","pillarId":"relation","age":"6-12","duration":"30 min","format":"objet médiateur","needs":["réparation","écoute","relation"],"intention":"Matérialiser le lien abîmé puis choisir un geste de réparation.","steps":["Présenter un fil ou ruban comme symbole du lien.","Nommer les faits sans accusation.","Chaque enfant dit une phrase d’impact ou choisit de passer.","Choisir un geste qui répare : aider, refaire, écrire, rendre, protéger.","Reposer le fil en disant ce qui change."],"adultPhrases":["Réparer, c’est aider le lien à respirer de nouveau.","Nous regardons les faits, pas la valeur de chacun."],"avoid":["Excuse-toi sinon…","Tu as détruit la confiance pour toujours."],"trace":"Observer si la réparation est concrète et proportionnée.","nextStep":"choisir une réparation concrète"},{"id":"rel52_act_02","title":"La parole qui circule","pillarId":"relation","age":"6-12","duration":"20 min","format":"cercle","needs":["écoute","cadre clair"],"intention":"Apprendre que chaque parole mérite un espace.","steps":["Installer un objet de parole.","Faire un tour très court : une phrase maximum.","Le gardien de l’écoute veille au silence entre les paroles.","Nommer ce que cela change dans le corps du groupe.","Clôturer par une gratitude d’écoute."],"adultPhrases":["Ta parole compte, et celle des autres aussi.","Nous faisons de la place sans disparaître."],"avoid":["Tu n’écoutes jamais.","Tais-toi."],"trace":"Observer les interruptions et les retours au cadre.","nextStep":"attendre son tour de parole"},{"id":"rel52_act_03","title":"Le pont après le conflit","pillarId":"relation","age":"9-15","duration":"40 min","format":"médiation guidée","needs":["réparation","justice","écoute"],"intention":"Passer de deux rives opposées à un pont de compréhension.","steps":["Chaque côté nomme les faits observables.","Nommer l’impact ressenti sans attaque.","Chercher le besoin de chaque rive.","Trouver une planche de pont : geste, accord, réparation.","Prévoir une vérification."],"adultPhrases":["Je vais protéger la parole de chacun.","Comprendre ne veut pas dire tout accepter."],"avoid":["Qui a raison ?","Vous êtes tous les deux pénibles."],"trace":"Observer si les besoins des deux côtés sont entendus.","nextStep":"formuler le besoin de chaque rive"},{"id":"rel52_act_04","title":"Le miroir bienveillant","pillarId":"dignite","age":"9-12","duration":"25 min","format":"duo","needs":["reconnaissance","confiance"],"intention":"Apprendre à reconnaître une qualité chez l’autre sans flatter ni comparer.","steps":["Former des duos choisis ou sécurisés.","Chaque enfant nomme une qualité observée concrètement.","L’autre répond seulement : “merci, je reçois”.","Changer de rôle.","Écrire une qualité reçue dans son carnet."],"adultPhrases":["Je nomme ce que j’ai observé, pas une étiquette.","Recevoir peut aussi s’apprendre."],"avoid":["Tu es le meilleur.","Lui au moins il…"],"trace":"Observer la capacité à recevoir sans gêne excessive.","nextStep":"recevoir une reconnaissance"},{"id":"rel52_act_05","title":"La moquerie démontée","pillarId":"discernement","age":"9-15","duration":"35 min","format":"analyse + jeu de rôle","needs":["protection","respect","discernement"],"intention":"Comprendre l’effet d’une moquerie et préparer des réponses de protection.","steps":["Présenter une moquerie fictive, non ciblée.","Distinguer humour partagé et humiliation.","Nommer l’impact sur le corps et le groupe.","Créer trois réponses : témoin, adulte, enfant visé.","Rejouer avec une réparation."],"adultPhrases":["Un rire qui écrase n’est pas un jeu.","Le témoin a aussi un pouvoir de protection."],"avoid":["C’était pour rire.","Ignore-le seulement."],"trace":"Observer si les témoins savent agir sans amplifier.","nextStep":"agir comme témoin protecteur"},{"id":"rel52_act_06","title":"L’équipe aux rôles tournants","pillarId":"responsabilite","age":"6-12","duration":"40 min","format":"mission de groupe","needs":["coopération","responsabilité"],"intention":"Expérimenter la coopération avec des rôles qui tournent.","steps":["Donner une mission simple : construire, trier, préparer.","Attribuer rôles : gardien temps, matériel, écoute, finition.","Faire tourner un rôle au bout de 10 minutes.","Observer ce qui change.","Débriefer : quel rôle m’a aidé ou surpris ?"],"adultPhrases":["Un rôle sert le groupe, il ne donne pas une supériorité.","Nous tournons pour découvrir plusieurs forces."],"avoid":["Tu commandes tout.","Tu es nul dans ce rôle."],"trace":"Observer la flexibilité relationnelle.","nextStep":"tenir un rôle sans domination"},{"id":"rel52_act_07","title":"La chaise de l’impact","pillarId":"relation","age":"12-15","duration":"35 min","format":"cercle sécurisé","needs":["écoute","responsabilité","réparation"],"intention":"Entendre l’impact de ses actes sans s’effondrer ni contre-attaquer.","steps":["Rappeler le cadre : faits, impact, besoin, pas d’insulte.","Une situation fictive ou réelle légère est posée.","La chaise de l’impact reçoit une phrase courte.","La personne répond : “j’ai entendu…” sans se défendre tout de suite.","Chercher une réparation ou un ajustement."],"adultPhrases":["Entendre l’impact ne veut pas dire que tu es mauvais.","Tu peux écouter avant d’expliquer."],"avoid":["Tu vois, tout le monde pense que…","Défends-toi maintenant."],"trace":"Observer la tolérance au retour.","nextStep":"entendre un impact"},{"id":"rel52_act_08","title":"La coopération silencieuse","pillarId":"presence","age":"6-15","duration":"20 min","format":"jeu silencieux","needs":["écoute","calme","coopération"],"intention":"Coopérer sans paroles pour sentir les signaux fins du groupe.","steps":["Donner une tâche simple à réaliser en silence.","Observer gestes, regards, patience.","Arrêter après quelques minutes.","Nommer ce qui a aidé ou bloqué.","Rejouer avec un accord non verbal."],"adultPhrases":["L’écoute ne passe pas seulement par les oreilles.","Ton geste peut faire de la place."],"avoid":["Parlez moins !","Vous êtes incapables."],"trace":"Observer la qualité d’attention aux autres.","nextStep":"coopérer en silence"},{"id":"rel52_act_09","title":"La gratitude spécifique","pillarId":"joie","age":"9-15","duration":"30 min","format":"cercle + action","needs":["reconnaissance","relation"],"intention":"Renforcer reconnaissance dans le groupe par une expérience relationnelle concrète.","steps":["Nommer la situation sans viser un enfant.","Explorer les besoins en jeu.","Choisir une phrase ou un geste collectif.","Tester dans une situation fictive.","Noter une prochaine marche."],"adultPhrases":["Le groupe peut devenir un lieu qui répare.","La responsabilité se partage."],"avoid":["Ce n’est pas notre problème.","Il l’a cherché."],"trace":"Observer un signe de reconnaissance dans le groupe.","nextStep":"nourrir reconnaissance"},{"id":"rel52_act_10","title":"Le pacte anti-exclusion","pillarId":"relation","age":"9-15","duration":"30 min","format":"cercle + action","needs":["appartenance","relation"],"intention":"Renforcer appartenance dans le groupe par une expérience relationnelle concrète.","steps":["Nommer la situation sans viser un enfant.","Explorer les besoins en jeu.","Choisir une phrase ou un geste collectif.","Tester dans une situation fictive.","Noter une prochaine marche."],"adultPhrases":["Le groupe peut devenir un lieu qui répare.","La responsabilité se partage."],"avoid":["Ce n’est pas notre problème.","Il l’a cherché."],"trace":"Observer un signe de appartenance dans le groupe.","nextStep":"nourrir appartenance"},{"id":"rel52_act_11","title":"Le témoin courageux","pillarId":"courage","age":"9-15","duration":"30 min","format":"cercle + action","needs":["protection","relation"],"intention":"Renforcer protection dans le groupe par une expérience relationnelle concrète.","steps":["Nommer la situation sans viser un enfant.","Explorer les besoins en jeu.","Choisir une phrase ou un geste collectif.","Tester dans une situation fictive.","Noter une prochaine marche."],"adultPhrases":["Le groupe peut devenir un lieu qui répare.","La responsabilité se partage."],"avoid":["Ce n’est pas notre problème.","Il l’a cherché."],"trace":"Observer un signe de protection dans le groupe.","nextStep":"nourrir protection"},{"id":"rel52_act_12","title":"Le banc de réparation","pillarId":"relation","age":"9-15","duration":"30 min","format":"cercle + action","needs":["réparation","relation"],"intention":"Renforcer réparation dans le groupe par une expérience relationnelle concrète.","steps":["Nommer la situation sans viser un enfant.","Explorer les besoins en jeu.","Choisir une phrase ou un geste collectif.","Tester dans une situation fictive.","Noter une prochaine marche."],"adultPhrases":["Le groupe peut devenir un lieu qui répare.","La responsabilité se partage."],"avoid":["Ce n’est pas notre problème.","Il l’a cherché."],"trace":"Observer un signe de réparation dans le groupe.","nextStep":"nourrir réparation"},{"id":"ado52_act_01","title":"Vrai, possible, à vérifier","pillarId":"discernement","age":"9-15","duration":"35 min","format":"enquête guidée","needs":["discernement","sécurité mentale"],"intention":"Installer une hygiène de pensée simple avant de croire ou rejeter.","steps":["Présenter quatre paniers : vrai vérifié, possible, ressenti, à vérifier.","Classer des phrases fictives.","Chercher quelle preuve ou observation manque.","Distinguer croire, ressentir, savoir, supposer.","Choisir une question de vérification."],"adultPhrases":["Je peux respecter ton ressenti sans le confondre avec une preuve.","À vérifier n’est pas un rejet, c’est une porte de lucidité."],"avoid":["C’est vrai parce que tu le sens.","C’est faux parce qu’un adulte le dit."],"trace":"Observer si l’enfant utilise “à vérifier”.","nextStep":"utiliser une catégorie de discernement"},{"id":"ado52_act_02","title":"Peur ou intuition ?","pillarId":"discernement","age":"12-15","duration":"40 min","format":"journal + cercle","needs":["lucidité","protection","ancrage"],"intention":"Différencier peur, prudence, intuition et réaction.","steps":["Décrire quatre sensations possibles sans les imposer.","Étudier des situations fictives.","Demander : qu’est-ce qui presse ? qu’est-ce qui apaise ?","Identifier une action prudente de vérification.","Clôturer : “Je peux écouter et vérifier.”"],"adultPhrases":["Une intuition claire n’a pas besoin de panique pour être entendue.","La peur peut protéger, mais elle peut aussi amplifier."],"avoid":["Fais confiance aveuglément à ton intuition.","Tu as peur pour rien."],"trace":"Observer si l’ado accepte de vérifier un ressenti.","nextStep":"écouter puis vérifier"},{"id":"ado52_act_03","title":"La boussole des influences","pillarId":"discernement","age":"12-15","duration":"45 min","format":"analyse","needs":["liberté intérieure","appartenance"],"intention":"Repérer les influences du groupe, des écrans, des adultes et de ses propres blessures.","steps":["Dessiner une boussole : moi, groupe, écran, adulte, peur, valeur.","Placer une décision fictive au centre.","Identifier qui pousse dans quel sens.","Nommer la valeur intérieure à protéger.","Choisir une action alignée."],"adultPhrases":["Être influencé est humain ; devenir conscient rend libre.","Quelle valeur veux-tu protéger ici ?"],"avoid":["Tu es manipulé.","Tu dois te couper de tout."],"trace":"Observer si l’ado nomme une influence sans honte.","nextStep":"nommer une influence"},{"id":"ado52_act_04","title":"L’algorithme de mon attention","pillarId":"discernement","age":"12-15","duration":"45 min","format":"atelier numérique conscient","needs":["attention","autonomie","choix"],"intention":"Comprendre que ce qui capte l’attention n’est pas toujours ce qui nourrit.","steps":["Lister ce qui capte facilement l’attention.","Distinguer captation, plaisir, nourriture réelle.","Créer une règle personnelle d’usage.","Imaginer un bouton pause intérieur.","Faire un engagement d’essai sur 24h."],"adultPhrases":["Ton attention est une force précieuse.","Ce qui attire n’est pas toujours ce qui nourrit."],"avoid":["Les écrans sont mauvais.","Tu n’as aucune volonté."],"trace":"Observer si l’ado formule une règle réaliste.","nextStep":"créer une règle attentionnelle"},{"id":"ado52_act_05","title":"Le tribunal des rumeurs","pillarId":"discernement","age":"9-15","duration":"40 min","format":"jeu de rôles","needs":["justice","vérification","relation"],"intention":"Montrer comment une rumeur se forme, se déforme et peut blesser.","steps":["Créer une rumeur fictive neutre.","La faire passer en chaîne avec transformations.","Arrêter et comparer l’origine et l’arrivée.","Nommer l’impact possible sur un être réel.","Créer une phrase de frein : “Je ne sais pas, je vérifie.”"],"adultPhrases":["Une parole non vérifiée peut voyager plus vite que la vérité.","Ne pas relayer peut être un acte de protection."],"avoid":["Tout le monde le dit donc c’est vrai.","Ce n’est qu’une histoire."],"trace":"Observer si les enfants freinent une rumeur.","nextStep":"refuser de relayer sans vérifier"},{"id":"ado52_act_06","title":"Mon non intérieur face au groupe","pillarId":"limites","age":"12-15","duration":"35 min","format":"mise en scène","needs":["courage","appartenance","liberté intérieure"],"intention":"S’entraîner à rester relié à soi sous pression sociale.","steps":["Jouer une scène fictive de défi ou moquerie.","Identifier les phrases de pression.","Créer trois réponses : courte, humoristique, appel allié.","Rejouer avec soutien.","Débriefer sur le corps après le non."],"adultPhrases":["Un vrai lien ne te demande pas de te trahir.","Ton non intérieur peut être calme et solide."],"avoid":["Si tu refuses, tu es faible.","Suis le groupe."],"trace":"Observer la phrase de sortie choisie.","nextStep":"préparer une phrase de sortie"},{"id":"ado52_act_07","title":"Valeur, image, masque","pillarId":"authenticite","age":"12-15","duration":"50 min","format":"écriture + cercle","needs":["vérité","dignité","identité"],"intention":"Explorer l’écart entre image sociale et vérité intérieure.","steps":["Dessiner un masque social.","Écrire derrière le masque une valeur à protéger.","Partager volontairement une phrase non intime.","Nommer ce qui aide à être vrai sans s’exposer trop.","Choisir une action d’authenticité prudente."],"adultPhrases":["Tu n’as pas à tout montrer pour être vrai.","L’authenticité peut aussi être progressive."],"avoid":["Sois toi-même maintenant.","Tu fais semblant."],"trace":"Observer si l’ado distingue authenticité et exposition.","nextStep":"choisir une authenticité prudente"},{"id":"ado52_act_08","title":"Débat sans domination","pillarId":"relation","age":"12-15","duration":"45 min","format":"débat guidé","needs":["écoute","vérité","respect"],"intention":"Apprendre à défendre une idée sans écraser l’autre.","steps":["Poser un sujet léger mais réel.","Donner trois règles : je parle en je, je reformule, je peux changer d’avis.","Débattre par tours courts.","Observer les moments de fermeture.","Clôturer par une idée entendue chez l’autre."],"adultPhrases":["Tu peux être ferme dans ton idée et ouvert dans ton écoute.","Changer d’avis peut être une force."],"avoid":["Tu as tort.","Si tu penses ça, tu es…"],"trace":"Observer si l’ado reformule avant de répondre.","nextStep":"reformuler une idée adverse"},{"id":"ado52_act_09","title":"Choisir mon prochain courage","pillarId":"courage","age":"12-18","duration":"25 min","format":"journal personnel","needs":["courage","autonomie","sens"],"intention":"Transformer un grand idéal en petite action réalisable.","steps":["Écrire une chose que je veux incarner.","Identifier ce qui bloque.","Réduire à une action de moins de 10 minutes.","Nommer le soutien nécessaire.","Fixer un moment d’essai."],"adultPhrases":["Le courage juste est souvent une petite marche tenue.","On ne prouve pas sa valeur par l’excès."],"avoid":["Tu dois te dépasser plus.","Ce n’est pas assez ambitieux."],"trace":"Observer si la marche est réaliste.","nextStep":"choisir un courage réaliste"},{"id":"ado52_act_10","title":"Ce qui me nourrit / ce qui m’aspire","pillarId":"presence","age":"12-18","duration":"35 min","format":"cartographie personnelle","needs":["discernement","attention","énergie"],"intention":"Distinguer les activités qui nourrissent de celles qui aspirent l’énergie.","steps":["Créer deux colonnes : nourrit / aspire.","Ajouter corps, émotions, attention, relations.","Choisir une activité à réduire et une à nourrir.","Définir un test d’une semaine.","Noter les effets."],"adultPhrases":["Ton énergie donne des informations.","Tout plaisir n’est pas nourriture profonde."],"avoid":["Tu perds ton temps.","Tu devrais aimer ça."],"trace":"Observer l’évolution de l’énergie après un choix.","nextStep":"faire un test d’énergie"},{"id":"ado52_act_11","title":"La question qui libère","pillarId":"discernement","age":"9-15","duration":"20 min","format":"questions puissantes","needs":["lucidité","vérité"],"intention":"Remplacer la réaction immédiate par une bonne question.","steps":["Présenter des situations de confusion.","Créer trois questions : Qu’est-ce que je sais ? Qu’est-ce que je suppose ? Qu’est-ce que je peux vérifier ?","S’entraîner en duo.","Choisir une question préférée.","L’utiliser dans la semaine."],"adultPhrases":["Une bonne question ouvre plus qu’une conclusion rapide.","Tu peux ralentir ton jugement."],"avoid":["Décide tout de suite.","Tu réfléchis trop."],"trace":"Observer si l’enfant pose une question avant conclusion.","nextStep":"poser une question de clarté"},{"id":"ado52_act_12","title":"Intégrité en action","pillarId":"responsabilite","age":"15-18","duration":"60 min","format":"projet court","needs":["intégrité","service","autonomie"],"intention":"Relier une valeur personnelle à une action concrète utile.","steps":["Choisir une valeur : justice, beauté, protection, vérité.","Identifier un petit problème réel.","Imaginer une action en 30 à 60 minutes.","La réaliser ou planifier.","Faire un retour : ai-je trahi ou honoré ma valeur ?"],"adultPhrases":["Une valeur devient vivante quand elle touche un geste.","Servir ne veut pas dire se sacrifier."],"avoid":["Parle moins, agis.","Tu dois sauver le monde."],"trace":"Observer l’accord valeur / action.","nextStep":"incarner une valeur"}],"sequences":[{"id":"emo52_seq_01","title":"Traverser la colère sans blesser","pillarId":"emotions","needs":["mouvement","limite claire","réparation"],"sessions":["Séance 1 : repérer les signaux du volcan intérieur.","Séance 2 : canaliser la colère par le parcours de la rivière.","Séance 3 : transformer accusation en phrase de besoin.","Séance 4 : réparer après un débordement."],"intention":"Apprendre que la colère peut devenir information, limite et force juste."},{"id":"emo52_seq_02","title":"Nommer ce qui traverse","pillarId":"presence","needs":["calme","expression","lenteur"],"sessions":["Météo couleur.","Nuage qui traverse.","Dessin qui parle avant les mots.","Carnet de micro-victoires."],"intention":"Installer un langage émotionnel simple et non jugeant."},{"id":"emo52_seq_03","title":"Surcharge et retour au calme","pillarId":"presence","needs":["ancrage","prévisibilité","protection"],"sessions":["La tasse trop pleine.","Feu rouge, orange, vert.","Marche du retour au calme.","Choix d’une stratégie personnelle."],"intention":"Aider l’enfant à prévenir la saturation au lieu d’être repris après coup."},{"id":"emo52_seq_04","title":"Réparer après émotion forte","pillarId":"relation","needs":["réparation","responsabilité","écoute"],"sessions":["Observer les faits sans étiquette.","Dire l’impact sans accusation.","Choisir une réparation proportionnée.","Célébrer la reprise du lien."],"intention":"Faire de la réparation une voie de dignité."},{"id":"lim52_seq_01","title":"Mon oui, mon non, mon espace","pillarId":"limites","needs":["sécurité","choix","protection"],"sessions":["Oui, non, pas maintenant.","Le territoire du hérisson.","Le feu du stop.","Le cercle des distances justes."],"intention":"Construire progressivement le langage corporel et verbal des limites."},{"id":"lim52_seq_02","title":"Pression du groupe et liberté intérieure","pillarId":"discernement","needs":["appartenance","courage","liberté intérieure"],"sessions":["Reconnaître les mécanismes de pression.","Créer des phrases de sortie.","Identifier les alliés.","Célébrer un refus juste."],"intention":"Aider l’ado à rester relié à son axe sans perdre toute appartenance."},{"id":"lim52_seq_03","title":"Secret lourd, aide sûre","pillarId":"limites","needs":["protection","confiance"],"sessions":["Différencier secret léger et secret lourd.","Identifier adulte ressource.","Créer une phrase de demande d’aide.","Rappeler la dignité de demander protection."],"intention":"Protéger l’enfant par le discernement et les voies d’aide."},{"id":"lim52_seq_04","title":"Cadre vivant et consentement du groupe","pillarId":"responsabilite","needs":["cadre clair","relation","responsabilité"],"sessions":["Contrat de jeu vivant.","Charte des espaces respectés.","Réparation après dépassement.","Révision des accords."],"intention":"Faire du cadre une création commune et protectrice."},{"id":"rel52_seq_01","title":"Écouter, dire, réparer","pillarId":"relation","needs":["écoute","réparation"],"sessions":["La parole qui circule.","Le pont après le conflit.","Réparer le fil du lien.","Célébrer une réparation réussie."],"intention":"Construire une culture de réparation non humiliante."},{"id":"rel52_seq_02","title":"Moquerie, témoin, protection","pillarId":"discernement","needs":["protection","respect"],"sessions":["Différencier humour et humiliation.","Créer des réponses de témoin.","Réparer après moquerie.","Créer un pacte anti-exclusion."],"intention":"Faire du témoin un protecteur possible."},{"id":"rel52_seq_03","title":"Coopérer sans dominer","pillarId":"responsabilite","needs":["coopération","rôle"],"sessions":["Équipe aux rôles tournants.","Coopération silencieuse.","Retour sur les rôles.","Nouvelle mission ajustée."],"intention":"Apprendre la responsabilité relationnelle."},{"id":"rel52_seq_04","title":"Reconnaître sans comparer","pillarId":"dignite","needs":["reconnaissance","confiance"],"sessions":["Miroir bienveillant.","Gratitude spécifique.","Recevoir sans se justifier.","Offrir une qualité au groupe."],"intention":"Créer une reconnaissance qui nourrit sans compétition."},{"id":"ado52_seq_01","title":"Hygiène du discernement","pillarId":"discernement","needs":["vérification","lucidité"],"sessions":["Vrai, possible, à vérifier.","Peur ou intuition ?","Tribunal des rumeurs.","Question qui libère."],"intention":"Créer une discipline douce du vrai sans couper l’intuition."},{"id":"ado52_seq_02","title":"Pression sociale et axe intérieur","pillarId":"limites","needs":["appartenance","courage"],"sessions":["Boussole des influences.","Mon non intérieur face au groupe.","Valeur, image, masque.","Choisir mon prochain courage."],"intention":"Aider l’ado à rester relié à lui-même dans le groupe."},{"id":"ado52_seq_03","title":"Attention et souveraineté numérique","pillarId":"discernement","needs":["attention","autonomie"],"sessions":["Algorithme de mon attention.","Ce qui me nourrit / m’aspire.","Règle personnelle.","Retour d’expérience."],"intention":"Transformer l’écran en objet de choix conscient."},{"id":"ado52_seq_04","title":"Débat, vérité, respect","pillarId":"relation","needs":["écoute","vérité"],"sessions":["Débat sans domination.","Reformulation.","Question de clarté.","Intégrité en action."],"intention":"Dire vrai sans écraser."}],"situations":[{"id":"emo52_sit_01","title":"Un enfant explose très vite","pillarId":"emotions","needs":["sécurité","mouvement","limite claire"],"reading":"L’explosion peut signaler une émotion trop rapide pour les mots, une surcharge ou une limite non reconnue. Chercher le signal avant le débordement.","firstSteps":["Écarter le danger sans humilier.","Passer par le corps avant l’explication.","Nommer un signal observé et proposer une phrase de besoin."],"avoid":["Exiger une explication immédiate.","Dire “tu es violent”."]},{"id":"emo52_sit_02","title":"Un enfant se ferme après une remarque","pillarId":"dignite","needs":["reconnaissance","sécurité","lenteur"],"reading":"Le retrait peut protéger une dignité blessée. Il ne faut pas forcer l’ouverture : créer une petite porte sûre.","firstSteps":["Proposer un choix : parler, dessiner, attendre.","Nommer que l’erreur ne retire pas la valeur.","Revenir plus tard en duo."],"avoid":["Insister devant le groupe."]},{"id":"emo52_sit_03","title":"Groupe agité au retour de récréation","pillarId":"presence","needs":["ancrage","prévisibilité","calme"],"reading":"Le groupe n’est pas forcément opposant : les corps n’ont pas encore atterri.","firstSteps":["Rituel court de pieds au sol.","Feu vert/orange/rouge collectif.","Activité calme de transition."],"avoid":[]},{"id":"emo52_sit_04","title":"Un enfant pleure mais ne veut pas parler","pillarId":"emotions","needs":["sécurité","expression","solitude"],"reading":"Le silence peut être une protection saine. La présence adulte peut soutenir sans extraire de force.","firstSteps":["Offrir présence silencieuse.","Proposer dessin ou objet médiateur.","Demander ce qui aiderait maintenant, sans enquêter."],"avoid":["Pourquoi tu pleures ?","Parle, sinon je ne peux pas t’aider."]},{"id":"emo52_sit_05","title":"Jalousie entre enfants","pillarId":"relation","needs":["reconnaissance","appartenance","justice"],"reading":"La jalousie parle souvent d’un besoin d’être vu, choisi ou rassuré.","firstSteps":["Reconnaître le besoin de place.","Éviter de comparer.","Créer un moment où chaque enfant reçoit une reconnaissance spécifique."],"avoid":["Tu es jaloux.","Regarde comme l’autre fait mieux."]},{"id":"emo52_sit_06","title":"Honte après erreur","pillarId":"dignite","needs":["confiance","reconnaissance","droit à l’erreur"],"reading":"La honte fige l’apprentissage. L’adulte doit protéger la valeur de l’enfant avant de corriger l’acte.","firstSteps":["Dire que l’erreur n’est pas l’identité.","Chercher la réparation ou la prochaine marche.","Valoriser le courage de recommencer."],"avoid":["Tu devrais avoir honte."]},{"id":"lim52_sit_01","title":"Un enfant accepte tout puis explose","pillarId":"limites","needs":["choix","sécurité","limite claire"],"reading":"L’enfant peut ne pas sentir ou ne pas oser son non avant saturation.","firstSteps":["Offrir des choix simples.","Valoriser un petit non.","Repérer les signaux corporels avant explosion."],"avoid":["Dire : “tu aurais dû parler”."]},{"id":"lim52_sit_02","title":"Un enfant envahit l’espace des autres","pillarId":"relation","needs":["limite claire","empathie","cadre"],"reading":"L’enfant peut chercher le lien sans sentir la distance juste.","firstSteps":["Rendre la limite visible au sol.","Faire demander avant d’entrer dans l’espace.","Réparer si une limite a été dépassée."],"avoid":["Le ridiculiser comme “collant”."]},{"id":"lim52_sit_03","title":"Des enfants se touchent sans demander","pillarId":"limites","needs":["respect","pudeur","sécurité"],"reading":"Le consentement se travaille dans les gestes ordinaires, pas seulement dans les grands discours.","firstSteps":["Rappeler : on demande avant.","S’exercer avec objets ou jeu fictif.","Installer une phrase commune : “je demande / j’écoute la réponse”."],"avoid":[]},{"id":"lim52_sit_04","title":"Un ado subit la pression de groupe","pillarId":"discernement","needs":["appartenance","courage","protection"],"reading":"Le besoin d’appartenir peut rendre le non difficile.","firstSteps":["Nommer les mécanismes sans accuser.","Préparer une phrase courte de sortie.","Identifier un allié."],"avoid":["Dire seulement : “tu n’avais qu’à refuser”."]},{"id":"lim52_sit_05","title":"Un enfant dit non avec agressivité","pillarId":"authenticite","needs":["courage","relation","régulation"],"reading":"Le non existe, mais il cherche une forme plus reliée.","firstSteps":["Reconnaître le droit au non.","Travailler le ton et la distance.","Distinguer fermeté et attaque."],"avoid":[]},{"id":"lim52_sit_06","title":"Un adulte veut forcer une participation","pillarId":"limites","needs":["respect","sécurité","choix"],"reading":"Un refus d’activité peut cacher surcharge, pudeur, peur ou besoin d’observer d’abord.","firstSteps":["Proposer rôle observateur.","Offrir une participation minimale.","Revenir plus tard sans pression."],"avoid":["“Tout le monde participe pareil.”"]},{"id":"rel52_sit_01","title":"Conflit répété entre deux enfants","pillarId":"relation","needs":["réparation","justice"],"reading":"Le conflit répété cache souvent un besoin de place, de reconnaissance ou de limite claire.","firstSteps":["Revenir aux faits.","Repérer le besoin de chaque côté.","Créer un accord vérifiable."],"avoid":["Chercher un coupable unique."]},{"id":"rel52_sit_02","title":"Moquerie dans le groupe","pillarId":"discernement","needs":["protection","respect"],"reading":"La moquerie crée une hiérarchie invisible. Les témoins ont besoin d’une voie d’action.","firstSteps":["Nommer l’impact.","Soutenir la personne visée.","Donner une phrase aux témoins."],"avoid":["“C’était pour rire” sans réparation."]},{"id":"rel52_sit_03","title":"Enfant qui domine le jeu","pillarId":"responsabilite","needs":["coopération","limite claire"],"reading":"Une force d’organisation peut devenir contrôle si elle n’apprend pas l’écoute.","firstSteps":["Valoriser la force.","Donner un rôle limité.","Faire tourner les responsabilités."],"avoid":[]},{"id":"rel52_sit_04","title":"Enfant qui s’efface dans le groupe","pillarId":"dignite","needs":["reconnaissance","sécurité"],"reading":"L’effacement peut protéger d’un risque social. Une petite place choisie vaut mieux qu’une exposition forcée.","firstSteps":["Donner un rôle discret.","Préparer une phrase en duo.","Célébrer une prise de place minuscule."],"avoid":["Le pousser au centre trop vite."]},{"id":"ado52_sit_01","title":"Ado fermé face aux adultes","pillarId":"authenticite","needs":["sécurité","respect","autonomie"],"reading":"Le silence peut protéger une vérité non prête, une fatigue ou une méfiance. L’invitation vaut mieux que l’extraction.","firstSteps":["Proposer un choix de canal.","Ne pas forcer devant le groupe.","Revenir par une question courte et respectueuse."],"avoid":["“Tu dois parler maintenant.”"]},{"id":"ado52_sit_02","title":"Rumeur dans le groupe","pillarId":"discernement","needs":["vérification","protection"],"reading":"La rumeur donne un sentiment de pouvoir au prix de la dignité d’un autre.","firstSteps":["Freiner la diffusion.","Demander la source.","Protéger l’être visé."],"avoid":[]},{"id":"ado52_sit_03","title":"Comparaison sur les réseaux","pillarId":"dignite","needs":["valeur","attention"],"reading":"La comparaison fragilise la dignité et capte l’attention.","firstSteps":["Distinguer image et réel.","Revenir aux valeurs propres.","Créer une règle d’attention."],"avoid":[]},{"id":"ado52_sit_04","title":"Conflit d’opinions très polarisé","pillarId":"relation","needs":["écoute","discernement"],"reading":"Le désaccord peut devenir violence identitaire si l’idée est confondue avec la valeur de l’être.","firstSteps":["Reformuler avant répondre.","Séparer être et idée.","Chercher un point de réalité observable."],"avoid":[]}],"phrases":[{"id":"socle_phrase_1_1","category":"accueillir une émotion","context":"accueillir une émotion","pillarId":"emotions","text":"Je vois que quelque chose te traverse fortement. Nous allons lui faire une place sans le laisser tout envahir.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_1_2","category":"accueillir une émotion","context":"accueillir une émotion","pillarId":"emotions","text":"Ton émotion est entendue, et je garde le cadre pour que chacun reste en sécurité.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_1_3","category":"accueillir une émotion","context":"accueillir une émotion","pillarId":"emotions","text":"Tu peux d’abord montrer avec un geste ou une couleur, les mots viendront après.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_1_4","category":"accueillir une émotion","context":"accueillir une émotion","pillarId":"emotions","text":"On ne va pas discuter avec la vague pendant qu’elle est au plus haut ; on va d’abord respirer.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_1_5","category":"accueillir une émotion","context":"accueillir une émotion","pillarId":"emotions","text":"Ce que tu ressens compte, même si nous devons ajuster ce que tu fais.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_1_6","category":"accueillir une émotion","context":"accueillir une émotion","pillarId":"emotions","text":"Je reste avec toi pendant que tu retrouves ton centre.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_1_7","category":"accueillir une émotion","context":"accueillir une émotion","pillarId":"emotions","text":"L’émotion donne une information ; elle ne décide pas toute seule.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_1_8","category":"accueillir une émotion","context":"accueillir une émotion","pillarId":"emotions","text":"Après la vague, nous chercherons la réparation juste.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_2_1","category":"poser une limite","context":"poser une limite","pillarId":"limites","text":"Je ne laisse pas ce geste continuer, parce que je protège ton espace et celui des autres.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_2_2","category":"poser une limite","context":"poser une limite","pillarId":"limites","text":"Stop. La limite est là. Nous parlerons après le retour au calme.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_2_3","category":"poser une limite","context":"poser une limite","pillarId":"limites","text":"Ton besoin est entendu ; cette manière de l’exprimer n’est pas possible ici.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_2_4","category":"poser une limite","context":"poser une limite","pillarId":"limites","text":"Je peux être doux et ferme en même temps.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_2_5","category":"poser une limite","context":"poser une limite","pillarId":"limites","text":"Le cadre n’est pas contre toi, il protège le lien.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_2_6","category":"poser une limite","context":"poser une limite","pillarId":"limites","text":"Tu peux choisir entre deux chemins qui respectent la limite.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_2_7","category":"poser une limite","context":"poser une limite","pillarId":"limites","text":"Je t’aide à transformer ce non en geste juste.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_2_8","category":"poser une limite","context":"poser une limite","pillarId":"limites","text":"La liberté grandit mieux avec des limites claires.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_3_1","category":"réparer après conflit","context":"réparer après conflit","pillarId":"relation","text":"Réparer ne veut pas dire te punir ; cela veut dire aider le lien à respirer à nouveau.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_3_2","category":"réparer après conflit","context":"réparer après conflit","pillarId":"relation","text":"Nous allons chercher un geste qui reconnaît l’effet de ce qui s’est passé.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_3_3","category":"réparer après conflit","context":"réparer après conflit","pillarId":"relation","text":"Tu peux commencer par “je reconnais que…” si “pardon” est trop difficile.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_3_4","category":"réparer après conflit","context":"réparer après conflit","pillarId":"relation","text":"L’intention compte, et l’effet compte aussi.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_3_5","category":"réparer après conflit","context":"réparer après conflit","pillarId":"relation","text":"La réparation peut être petite, mais elle doit être vraie.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_3_6","category":"réparer après conflit","context":"réparer après conflit","pillarId":"relation","text":"Je ne force pas une excuse vide ; j’accompagne une réparation sincère.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_3_7","category":"réparer après conflit","context":"réparer après conflit","pillarId":"relation","text":"Qu’est-ce qui aiderait l’autre à se sentir de nouveau respecté ?","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_3_8","category":"réparer après conflit","context":"réparer après conflit","pillarId":"relation","text":"Après la réparation, chacun retrouve sa dignité.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_4_1","category":"encourager sans pression","context":"encourager sans pression","pillarId":"dignite","text":"Je vois ton effort, pas seulement le résultat.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_4_2","category":"encourager sans pression","context":"encourager sans pression","pillarId":"dignite","text":"Ton erreur ne retire rien à ta valeur.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_4_3","category":"encourager sans pression","context":"encourager sans pression","pillarId":"dignite","text":"Tu avances à ton rythme, et je vois la marche d’aujourd’hui.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_4_4","category":"encourager sans pression","context":"encourager sans pression","pillarId":"dignite","text":"Tu peux être fier sans devoir être parfait.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_4_5","category":"encourager sans pression","context":"encourager sans pression","pillarId":"dignite","text":"Un brouillon courageux vaut mieux qu’un silence par peur.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_4_6","category":"encourager sans pression","context":"encourager sans pression","pillarId":"dignite","text":"Je ne te compare pas : je regarde ton propre chemin.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_4_7","category":"encourager sans pression","context":"encourager sans pression","pillarId":"dignite","text":"Ce que tu as tenté compte déjà.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_4_8","category":"encourager sans pression","context":"encourager sans pression","pillarId":"dignite","text":"Ta valeur reste entière pendant l’apprentissage.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_5_1","category":"soutenir un enfant discret","context":"soutenir un enfant discret","pillarId":"authenticite","text":"Tu peux participer avec un mot, un signe, un dessin ou simplement une présence attentive.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_5_2","category":"soutenir un enfant discret","context":"soutenir un enfant discret","pillarId":"authenticite","text":"Je ne confonds pas ton silence avec une absence d’idée.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_5_3","category":"soutenir un enfant discret","context":"soutenir un enfant discret","pillarId":"authenticite","text":"Ta parole peut venir en petit format.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_5_4","category":"soutenir un enfant discret","context":"soutenir un enfant discret","pillarId":"authenticite","text":"Je peux te proposer un duo avant le grand groupe.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_5_5","category":"soutenir un enfant discret","context":"soutenir un enfant discret","pillarId":"authenticite","text":"Tu as le droit de prendre le temps de sentir ce qui est vrai.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_5_6","category":"soutenir un enfant discret","context":"soutenir un enfant discret","pillarId":"authenticite","text":"Je garderai une place pour ta voix sans la forcer.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_5_7","category":"soutenir un enfant discret","context":"soutenir un enfant discret","pillarId":"authenticite","text":"Même une petite phrase peut être très précieuse.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_5_8","category":"soutenir un enfant discret","context":"soutenir un enfant discret","pillarId":"authenticite","text":"Tu peux me dire plus tard si maintenant c’est trop.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_6_1","category":"accompagner un enfant très moteur","context":"accompagner un enfant très moteur","pillarId":"presence","text":"Ton corps a beaucoup d’énergie ; nous allons lui donner un chemin utile.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_6_2","category":"accompagner un enfant très moteur","context":"accompagner un enfant très moteur","pillarId":"presence","text":"Avant le cercle, ton corps peut faire une mission de mouvement.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_6_3","category":"accompagner un enfant très moteur","context":"accompagner un enfant très moteur","pillarId":"presence","text":"Je vois l’élan ; maintenant on lui donne une direction qui respecte le groupe.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_6_4","category":"accompagner un enfant très moteur","context":"accompagner un enfant très moteur","pillarId":"presence","text":"Bouger peut aider, mais pas au détriment de l’espace des autres.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_6_5","category":"accompagner un enfant très moteur","context":"accompagner un enfant très moteur","pillarId":"presence","text":"Ton énergie est une force quand elle apprend à écouter le cadre.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_6_6","category":"accompagner un enfant très moteur","context":"accompagner un enfant très moteur","pillarId":"presence","text":"Prends le rôle actif, puis reviens au point calme.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_6_7","category":"accompagner un enfant très moteur","context":"accompagner un enfant très moteur","pillarId":"presence","text":"On va alterner mouvement et pause.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_6_8","category":"accompagner un enfant très moteur","context":"accompagner un enfant très moteur","pillarId":"presence","text":"Ton corps peut participer sans prendre toute la place.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_7_1","category":"aider à dire non","context":"aider à dire non","pillarId":"limites","text":"Ton non est une information précieuse.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_7_2","category":"aider à dire non","context":"aider à dire non","pillarId":"limites","text":"Tu peux dire “pas maintenant” si “non” est trop grand.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_7_3","category":"aider à dire non","context":"aider à dire non","pillarId":"limites","text":"Ton corps a le droit d’être écouté.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_7_4","category":"aider à dire non","context":"aider à dire non","pillarId":"limites","text":"Un vrai oui ne naît pas de la pression.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_7_5","category":"aider à dire non","context":"aider à dire non","pillarId":"limites","text":"Je t’accompagne pendant que tu poses ta limite.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_7_6","category":"aider à dire non","context":"aider à dire non","pillarId":"limites","text":"Tu peux changer d’avis.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_7_7","category":"aider à dire non","context":"aider à dire non","pillarId":"limites","text":"Respecter ton non aide aussi les autres à apprendre le respect.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_7_8","category":"aider à dire non","context":"aider à dire non","pillarId":"limites","text":"Nous allons chercher une phrase courte pour protéger ton espace.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_8_1","category":"apaiser un groupe agité","context":"apaiser un groupe agité","pillarId":"presence","text":"Avant de parler, nous allons remettre les corps dans la pièce.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_8_2","category":"apaiser un groupe agité","context":"apaiser un groupe agité","pillarId":"presence","text":"Le groupe a besoin de ralentir pour que chacun retrouve sa place.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_8_3","category":"apaiser un groupe agité","context":"apaiser un groupe agité","pillarId":"presence","text":"Nous ne cherchons pas le silence parfait, mais un espace respirable.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_8_4","category":"apaiser un groupe agité","context":"apaiser un groupe agité","pillarId":"presence","text":"Je vais réduire la consigne et clarifier la prochaine marche.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_8_5","category":"apaiser un groupe agité","context":"apaiser un groupe agité","pillarId":"presence","text":"On revient ensemble : pieds, souffle, regard, écoute.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_8_6","category":"apaiser un groupe agité","context":"apaiser un groupe agité","pillarId":"presence","text":"Le mouvement a eu sa place ; maintenant la parole peut revenir.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_8_7","category":"apaiser un groupe agité","context":"apaiser un groupe agité","pillarId":"presence","text":"Un groupe agité n’est pas un groupe mauvais, c’est un groupe qui demande un autre rythme.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_8_8","category":"apaiser un groupe agité","context":"apaiser un groupe agité","pillarId":"presence","text":"Nous allons faire court, clair et doux.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_9_1","category":"parler à un ado fermé","context":"parler à un ado fermé","pillarId":"authenticite","text":"Je ne vais pas forcer ta parole, mais je reste disponible.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_9_2","category":"parler à un ado fermé","context":"parler à un ado fermé","pillarId":"authenticite","text":"Tu as le droit de ne pas tout livrer ici.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_9_3","category":"parler à un ado fermé","context":"parler à un ado fermé","pillarId":"authenticite","text":"Je préfère une phrase vraie à une réponse attendue.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_9_4","category":"parler à un ado fermé","context":"parler à un ado fermé","pillarId":"authenticite","text":"On peut commencer par ce que tu refuses, si c’est plus clair que ce que tu veux.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_9_5","category":"parler à un ado fermé","context":"parler à un ado fermé","pillarId":"authenticite","text":"Je respecte ton espace, et je garde le lien ouvert.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_9_6","category":"parler à un ado fermé","context":"parler à un ado fermé","pillarId":"authenticite","text":"Tu peux écrire au lieu de parler.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_9_7","category":"parler à un ado fermé","context":"parler à un ado fermé","pillarId":"authenticite","text":"Je ne cherche pas à gagner contre toi ; je cherche le passage juste.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_9_8","category":"parler à un ado fermé","context":"parler à un ado fermé","pillarId":"authenticite","text":"Ton silence peut être une protection ; regardons s’il peut devenir un choix libre.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_10_1","category":"développer le discernement","context":"développer le discernement","pillarId":"discernement","text":"Accueillons cette idée sans la transformer trop vite en certitude.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_10_2","category":"développer le discernement","context":"développer le discernement","pillarId":"discernement","text":"Qu’est-ce qui est vu, supposé, ressenti ou à vérifier ?","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_10_3","category":"développer le discernement","context":"développer le discernement","pillarId":"discernement","text":"Une question honnête n’est pas une attaque.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_10_4","category":"développer le discernement","context":"développer le discernement","pillarId":"discernement","text":"Tu peux changer d’avis quand de nouvelles informations arrivent.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_10_5","category":"développer le discernement","context":"développer le discernement","pillarId":"discernement","text":"La peur parle fort ; vérifions si elle dit vrai.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socle_phrase_10_6","category":"développer le discernement","context":"développer le discernement","pillarId":"discernement","text":"Cherchons plusieurs angles avant de conclure.","intention":"Guider sans étiqueter, soutenir la prochaine marche et protéger la dignité de l’enfant."},{"id":"socl
