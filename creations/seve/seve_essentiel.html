 classActive(){return this.state.classes.find(c=>c.id===this.state.activeClassId)||this.state.classes[0];},childrenActive(){return this.state.children.filter(c=>!c.archived&&c.classId===this.state.activeClassId);},childrenArchived(){return this.state.children.filter(c=>c.archived&&c.classId===this.state.activeClassId);},child(id){return this.state.children.find(c=>c.id===id);},pillar(id){return PILLARS.find(p=>p.id===id)||PILLARS[0];},obsForChild(id){return this.state.observations.filter(o=>o.childId===id).sort((a,b)=>b.date.localeCompare(a.date));},obsActiveClass(){const ids=new Set(this.state.children.filter(c=>c.classId===this.state.activeClassId).map(c=>c.id));return this.state.observations.filter(o=>ids.has(o.childId)).sort((a,b)=>b.date.localeCompare(a.date));},lessonsActiveClass(){const ids=new Set(this.state.children.filter(c=>c.classId===this.state.activeClassId).map(c=>c.id));return this.state.lessons.filter(l=>!l.childId||ids.has(l.childId)).sort((a,b)=>b.date.localeCompare(a.date));},classNameForChild(c){return this.state.classes.find(x=>x.id===c?.classId)?.name||'Classe inconnue';},setJournalScope(scope){this.journalScope=scope==='all'?'all':'class';this.render();},setLessonScope(scope){this.lessonScope=scope==='all'?'all':'class';this.render();},
 levelLabel(n){return ['Non observé','Graine','Bourgeon','Fleur','Fruit'][Number(n)||0]||'Non observé';},reduceNum(n,keepMasters=true){n=String(n).replace(/\D/g,'').split('').reduce((a,b)=>a+Number(b),0);while(n>9&&!(keepMasters&&[11,22,33].includes(n)))n=String(n).split('').reduce((a,b)=>a+Number(b),0);return n;},lifePath(date){if(!date)return null;const digits=date.replace(/\D/g,'');if(digits.length<8)return null;return this.reduceNum(digits,true);},dayNumber(date){if(!date)return null;const d=new Date(date+'T00:00:00');if(isNaN(d))return null;return this.reduceNum(String(d.getDate()),true);},personalYear(date,year=(new Date()).getFullYear()){if(!date)return null;const d=new Date(date+'T00:00:00');if(isNaN(d))return null;return this.reduceNum(String(d.getDate())+String(d.getMonth()+1)+String(year),false);},
 simpleOrientation(c){const lp=this.lifePath(c.birthDate),lines=[];let short='Commencer par une observation simple : ce qui nourrit, ferme ou apaise l’enfant.';if(lp){const text=LIFE_PATHS[lp]||'dynamique à observer avec prudence.';lines.push(`Date de naissance — chemin ${lp} : ${text}`);short=`Chemin ${lp} : ${text}`;}if(c.hdType){const text=HD_TYPES[c.hdType]||'rythme à observer sans conclure.';lines.push(`Design Humain — ${c.hdType} : ${text}`);short=lp?`Chemin ${lp} + ${c.hdType} : chercher le bon rythme d’accompagnement.`:`${c.hdType} : ${text}`;}const nextByType={"Générateur":"Proposer deux choix concrets et observer ce qui allume l’élan.","Générateur Manifesteur":"Laisser tester brièvement, puis aider à terminer ou ajuster sans culpabiliser.","Projecteur":"Donner une reconnaissance précise avant de demander un effort.","Manifesteur":"Prévenir clairement le cadre, puis laisser une part d’initiative.","Réflecteur":"Observer l’influence du groupe, du lieu et du rythme avant de conclure."};const next=nextByType[c.hdType]||(lp?'Choisir une petite marche liée à cette dynamique, puis vérifier dans les faits.':'Noter un fait précis avant de proposer une marche.');return{short,lines,next};},
 splitList(s){return String(s||'').split(',').map(x=>x.trim()).filter(Boolean);},initials(name){const p=String(name||'É').trim().split(/\s+/);return (p[0]?.[0]||'É').toUpperCase()+(p.length>1?(p[p.length-1][0]||'').toUpperCase():'');},pillarCoverage(c){return Object.values(c.pillars||{}).map(Number).filter(v=>v>0).length;},levelDistribution(kids,pid){const counts=[0,0,0,0,0];kids.forEach(c=>{const v=Number(c.pillars?.[pid]||0);if(v>=1&&v<=4)counts[v]++;});return counts;},distributionHtml(counts){const labels=['','Graine','Bourgeon','Fleur','Fruit'];const parts=[1,2,3,4].filter(n=>counts[n]).map(n=>`<span>${labels[n]} <b>${counts[n]}</b></span>`);return parts.length?`<div class="state-counts">${parts.join('')}</div>`:`<div class="state-counts"><span>Aucun niveau renseigné</span></div>`;},toneClass(color){return color==='blue'?'river':color==='gold'?'gold':color==='red'?'rose':'leaf';},pageHead(eyebrow,title,desc,actions=''){return `<section class="page-head"><div class="page-title"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${actions?`<div class="page-actions no-print">${actions}</div>`:''}</section>`;},empty(icon,title,text,action=''){return `<div class="empty"><div class="empty-icon" aria-hidden="true">${this.icon(icon)}</div><strong>${title}</strong><div>${text}</div>${action?`<div style="margin-top:12px">${action}</div>`:''}</div>`;},

· leçon générale'}</div></div></div>${l.intention?`<div class="lesson-intention"><strong>Intention :</strong> ${this.esc(l.intention)}</div>`:''}${l.steps?`<div class="lesson-steps">${this.esc(l.steps)}</div>`:''}${l.phrase?`<div class="quote"><strong>Phrase adulte :</strong> ${this.esc(l.phrase)}</div>`:''}${l.trace?`<div class="record-meta" style="margin-top:10px"><strong>À observer après :</strong> ${this.esc(l.trace)}</div>`:''}</article>`;},createLessonFor(childId=''){const c=childId?this.child(childId):null,last=c?this.obsForChild(c.id)[0]:null,p=this.pillar(last?.pillarId||'presence');this.modal('Créer une leçon simple',c?`À partir du fil de ${this.esc(c.firstName)}.`:'Une activité courte autour d’une qualité humaine.',`<form onsubmit="App.saveLesson(event)"><input type="hidden" name="childId" value="${this.esc(childId)}"><div class="field"><label for="lessonTitle">Titre</label><input id="lessonTitle" name="title" value="${this.esc(last?`Petite marche — ${p.n}`:'Leçon simple de sagesse')}" required></div><div class="field" style="margin-top:12px"><label for="lessonIntention">Intention</label><textarea id="lessonIntention" name="intention">${this.esc(last?`Accompagner ${c.firstName} autour de : ${last.need||p.short}.`:'Nourrir une qualité humaine à travers une expérience courte.')}</textarea></div><div class="field" style="margin-top:12px"><label for="lessonSteps">Déroulé très simple</label><textarea id="lessonSteps" name="steps">${this.esc('1. Ouvrir par une phrase douce.\n2. Proposer une activité courte liée au vécu.\n3. Laisser une trace : parole, dessin, geste ou choix.\n4. Clore par une petite marche.')}</textarea></div><div class="form-grid" style="margin-top:12px"><div class="field"><label for="lessonPhrase">Phrase adulte</label><textarea id="lessonPhrase" name="phrase">${this.esc(last?.advice||'Nous n’avons pas besoin de réussir parfaitement. Nous cherchons la petite marche juste.')}</textarea></div><div class="field"><label for="lessonTrace">À observe  view_donnees(){const json=JSON.stringify(this.state),size=new Blob([json]).size;return `${this.pageHead('Autonomie','Données & sauvegardes','Tout reste dans ce fichier et dans le stockage local du navigateur. Aucun compte ni connexion réseau ne sont nécessaires.')}<section class="panel panel-pad"><div class="data-stats"><div class="data-stat"><strong>${(size/1024).toFixed(1)} Ko</strong><span>taille locale estimée</span></div><div class="data-stat"><strong>${this.state.classes.length}</strong><span>classe${this.state.classes.length>1?'s':''}</span></div><div class="data-stat"><strong>${this.state.children.length}</strong><span>élèves, archivés inclus</span></div><div class="data-stat"><strong>${this.state.observations.length}</strong><span>observations</span></div></div><div class="notice" style="margin-top:12px"><strong>Version de données :</strong> ${APP_VERSION}. Les données de v0.2.alpha, v0.1.alpha et de l’ancienne clé « seve_essentiel_v1 » peuvent être migrées automatiquement sans effacer leurs clés historiques.</div><div class="toolbar no-print" style="margin-top:14px"><button class="btn primary" onclick="App.exportData()">${this.icon('download')}Télécharger une sauvegarde</button><label class="btn" for="restoreFile">${this.icon('restore')}Restaurer un JSON<input id="restoreFile" class="hide" type="file" accept="application/json,.json" onchange="App.importData(event)"></label><button class="btn" onclick="window.print()">${this.icon('print')}Imprimer / PDF</button><button class="btn danger" onclick="App.reset()">Réinitialiser</button></div></section><section class="panel panel-pad section-gap"><div class="section-title"><div><h3>Ce qui est sauvegardé</h3><p>Le cycle export → import doit reproduire le même état fonctionnel.</p></div></div><div class="grid three"><div class="notice"><strong>Classe & élèves</strong><br>Identité pratique, besoins, intérêts, niveaux de sagesses et champs optionnels.</div><div class="notice"><strong>Journal</strong><br>Dates, faits, types, besoins possibles, soutiens, conseils et petites marches.</div><div class="notice"><strong>Leçons</strong><br>Intention, déroulé, phrase adulte et trace à observer.</div></div></section><section class="panel panel-pad section-gap"><div class="section-title"><div><h3>Passer ensuite à Sève complet</h3><p>Cette version sert de porte d’entrée.</p></div></div><p style="margin:0;color:var(--muted)">Quand l’enseignant se sent à l’aise, la version complète permet d’aller plus loin : packs, référentiel détaillé, formation, rapports avancés, miroirs symboliques approfondis.</p></section>`;},exportData(){const blob=new Blob([JSON.stringify(this.state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='seve_essentiel_v0_2_1_alpha_sauvegarde_'+this.todayLocal()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0);this.toast('Sauvegarde JSON préparée.');},importData(ev){const file=ev.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result),validation=this.validateImportData(data);if(!validation.ok){alert(validation.message);return;}if(!confirm(`${validation.message}\n\nRestaurer cette sauvegarde ? Les données locales actuelles seront remplacées.`))return;this.state=this.migrateState(data);this.save();document.documentElement.dataset.theme=this.state.theme;this.renderChrome();this.render();this.toast('Sauvegarde restaurée.');}catch(e){alert('Fichier invalide : impossible de lire cette sauvegarde JSON.');}finally{ev.target.value='';}};reader.readAsText(file);},validateImportData(data){if(!data||typeof data!=='object'||Array.isArray(data))return{ok:false,message:'Import impossible : le fichier JSON ne contient pas une sauvegarde Sève Essentiel reconnue.'};if(String(data.schema||'').startsWith('seve.contentPack.')||data.modules)return{ok:false,message:'Ce fichier est un pack pédagogique destiné à Sève complet. Sève Essentiel reste volontairement léger et ne l’importe pas.'};const hasKnownVersion=String(data.version||'').includes('seve-essentiel'),hasCoreArrays=Array.isArray(data.classes)||Array.isArray(data.children)||Array.isArray(data.observations)||Array.isArray(data.lessons);if(!hasKnownVersion&&!hasCoreArrays)return{ok:false,message:'Import impossible : le fichier ne ressemble pas à une sauvegarde Sève Essentiel.'};if(unsafeIdentifierPaths(data).length)return{ok:false,message:'Import refusé : un ou plusieurs identifiants contiennent des caractères non autorisés.'};const classes=Array.isArray(data.classes)?data.classes.length:0,children=Array.isArray(data.children)?data.children.length:0,observations=Array.isArray(data.observations)?data.observations.length:0,lessons=Array.isArray(data.lessons)?data.lessons.length:0;return{ok:true,message:`Sauvegarde détectée : ${classes} classe(s), ${children} élève(s), ${observations} observation(s), ${lessons} leçon(s).`};},reset(){if(confirm('Réinitialiser cette version de Sève Essentiel ? Les sauvegardes téléchargées et les anciennes clés locales ne seront pas supprimées.')){this.state=this.clone(DEFAULT_STATE);this.journalScope='class';this.lessonScope='class';document.documentElement.dataset.theme=this.state.theme;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(this.state));}catch(e){alert('Impossible d’écrire l’état vierge dans le stockage local. Télécharge une sauvegarde avant de poursuivre.');return;}this.renderChrome();this.render();this.toast('Version actuelle réinitialisée ; les données historiques restent intactes.');}},
 openHelp(){this.modal('Comment utiliser Sève Essentiel ?','Un outil d’observation et de continuité pédagogique, pensé pour rester simple.',`<div class="quick-path"><div class="path-step"><span class="step-no">1</span><strong>Classe</strong><span>Ajoute les élèves puis complète seulement ce qui devient utile.</span></div><div class="path-step"><span class="step-no">2</span><strong>Journal</strong><span>Note un fait, puis une hypothèse de besoin et une petite marche.</span></div><div class="path-step"><span class="step-no">3</span><strong>Guidance</strong><span>Relis les traces ensemble pour préparer une action ou une leçon.</span></div></div><div class="grid two" style="margin-top:12px"><div class="notice"><strong>Sagesses</strong><br>Les niveaux sont des repères d’accompagnement. « Non observé » n’est jamais un niveau faible.</div><div class="notice"><strong>Miroirs optionnels</strong><br>Date de naissance, numérologie de date et Design Humain ne sont utilisés que s’ils sont renseignés.</div></div><div class="form-actions"><button class="btn primary" onclick="App.closeModal()">J’ai compris</button></div>`);},
 modal(title,subtitle,body){this.previousFocus=document.activeElement;document.getElementById('appShell')?.setAttribute('inert','');document.getElementById('fab')?.setAttribute('inert','');document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" role="presentation" onclick="if(event.target===this)App.closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="modal-close" type="button" onclick="App.closeModal()" aria-label="Fermer">${this.icon('close')}</button></div><div class="modal-body">${body}</div></section></div>`;const m=document.querySelector('.modal');m?.addEventListener('keydown',e=>this.trapModalFocus(e));const target=m?.querySelector('.modal-body [autofocus]')||m?.querySelector('.modal-body input:not([type="hidden"]),.modal-body select,.modal-body textarea,.modal-body button,.modal-body summary')||m?.querySelector('.modal-close');target?.focus();},trapModalFocus(e){if(e.key!=='Tab')return;const m=document.querySelector('.modal');if(!m)return;const focusables=[...m.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),summary,[href],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.hidden&&el.offsetParent!==null);if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}},closeModal(){document.getElementById('modalRoot').innerHTML='';document.getElementById('appShell')?.removeAttribute('inert');document.getElementById('fab')?.removeAttribute('inert');if(this.previousFocus&&document.contains(this.previousFocus))this.previousFocus.focus();},toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${this.esc(msg)}</div>`;clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>{root.innerHTML='';},2400);}
};
