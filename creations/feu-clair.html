<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="application-name" content="Feu Clair - Soi-Libre" />
  <meta name="version" content="v0.2.alpha" />
  <meta name="description" content="Soin guidé local pour traverser une colère, rendre la charge et garder la force utile." />
  <title>Feu Clair v0.2.alpha — traverser, rendre, garder la force</title>

  <style>
    :root {
      --bg: #fbf7ef;
      --surface: #fffdf8;
      --surface-2: #f4eadf;
      --text: #2f2923;
      --muted: #756b61;
      --line: #e5d7c8;
      --accent: #c76f47;
      --accent-2: #e8b86d;
      --good: #679b78;
      --danger: #b15b5b;
      --shadow: 0 10px 28px rgba(70, 45, 25, 0.10);
      --radius: 18px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      --bg: #161412;
      --surface: #211d1a;
      --surface-2: #2c2621;
      --text: #f5eadc;
      --muted: #c9b7a2;
      --line: #44382f;
      --accent: #e08a5f;
      --accent-2: #f0c77a;
      --good: #8bc99c;
      --danger: #d07171;
      --shadow: 0 10px 28px rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, rgba(232,184,109,.22), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(199,111,71,.16), transparent 28rem),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: .72rem 1rem;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }

    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #25150d;
      font-weight: 700;
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--line);
    }

    button.ghost:hover {
      background: color-mix(in srgb, var(--surface-2) 72%, transparent);
    }

    button.danger {
      background: rgba(177,91,91,.15);
      color: var(--danger);
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 14px;
      padding: .75rem .85rem;
      outline: none;
    }

    textarea {
      min-height: 7rem;
      resize: vertical;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 1rem 0 .4rem;
    }

    small {
      color: var(--muted);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    header {
      padding: 1rem;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: .75rem;
      justify-content: space-between;
    }

    .brand h1 {
      font-size: 1.1rem;
      margin: 0;
    }

    .brand p {
      margin: .1rem 0 0;
      color: var(--muted);
      font-size: .86rem;
    }

    .app-version {
      display: inline-block;
      margin-left: .35rem;
      padding: .08rem .38rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 650;
      vertical-align: middle;
      background: color-mix(in srgb, var(--surface) 72%, transparent);
    }

    nav {
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      overflow-x: auto;
    }

    .tabs {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: .45rem;
      padding: .6rem 1rem;
    }

    .tab {
      white-space: nowrap;
      padding: .62rem .85rem;
      border-radius: 999px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
    }

    .tab.active {
      color: var(--text);
      border-color: var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    .grid {
      display: grid;
      gap: 1rem;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
    }

    .card h2, .card h3 {
      margin: 0 0 .6rem;
      color: var(--text);
    }

    h1, h2, h3, h4,
    label,
    summary,
    .choice,
    .summary,
    .notice,
    .brand h1 {
      color: var(--text);
    }

    .muted {
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
      margin-top: 1rem;
    }

    .library-panel .actions + .notice,
    .library-panel .actions + .grid,
    .library-panel .notice + details,
    .library-panel .grid + details,
    .library-panel details + details {
      margin-top: .85rem;
    }

    .library-panel details {
      padding-top: .15rem;
    }

    .sanctuary-map {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .7rem;
      margin-top: .85rem;
    }

    .sanctuary-link {
      width: 100%;
      display: grid;
      gap: .25rem;
      text-align: left;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-2) 42%, var(--surface));
      color: var(--text);
      padding: .8rem;
    }

    .sanctuary-link strong,
    .sanctuary-link span {
      display: block;
    }

    .sanctuary-link span {
      color: var(--muted);
      font-size: .86rem;
      line-height: 1.35;
    }

    .sanctuary-panel {
      padding: 0;
      overflow: hidden;
      scroll-margin-top: 8.5rem;
    }

    .sanctuary-panel > summary {
      cursor: pointer;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .25rem .75rem;
      align-items: center;
      list-style: none;
      padding: 1rem 1rem 1.15rem;
    }

    .sanctuary-panel > summary::-webkit-details-marker {
      display: none;
    }

    .sanctuary-panel > summary::after {
      content: "Déplier";
      grid-column: 2;
      grid-row: 1 / span 2;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .22rem .58rem;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.2;
      background: var(--surface);
    }

    .sanctuary-panel[open] > summary::after {
      content: "Replier";
    }

    .sanctuary-panel > summary h3,
    .sanctuary-panel > summary p,
    .sanctuary-panel > summary .summary-title,
    .sanctuary-panel > summary .summary-desc {
      display: block;
      grid-column: 1;
      margin: 0;
      max-width: 48rem;
    }

    .sanctuary-panel > summary .summary-title {
      font-size: 1.08rem;
      font-weight: 750;
    }

    .sanctuary-panel > summary p,
    .sanctuary-panel > summary .summary-desc {
      margin-top: .25rem;
      color: var(--muted);
    }

    details[data-details-key="carnet-filters"] {
      margin-top: 1.15rem;
    }

    .sanctuary-panel-body {
      padding: 0 1rem 1rem;
    }

    .sanctuary-panel-body > :first-child {
      margin-top: 0;
    }

    .understand-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .75rem;
      margin-top: .85rem;
    }

    .understand-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: .85rem;
      background: var(--surface);
    }

    .understand-card h4,
    .understand-card p {
      margin: 0;
    }

    .understand-card p + p {
      margin-top: .55rem;
    }

    .understand-details {
      display: grid;
      gap: .65rem;
      margin-top: .85rem;
    }

    .understand-details details {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: .75rem .85rem;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }

    .understand-details summary {
      cursor: pointer;
      font-weight: 700;
    }

    .understand-details details[open] summary {
      margin-bottom: .65rem;
    }

    .understand-details p,
    .understand-details ul {
      margin-top: .5rem;
      margin-bottom: .5rem;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin: .5rem 0;
    }

    .cycle-map-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
    }

    .cycle-map-card {
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent-2);
      border-radius: 14px;
      padding: .85rem;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
    }

    .cycle-map-card h4,
    .cycle-map-card p {
      margin: 0;
    }

    .cycle-map-card p + p,
    .cycle-map-card .actions {
      margin-top: .65rem;
    }

    .choice {
      display: inline-flex;
      align-items: center;
      gap: .42rem;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: .55rem .7rem;
      cursor: pointer;
      user-select: none;
    }

    .choice input {
      width: auto;
    }

    .step-shell {
      display: grid;
      gap: 1rem;
    }

    .progress {
      display: flex;
      gap: .35rem;
      overflow-x: auto;
      padding-bottom: .25rem;
    }

    .path-guide {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      flex-wrap: wrap;
      padding: .75rem .85rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
    }

    .path-guide p {
      margin: 0;
    }

    .dot {
      min-width: 2.2rem;
      height: 2.2rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface);
      font-size: .8rem;
    }

    .dot.active {
      color: #25150d;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 800;
    }

    .dot.done {
      border-color: var(--good);
      color: var(--good);
    }

    .notice {
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--accent-2) 18%, var(--surface));
      border-radius: 14px;
      padding: .85rem;
      color: var(--text);
    }

    .symbolic-suggestions {
      display: grid;
      gap: .45rem;
      margin: .85rem 0;
    }

    .symbolic-suggestion-list {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin-top: .45rem;
    }

    .symbolic-suggestion {
      flex: 1 1 13rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: .7rem .75rem;
      background: color-mix(in srgb, var(--surface) 92%, var(--accent-2) 8%);
    }

    .symbolic-suggestion strong,
    .symbolic-suggestion span {
      display: block;
    }

    .symbolic-suggestion span {
      margin-top: .22rem;
      color: var(--muted);
    }

    .archetype-group {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: .75rem;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }

    .archetype-group h4 {
      margin: 0 0 .45rem;
    }

    .symbolic-profile-note {
      display: block;
      margin: .45rem 0 .85rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .notice h3 {
      margin: 0 0 .35rem;
      font-size: 1rem;
    }

    .dangerBox {
      border-left-color: var(--danger);
      background: color-mix(in srgb, var(--danger) 16%, var(--surface));
    }

    .softBox {
      border-left-color: var(--good);
      background: color-mix(in srgb, var(--good) 14%, var(--surface));
    }

    .summary {
      white-space: pre-wrap;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      color: var(--text);
    }

    .body-map {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .55rem;
      margin-top: .7rem;
    }

    .body-zone {
      width: 100%;
      text-align: left;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      padding: .72rem .8rem;
    }

    .body-zone small {
      display: block;
      margin-top: .18rem;
    }

    .visual-body-map {
      display: grid;
      grid-template-columns: minmax(14rem, .8fr) minmax(0, 1.2fr);
      gap: 1rem;
      align-items: start;
      margin: 1rem 0;
    }

    .body-map-svg {
      width: 100%;
      max-height: 34rem;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent-2) 8%, var(--surface));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: .75rem;
    }

    .body-map-silhouette {
      fill: color-mix(in srgb, var(--surface-2) 82%, transparent);
      stroke: var(--muted);
      stroke-width: 2;
    }

    .body-map-zone {
      cursor: pointer;
      outline: none;
    }

    .body-map-zone circle,
    .body-map-zone ellipse,
    .body-map-zone path {
      fill: color-mix(in srgb, var(--accent-2) 28%, transparent);
      stroke: var(--accent);
      stroke-width: 2;
      transition: fill .15s ease, stroke-width .15s ease;
    }

    .body-map-zone:hover circle,
    .body-map-zone:hover ellipse,
    .body-map-zone:hover path,
    .body-map-zone:focus-visible circle,
    .body-map-zone:focus-visible ellipse,
    .body-map-zone:focus-visible path,
    .body-map-zone.active circle,
    .body-map-zone.active ellipse,
    .body-map-zone.active path {
      fill: color-mix(in srgb, var(--accent) 48%, transparent);
      stroke-width: 4;
    }

    .body-map-zone text {
      fill: var(--text);
      font-size: 10px;
      font-weight: 700;
      pointer-events: none;
    }

    .body-map-zone.field-zone ellipse {
      fill: none;
      stroke-width: 10;
      opacity: .55;
    }

    .body-map-zone.field-zone:hover ellipse,
    .body-map-zone.field-zone:focus-visible ellipse,
    .body-map-zone.field-zone.active ellipse,
    .body-map-zone.field-zone.linked-highlight ellipse {
      fill: none;
      stroke-width: 14;
      opacity: .9;
    }

    .body-map-zone.linked-highlight circle,
    .body-map-zone.linked-highlight ellipse,
    .body-map-zone.linked-highlight path {
      fill: color-mix(in srgb, var(--accent) 48%, transparent);
      stroke-width: 4;
    }

    .body-zone.active,
    .body-zone.linked-highlight {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent-2) 16%, var(--surface));
    }

    .body-zone.linked-highlight strong {
      color: var(--accent);
    }

    .screenless-space {
      min-height: 62vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    .screenless-space h2 {
      font-size: clamp(1.7rem, 5vw, 3rem);
      margin-bottom: .5rem;
    }

    .screenless-timer {
      font-size: clamp(2rem, 9vw, 4.5rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: .06em;
      margin: 1rem 0;
    }

    .screenless-space .actions {
      justify-content: center;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .85rem;
    }

    .tool-card {
      min-height: 10.5rem;
      width: 100%;
      display: grid;
      align-content: start;
      gap: .45rem;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .tool-card strong {
      display: block;
      font-size: 1.05rem;
      color: var(--text);
    }

    .tool-card span {
      display: block;
      color: var(--muted);
      line-height: 1.35;
    }

    .tool-card small {
      display: inline-block;
      width: fit-content;
      margin-top: .25rem;
      border-radius: 999px;
      padding: .28rem .55rem;
      background: color-mix(in srgb, var(--accent-2) 22%, var(--surface));
      color: var(--text);
    }

    .tool-card.body {
      background: color-mix(in srgb, #e6f2df 48%, var(--surface));
    }

    .tool-card.memory {
      background: color-mix(in srgb, #e8edf7 50%, var(--surface));
    }

    .tool-card.authority {
      background: color-mix(in srgb, #f7e3d5 52%, var(--surface));
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem;
    }

    .hidden {
      display: none !important;
    }

    .print-only {
      display: none;
    }

    .mini {
      font-size: .88rem;
    }

    .seal-selector {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .7rem;
      margin-top: .75rem;
    }

    .seal-choice {
      position: relative;
      min-width: 0;
      display: grid;
      grid-template-columns: 4.2rem 1fr;
      align-items: center;
      gap: .65rem;
      margin: 0;
      padding: .7rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      cursor: pointer;
    }

    .seal-choice:has(input:checked) {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent-2) 14%, var(--surface));
    }

    .seal-choice:has(input:focus-visible) {
      outline: 3px solid color-mix(in srgb, var(--accent) 65%, transparent);
      outline-offset: 2px;
    }

    .seal-choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
      opacity: 0;
    }

    .seal-choice strong,
    .seal-choice small {
      display: block;
    }

    .seal-mark {
      width: 4rem;
      height: 4rem;
      color: var(--accent);
    }

    .seal-mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .seal-display {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      align-items: center;
      gap: .9rem;
      margin: .85rem 0;
      padding: .85rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--accent-2) 10%, var(--surface));
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .seal-display .seal-mark {
      width: 5rem;
      height: 5rem;
    }

    .seal-display p {
      margin: .2rem 0 0;
    }

    .body-return-panel {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(31, 24, 19, .52);
      backdrop-filter: blur(5px);
    }

    .body-return-card {
      width: min(100%, 34rem);
      max-height: calc(100vh - 2rem);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.1rem;
      box-shadow: var(--shadow);
    }

    .body-return-card h2 {
      margin-top: 0;
    }

    .body-return-card ol {
      padding-left: 1.35rem;
    }

    .companion-view {
      max-width: 48rem;
      margin: 0 auto;
    }

    .companion-step {
      display: grid;
      gap: .75rem;
    }

    .companion-step ol {
      margin: 0;
      padding-left: 1.35rem;
    }

    .companion-reminder {
      border-left-color: var(--good);
      background: color-mix(in srgb, var(--good) 14%, var(--surface));
    }

    .print-preview {
      max-width: 52rem;
      margin: 0 auto;
    }

    .print-preview-page {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.2rem;
      box-shadow: var(--shadow);
    }

    .print-cover {
      min-height: 18rem;
      display: grid;
      place-content: center;
      text-align: center;
      break-after: page;
      page-break-after: always;
    }

    .print-document-section {
      margin: 0 0 1rem;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .print-document-section h2,
    .print-document-section h3 {

    [data-theme="dark"] button.ghost {

      border-color: color-mix(in srgb, var(--line) 82%, #000 18%);

    }

    [data-theme="dark"] button.ghost:hover {

    [data-theme="dark"] input,
    [data-theme="dark"] textarea,
    [data-theme="dark"] select,

    [data-theme="dark"] .summary,
    [data-theme="dark"] .notice {

    /* ==========================================================
       Refonte premium v0.2 — architecture adaptative Feu Clair
       Le moteur métier reste inchangé ; cette couche redéfinit
       l'espace, la hiérarchie, le responsive et les états visuels.
       ========================================================== */
    :root {
      --bg: #f6f0e8;
      --surface: #fffdf9;
      --surface-2: #f2e8dc;
      --surface-soft: #fbf6ef;
      --text: #2d2824;
      --muted: #766a60;
      --line: #dfd2c5;
      --line-strong: #cbb8a6;
      --accent: #b85f3c;
      --accent-strong: #91452d;
      --accent-2: #dfaa5f;
      --accent-soft: #f4dfc3;
      --good: #5f8e70;
      --danger: #a64f50;
      --shadow: 0 18px 50px rgba(72, 46, 27, .08);
      --shadow-soft: 0 8px 28px rgba(72, 46, 27, .06);
      --radius: 20px;
      --radius-sm: 13px;
      --content: 1180px;
      --reading: 740px;
      --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
      --primary-end: #a94f31;
      --primary-text: #fffaf5;
    }

    [data-theme="dark"] {
      --bg: #171412;
      --surface: #211c18;
      --surface-2: #2a231e;
      --surface-soft: #1c1815;
      --text: #f7ecdf;
      --muted: #c7b6a6;
      --line: #463a31;
      --line-strong: #625043;
      --accent: #e18a63;
      --accent-strong: #f3a47e;
      --accent-2: #e9bd77;
      --accent-soft: #3a2a20;
      --good: #8fc19e;
      --danger: #df8181;
      --shadow: 0 20px 54px rgba(0,0,0,.24);
      --shadow-soft: 0 8px 28px rgba(0,0,0,.18);
      --primary-end: var(--accent);
      --primary-text: #25150d;
    }

    html { scroll-behavior: smooth; }
    body {
      min-width: 320px;
      background:
        radial-gradient(circle at 8% -5%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 34rem),
        radial-gradient(circle at 96% 20%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 30rem),
        linear-gradient(180deg, color-mix(in srgb, var(--surface-soft) 70%, transparent), transparent 24rem),
        var(--bg);
      font-size: 15.5px;
      letter-spacing: .002em;
    }

    ::selection { background: color-mix(in srgb, var(--accent-2) 35%, transparent); }

    .skip-link:focus { transform: translateY(0); }

    .app { min-height: 100svh; display: block; }
    .app-header { position: sticky; top: 0; z-index: 40; padding: .72rem 1rem; border-bottom: 1px solid color-mix(in srgb, var(--line) 74%, transparent); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(18px) saturate(1.1); }

    .brand-mark svg { width: 1.42rem; height: 1.42rem; fill: currentColor; transform: rotate(4deg); }
    .brand-copy { display: grid; min-width: 0; gap: .08rem; }
    .brand-title { margin: 0; font-size: 1.05rem; font-weight: 800; line-height: 1.15; letter-spacing: -.015em; color: var(--text); }
    .brand-subtitle { color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-version { margin-left: .42rem; padding: .12rem .4rem; font-size: .62rem; letter-spacing: .04em; background: var(--surface); }
    .header-actions { display: flex; align-items: center; gap: .6rem; }
    .local-badge { display: inline-flex; align-items: center; gap: .4rem; font-size: .72rem; color: var(--muted); padding: .45rem .65rem; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
    .local-dot { width: .45rem; height: .45rem; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 14%, transparent); }
    .theme-toggle { min-width: auto; padding: .55rem .72rem; display: inline-flex; align-items: center; gap: .42rem; }
    .theme-toggle svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }

    .app-nav { position: sticky; top: 4.85rem; z-index: 35; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(16px); overflow: visible; }
    .tabs { max-width: var(--content); padding: .4rem 1rem; gap: .15rem; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { position: relative; display: inline-flex; align-items: center; gap: .45rem; min-height: 2.55rem; padding: .58rem .78rem; border: 0; border-radius: 10px; color: var(--muted); font-weight: 680; background: transparent; box-shadow: none; }
    .tab::after { content: ""; position: absolute; left: .78rem; right: .78rem; bottom: -.42rem; height: 2px; border-radius: 2px; background: transparent; }
    .tab:hover { color: var(--text); background: color-mix(in srgb, var(--surface-2) 58%, transparent); }
    .tab.active { color: var(--accent-strong); border: 0; background: color-mix(in srgb, var(--accent-soft) 52%, var(--surface)); box-shadow: none; }
    .tab.active::after { background: var(--accent); }
    .tab-icon { display: grid; place-items: center; }
    .tab-label-short { display: none; }
    .ui-icon { flex: 0 0 auto; }

    main { width: min(100%, var(--content)); max-width: none; padding: clamp(1rem, 2.2vw, 1.8rem); }
    .grid { gap: 1rem; }
    .grid.two { gap: 1rem; }

    .card { border-radius: var(--radius); border-color: color-mix(in srgb, var(--line) 86%, transparent); background: color-mix(in srgb, var(--surface) 96%, transparent); box-shadow: var(--shadow-soft); padding: clamp(1rem, 2vw, 1.35rem); }
    .card h2 { font-size: clamp(1.35rem, 2.1vw, 1.75rem); letter-spacing: -.025em; }
    .card h3 { letter-spacing: -.015em; }
    .muted { color: var(--muted); }
    .mini { font-size: .84rem; }
    .eyebrow { display: inline-block; margin-bottom: .5rem; color: var(--accent-strong); font-size: .7rem; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: .115em; }

    button { min-height: 2.6rem; border-radius: 11px; padding: .65rem .9rem; font-weight: 680; transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease; }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button.primary { background: linear-gradient(135deg, var(--accent-strong), var(--primary-end)); color: var(--primary-text); box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 21%, transparent); }
    button.primary:hover:not(:disabled) { box-shadow: 0 10px 25px color-mix(in srgb, var(--accent) 28%, transparent); }
    button.ghost { background: color-mix(in srgb, var(--surface) 76%, transparent); border: 1px solid var(--line); }
    button.danger { border-radius: 11px; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .quiet-action { min-height: auto; padding: .52rem .25rem; border-radius: 6px; color: var(--muted); background: transparent; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--muted) 38%, transparent); text-underline-offset: .2em; }
    .quiet-action:hover { color: var(--text); background: transparent; }

    input, textarea, select { border-radius: 11px; border-color: var(--line); padding: .78rem .85rem; background: color-mix(in srgb, var(--surface) 96%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
    input:hover, textarea:hover, select:hover { border-color: var(--line-strong); }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: .42rem; padding: 0; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--line) 70%, var(--surface)); box-shadow: none; accent-color: var(--accent-strong); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 1.05rem; height: 1.05rem; border: 2px solid var(--surface); border-radius: 50%; background: var(--accent-strong); box-shadow: 0 1px 5px color-mix(in srgb, var(--accent) 35%, transparent); }
    input[type="range"]::-moz-range-track { height: .42rem; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--line) 70%, var(--surface)); }
    input[type="range"]::-moz-range-thumb { width: 1rem; height: 1rem; border: 2px solid var(--surface); border-radius: 50%; background: var(--accent-strong); box-shadow: 0 1px 5px color-mix(in srgb, var(--accent) 35%, transparent); }
    label { margin-top: 1.05rem; font-size: .9rem; }
    .group-label { margin: 1.05rem 0 .4rem; color: var(--text); font-size: .9rem; font-weight: 650; }
    .choice { border-radius: 11px; padding: .62rem .72rem; }
    .actions { gap: .55rem; }
    .actions button { display: inline-flex; align-items: center; justify-content: center; gap: .42rem; }

    .notice { border-left-width: 3px; border-radius: 10px; padding: .8rem .9rem; }
    .summary { border-radius: 11px; line-height: 1.55; }

    /* Boussole */
    .orientation-space { gap: 1.15rem; }
    .orientation-hero { position: relative; isolation: isolate; min-height: 22rem; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(16rem, .75fr); align-items: center; gap: 2rem; overflow: hidden; padding: clamp(1.5rem, 4vw, 3.2rem); border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: 26px; background: linear-gradient(125deg, color-mix(in srgb, var(--surface) 98%, transparent), color-mix(in srgb, var(--accent-soft) 32%, var(--surface))); box-shadow: var(--shadow); }
    .orientation-hero::before { content: ""; position: absolute; width: 22rem; height: 22rem; right: -8rem; top: -8rem; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 68%); z-index: -1; }
    .orientation-copy { max-width: 42rem; }
    .orientation-copy h2 { margin: 0; max-width: 12ch; font-size: clamp(2.15rem, 5vw, 4.4rem); line-height: .98; letter-spacing: -.055em; font-weight: 770; }
    .orientation-copy h2 em { color: var(--accent-strong); font-family: Georgia, 'Times New Roman', serif; font-weight: 500; }
    .orientation-copy > p { max-width: 38rem; margin: 1.15rem 0 0; color: var(--muted); font-size: clamp(.98rem, 1.6vw, 1.08rem); line-height: 1.65; }
    .hero-actions { margin-top: 1.35rem; }
    .ember-orbit { position: relative; width: min(19rem, 100%); aspect-ratio: 1; margin: 0 auto; display: grid; place-items: center; }
    .ember-ring { position: absolute; inset: 10%; border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 50%; }
    .ring-two { inset: 25%; border-color: color-mix(in srgb, var(--accent-2) 34%, transparent); }
    .ember-core { width: 7.5rem; height: 7.5rem; display: grid; place-items: center; border-radius: 50% 50% 45% 55% / 60% 58% 42% 40%; color: #fff9ef; background: radial-gradient(circle at 36% 32%, #edc786, var(--accent) 48%, var(--accent-strong)); box-shadow: 0 18px 50px color-mix(in srgb, var(--accent) 32%, transparent), inset 0 1px 12px rgba(255,255,255,.2); transform: rotate(-4deg); }
    .ember-core .ui-icon { transform: rotate(4deg); }
    .orbit-word { position: absolute; padding: .28rem .52rem; color: var(--muted); font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; background: color-mix(in srgb, var(--surface) 84%, transparent); border: 1px solid var(--line); border-radius: 999px; }
    .orbit-word-a { top: 5%; left: 42%; } .orbit-word-b { right: 0; top: 56%; } .orbit-word-c { left: 5%; bottom: 10%; }
    .active-cycle-panel { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 1rem; padding: 1rem 1.15rem; border: 1px solid var(--line); border-radius: 17px; background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: var(--shadow-soft); }
    .active-cycle-panel.danger { border-color: color-mix(in srgb, var(--danger) 36%, var(--line)); }
    .active-cycle-panel.good { border-color: color-mix(in srgb, var(--good) 36%, var(--line)); }
    .active-cycle-symbol { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; border-radius: 50%; color: var(--accent-strong); background: var(--accent-soft); }
    .active-cycle-copy h3, .active-cycle-copy p { margin: 0; }
    .active-cycle-copy h3 { font-size: 1.08rem; }
    .active-cycle-copy > p { margin-top: .18rem; color: var(--muted); font-size: .84rem; }
    .active-cycle-copy .cycle-guidance { margin-top: .42rem; color: var(--text); }
    .active-cycle-actions { display: flex; align-items: center; gap: .8rem; }
    .door-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .8rem; }
    .door-card { min-height: 8.7rem; display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; align-items: start; text-align: left; padding: 1.05rem; border: 1px solid var(--line); border-radius: 17px; color: var(--text); background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: none; }
    .door-card:hover { border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); box-shadow: var(--shadow-soft); }
    .door-icon { width: 2.55rem; height: 2.55rem; display: grid; place-items: center; border-radius: 12px; color: var(--accent-strong); background: color-mix(in srgb, var(--accent-soft) 70%, var(--surface)); }
    .door-card strong, .door-card small { display: block; }
    .door-card strong { margin-top: .12rem; font-size: .98rem; }
    .door-card small { margin-top: .38rem; color: var(--muted); line-height: 1.45; font-weight: 500; }
    .door-arrow { align-self: center; color: var(--muted); }
    .clarity-note { display: flex; align-items: center; gap: .85rem; max-width: 48rem; margin: .25rem auto 0; padding: .75rem 1rem; color: var(--muted); }
    .clarity-note p { margin: .1rem 0 0; }
    .clarity-note strong { color: var(--text); }
    .clarity-mark { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; flex: 0 0 auto; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--accent-strong); font-family: Georgia, serif; font-weight: 700; }

    /* Soin : rail contextuel + étape focalisée */
    .care-workspace { display: grid; grid-template-columns: 16.5rem minmax(0,1fr); gap: clamp(1rem, 2vw, 1.5rem); align-items: start; }
    .care-workspace > .notice { grid-column: 1 / -1; }
    .care-rail { position: sticky; top: 9rem; display: grid; gap: .75rem; max-height: calc(100vh - 10rem); overflow: auto; padding: 1rem; border: 1px solid var(--line); border-radius: 18px; background: color-mix(in srgb, var(--surface) 90%, transparent); box-shadow: var(--shadow-soft); scrollbar-width: thin; }
    .care-rail-head { padding: .15rem .2rem .75rem; border-bottom: 1px solid var(--line); }
    .care-rail-head h2 { margin: 0; font-size: 1.06rem; line-height: 1.3; letter-spacing: -.02em; }
    .care-rail-head p { margin: .28rem 0 0; color: var(--muted); font-size: .78rem; }
    .current-step-beacon { display: flex; align-items: center; gap: .7rem; padding: .72rem; border-radius: 13px; color: var(--accent-strong); background: color-mix(in srgb, var(--accent-soft) 64%, var(--surface)); }

    .current-step-beacon strong { margin-top: .08rem; font-size: .84rem; }
    .rail-toggle { width: 100%; min-height: 2.3rem; color: var(--text); border: 1px solid var(--line); background: transparent; font-size: .78rem; }
    .rail-note { margin: .1rem .2rem 0; color: var(--muted); font-size: .72rem; line-height: 1.45; }
    .path-list { display: grid; gap: .22rem; overflow: visible; padding: 0; }
    .path-step.dot { width: 100%; min-width: 0; height: auto; min-height: 2.9rem; display: grid; grid-template-columns: 1.8rem minmax(0,1fr); gap: .55rem; align-items: center; padding: .42rem .5rem; border: 0; border-radius: 10px; text-align: left; color: var(--muted); background: transparent; }
    .path-step:hover { background: var(--surface-2); }
    .path-step .path-number { width: 1.65rem; height: 1.65rem; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; font-size: .7rem; font-weight: 800; }
    .path-copy small, .path-copy strong { display: block; }
    .path-copy small { font-size: .58rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .path-copy strong { margin-top: .02rem; color: inherit; font-size: .77rem; line-height: 1.2; }
    .path-step.dot.active { color: var(--accent-strong); background: color-mix(in srgb, var(--accent-soft) 58%, var(--surface)); }
    .path-step.dot.active .path-number { border-color: var(--accent); color: #fff; background: var(--accent); }
    .path-step.dot.done { color: var(--good); }
    .path-step.dot.done .path-number { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); color: var(--good); }
    .care-stage { min-width: 0; max-width: 52rem; width: 100%; margin: 0 auto; }
    .care-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .8rem; padding: .15rem .1rem; }
    .care-toolbar-context { display: grid; }
    .care-toolbar-context .step-kicker { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; }
    .care-toolbar-context strong { margin-top: .15rem; font-size: 1rem; }
    .care-toolbar-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem; }
    .icon-action { min-height: 2.35rem; display: inline-flex; align-items: center; gap: .35rem; padding: .5rem .65rem; border: 1px solid var(--line); color: var(--muted); background: color-mix(in srgb, var(--surface) 74%, transparent); font-size: .75rem; }

        { id: "r_collective_2", text: "Je réduis l’immensité à une prochaine marche possible.", family: "collective", intensity: "doux", mode: "doux", zones: ["jambes", "pieds"], masks: ["impuissance"], egregores: ["effondrement"], element: "terre", tags: ["action"], active: true },
        { id: "r_relationnel_1", text: "J’ai peut-être laissé le lien décider à la place de ma limite.", family: "limite", intensity: "moyen", mode: "doux", zones: ["poitrine", "gorge"], masks: ["gentillesse-forcee"], egregores: ["dependance-affective", "dette-affective"], element: "air", tags: ["lien", "limite"], active: true },
        { id: "r_relationnel_2", text: "Une fragilité autour de moi a peut-être été utilisée pour m’empêcher de dire non.", family: "limite", intensity: "direct", mode: "profond", zones: ["gorge", "dos"], masks: ["sauveur"], egregores: ["culpabilisation-fragilite"], element: "terre", tags: ["chantage émotionnel", "discernement"], active: true },
        { id: "r_fausse_lumiere_1", text: "La vraie paix ne me demande pas de nier ce qui a été blessé.", family: "spirituelle", intensity: "direct", mode: "profond", zones: ["poitrine", "plexus"], masks: ["pardon-premature"], egregores: ["paix-sans-verite"], element: "soleil", tags: ["fausse lumière", "vérité"], active: true },
        { id: "r_fausse_lumiere_2", text: "La douceur juste n’interdit pas la limite ; elle l’éclaire.", family: "spirituelle", intensity: "moyen", mode: "profond", zones: ["poitrine", "mains"], masks: ["spiritualisation"], egregores: ["douceur-interdit-limite"], element: "soleil", tags: ["limite", "spirituel"], active: true },
        { id: "r_corps_1", text: "Mon corps a peut-être dit non avant que ma tête ose comprendre.", family: "absorbee", intensity: "moyen", mode: "doux", zones: ["ventre", "mâchoire"], masks: ["inertie"], egregores: ["corps-controle", "gorge-verrouillee"], element: "terre", tags: ["corps", "consentement"], active: true },
        { id: "r_parole_3", text: "Ma parole n’a pas besoin d’être violente pour être ferme.", family: "parole", intensity: "doux", mode: "doux", zones: ["gorge"], masks: ["peur-rejet"], egregores: ["peur-blesser", "parole-confisquee"], element: "air", tags: ["parole", "fermeté"], active: true },
        { id: "r_addiction_1", text: "Ce comportement est peut-être une fausse porte pour un feu qui veut sortir.", family: "masquee", intensity: "direct", mode: "profond", zones: ["ventre", "mains"], masks: ["addiction"], egregores: ["anesthesie", "vide-interieur"], element: "terre", tags: ["inversion", "addiction"], active: true },
        { id: "r_jouissance_1", text: "Je distingue le plaisir vivant de l’intensité qui me vide après.", family: "masquee", intensity: "direct", mode: "profond", zones: ["ventre", "poitrine"], masks: ["jouissance-vide"], egregores: ["corps-utilise", "sexualite-blessee"], element: "eau", tags: ["discernement", "désir"], active: true },
        { id: "r_perversion_1", text: "Je ne confonds pas mon essence avec une inversion : je cherche la force saine capturée dessous.", family: "masquee", intensity: "très direct", mode: "intensif", zones: ["ventre", "plexus"], masks: ["fascination-sombre"], egregores: ["honte-corporelle", "emprise"], element: "feu", tags: ["inversion", "prudence"], active: true },
        { id: "r_enfant_3", text: "Avant les mots forts, je vérifie que la part enfant en moi est en sécurité pour entendre cela.", family: "enfant", intensity: "doux", mode: "profond", zones: ["ventre", "poitrine"], masks: ["enfant-adapte"], egregores: ["enfant-invisible"], element: "eau", tags: ["enfance", "sécurité"], active: true },
        { id: "r_collective_3", text: "Je peux voir le monde sans porter tout le monde dans mon système nerveux.", family: "collective", intensity: "doux", mode: "doux", zones: ["épaules", "dos"], masks: ["sauveur"], egregores: ["peur-mediatique", "scandale-permanent"], element: "terre", tags: ["collectif", "ancrage"], active: true },
        { id: "r_autorite_1", text: "Je rends la charge, je garde l’épée : mon autorité reste gardienne de mes actes.", family: "spirituelle", intensity: "direct", mode: "intensif", zones: ["mains", "plexus"], masks: ["vengeance"], egregores: ["guerre-spirituelle-permanente"], element: "feu", tags: ["autorité", "responsabilité"], active: true }

      family: item?.family || "",
      intensity: item?.intensity || "doux",
      mode: item?.mode || "doux",
      zones: item?.zones || [],
      masks: item?.masks || [],
      egregores: item?.egregores || [],
      element: item?.element || "",
      cue: item?.cue || "",
      tags: item?.tags || [],
      active: item?.active !== false,
      custom: item?.custom === true,
      createdAt: item?.createdAt || "",
      updatedAt: item?.updatedAt || ""
    };
  }

  function libraryItems(key, options = {}) {
    const source = data.library?.[key] ?? DEFAULT_DATA.library[key] ?? [];
    if (Array.isArray(source)) {
      return dedupeLibraryItems(source
        .map(item => normalizeLibraryItem(item, key))
        .filter(item => item.active)
        .filter(item => options.ignoreCategoryToggle || libraryCategoryEnabled(key))
        .filter(item => options.includeSensitive || itemAllowedByArchetype(item, key))
        .filter(item => options.includeSensitive || itemAllowedByAdvancedContent(item, key)));
    }
    return [];
  }

  function dedupeLibraryItems(items) {
    const seen = new Set();
    return items.filter(item => {
      const signature = slugify(item.text || item.label || item.id);
      if (!signature) return true;
      if (seen.has(signature)) return false;
      seen.add(signature);
      return true;
    });
  }

  function libraryCategoryEnabled(key) {
    if (!Object.prototype.hasOwnProperty.call(data.settings.libraryEnabled || {}, key)) return true;
    return data.settings.libraryEnabled[key] !== false;
  }

  function itemAllowedByArchetype(item, key) {
    if (activeSymbolicProfile().id !== "aucun") return true;
    const sensitiveWords = [
      "spirituel",
      "subtil",
      "éther",
      "ether",
      "signature-etrangere",
      "signature étrangère",
      "parasite",
      "programmée",
      "non alignée",
      "mikaël",
      "dragon",
      "source",
      "fausse lumière"
    ];
    const haystack = [
      key,
      item.id,
      item.label,
      item.text,
      item.family,
      item.element,
      item.mode,
      ...(item.tags || []),
      ...(item.egregores || [])
    ].join(" ").toLowerCase();
    return !sensitiveWords.some(word => haystack.includes(word));
  }

  function itemAllowedByAdvancedContent(item, key) {
    const settings = data.settings.advancedContent || DEFAULT_DATA.settings.advancedContent;
    const haystack = [
      key,
      item.id,
      item.label,
      item.text,
      item.family,
      item.intensity,
      item.mode,
      item.element,
      ...(item.tags || []),
      ...(item.masks || []),
      ...(item.egregores || [])
    ].join(" ").toLowerCase();

    const isVeryDirectWord = key === "boldWords" || (item.tags || []).includes("mots qui osent");
    if (!settings.veryDirectWords && isVeryDirectWord && (item.intensity === "très direct" || item.mode === "intensif")) return false;
    if (!settings.inversions && [
      "inversion",
      "addiction",
      "jouissance",
      "perversion",
      "fascination-sombre",
      "sexualite",
      "sexualité",
      "emprise"
    ].some(word => haystack.includes(word))) return false;
    if (!settings.childhoodDeep && [
      "enfant",
      "enfance",
      "mémoire",
      "memoire",
      "innocence"
    ].some(word => haystack.includes(word))) return false;
    if (!settings.bodyMemory && [
      "mémoire corporelle",
      "memoire corporelle",
      "toucher-non-respecte",
      "corps-utilise"
    ].some(word => haystack.includes(word))) return false;
    return true;
  }

  function libraryLabels(key) {
    return libraryItems(key).map(item => item.label || item.text).filter(Boolean);
  }

  function librarySearchResults(query) {
    const q = String(query || "").trim().toLowerCase();
    if (q.length < 2) return [];
    const groups = [
      ["Famille", libraryItems("families")],
      ["Résonance", resonanceItems()],
      ["Mot qui ose", libraryItems("boldWords")],
      ["Égrégore", libraryItems("egregores")],
      ["Masque", libraryItems("masks")],
      ["Zone", libraryItems("zones")],
      ["Sortie", libraryItems("exits")],
      ["Qualité", libraryItems("qualities")],
      ["Permission", libraryItems("permissionPhrases")],
      ["Positionnement", libraryItems("positioningPhrases")],
      ["Action / non-action", libraryItems("actionOptions")]
    ];
    return groups.flatMap(([type, items]) => items.map(item => {
      const text = item.text || item.label || "";
      const haystack = [
        text,
        item.family,
        item.intensity,
        item.mode,
        item.element,
        ...(item.tags || []),
        ...(item.zones || []),
        ...(item.masks || []),
        ...(item.egregores || [])
      ].join(" ").toLowerCase();
      return haystack.includes(q) ? { type, text, item } : null;
    }).filter(Boolean)).slice(0, 12);
  }

  function findLibraryItemById(id) {
    if (!id) return null;
    const groups = ["families", "resonance", "boldWords", "egregores", "masks", "zones", "exits", "qualities", "permissionPhrases", "positioningPhrases", "actionOptions"];
    for (const key of groups) {
      const item = libraryItems(key, { includeSensitive: true, ignoreCategoryToggle: true }).find(entry => entry.id === id);
      if (item) return item;
    }
    return null;
  }

  function editableLibraryGroups() {
    return [

      { key: "actionOptions", label: "Actions / non-actions" },

  function customLibraryItems() {
    return Object.entries(data.library || {}).flatMap(([key, items]) => (
      Array.isArray(items)
        ? items.map(item => normalizeLibraryItem(item, key)).filter(item => item.custom).map(item => ({ key, item }))
        : []
    ));

  function managedLibraryItems(key) {
    const source = Array.isArray(data.library?.[key]) ? data.library[key] : [];
    return source
      .map(item => normalizeLibraryItem(item, key))
      .sort((a, b) => Number(b.custom) - Number(a.custom));
  }

    const key = data.settings.libraryEditKey || "";

  function resonanceItems(options = {}) {
    const source = data.library?.resonance ?? DEFAULT_DATA.library.resonance;
    if (Array.isArray(source)) {
      return dedupeLibraryItems(source
        .map(item => normalizeLibraryItem(item, "resonance"))
        .filter(item => item.active)
        .filter(item => options.ignoreCategoryToggle || libraryCategoryEnabled("resonance"))
        .filter(item => options.includeSensitive || itemAllowedByArchetype(item, "resonance"))
        .filter(item => options.includeSensitive || itemAllowedByAdvancedContent(item, "resonance")));
    }

    // Compatibilité avec les anciens exports où resonance était un objet par famille.
    return Object.entries(source || {}).flatMap(([familyLabel, phrases]) => {
      const family = libraryItems("families").find(item => item.label === familyLabel || item.id === familyLabel);
      return (Array.isArray(phrases) ? phrases : []).map(text => normalizeLibraryItem({
        id: `${family?.id || slugify(familyLabel)}_${slugify(text).slice(0, 24)}`,
        text,
        family: family?.id || familyLabel,
        mode: "doux",
        intensity: "moyen",
        tags: [familyLabel],
        active: true
      }, "resonance"));
    }).filter(item => item.active)
      .filter(item => options.ignoreCategoryToggle || libraryCategoryEnabled("resonance"))
      .filter(item => options.includeSensitive || itemAllowedByArchetype(item, "resonance"))
      .filter(item => options.includeSensitive || itemAllowedByAdvancedContent(item, "resonance"));

  function activeSymbolicProfile() {
    return symbolicProfiles().find(profile => profile.id === data.settings.archetypeMode) || symbolicProfiles()[1];
  }

  function activeArchetypeIds() {
    const profile = activeSymbolicProfile();
    if (profile.id === "aucun") return [];
    if (profile.id === "personnalise") return data.settings.customArchetypeIds || [];
    return profile.archetypes || [];
  }

  function activeArchetypes() {
    const activeIds = new Set(activeArchetypeIds());
    return archetypeDefinitions().filter(archetype => activeIds.has(archetype.id));
  }

  function renderActiveSymbolicProfileNote() {
    const profile = activeSymbolicProfile();
    if (profile.id === "personnalise") return "";
    const labels = activeArchetypes().map(archetype => archetype.label);
    const text = labels.length
      ? `Contient : ${labels.join(" · ")}.`
      : "Contient : aucun archétype visible ; les formulations restent sobres, corporelles et concrètes.";
    return `<small class="symbolic-profile-note">${escapeHtml(text)}</small>`;
  }

  function symbolicContext(cycle, extras = {}) {
    const answers = cycle?.answers || {};
    return [
      extras.intent,
      extras.theme,
      extras.zone,
      extras.text,
      cycle?.title,
      cycle?.entry?.source,
      ...(cycle?.entry?.zones || []),
      answers[2]?.trigger,
      answers[2]?.against,
      answers[2]?.forWhat,
      ...(answers[2]?.families || []),
      ...(answers[3]?.bodySignals || []),
      ...(answers[4]?.ownership || []),
      answers[7]?.whatIReturn,
      answers[7]?.element,
      answers[8]?.innerBoundary,
      answers[9]?.nextGentleStep
    ].filter(Boolean).join(" ").toLowerCase();
  }

  function getSuggestedArchetypes(context = {}) {
    const available = activeArchetypes();
    if (!available.length) return [];
    const haystack = String(context.text || "").toLowerCase();
    const forced = [];
    const addForced = ids => ids.forEach(id => {
      const archetype = available.find(item => item.id === id);
      if (archetype && !forced.some(item => item.id === id)) forced.push(archetype);
    });

    if (/gorge|parole|cri|silence/.test(haystack)) addForced(["air", "eau", "mikael"]);
    if (/ventre/.test(haystack)) addForced(["terre", "dragon", "eau"]);
    if (/dos|épaules|epaules/.test(haystack)) addForced(["terre", "arbre", "ancetres-lumineux"]);
    if (/mains/.test(haystack)) addForced(["feu-clair", "mikael", "dragon"]);
    if (/injustice|vérité|verite/.test(haystack)) addForced(["soleil", "feu-clair", "mikael"]);
    if (/enfant|enfance/.test(haystack)) addForced(["eau", "enfant-interieur", "adulte-protecteur"]);
    if (/absorb|collectif/.test(haystack)) addForced(["terre", "ether", "source", "montagne", "abeille"]);
    if (/lignée|lignee|familial|ancêtre|ancetre/.test(haystack)) addForced(["terre", "ancetres-lumineux", "lignee-apaisee"]);
    if (/mémoire|memoire/.test(haystack)) addForced(["terre", "gardien-seuil", "cercle-protection"]);
    if (/autorité|autorite|emprise|lien|inversion/.test(haystack)) addForced(["feu-clair", "mikael", "dragon"]);
    if (/transmutation|profond|inversion/.test(haystack)) addForced(["feu-clair", "kali-mahakali", "phenix"]);
    if (/intégration|integration|clôture|cloture/.test(haystack)) addForced(["eau", "fleur-vie", "source", "phenix"]);
    if (/confusion|mental|tête|tete/.test(haystack)) addForced(["air", "cube-metatron", "montagne"]);

    const scored = available.map(archetype => ({
      archetype,
      score: (archetype.cues || []).reduce((sum, cue) => sum + (haystack.includes(cue.toLowerCase()) ? 1 : 0), 0)
    })).filter(item => item.score > 0).sort((a, b) => b.score - a.score).map(item => item.archetype);
    return [...forced, ...scored, ...available]
      .filter((item, index, list) => list.findIndex(candidate => candidate.id === item.id) === index)
      .slice(0, 3);
  }

  function getSymbolicPhrase(intent, archetypeId) {
    const archetype = archetypeDefinitions().find(item => item.id === archetypeId);
    if (!archetype) return "";
    return archetype.phrases?.[intent]
      || archetype.phrases?.restitution
      || archetype.phrases?.stabilization
      || Object.values(archetype.phrases || {})[0]
      || "";
  }

  function renderSymbolicSuggestions(intent, cycle, extras = {}) {
    const contextText = symbolicContext(cycle, { ...extras, intent });
    const suggestions = getSuggestedArchetypes({ text: contextText });
    if (!suggestions.length) return "";
    return `
      <div class="notice mini symbolic-suggestions">
        <strong>Symboles proposés pour cette étape : ${suggestions.map(item => escapeHtml(item.label)).join(" · ")}</strong>
        <div class="symbolic-suggestion-list">
          ${suggestions.map(item => `
            <div class="symbolic-suggestion">
              <strong>${escapeHtml(item.label)}</strong>
              <span>${escapeHtml(getSymbolicPhrase(intent, item.id))}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

    const answers = cycle.answers || {};
    return [

      ...(answers[3]?.bodySignals || []),
      answers[7]?.element,
      ...(answers[7]?.qualities || []),
      answers[8]?.innerBoundary,
      answers[8]?.spokenBoundary,
      answers[8]?.positioningPhrase,
      answers[8]?.action
    ].filter(Boolean).join(" ").toLocaleLowerCase("fr");
  }

  function recommendedSeals(cycle) {
    const text = cycleSealSearchText(cycle);
    const scored = sealDefinitions().map((seal, index) => ({
      seal,
      score: seal.keywords.reduce((score, keyword) => score + (text.includes(keyword) ? 1 : 0), 0),
      index
    })).sort((a, b) => b.score - a.score || a.index - b.index);
    const matched = scored.filter(item => item.score > 0).slice(0, 4).map(item => item.seal);
    return matched.length ? matched : sealDefinitions().slice(0, 4);
  }

    if (!seal) return "";
    const printHidden = data.extensionsV3?.printPreferences?.includeSeal === false ? "seal-print-hidden" : "";
    const compact = options.compact === true ? "mini" : "";
    return `
      <div class="seal-display ${printHidden} ${compact}" role="img" aria-label="${escapeAttr(`Sceau ${seal.label} : ${seal.description}`)}">
        <div class="seal-mark">${sealSvg(seal.id)}</div>
        <div>
          <strong>Sceau d’intention : ${escapeHtml(seal.label)}</strong>
          <p class="muted mini">${escapeHtml(seal.description)} Ce symbole représente une intention gardée, pas une preuve de guérison.</p>
        </div>
      </div>
    `;
  }

  function renderSealSelector(cycle, selectedId = "") {
    const current = sealDefinition(selectedId);

    if (current && !suggestions.some(seal => seal.id === current.id)) suggestions.unshift(current);
    return `
      <div class="notice mini">
        Le sceau est facultatif. Il représente une qualité ou une intention gardée après le soin, sans promesse de protection ni verdict.
      </div>
      <div class="seal-selector" data-radio-group="sealId">

    const s = cycle.answers || {};
    const missing = [];
    if (!s[5]?.trueName && !s[5]?.rootName) missing.push("un nom du feu");
    if (!s[7]?.whatIReturn) missing.push("ce qui est rendu");
    if (!Array.isArray(s[7]?.qualities) || !s[7].qualities.length) missing.push("une qualité récupérée");
    if (!s[8]?.innerBoundary && !s[8]?.action) missing.push("une limite, action ou non-action");
    if (!s[9]?.closingPhrase && !s[9]?.closingPreset) missing.push("une phrase de clôture");
    return missing;
  }

  function cycleMiniSummary(c) {
    const s = c.answers || {};
    const a5 = s[5] || {};
    const a7 = s[7] || {};
    const a8 = s[8] || {};
    return [
      a5.trueName || a5.rootName ? `Feu : ${a5.trueName || a5.rootName}` : "",
      a7.whatIReturn ? `Rendu : ${a7.whatIReturn}` : "",
      Array.isArray(a7.qualities) && a7.qualities.length ? `Récupéré : ${a7.qualities.join(", ")}` : "",
      a8.action || a8.actionOption ? `Prochaine marche : ${a8.action || a8.actionOption}` : ""
    ].filter(Boolean).join("\n");

  function carnetFilters() {
    data.settings.carnetFilters ||= { status: "", family: "", zone: "", quality: "" };
    return data.settings.carnetFilters;
  }

  function cycleFacetValues(cycle, facet) {
    const answers = cycle.answers || {};
    if (facet === "family") return normalizeStringArray(answers[2]?.families);
    if (facet === "zone") return [...new Set([...normalizeStringArray(cycle.entry?.zones), ...normalizeStringArray(answers[3]?.bodySignals)])];
    if (facet === "quality") return normalizeStringArray(answers[7]?.qualities);
    return [];
  }

  function carnetFilterValues(facet) {
    return [...new Set(data.cycles.flatMap(cycle => cycleFacetValues(cycle, facet)).filter(Boolean))]
      .sort((a, b) => String(a).localeCompare(String(b), "fr"));
  }

  function filteredCarnetCycles() {
    const filters = carnetFilters();
    return data.cycles.filter(cycle => (
      (!filters.status || cycle.status === filters.status)
      && (!filters.family || cycleFacetValues(cycle, "family").includes(filters.family))
      && (!filters.zone || cycleFacetValues(cycle, "zone").includes(filters.zone))
      && (!filters.quality || cycleFacetValues(cycle, "quality").includes(filters.quality))
    ));
  }

  function mostFrequentCycleValue(values) {
    const counts = new Map();
    values.filter(Boolean).forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
    return [...counts.entries()].sort((a, b) => b[1] - a[1])[0] || null;
  }

  function advancedPatternSettings() {
    data.extensionsV3.advancedPatterns ||= cloneData(DEFAULT_DATA.extensionsV3.advancedPatterns);
    data.extensionsV3.advancedPatterns.hiddenObservationIds ||= [];
    return data.extensionsV3.advancedPatterns;

  function patternObservation(id, text) {
    return { id, text };
  }

  function carnetObservations() {
    if (data.cycles.length < 2) return [];
    const observations = [];
    const family = mostFrequentCycleValue(data.cycles.flatMap(cycle => cycleFacetValues(cycle, "family")));
    const zone = mostFrequentCycleValue(data.cycles.flatMap(cycle => cycleFacetValues(cycle, "zone")));
    const quality = mostFrequentCycleValue(data.cycles.flatMap(cycle => cycleFacetValues(cycle, "quality")));
    const exit = mostFrequentCycleValue(data.cycles.map(cycle => cycle.answers?.[6]?.exit));
    const element = mostFrequentCycleValue(data.cycles.map(cycle => cycle.answers?.[7]?.element));
    const action = mostFrequentCycleValue(data.cycles.map(cycle => cycle.answers?.[8]?.actionOption));
    const openActions = data.cycles.filter(cycle => {
      const followUp = cycle.integrationFollowUp?.answers || {};
      return followUp.actionDone === "pas encore" || followUp.boundaryPlaced === "pas encore";
    }).length;

    if (family?.[1] >= 2) observations.push(patternObservation(`family-${slugify(family[0])}`, `La famille “${family[0]}” semble revenir dans plusieurs traversées. C’est une piste possible à observer doucement.`));
    if (zone?.[1] >= 2) observations.push(patternObservation(`zone-${slugify(zone[0])}`, `La zone “${zone[0]}” semble revenir comme porte d’entrée. Elle peut être écoutée sans en faire une preuve.`));
    if (exit?.[1] >= 2) observations.push(patternObservation(`exit-${slugify(exit[0])}`, `La sortie “${exit[0]}” semble avoir été choisie plusieurs fois. Elle est peut-être une ressource disponible, à vérifier selon le terrain.`));
    if (element?.[1] >= 2) observations.push(patternObservation(`element-${slugify(element[0])}`, `L’élément “${element[0]}” semble revenir dans les temps de purification. Il peut offrir un repère symbolique, à vérifier selon le terrain.`));
    if (quality?.[1] >= 2) observations.push(patternObservation(`quality-${slugify(quality[0])}`, `La qualité “${quality[0]}” semble revenir après les soins. Elle peut être un pilier à nourrir sans devenir une conclusion.`));
    if (action?.[1] >= 2) observations.push(patternObservation(`action-${slugify(action[0])}`, `L’action ou non-action “${action[0]}” semble revenir comme prochaine marche. C’est une piste possible à ajuster selon le terrain.`));
    if (openActions) observations.push(patternObservation("open-actions", "Certaines limites ou actions semblent encore ouvertes dans les suivis d’intégration. Elles peuvent être revisitées doucement, sans urgence ni jugement."));
    return observations;
  }

  function cycleMapGroups() {
    const groups = [];
    cycleMapFacetDefinitions().forEach(facet => {
      const cyclesByValue = new Map();
      data.cycles.forEach(cycle => {
        [...new Set(cycleFacetValues(cycle, facet.id).filter(Boolean))].forEach(value => {
          if (!cyclesByValue.has(value)) cyclesByValue.set(value, []);
          cyclesByValue.get(value).push(cycle);
        });
      });
      [...cyclesByValue.entries()]
        .filter(([, cycles]) => cycles.length >= 2)
        .sort((a, b) => b[1].length - a[1].length || String(a[0]).localeCompare(String(b[0]), "fr"))
        .slice(0, 2)
        .forEach(([value, cycles]) => groups.push({ facet, value, cycles }));
    });
    return groups
      .sort((a, b) => b.cycles.length - a.cycles.length || a.facet.label.localeCompare(b.facet.label, "fr"))
      .slice(0, 6);

    if (schedule === "tomorrow") date.setHours(date.getHours() + 24);

    ]));

  function redactCycleRawTexts(cycle) {
    const textKeys = [
      "intention",
      "trigger",
      "against",
      "forWhat",
      "secondaryAngers",
      "discernmentNotes",
      "falseName",
      "trueName",
      "rootName",

      "spokenBoundary",
      "action",
      "quarantineMessage",
      "closingPhrase",
      "nextGentleStep",
      "bodyScanNotes",
      "bodyMemoryNotes"
    ];
    Object.values(cycle.answers || {}).forEach(stepAnswers => {
      textKeys.forEach(key => {
        if (typeof stepAnswers[key] === "string" && stepAnswers[key].trim()) {
          stepAnswers[key] = "[texte effacé]";
        }
      });
    });
    cycle.notes = "";
    if (cycle.integrationFollowUp?.answers?.notes) cycle.integrationFollowUp.answers.notes = "[texte effacé]";
    if (cycle.coldReview && typeof cycle.coldReview === "object") {
      ["trigger", "earlySignals", "interpretation", "impulse", "actionTaken", "consequence", "choicePoint", "nextTime"].forEach(key => {
        if (typeof cycle.coldReview[key] === "string" && cycle.coldReview[key].trim()) cycle.coldReview[key] = "[texte effacé]";
      });
      cycle.coldReview.updatedAt = nowISO();
    }
    if (data.toolDraft?.coldReview?.cycleId === cycle.id) data.toolDraft.coldReview = { cycleId: cycle.id };
    cycle.updatedAt = nowISO();
  }

  function slugify(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");

  function restoreOpenDetails() {

      if (openDetailsState.has(key)) details.open = openDetailsState.get(key);

    keys.filter(Boolean).forEach(key => forcedOpenDetails.add(key));
  }

  function applyForcedDetailsState() {
    forcedOpenDetails.forEach(key => openDetailsState.set(key, true));
    forcedOpenDetails.clear();
  }

  function focusAfterRender(selector) {
    pendingFocusSelector = selector || "";
  }

  function applyPendingFocus() {
    if (!pendingFocusSelector) return;
    const selector = pendingFocusSelector;
    pendingFocusSelector = "";
    requestAnimationFrame(() => {
      const target = document.querySelector(selector);
      if (!target) return;
      if (target instanceof HTMLElement) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        if (!target.matches("button, input, select, textarea, summary, a[href], [tabindex]")) target.tabIndex = -1;
        target.focus({ preventScroll: true });
      }
    });
  }

    if (screenlessTimerId) {
      clearInterval(screenlessTimerId);
      screenlessTimerId = null;
    }
    if (groundingTimerId) {
      clearInterval(groundingTimerId);
      groundingTimerId = null;

  function enhanceRenderedAccessibility() {
    associateVisibleLabels();
    activateDialogAccessibility();

  function associateVisibleLabels() {
    document.querySelectorAll("#view label:not([for])").forEach((label, index) => {
      if (label.querySelector("input, select, textarea")) return;
      const field = label.nextElementSibling;
      if (!field?.matches("input, select, textarea")) return;
      field.id ||= `feu-clair-field-${index}`;
      label.htmlFor = field.id;
    });
  }

  function activateDialogAccessibility() {
    const dialog = document.querySelector("#view [role='dialog'][aria-modal='true']");
    if (!dialog) return;
    const focusable = [...dialog.querySelectorAll("button, input, select, textarea, [tabindex]:not([tabindex='-1'])")]
      .filter(el => !el.disabled && !el.hidden);
    if (!dialog.contains(document.activeElement)) focusable[0]?.focus();
    dialog.addEventListener("keydown", event => {
      if (event.key !== "Tab" || !focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
  }

  function rememberDialogReturnFocus() {
    dialogReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;

  function restoreDialogReturnFocus() {
    const target = dialogReturnFocus;
    dialogReturnFocus = null;
    requestAnimationFrame(() => {

  function toolRatingDefinitions() {
    return [
      { id: "grounding-live", label: "Ancrage vivant", tool: "grounding-live", icon: "anchor" },
      { id: "screenless", label: "Mode sans écran", tool: "screenless", icon: "moon" },
      { id: "body-scan", label: "Carte corporelle", tool: "body-scan", icon: "body" },
      { id: "micro", label: "Micro-soin", tab: "micro", icon: "spark" },
      { id: "memory", label: "Mémoire du Corps", tool: "memory", icon: "memory" },
      { id: "boundary-action", label: "Limite & Action", tool: "boundary-action", icon: "boundary" }
    ];
  }

  function toolRating(id) {
    return Number(personalFirePlan().toolRatings?.[id] || 0);
  }

  function ratedToolOrder(ids) {
    return [...ids].sort((a, b) => toolRating(b) - toolRating(a));
  }

  function adaptiveCheckInIsStale(check = adaptiveCheckIn()) {
    if (!check.updatedAt) return false;
    const age = Date.now() - new Date(check.updatedAt).getTime();
    return Number.isFinite(age) && age > 8 * 60 * 60 * 1000;
  }

  function adaptiveRecommendation() {
    const check = adaptiveCheckIn();
    const intensity = check.intensity === "" ? null : Number(check.intensity);
    const body = check.bodyAccess || "";
    const need = check.need || "";
    let ids = [];
    let reason = "Complète les trois repères pour obtenir une proposition locale et explicable.";

    if (adaptiveCheckInIsStale(check)) return { ready: false, ids: [], reason: "Ces repères datent d’une ancienne session. Réinitialise-les pour que la Boussole parle bien de maintenant.", stale: true };
    if (intensity === null || !body || !need) return { ready: false, ids: [], reason };

    if (intensity >= 8) {
      ids = body === "engourdi" ? ["body-scan", "grounding-live"] : ["grounding-live", "screenless"];
      reason = `Feu ${intensity}/10 : Feu Clair privilégie d’abord une baisse d’activation et le retour au corps avant l’analyse ou la décision.`;
    } else if (need === "pause") {
      ids = ["boundary-action", intensity >= 6 ? "screenless" : "micro"];
      reason = "Tu demandes surtout de ne pas agir trop vite : la zone tampon passe avant une réponse extérieure.";
    } else if (need === "limite") {
      ids = intensity >= 7 ? ["screenless", "boundary-action"] : ["boundary-action", "micro"];
      reason = intensity >= 7
        ? "La limite compte, mais le feu est encore haut : calmer d’abord aide à poser une limite qui ne soit pas conduite par l’impulsion."
        : "Le feu est suffisamment traversable pour clarifier directement le fait, la limite et le prochain acte.";
    } else if (need === "traverser") {
      ids = body === "engourdi" ? ["body-scan", "cycle"] : ["cycle", "body-scan"];
      reason = body === "engourdi"
        ? "Le corps est difficile à lire : une porte corporelle peut précéder le Cycle sans forcer le ressenti."
        : "Tu souhaites traverser et l’intensité reste dans une zone abordable : le Cycle guidé est la porte la plus complète.";
    } else if (need === "calmer") {
      ids = ratedToolOrder(["grounding-live", "screenless", "micro", "body-scan"]).slice(0, 2);

  function cycleFireReadings(cycle) {
    const inferStep = item => {
      if (Number.isFinite(Number(item?.step))) return Math.max(0, Math.min(STEPS.length - 1, Number(item.step)));
      const label = String(item?.label || "").toLowerCase();
      if (label.includes("stabil" ) || label.includes("arrivée")) return 1;
      if (label.includes("après sortie")) return 6;
      if (label.includes("restitution")) return 7;
      if (label.includes("clôture")) return 9;
      const match = label.match(/marche\s+(\d+)/);
      return match ? Math.max(0, Math.min(STEPS.length - 1, Number(match[1]) - 1)) : 0;
    };
    const manual = (Array.isArray(cycle?.fireReadings) ? cycle.fireReadings : [])
      .map((item, index) => ({ ...item, value: Number(item.value), step: inferStep(item), source: "manual", order: index }))
      .filter(item => Number.isFinite(item.value));
    const derived = [];
    const entry = cycle?.answers?.[1]?.intensity;
    const after = cycle?.answers?.[6]?.intensityAfter;
    if (entry !== undefined && entry !== "") derived.push({ id: "legacy-entry", value: Number(entry), label: "arrivée / stabilisation", step: 1, at: cycle.createdAt || "", derived: true, source: "derived", order: -2 });
    if (after !== undefined && after !== "") derived.push({ id: "legacy-exit", value: Number(after), label: "après sortie", step: 6, at: cycle.updatedAt || "", derived: true, source: "derived", order: -1 });
    const manualKeys = new Set(manual.map(item => `${item.step}:${item.value}`));
    return [...derived.filter(item => Number.isFinite(item.value) && !manualKeys.has(`${item.step}:${item.value}`)), ...manual]
      .sort((a, b) => {
        if (a.step !== b.step) return a.step - b.step;
        if (a.source !== b.source) return a.source === "derived" ? -1 : 1;
        const atA = Date.parse(a.at || "");
        const atB = Date.parse(b.at || "");
        if (Number.isFinite(atA) && Number.isFinite(atB) && atA !== atB) return atA - atB;
        return (a.order || 0) - (b.order || 0);
      })
      .slice(-8);
  }

  function fireReadingLabel(cycle) {
    const step = cycle?.currentStep ?? 0;
    if (step <= 1) return "arrivée / stabilisation";
    if (step <= 5) return `marche ${step + 1}`;
    if (step === 6) return "après sortie";
    if (step <= 8) return "après restitution";
    return "clôture";
  }

  function renderFireThermometer(cycle) {
    const readings = cycleFireReadings(cycle);
    const latest = readings.length ? Number(readings[readings.length - 1].value) : Number(cycle?.answers?.[1]?.intensity ?? 5);
    const value = Number.isFinite(latest) ? latest : 5;
    return `
      <div class="fire-thermometer">
        <div class="fire-thermometer-title"><span>${uiIcon("thermometer", 17)} Thermomètre du Feu</span><strong>${readings.length ? `${value}/10` : "—"}</strong></div>
        ${readings.length ? `<div class="fire-history" aria-label="Historique récent du thermomètre">${readings.map(item => `<span class="fire-bar" style="--fire-level:${Math.max(4, Number(item.value) * 10)}%" title="${escapeAttr(item.label)} : ${Number(item.value)}/10"><i></i><small>${Number(item.value)}</small></span>`).join("")}</div>` : `<p class="muted mini">Aucune mesure enregistrée. Le feu n’a pas besoin de baisser pour que la traversée soit juste.</p>`}
        <div class="fire-record-row">
          <input id="fire-thermometer-range" type="range" min="0" max="10" value="${value}" aria-label="Intensité du feu à noter" />
          <button class="ghost" data-action="record-fire-reading">Noter</button>
        </div>

      </div>`;
  }

  function frequencyList(values, limit = 4) {
    const counts = new Map();
    values.flat().filter(Boolean).forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
    return [...counts.entries()].sort((a,b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), "fr")).slice(0, limit).map(([label,count]) => ({label,count}));
  }

  function personalPlanInsights() {

    const qualityValues = data.cycles.map(c => c.answers?.[7]?.qualities || []);
    const actionValues = data.cycles.map(c => c.answers?.[8]?.actionOption || "").filter(Boolean);
    return {
      families: frequencyList(familyValues),
      zones: frequencyList(zoneValues),
      qualities: frequencyList(qualityValues),
      actions: frequencyList(actionValues, 3)
    };
  }
