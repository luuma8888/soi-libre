              <label>Catégories actives</label>
              <div class="pill-list">
                ${editableLibraryGroups().map(group => `
                  <label class="choice">
                    <input type="checkbox" data-library-toggle="${escapeAttr(group.key)}" ${libraryCategoryEnabled(group.key) ? "checked" : ""}>
                    ${escapeHtml(group.label)}
                  </label>
                `).join("")}
              </div>

              <label>Ajouter une entrée personnalisée</label>
              <select id="custom-library-key">
                ${editableLibraryGroups().map(group => `<option value="${escapeAttr(group.key)}">${escapeHtml(group.label)}</option>`).join("")}
              </select>

              <label>Texte ou libellé</label>
              <textarea id="custom-library-text" placeholder="Ex : Je peux poser une limite sans expliquer toute mon histoire."></textarea>

              <label>Famille associée</label>
              <select id="custom-library-family">
                <option value="">Non précisée</option>
                ${libraryItems("families", { ignoreCategoryToggle: true, includeSensitive: true }).map(item => `<option value="${escapeAttr(item.id)}">${escapeHtml(item.label)}</option>`).join("")}
              </select>

              <label>Mode recommandé</label>
              <select id="custom-library-mode">
                ${option("doux", "Doux", "doux")}
                ${option("profond", "Profond", "doux")}
                ${option("intensif", "Intensif", "doux")}
              </select>

              <div class="actions">
                <button class="primary" data-action="add-custom-library-entry">Ajouter cette entrée</button>
              </div>

              ${customLibraryItems().length ? `
                <label>Entrées personnalisées</label>
                <div class="grid">
                  ${customLibraryItems().slice(0, 12).map(({ key, item }) => `
                    <div class="notice mini">
                      <strong>${escapeHtml(libraryGroupLabel(key))}</strong><br />
                      ${escapeHtml(item.text || item.label)}
                      <div class="actions">
                        <button class="ghost" data-action="remove-custom-library-entry" data-library-key="${escapeAttr(key)}" data-library-id="${escapeAttr(item.id)}">Retirer</button>
                      </div>
                    </div>
                  `).join("")}
                </div>
              ` : `
                <div class="notice mini">Aucune entrée personnalisée pour l’instant.</div>
              `}
            </details>
          </div>

          <div class="card">
            <h3>Données locales</h3>
            <p class="muted">Les données restent dans ce navigateur, via localStorage.</p>
            <label class="choice">
              <input type="checkbox" data-privacy-setting="maskSensitiveTitles" ${data.settings.privacy?.maskSensitiveTitles ? "checked" : ""}>
              Masquer les titres sensibles dans le Carnet
            </label>
            <p class="muted mini">Le masquage protège seulement l’affichage. Les données complètes restent disponibles localement et dans l’export complet.</p>
            <div class="actions">
              <button class="primary" data-action="export-json">Exporter JSON</button>
              <button class="ghost" data-action="export-anonymized-json">Exporter anonymisé</button>
              <label class="choice">
                Importer JSON
                <input type="file" accept="application/json" data-action="import-json" style="display:none">
              </label>
              <button class="danger" data-action="reset-data">Tout effacer</button>
            </div>
          </div>
        </div>
      </section>
    `;
  }

  function buildCycleSummary(c) {
    const s = c.answers;
    const a2 = s[2] || {};
    const a3 = s[3] || {};
    const a4 = s[4] || {};
    const a5 = s[5] || {};
    const a6 = s[6] || {};
    const a7 = s[7] || {};
    const a8 = s[8] || {};
    const a9 = s[9] || {};

    return [
      `Cycle : ${c.title}`,
      ``,
      `Déclencheur : ${a2.trigger || "—"}`,
      `Contre quoi : ${a2.against || "—"}`,
      `Pour quoi : ${a2.forWhat || "—"}`,
      `Parking : ${a2.secondaryAngers || "—"}`,
      ``,
      `Familles : ${(a2.families || []).join(", ") || "—"}`,
      `Résonances : ${(a3.resonancePhrases || []).join(" / ") || "—"}`,
      `Masques : ${(a3.masks || []).join(", ") || "—"}`,
      `Appartenance : ${(a4.ownership || []).join(", ") || "—"}`,
      `Permission : ${a4.permissionPhrase || "—"}`,
      ``,
      `Vrai nom : ${a5.trueName || "—"}`,
      `Nom racine : ${a5.rootName || "—"}`,
      `Permission de nommage : ${a5.namingPermission || "—"}`,
      ``,
      `Sortie : ${a6.exit || "—"}`,
      `Phrase sortie : ${a6.exitPhrase || "—"}`,
      `Intensité après sortie : ${a6.intensityAfter || "—"}/10`,
      ``,
      `Élément : ${a7.element || "—"}`,
      `Ce que je rends : ${a7.whatIReturn || "—"}`,
      `Qualités récupérées : ${(a7.qualities || []).join(", ") || "—"}`,
      ``,
      `Limite intérieure : ${a8.innerBoundary || "—"}`,
      `Parole possible : ${a8.spokenBoundary || "—"}`,
      `Positionnement : ${a8.positioningPhrase || "—"}`,
      `Action / non-action : ${a8.action || a8.actionOption || "—"}`,
      ``,
      `Clôture : ${a9.closingPreset || a9.closingPhrase || "—"}`,
      `Intégration : ${(a9.integrationDone || []).join(", ") || "—"}`,
      `Prochaine marche douce : ${a9.nextGentleStep || "—"}`
    ].join("\n");
  }

  function bindDynamicEvents() {
    document.querySelectorAll("[data-tab]").forEach(el => {
      if (el.dataset.boundTab === "1") return;
      el.dataset.boundTab = "1";
      el.addEventListener("click", () => setTab(el.dataset.tab, el.dataset.tool || null, toolDraftFromDataset(el)));
    });

    document.querySelectorAll("[data-tool]").forEach(el => {
      if (el.dataset.tab) return;
      if (el.dataset.boundTool === "1") return;
      el.dataset.boundTool = "1";
      el.addEventListener("click", () => setTab("outils", el.dataset.tool, toolDraftFromDataset(el)));
    });

    document.querySelectorAll("[data-step]").forEach(el => {
      if (el.dataset.boundStep === "1") return;
      el.dataset.boundStep = "1";
      el.addEventListener("click", () => setStep(Number(el.dataset.step)));
    });

    document.querySelectorAll("[data-field]").forEach(el => {
      if (el.dataset.boundField === "1") return;
      el.dataset.boundField = "1";
      el.addEventListener("input", () => {
        const step = activeCycle()?.currentStep ?? 0;
        if (el.type === "checkbox") return;
        setAnswer(step, el.dataset.field, el.value);
        if (el.type === "range") render();
      });
      el.addEventListener("change", () => {
        const step = activeCycle()?.currentStep ?? 0;
        setAnswer(step, el.dataset.field, el.value);
        if (el.tagName === "SELECT" || el.type === "range") render();
      });
    });

    document.querySelectorAll("[data-check-group]").forEach(box => {
      if (box.dataset.boundCheckGroup === "1") return;
      box.dataset.boundCheckGroup = "1";
      box.addEventListener("change", () => {
        const step = activeCycle()?.currentStep ?? 0;
        const key = box.dataset.checkGroup;
        const values = [...box.querySelectorAll("input:checked")].map(i => i.value);
        setAnswer(step, key, values);
      });
    });

    document.querySelectorAll("[data-radio-group]").forEach(box => {
      if (box.dataset.boundRadioGroup === "1") return;
      box.dataset.boundRadioGroup = "1";
      box.addEventListener("change", () => {
        const step = activeCycle()?.currentStep ?? 0;
        const key = box.dataset.radioGroup;
        const selected = box.querySelector("input:checked");
        setAnswer(step, key, selected ? selected.value : "");
        render();
      });
    });

    document.querySelectorAll("[data-setting]").forEach(el => {
      if (el.dataset.boundSetting === "1") return;
      el.dataset.boundSetting = "1";
      el.addEventListener("change", () => {
        data.settings[el.dataset.setting] = el.value;
        saveData();
        render();
      });
    });

    document.querySelectorAll("[data-library-toggle]").forEach(el => {
      if (el.dataset.boundLibraryToggle === "1") return;
      el.dataset.boundLibraryToggle = "1";
      el.addEventListener("change", () => {
        data.settings.libraryEnabled ||= cloneData(DEFAULT_DATA.settings.libraryEnabled);
        data.settings.libraryEnabled[el.dataset.libraryToggle] = el.checked;
        saveData();
        render();
      });
    });

    document.querySelectorAll("[data-privacy-setting]").forEach(el => {
      if (el.dataset.boundPrivacySetting === "1") return;
      el.dataset.boundPrivacySetting = "1";
      el.addEventListener("change", () => {
        data.settings.privacy ||= cloneData(DEFAULT_DATA.settings.privacy);
        data.settings.privacy[el.dataset.privacySetting] = el.checked;
        saveData();
        render();
      });
    });

    document.querySelectorAll("[data-cycle-title]").forEach(el => {
      if (el.dataset.boundCycleTitle === "1") return;
      el.dataset.boundCycleTitle = "1";
      el.addEventListener("input", () => updateCycle({ title: el.value || "Cycle sans titre" }));
    });

    document.querySelectorAll("[data-action]").forEach(el => {
      if (el.dataset.boundAction === "1") return;
      el.dataset.boundAction = "1";
      const action = el.dataset.action;

      if (action === "import-json") {
        el.addEventListener("change", importJson);
      } else {
        el.addEventListener("click", () => handleAction(el));
      }
    });
  }

  function handleAction(el) {
    const action = el.dataset.action;

    if (action === "toggle-theme") {
      data.settings.theme = data.settings.theme === "dark" ? "light" : "dark";
      saveData();
      render();
    }

    if (action === "new-cycle") createCycle();

    if (action === "tools-list") {
      data.activeTab = "outils";
      data.activeTool = null;
      saveData();
      render();
    }

    if (action === "prev-step") setStep((activeCycle()?.currentStep || 0) - 1);

    if (action === "next-step") setStep((activeCycle()?.currentStep || 0) + 1);

    if (action === "save-and-close") {
      updateCycle({ status: "en pause" });
      setTab("boussole");
    }

    if (action === "close-cycle-soft") {
      updateCycle({ status: "fermé pour aujourd’hui" });
      setTab("boussole");
    }

    if (action === "set-numb-mode") {
      const c = activeCycle();
      if (!c) return;
      c.regulationMode = "numb";
      c.answers[1] ||= {};
      c.answers[1].regulationMode = "numb";
      c.updatedAt = nowISO();
      saveData();
      render();
    }

    if (action === "strong-close") {
      const c = activeCycle();
      if (!c) return;
      const step = c.currentStep;
      c.status = "à revisiter doucement";
      c.regulationMode = "tooActivated";
      c.answers[step] ||= {};
      c.answers[step].closedBecauseTooActivated = true;
      c.answers[9] ||= {};
      c.answers[9].closingPreset ||= "Pas plus aujourd’hui. Je ferme proprement, je garde la force, je laisse le corps intégrer.";
      c.updatedAt = nowISO();
      data.lastNotice = {
        text: "Cycle fermé proprement. Pas plus aujourd’hui : le corps peut intégrer, et ce feu pourra être revisité doucement.",
        tone: "danger",
        createdAt: nowISO()
      };
      saveData();
      setTab("boussole");
    }

    if (action === "body-return") {
      alert("Retour au corps : pieds au sol, regarde autour de toi, nomme 3 objets visibles, respire lentement, bois de l’eau si possible.");
    }

    if (action === "archive-cycle") {
      const c = activeCycle();
      if (c) {
        c.answers[9] ||= {};
        c.answers[9].closingPreset ||= c.answers[9].closingPhrase || defaultClosingPhrase();
      }
      updateCycle({ status: "à intégrer" });
      setNotice("Cycle clôturé. Cette charge est libérée maintenant ; si ce feu revient, il revient comme signal, non comme prison.");
      setTab("carnet");
    }

    if (action === "open-cycle") {
      data.activeCycleId = el.dataset.id;
      data.activeTab = "soin";
      saveData();
      render();
    }

    if (action === "review-cycle") {
      data.activeCycleId = el.dataset.id;
      const c = activeCycle();
      if (c) c.currentStep = STEPS.length - 1;
      data.activeTab = "soin";
      saveData();
      render();
    }

    if (action === "mark-complete") {
      const c = data.cycles.find(cycle => cycle.id === el.dataset.id);
      if (!c) return;
      c.status = "clôturé";
      c.updatedAt = nowISO();
      setNotice("Cycle marqué comme clôturé. La synthèse reste disponible dans le Carnet.");
      saveData();
      render();
    }

    if (action === "export-cycle-json") {
      exportCycleJson(el.dataset.id);
    }

    if (action === "export-cycle-anonymized-json") {
      exportCycleJson(el.dataset.id, { anonymized: true });
    }

    if (action === "library-search") {
      data.settings.librarySearch = document.querySelector("#library-search")?.value || "";
      saveData();
      render();
    }

    if (action === "library-search-clear") {
      data.settings.librarySearch = "";
      saveData();
      render();
    }

    if (action === "add-custom-library-entry") {
      addCustomLibraryEntry();
    }

    if (action === "remove-custom-library-entry") {
      removeCustomLibraryEntry(el.dataset.libraryKey, el.dataset.libraryId);
    }

    if (action === "start-from-library") {
      const text = el.dataset.libraryText || "";
      const type = el.dataset.libraryType || "Résonance";
      const cycle = {
        id: uid("cycle"),
        title: `${type} : ${text.slice(0, 48)}`,
        status: "ouvert",
        currentStep: 2,
        createdAt: nowISO(),
        updatedAt: nowISO(),
        answers: {
          0: {
            intention: "Explorer cette résonance comme une porte, sans en faire une preuve.",
            depth: data.settings.depth,
            regulationMode: "normal"
          },
          2: {
            trigger: text,
            forWhat: "Comprendre ce que cette phrase ou ce mot cherche à protéger.",
            families: []
          },
          3: {
            resonancePhrases: [text]
          }
        }
      };
      data.cycles.unshift(cycle);
      data.activeCycleId = cycle.id;
      data.activeTab = "soin";
      data.lastNotice = {
        text: "Cycle créé depuis une résonance. Cette phrase est une porte d’exploration, pas une preuve.",
        tone: "soft",
        createdAt: nowISO()
      };
      saveData();
      render();
    }

    if (action === "body-scan-close") {
      const scan = readBodyScan();
      data.bodyScans.unshift({ ...scan, id: uid("scan"), status: "fermé proprement", createdAt: nowISO() });
      data.lastNotice = {
        text: "Scan corporel fermé proprement. Rien n’est perdu : tu peux revenir plus tard sans ouvrir un Cycle maintenant.",
        tone: "soft",
        createdAt: nowISO()
      };
      saveData();
      setTab("boussole");
    }

    if (action === "body-scan-to-cycle") {
      const scan = readBodyScan();
      const cycle = createCycleFromBodyScan(scan);
      data.bodyScans.unshift({ ...scan, id: uid("scan"), status: "transformé en cycle", cycleId: cycle.id, createdAt: nowISO() });
      data.cycles.unshift(cycle);
      data.activeCycleId = cycle.id;
      data.activeTab = "soin";
      data.lastNotice = {
        text: cycle.currentStep === 1
          ? "Cycle créé depuis la carte corporelle. Avant de continuer, vérifions si ton feu est traversable maintenant."
          : "Cycle créé depuis la carte corporelle. La stabilité est notée, mais tu peux revenir à Stabiliser si besoin.",
        tone: cycle.currentStep === 1 ? "danger" : "soft",
        createdAt: nowISO()
      };
      saveData();
      render();
    }

    if (action === "body-scan-add-cycle") {
      const scan = readBodyScan();
      const targetId = document.querySelector("#body-scan-cycle-target")?.value;
      const cycle = data.cycles.find(c => c.id === targetId);
      if (!cycle) return;
      cycle.answers[2] ||= {};
      cycle.answers[2].bodyScanNotes = [
        cycle.answers[2].bodyScanNotes || "",
        bodyScanSummary(scan)
      ].filter(Boolean).join("\n\n");
      cycle.answers[3] ||= {};
      cycle.answers[3].bodySignals ||= [];
      if (scan.zone && !cycle.answers[3].bodySignals.includes(scan.zone)) {
        cycle.answers[3].bodySignals.push(scan.zone);
      }
      cycle.updatedAt = nowISO();
      data.bodyScans.unshift({ ...scan, id: uid("scan"), status: "ajouté à un cycle", cycleId: cycle.id, createdAt: nowISO() });
      data.lastNotice = {
        text: "Scan corporel ajouté au Cycle existant. Il reste une information, pas une preuve.",
        tone: "soft",
        createdAt: nowISO()
      };
      saveData();
      setTab("carnet");
    }

    if (action === "memory-close") {
      const memory = readBodyMemory();
      data.bodyMemorySessions.unshift({ ...memory, id: uid("memory"), status: "fermé proprement", createdAt: nowISO() });
      data.lastNotice = {
        text: "Sas Mémoire du Corps fermé proprement. Rien n’est forcé, rien n’est conclu comme preuve.",
        tone: "soft",
        createdAt: nowISO()
      };
      saveData();
      setTab("boussole");
    }

    if (action === "memory-strong-close") {
      const memory = readBodyMemory();
      data.bodyMemorySessions.unshift({ ...memory, id: uid("memory"), status: "à revisiter doucement", createdAt: nowISO() });
      data.lastNotice = {
        text: "Mémoire du Corps fermée maintenant. Pas plus aujourd’hui : ouvrir les yeux, sentir les pieds, laisser le corps intégrer.",
        tone: "danger",
        createdAt: nowISO()
      };
      saveData();
      setTab("boussole");
    }

    if (action === "memory-to-cycle") {
      const memory = readBodyMemory();
      const cycle = createCycleFromBodyMemory(memory);
      data.bodyMemorySessions.unshift({ ...memory, id: uid("memory"), status: "transformé en cycle", cycleId: cycle.id, createdAt: nowISO() });
      data.cycles.unshift(cycle);
      data.activeCycleId = cycle.id;
      data.activeTab = "soin";
      data.lastNotice = {
        text: "Cycle créé depuis le sas Mémoire du Corps. Il commence par Stabiliser pour ne pas ouvrir trop vite.",
        tone: memory.intensity >= 7 ? "danger" : "soft",
        createdAt: nowISO()
      };
      saveData();
      render();
    }

    if (action === "authority-close") {
      const session = readAuthoritySession();
      data.authoritySessions ||= [];
      data.authoritySessions.unshift({ ...session, id: uid("authority"), status: "fermé proprement", createdAt: nowISO() });
      data.lastNotice = {
        text: "Sas Feu d’Autorité fermé proprement. Le feu reste symbolique, le corps peut redescendre.",
        tone: "soft",
        createdAt: nowISO()
      };
      saveData();
      setTab("boussole");
    }

    if (action === "authority-to-cycle") {
      const session = readAuthoritySession();
      const cycle = createCycleFromAuthority(session);
      data.authoritySessions ||= [];
      data.authoritySessions.unshift({ ...session, id: uid("authority"), status: "transformé en cycle", cycleId: cycle.id, createdAt: nowISO() });
      data.cycles.unshift(cycle);
      data.activeCycleId = cycle.id;
      data.activeTab = "soin";
      data.lastNotice = {
        text: "Cycle créé depuis le Feu d’Autorité. Il commence par Stabiliser pour garder le feu symbolique et responsable.",
        tone: session.intensity >= 7 ? "danger" : "soft",
        createdAt: nowISO()
      };
      saveData();
      render();
    }

    if (action === "duplicate-cycle") {
      const source = data.cycles.find(c => c.id === el.dataset.id);
      if (!source) return;
      const copy = cloneData(source);
      copy.id = uid("cycle");
      copy.title = `${source.title} — copie`;
      copy.status = "ouvert";
      copy.createdAt = nowISO();
      copy.updatedAt = nowISO();
      data.cycles.unshift(copy);
      data.activeCycleId = copy.id;
      saveData();
      render();
    }

    if (action === "delete-cycle") {
      if (!confirm("Supprimer ce Cycle de Feu ?")) return;
      data.cycles = data.cycles.filter(c => c.id !== el.dataset.id);
      if (data.activeCycleId === el.dataset.id) data.activeCycleId = data.cycles[0]?.id || null;
      saveData();
      render();
    }

    if (action === "redact-cycle") {
      const cycle = data.cycles.find(c => c.id === el.dataset.id);
      if (!cycle) return;
      if (!confirm("Effacer les textes libres de ce Cycle ? Les choix structurés et la synthèse minimale resteront, mais les phrases écrites seront remplacées.")) return;
      redactCycleRawTexts(cycle);
      setNotice("Textes bruts effacés pour ce Cycle. Les choix structurés restent disponibles.");
      saveData();
      render();
    }

    if (action === "save-micro") {
      saveMicro(false);
    }

    if (action === "micro-to-cycle") {
      saveMicro(true);
    }

    if (action === "export-json") exportJson();

    if (action === "export-anonymized-json") exportJson({ anonymized: true });

    if (action === "reset-data") {
      if (!confirm("Tout effacer localement ? Cette action est définitive.")) return;
      localStorage.removeItem(STORAGE_KEY);
      data = normalizeData(cloneData(DEFAULT_DATA));
      render();
    }

    if (action === "print") window.print();
  }

  function saveMicro(createAsCycle) {
    const word = document.querySelector("#micro-word")?.value || "";
    const body = document.querySelector("#micro-body")?.value || "";
    const element = document.querySelector("#micro-element")?.value || "";
    const phrase = document.querySelector("#micro-phrase")?.value || "";
    const closing = document.querySelector("#micro-closing")?.value || defaultClosingPhrase();

    const micro = {
      id: uid("micro"),
      createdAt: nowISO(),
      word,
      body,
      element,
      phrase,
      closing
    };

    data.microSessions.unshift(micro);

    if (createAsCycle) {
      const cycle = {
        id: uid("cycle"),
        title: word ? `Micro-feu : ${word}` : "Cycle depuis micro-soin",
        status: "ouvert",
        currentStep: 8,
        createdAt: nowISO(),
        updatedAt: nowISO(),
        answers: {
          0: {
            intention: "Transformer ce micro-soin en Cycle de Feu sans rouvrir trop grand.",
            depth: "doux",
            regulationMode: "normal"
          },
          2: {
            trigger: word,
            forWhat: phrase,
            families: []
          },
          5: {
            trueName: word,
            rootName: `Charge ressentie dans : ${body}`
          },
          7: {
            element,
            whatIReturn: "Charge active du micro-soin",
            qualities: []
          },
          8: {
            innerBoundary: phrase
          },
          9: {
            closingPreset: closing
          }
        }
      };
      data.cycles.unshift(cycle);
      data.activeCycleId = cycle.id;
      data.activeTab = "soin";
    }

    saveData();
    render();
  }

  function addCustomLibraryEntry() {
    const key = document.querySelector("#custom-library-key")?.value || "resonance";
    const text = (document.querySelector("#custom-library-text")?.value || "").trim();
    const family = document.querySelector("#custom-library-family")?.value || "";
    const mode = document.querySelector("#custom-library-mode")?.value || "doux";

    if (!text) {
      alert("Ajout impossible : écris d’abord un texte ou un libellé.");
      return;
    }

    data.library[key] ||= [];
    const entry = normalizeLibraryItem({
      id: `custom_${key}_${slugify(text).slice(0, 36) || Date.now()}`,
      label: text,
      text,
      family,
      mode,
      intensity: mode === "intensif" ? "direct" : "doux",
      tags: ["personnalisé"],
      active: true,
      custom: true,
      createdAt: nowISO()
    }, key);

    if (data.library[key].some(item => normalizeLibraryItem(item, key).id === entry.id)) {
      entry.id = `${entry.id}_${Math.random().toString(16).slice(2, 6)}`;
    }

    data.library[key].push(entry);
    setNotice("Entrée personnalisée ajoutée au Sanctuaire. Elle reste locale et sera incluse dans l’export JSON.");
    saveData();
    render();
  }

  function removeCustomLibraryEntry(key, id) {
    if (!key || !id || !Array.isArray(data.library?.[key])) return;
    data.library[key] = data.library[key].filter(item => normalizeLibraryItem(item, key).id !== id);
    setNotice("Entrée personnalisée retirée.");
    saveData();
    render();
  }

  function exportJson(options = {}) {
    const payload = options.anonymized ? anonymizedExportData() : data;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = options.anonymized ? `feu-clair-export-anonymise-${date}.json` : `feu-clair-export-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportCycleJson(cycleId, options = {}) {
    const cycle = data.cycles.find(c => c.id === cycleId);
    if (!cycle) return;
    const payload = cycleExportData(cycle, options);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    const name = slugify(cycle.title || "cycle");
    a.href = url;
    a.download = options.anonymized
      ? `feu-clair-cycle-anonymise-${date}.json`
      : `feu-clair-cycle-${name || "cycle"}-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importJson(event) {
    const file = event.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        data = normalizeData(imported);
        saveData();
        render();
      } catch (error) {
        alert("Import impossible : fichier JSON invalide.");
      }
    };
    reader.readAsText(file);
  }

  function option(value, label, current) {
    const selected = value === current ? "selected" : "";
    return `<option value="${escapeAttr(value)}" ${selected}>${escapeHtml(label)}</option>`;
  }

  function checks(name, values, selected = []) {
    const current = Array.isArray(selected) ? selected : [];
    return `
      <div class="pill-list" data-check-group="${escapeAttr(name)}">
        ${values.map(v => `
          <label class="choice">
            <input type="checkbox" value="${escapeAttr(v)}" ${current.includes(v) ? "checked" : ""}>
            ${escapeHtml(v)}
          </label>
        `).join("")}
      </div>
    `;
  }

  function checksStatic(name, values) {
    return `
      <div class="pill-list" data-static-check-group="${escapeAttr(name)}">
        ${values.map(v => `
          <label class="choice">
            <input type="checkbox" value="${escapeAttr(v)}">
            ${escapeHtml(v)}
          </label>
        `).join("")}
      </div>
    `;
  }

  function radios(name, values, selected = "") {
    return `
      <div class="pill-list" data-radio-group="${escapeAttr(name)}">
        ${values.map(v => {
          const parsed = parseChoice(v);
          return `
          <label class="choice">
            <input type="radio" name="${escapeAttr(name)}" value="${escapeAttr(parsed.value)}" ${selected === parsed.value || selected === parsed.label ? "checked" : ""}>
            ${escapeHtml(parsed.label)}
          </label>
        `}).join("")}
      </div>
    `;
  }

  function parseChoice(value) {
    if (typeof value !== "string") return { value: String(value ?? ""), label: String(value ?? "") };
    const parts = value.split("|");
    return parts.length > 1 ? { value: parts[0], label: parts.slice(1).join("|") } : { value, label: value };
  }

  function cloneData(value) {
    if (typeof structuredClone === "function") return structuredClone(value);
    return JSON.parse(JSON.stringify(value));
  }

  function readBodyScan() {
    const flags = [...document.querySelectorAll("[data-static-check-group='body-scan-flags'] input:checked")].map(input => input.value);
    const intensityRaw = document.querySelector("#body-scan-intensity")?.value || "";
    return {
      zone: document.querySelector("#body-scan-zone")?.value || "",
      sensation: document.querySelector("#body-scan-sensation")?.value || "",
      intensity: intensityRaw === "" ? null : Number(intensityRaw),
      signal: document.querySelector("#body-scan-signal")?.value || "",
      family: document.querySelector("#body-scan-family")?.value || "",
      flags
    };
  }

  function readBodyMemory() {
    const guards = [...document.querySelectorAll("[data-static-check-group='memory-guards'] input:checked")].map(input => input.value);
    const qualities = [...document.querySelectorAll("[data-static-check-group='memory-qualities'] input:checked")].map(input => input.value);
    return {
      level: document.querySelector("#memory-level")?.value || "effleurer",
      kind: document.querySelector("#memory-kind")?.value || "mémoire corporelle",
      zone: document.querySelector("#memory-zone")?.value || "",
      intensity: Number(document.querySelector("#memory-intensity")?.value || 0),
      note: document.querySelector("#memory-note")?.value || "",
      release: document.querySelector("#memory-release")?.value || "",
      qualities,
      afterState: document.querySelector("#memory-after-state")?.value || "à intégrer doucement",
      guards
    };
  }

  function readAuthoritySession() {
    const guards = [...document.querySelectorAll("[data-static-check-group='authority-guards'] input:checked")].map(input => input.value);
    const qualities = [...document.querySelectorAll("[data-static-check-group='authority-qualities'] input:checked")].map(input => input.value);
    return {
      targetType: document.querySelector("#authority-target-type")?.value || "charge",
      note: document.querySelector("#authority-note")?.value || "",
      intensity: Number(document.querySelector("#authority-intensity")?.value || 0),
      guards,
      qualities
    };
  }

  function createCycleFromBodyMemory(memory) {
    return {
      id: uid("cycle"),
      title: `Mémoire du Corps : ${memory.zone || "sas"}`,
      status: "ouvert",
      currentStep: 1,
      createdAt: nowISO(),
      updatedAt: nowISO(),
      answers: {
        0: {
          intention: "Explorer une perception corporelle sans forcer une mémoire ni conclure à une preuve.",
          depth: memory.level === "traverser" ? "profond" : "doux",
          regulationMode: memory.intensity >= 7 ? "tooActivated" : "normal"
        },
        1: {
          intensity: memory.intensity,
          regulationMode: memory.intensity >= 7 ? "tooActivated" : "normal",
          grounding: memory.guards
        },
        2: {
          trigger: memory.zone,
          forWhat: "Discerner ce que ce signal corporel demande maintenant, sans forcer l’histoire.",
          bodyMemoryNotes: bodyMemorySummary(memory),
          families: []
        },
        4: {
          ownership: [memory.kind],
          discernmentNotes: "Sas Mémoire du Corps : perception à discerner, pas une preuve littérale."
        },
        7: {
          whatIReturn: memory.release,
          qualities: memory.qualities || []
        },
        9: {
          integrationDone: memory.afterState ? [memory.afterState] : [],
          closingPreset: memory.intensity >= 7
            ? "Pas plus aujourd’hui. Je ferme proprement, je garde la force, je laisse le corps intégrer."
            : defaultClosingPhrase()
        }
      }
    };
  }

  function bodyMemorySummary(memory) {
    return [
      `Niveau : ${memory.level}`,
      `Forme : ${memory.kind}`,
      `Zone : ${memory.zone || "—"}`,
      `Intensité : ${memory.intensity}/10`,
      `Note : ${memory.note || "—"}`,
      `Rendu possible : ${memory.release || "—"}`,
      `Qualités / parts qui reviennent : ${(memory.qualities || []).join(", ") || "—"}`,
      `État après : ${memory.afterState || "—"}`,
      `Garde-fous : ${memory.guards.join(", ") || "—"}`
    ].join("\n");
  }

  function createCycleFromAuthority(session) {
    const guarded = session.guards.includes("Je ne dirige pas ce feu contre un être vivant présent")
      && session.guards.includes("Je reste gardien de mes actes")
      && session.guards.includes("Je peux fermer maintenant");
    const needsStabilizing = session.intensity >= 7 || !guarded;
    return {
      id: uid("cycle"),
      title: `Feu d’Autorité : ${session.targetType || "charge"}`,
      status: "ouvert",
      currentStep: 1,
      createdAt: nowISO(),
      updatedAt: nowISO(),
      answers: {
        0: {
          intention: "Diriger le feu symboliquement contre une charge, jamais contre un être vivant présent.",
          depth: "profond",
          regulationMode: needsStabilizing ? "tooActivated" : "normal"
        },
        1: {
          intensity: session.intensity,
          regulationMode: needsStabilizing ? "tooActivated" : "normal",
          grounding: session.guards
        },
        2: {
          trigger: `Sas Feu d’Autorité : ${session.targetType}`,
          forWhat: "Discerner ce qui doit être rendu, coupé ou transmuté sans perdre la responsabilité des actes.",
          families: ["Colère spirituelle"],
          authorityNotes: authoritySummary(session)
        },
        4: {
          ownership: ["Signature à discerner"],
          discernmentNotes: "Feu d’Autorité : expression intérieure symbolique. Ne pas conclure à une cause unique."
        },
        7: {
          qualities: session.qualities || []
        },
        9: {
          closingPreset: "Même si une influence, une mémoire ou un champ agit en moi, je reste gardien de mes actes."
        }
      }
    };
  }

  function authoritySummary(session) {
    return [
      `Cible symbolique : ${session.targetType || "—"}`,
      `Intensité : ${session.intensity}/10`,
      `Formulation : ${session.note || "—"}`,
      `Garde-fous : ${session.guards.join(", ") || "—"}`,
      `Qualités à récupérer : ${(session.qualities || []).join(", ") || "—"}`
    ].join("\n");
  }

  function bodyScanNeedsStabilizing(scan) {
    const alertFlags = ["Confusion", "Envie de fuir", "Vide inquiétant", "Trop activé", "Je préfère fermer proprement"];
    if (scan.intensity === null) return true;
    if (scan.intensity >= 7) return true;
    if (scan.flags.some(flag => alertFlags.includes(flag))) return true;
    return !scan.flags.includes("Je me sens assez stable pour identifier doucement");
  }

  function createCycleFromBodyScan(scan) {
    const needsStabilizing = bodyScanNeedsStabilizing(scan);
    return {
      id: uid("cycle"),
      title: `Zone : ${scan.zone || "corps"}`,
      status: "ouvert",
      currentStep: needsStabilizing ? 1 : 2,
      createdAt: nowISO(),
      updatedAt: nowISO(),
      answers: {
        0: {
          intention: "Explorer une zone du corps sans forcer l’histoire.",
          depth: "doux",
          regulationMode: needsStabilizing ? "tooActivated" : "normal"
        },
        1: {
          intensity: scan.intensity ?? "",
          regulationMode: needsStabilizing ? "tooActivated" : "normal"
        },
        2: {
          trigger: scan.zone,
          forWhat: scan.signal || "Écouter ce que cette zone cherche à protéger.",
          families: scan.family ? [scan.family] : [],
          bodyScanNotes: bodyScanSummary(scan)
        },
        3: {
          bodySignals: scan.zone ? [scan.zone] : []
        }
      }
    };
  }

  function bodyScanSummary(scan) {
    return [
      `Zone : ${scan.zone || "—"}`,
      `Sensation : ${scan.sensation || "—"}`,
      `Intensité : ${scan.intensity === null ? "inconnue" : `${scan.intensity}/10`}`,
      `Signal : ${scan.signal || "—"}`,
      `Famille possible : ${scan.family || "—"}`,
      `État : ${scan.flags.join(", ") || "—"}`
    ].join("\n");
  }

  function escapeHtml(str) {
    return String(str ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(str) {
    return escapeHtml(str);
  }

  render();
})();
</script>
</body>
</html>
