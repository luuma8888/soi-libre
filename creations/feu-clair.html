          ${escapeHtml(profileText("prepareNotice"))}
        </div>
        ${renderNeutralAlternative("prepareNotice")}
      `;
    }

    if (step === 1) {
      const intensity = Number(a.intensity || 0);
      return `
        <h2>Stabiliser le feu</h2>
        <p class="muted">${escapeHtml(profileText("stabilizeIntro"))}</p>
        ${renderNeutralAlternative("stabilizeIntro")}
        ${renderSymbolicSuggestions("stabilization", cycle, { theme: "stabiliser mémoire du corps retour au corps" })}

        ${cycleHasEntrySas(cycle) ? renderEntrySas(cycle, a) : `
          <label>Intensité actuelle : <strong>${intensity}/10</strong></label>
          <input type="range" min="0" max="10" data-field="intensity" value="${intensity}" />

          ${intensity >= 8 ? `
            <div class="notice dangerBox">
              Intensité haute. Corps d’abord, analyse ensuite. Ne prends aucune décision, n’envoie aucun message, ne cherche pas encore les grandes causes.
            </div>
          ` : `
            <div class="notice">
              Intensité traversable. Tu peux continuer doucement.
            </div>
          `}
        `}

        <label>Mini-ancrage effectué ?</label>
        ${checks("grounding", [
          "Pieds au sol",
          "Respiration lente",
          "Eau bue",
          "Regard autour de moi",
          "Mains sur cœur / ventre",
          "Je choisis de ne blesser personne"
        ], a.grounding)}

        <label>Si le corps parle difficilement</label>
        ${radios("regulationMode", [
          "normal|Je peux explorer doucement",
          "numb|Je ne ressens rien",
          "tooActivated|Je suis trop activé"
        ], a.regulationMode || "normal", true)}

        ${renderRegulationNotice(cycle)}

        ${currentRegulation(cycle) === "tooActivated" ? `
          <label>Fermeture forte effectuée</label>
          ${checks("strongCloseDone", libraryItems("strongCloseSteps").map(item => item.label), a.strongCloseDone)}
        ` : ""}
      `;
    }

    if (step === 2) {
      return `
        <h2>Identifier la colère visible</h2>
        <p class="muted">${escapeHtml(profileText("identifyIntro"))}</p>
        ${renderNeutralAlternative("identifyIntro")}

        <label>Déclencheur apparent</label>
        <textarea data-field="trigger" placeholder="Ce qui a déclenché le feu...">${escapeHtml(a.trigger || "")}</textarea>

        <label>Contre quoi va ce feu ?</label>
        <textarea data-field="against" placeholder="Contre une situation, une parole, une injustice, un être, un système...">${escapeHtml(a.against || "")}</textarea>

        <label>Pour quoi se lève-t-il ?</label>
        <textarea data-field="forWhat" placeholder="Pour une limite, une dignité, une vérité, une protection...">${escapeHtml(a.forWhat || "")}</textarea>

        <label>Familles qui résonnent</label>
        ${checks("families", libraryLabels("families"), a.families)}

        <label>Colères secondaires à laisser au parking</label>
        <textarea data-field="secondaryAngers" placeholder="Autres feux aperçus, à ne pas ouvrir maintenant.">${escapeHtml(a.secondaryAngers || "")}</textarea>

        <div class="notice">
          Une seule colère suffit pour cette session. Les autres sont notées, pas perdues, pas ouvertes maintenant.
        </div>
      `;
    }

    if (step === 3) {
      const phrases = resonanceWave(cycle);
      const shown = phrases.length ? phrases : [
        "Je ne sais pas encore ce qui est là, mais mon corps peut répondre doucement.",
        "Je peux explorer par résonance sans forcer.",
        "Si rien ne bouge, cela peut être un calme, une fatigue ou un verrou."
      ];

      return `
        <h2>Éveiller la colère cachée</h2>
        <p class="muted">${escapeHtml(profileText("awakenIntro"))} Vague limitée à ${RESONANCE_WAVE_LIMIT} phrases.</p>
        ${renderNeutralAlternative("awakenIntro")}

        ${renderRegulationNotice(cycle)}

        <label>Phrases qui résonnent</label>
        ${checks("resonancePhrases", shown, a.resonancePhrases)}

        <label>Masques possibles du feu retourné</label>
        ${checks("masks", libraryLabels("masks"), a.masks)}

        <label>Ce que le corps répond</label>
        ${checks("bodySignals", [
          ...libraryLabels("zones"),
          "Larmes",
          "Froid",
          "Chaleur",
          "Vide",
          "Envie de fuir",
          "Envie de crier"
        ], a.bodySignals)}
      `;
    }

    if (step === 4) {
      return `
        <h2>Discerner ce qui m’appartient</h2>
        <p class="muted">${escapeHtml(profileText("discernIntro"))}</p>
        ${renderNeutralAlternative("discernIntro")}
        ${renderSymbolicSuggestions("responsibility", cycle, { theme: "discernement charge subtile responsabilité" })}

        <label>Appartenance ressentie</label>
        ${checks("ownership", [
          "Personnel",
          "Ancien",
          "Enfant intérieur",
          "Familial / lignée",
          "Collectif",
          "Absorbé d’un autre être",
          "Spirituel / subtil",
          "Mélangé",
          "Je ne sais pas"
        ], a.ownership)}

        <label>Questions de clarté</label>
        <textarea data-field="discernmentNotes" placeholder="Est-ce proportionné ? Est-ce ancien ? Est-ce que cela me rend plus clair ou plus confus ?">${escapeHtml(a.discernmentNotes || "")}</textarea>

        <label>Permission utile maintenant</label>
        ${radios("permissionPhrase", libraryItems("permissionPhrases").map(item => item.text), a.permissionPhrase || "")}
        <div class="notice mini">${escapeHtml(profileText("permission"))}</div>
        ${renderNeutralAlternative("permission")}

        <div class="notice">
          Même si une influence, une mémoire ou un champ agit en moi, je reste gardien de mes actes.
        </div>
      `;
    }

    if (step === 5) {
      return `
        <h2>Trouver le vrai nom</h2>
        <p class="muted">${escapeHtml(profileText("namingIntro"))}</p>
        ${renderNeutralAlternative("namingIntro")}

        <label>Faux nom possible</label>
        <input data-field="falseName" value="${escapeAttr(a.falseName || "")}" placeholder="Ex : fatigue, jalousie, addiction, paresse, agacement..." />

        <label>Nom plus vrai</label>
        <input data-field="trueName" value="${escapeAttr(a.trueName || "")}" placeholder="Ex : colère d’avoir dû me taire..." />

        <label>Nom racine</label>
        <textarea data-field="rootName" placeholder="Ex : refus de continuer à porter ce qui n’est pas à moi...">${escapeHtml(a.rootName || "")}</textarea>

        <label>Permission pour nommer sans forcer</label>
        ${radios("namingPermission", libraryItems("permissionPhrases").map(item => item.text), a.namingPermission || "")}
      `;
    }

    if (step === 6) {
      const exit = a.exit || "";
      return `
        <h2>Faire sortir le feu</h2>
        <p class="muted">${escapeHtml(profileText("exitIntro"))}</p>
        ${renderNeutralAlternative("exitIntro")}
        ${renderSymbolicSuggestions("cut", cycle, { theme: "sortir coupe parole action" })}

        <label>Porte de sortie choisie</label>
        ${radios("exit", libraryLabels("exits"), exit)}

        ${exit ? `
          <div class="notice">
            Porte choisie : <strong>${escapeHtml(exit)}</strong><br />
            Fais une vague simple. Puis reviens ici noter ce qui a changé.
          </div>
        ` : ""}

        <label>Phrase courte à faire sortir</label>
        <input data-field="exitPhrase" value="${escapeAttr(a.exitPhrase || "")}" placeholder="Ex : Non. Stop. Je rends. Je reprends. Ce n’était pas juste." />

        <label>Intensité après sortie : <strong>${Number(a.intensityAfter || 0)}/10</strong></label>
        <input type="range" min="0" max="10" data-field="intensityAfter" value="${Number(a.intensityAfter || 0)}" />
      `;
    }

    if (step === 7) {
      return `
        <h2>Purifier et rendre la charge</h2>
        <p class="muted">${escapeHtml(profileText("purifyIntro"))}</p>
        ${renderNeutralAlternative("purifyIntro")}
        ${renderSymbolicSuggestions("restitution", cycle, { theme: "restitution transmutation purification" })}

        <label>Élément de restitution</label>
        ${radios("element", libraryLabels("elements"), a.element || "")}

        <label>Ce que je rends</label>
        <textarea data-field="whatIReturn" placeholder="Honte, culpabilité, colère étrangère, obsession, charge collective...">${escapeHtml(a.whatIReturn || "")}</textarea>

        <label>Qualité récupérée</label>
        ${checks("qualities", libraryLabels("qualities"), a.qualities)}

        <div class="notice">
          ${escapeHtml(profileText("restitution"))}
        </div>
        ${renderNeutralAlternative("restitution")}
      `;
    }

    if (step === 8) {
      return `
        <h2>Se positionner dans la matière</h2>
        <p class="muted">${escapeHtml(profileText("positionIntro"))}</p>
        ${renderNeutralAlternative("positionIntro")}
        ${renderSymbolicSuggestions("integration", cycle, { theme: "positionner limite action intégration" })}

        <label>Limite intérieure</label>
        <textarea data-field="innerBoundary" placeholder="Ex : Je ne confonds plus paix et silence forcé.">${escapeHtml(a.innerBoundary || "")}</textarea>

        <label>Parole possible</label>
        <textarea data-field="spokenBoundary" placeholder="Ex : Je ne souhaite pas continuer cet échange dans ces conditions.">${escapeHtml(a.spokenBoundary || "")}</textarea>

        <label>Phrase de positionnement proposée</label>
        ${radios("positioningPhrase", libraryItems("positioningPhrases").map(item => item.text), a.positioningPhrase || "")}

        <label>Action concrète ou non-action juste</label>
        <textarea data-field="action" placeholder="Ex : ne pas répondre aujourd’hui, écrire demain, marcher, demander soutien, quitter un champ...">${escapeHtml(a.action || "")}</textarea>

        <label>Piste d’action / non-action</label>
        ${radios("actionOption", libraryItems("actionOptions").map(item => `${item.text}|${item.label}`), a.actionOption || "")}

        <label>Message en quarantaine, si besoin</label>
        <textarea data-field="quarantineMessage" placeholder="Brouillon à ne pas envoyer dans le feu.">${escapeHtml(a.quarantineMessage || "")}</textarea>
      `;
    }

    if (step === 9) {
      const summary = buildCycleSummary(cycle);
      const missing = cycleCompletionHints(cycle);
      return `
        <h2>Sceller et archiver</h2>
        <p class="muted">${escapeHtml(profileText("sealIntro"))}</p>
        ${renderNeutralAlternative("sealIntro")}
        ${renderSymbolicSuggestions("closure", cycle, { theme: "clôture intégration fin de cycle" })}

        <div class="print-only">
          <h1>${escapeHtml(cycle.title)}</h1>
          <p>Feu Clair — synthèse de cycle · ${new Date(cycle.updatedAt).toLocaleDateString("fr-FR")}</p>
        </div>

        ${data.extensionsV3?.enabled?.seals ? `
          <label>Sceau visuel local</label>
          ${renderSealSelector(cycle, a.sealId || "")}
          ${renderSealDisplay(cycle)}
        ` : ""}

        <div class="summary">${escapeHtml(summary)}</div>

        ${missing.length ? `
          <div class="notice">
            <strong>À compléter si possible, sans forcer :</strong> ${escapeHtml(missing.join(", "))}.<br />
            Tu peux quand même fermer proprement si le corps demande l’arrêt.
          </div>
        ` : `
          <div class="notice softBox">
            Les éléments essentiels sont présents pour une clôture claire.
          </div>
        `}

        <label>Phrase de clôture personnelle</label>
        <textarea data-field="closingPhrase" placeholder="Si cette énergie revient, elle revient comme signal. Je refuse l’ancien circuit.">${escapeHtml(a.closingPhrase || "")}</textarea>

        <label>Phrase de clôture proposée</label>
        ${radios("closingPreset", [...new Set([profileText("closing"), ...libraryItems("closingPhrases").map(item => item.text)])], a.closingPreset || "")}
        ${renderNeutralAlternative("closing")}

        <label>Intégration après clôture</label>
        ${checks("integrationDone", libraryItems("integrationSteps").map(item => item.label), a.integrationDone)}

        <label>Prochaine marche douce</label>
        <textarea data-field="nextGentleStep" placeholder="Ex : ne rien rouvrir aujourd’hui, dormir, imprimer la synthèse, demander soutien demain.">${escapeHtml(a.nextGentleStep || "")}</textarea>

        <select data-field="followUpPlan">
          ${option("tomorrow", "À revoir demain", a.followUpPlan || "tomorrow")}
          ${option("72h", "À revoir dans 72 heures", a.followUpPlan || "tomorrow")}
          ${option("reactivation", "À revisiter seulement si réactivation", a.followUpPlan || "tomorrow")}
          ${option("none", "Ne pas revoir automatiquement", a.followUpPlan || "tomorrow")}
        </select>
        <p class="muted mini">Aucune notification ne sera envoyée. Ce repère restera seulement visible dans le Carnet.</p>

        <div class="actions">
          <button class="primary" data-action="archive-cycle">Clôturer ce Cycle</button>
          ${data.extensionsV3?.enabled?.richPrint
            ? `<button class="ghost" data-action="open-print-preparation">Préparer impression / PDF</button>`
            : `<button class="ghost" data-action="print">Imprimer / PDF</button>`}
        </div>
      `;
    }
  }

    if (progress < .58) return { index: 1, title: "Souffle", text: "Laisse l’expiration devenir un peu plus longue, sans retenir ni forcer." };
    if (progress < .82) return { index: 2, title: "Regard", text: "Laisse les yeux rencontrer lentement trois formes, couleurs ou objets autour de toi." };
    return { index: 3, title: "Point d’appui", text: "Une main, un dossier, le sol : retrouve quelque chose de concret qui te soutient maintenant." };
  }

  function startGroundingTimerIfNeeded() {
    const timer = document.querySelector("[data-grounding-timer]");
    const d = data.toolDraft?.groundingLive;
    if (!timer || d?.phase !== "practice" || !d.startedAt) return;
    const duration = Math.max(30, Number(d.duration) || 90);
    const update = () => {
      const elapsed = Math.max(0, Math.floor((Date.now() - new Date(d.startedAt).getTime()) / 1000));
      const remaining = Math.max(0, duration - elapsed);
      const progress = Math.min(1, elapsed / duration);
      timer.textContent = `${String(Math.floor(remaining/60)).padStart(2,"0")}:${String(remaining%60).padStart(2,"0")}`;
      const cue = groundingCue(progress);
      const title = document.querySelector("[data-grounding-cue-title]");
      const text = document.querySelector("[data-grounding-cue-text]");
      if (title) title.textContent = cue.title;
      if (text) text.textContent = cue.text;
      document.querySelectorAll("[data-grounding-stage]").forEach((el,i)=>{
        el.classList.toggle("active", i===cue.index);
        el.classList.toggle("done", i<cue.index);
      });
      if (remaining === 0) {
        if (groundingTimerId) clearInterval(groundingTimerId);
        groundingTimerId = null;
        data.toolDraft.groundingLive = { ...d, phase: "return" };
        saveData();
        render();
      }
    };
    update();
    groundingTimerId = setInterval(update, 1000);
  }

        <div class="card cold-review-form"><div class="notice"><strong>Textes bruts masqués</strong><br>Réaffiche explicitement les textes du Cycle si tu veux reprendre cette relecture.</div><div class="actions"><button class="primary" data-action="toggle-cycle-raw-visibility" data-id="${escapeAttr(cycle.id)}">Réafficher les textes bruts</button><button class="ghost" data-tab="carnet">Retour au Carnet</button></div></div>
      </div>`;
    }
    const d = coldReviewDraft(cycle);
    const fields = [d.trigger,d.earlySignals,d.interpretation,d.impulse,d.actionTaken,d.consequence,d.choicePoint];
    const bodySignals = personalMapCycleZones(cycle);
    const existingAction = cycle.answers?.[8]?.action || cycle.answers?.[8]?.actionOption || "";
    return `

        <div class="card cold-review-context">

          ${cycleSelector}
          <div class="cold-review-existing"><strong>Repères déjà présents dans ce Cycle</strong><p><b>Déclencheur :</b> ${escapeHtml(cycle.answers?.[2]?.trigger || "—")}</p><p><b>Signaux corporels renseignés :</b> ${escapeHtml(bodySignals.join(", ") || "—")}</p><p><b>Action déjà notée :</b> ${escapeHtml(existingAction || "—")}</p></div>
          <p class="muted mini">Seul le déclencheur est prérempli lorsqu’il existe, car il correspond directement au même champ. Les autres étapes restent à ton discernement.</p>
        </div>
        <div class="card cold-review-form">
          <span class="eyebrow">Séquence à froid</span>
          <div class="cold-review-path" aria-label="Chemin de relecture">${["Déclencheur","Signes","Pensée","Impulsion","Acte","Conséquence","Choix"].map((x,i)=>`<span class="cold-review-node ${fields[i]?"filled":""}">${x}</span>`).join("")}</div>

          <label>2. Premiers signes — ce qui a commencé à changer
            <textarea id="cold-review-signals" placeholder="Corps, rythme, envie de parler, de fuir, de serrer… sans interprétation obligatoire.">${escapeHtml(d.earlySignals)}</textarea>
          </label>
          <label>3. Pensée / interprétation du moment
            <textarea id="cold-review-interpretation" placeholder="Ex : je me suis dit que ma parole ne comptait pas. Cela peut rester une interprétation provisoire.">${escapeHtml(d.interpretation)}</textarea>
          </label>
          <label>4. Impulsion
            <textarea id="cold-review-impulse" placeholder="Ex : répondre tout de suite, partir, crier, me taire, convaincre…">${escapeHtml(d.impulse)}</textarea>
          </label>
          <label>5. Ce que j’ai réellement fait
            <textarea id="cold-review-action" placeholder="Un fait, sans te condamner ni te justifier.">${escapeHtml(d.actionTaken)}</textarea>
          </label>
          <label>6. Conséquence observable
            <textarea id="cold-review-consequence" placeholder="Ce qui s’est passé ensuite, en moi ou dans la situation.">${escapeHtml(d.consequence)}</textarea>
          </label>
          <label>7. Où un autre choix devenait-il possible ?
            <textarea id="cold-review-choice" placeholder="Ex : au premier serrement de mâchoire ; avant d’envoyer ; quand j’ai senti l’envie de convaincre…">${escapeHtml(d.choicePoint)}</textarea>
          </label>
          <label>La prochaine fois, une petite alternative réaliste
            <textarea id="cold-review-next" placeholder="Ex : demander une pause de 20 minutes et marcher avant de répondre.">${escapeHtml(d.nextTime)}</textarea>
          </label>
          <div class="actions"><button class="primary" data-action="save-cold-review">Enregistrer cette relecture</button><button class="ghost" data-action="cold-review-reset-draft">Réinitialiser le brouillon</button><button class="ghost" data-tab="carnet">Retour au Carnet</button></div>
        </div>
      </div>`;
  }

  function personalMapFocus() {
    data.adaptiveV4.personalMapFocus ||= cloneData(DEFAULT_DATA.adaptiveV4.personalMapFocus);
    return data.adaptiveV4.personalMapFocus;
  }

  function personalMapCycleZones(cycle) {
    const known = new Set(libraryLabels("zones"));
    return [...new Set([
      ...(Array.isArray(cycle?.entry?.zones) ? cycle.entry.zones : []),
      ...(Array.isArray(cycle?.answers?.[3]?.bodySignals) ? cycle.answers[3].bodySignals : [])
    ].filter(value => known.has(value)))];
  }

  function personalMapCycleQualities(cycle) {
    return cycle.answers?.[7]?.qualities || [];
  }

  function personalMapCounts() {
    return {
      zones: frequencyList(data.cycles.map(personalMapCycleZones), 20),
      qualities: frequencyList(data.cycles.map(personalMapCycleQualities), 20)
    };
  }

  function personalMapMatchingCycles(focus = personalMapFocus()) {
    if (!focus?.type || !focus?.value) return [];
    return data.cycles.filter(c => focus.type === "zone" ? personalMapCycleZones(c).includes(focus.value) : focus.type === "quality" ? personalMapCycleQualities(c).includes(focus.value) : false);
  }

  function personalMapZoneStrength(label, counts, max) {
    const item = counts.find(x=>x.label===label);
    return item ? Math.max(14, Math.round(item.count / Math.max(1,max) * 100)) : 0;
  }

  function renderPersonalBodyMap(zoneCounts, focus) {
    const max = Math.max(1,...zoneCounts.map(x=>x.count));
    const z = label => personalMapZoneStrength(label, zoneCounts, max);
    const active = label => focus.type === "zone" && focus.value === label ? "active" : "";
    const group = (label, shape, text, tx, ty) => { const strength=z(label), opacity=strength?Math.min(.72,.12+strength/165):.035, width=strength?Math.min(3.2,1.2+strength/55):1; return `<g class="personal-map-zone ${label === "Champ autour" ? "field-zone" : ""} ${active(label)}" style="--map-opacity:${opacity.toFixed(2)};--map-width:${width.toFixed(2)}px" tabindex="0" role="button" aria-label="${escapeAttr(label)} : ${zoneCounts.find(x=>x.label===label)?.count||0} cycle(s)" data-map-focus-type="zone" data-map-focus-value="${escapeAttr(label)}">${shape}<text x="${tx}" y="${ty}">${text}</text></g>`; };
    return `<svg class="personal-body-svg" viewBox="0 0 360 500" role="group" aria-label="Silhouette des zones corporelles récurrentes">
      <ellipse class="personal-body-silhouette" cx="130" cy="250" rx="105" ry="220" opacity=".22"></ellipse><circle class="personal-body-silhouette" cx="130" cy="62" r="34"></circle><path class="personal-body-silhouette" d="M104 98 C82 118 76 170 82 225 L92 330 L108 330 L112 455 L128 455 L130 330 L132 330 L136 455 L152 455 L168 330 L178 225 C184 170 178 118 156 98 Z"></path><path class="personal-body-silhouette" d="M86 130 L48 255 L62 262 L104 168M174 130 L212 255 L198 262 L156 168"></path>
      ${group("Tête",'<circle cx="130" cy="62" r="25"></circle>',"tête",160,65)}
      ${group("Mâchoire",'<path d="M111 70 Q130 88 149 70"></path>',"mâchoire",158,88)}
      ${group("Gorge",'<ellipse cx="130" cy="105" rx="18" ry="11"></ellipse>',"gorge",154,109)}
      ${group("Poitrine",'<ellipse cx="130" cy="150" rx="35" ry="25"></ellipse>',"poitrine",170,153)}
      ${group("Plexus",'<circle cx="130" cy="192" r="18"></circle>',"plexus",153,196)}
      ${group("Ventre",'<ellipse cx="130" cy="238" rx="28" ry="32"></ellipse>',"ventre",163,242)}
      ${group("Bassin",'<ellipse cx="130" cy="290" rx="36" ry="23"></ellipse>',"bassin",171,294)}
      ${group("Mains",'<circle cx="55" cy="268" r="14"></circle><circle cx="205" cy="268" r="14"></circle>',"mains",12,288)}
      ${group("Jambes / pieds",'<path d="M98 325 L128 325 L128 470 L98 470 Z M132 325 L162 325 L162 470 L132 470 Z"></path>',"jambes / pieds",170,450)}
      <circle class="personal-body-silhouette" cx="300" cy="120" r="22"></circle><path class="personal-body-silhouette" d="M282 148 C270 165 270 225 278 270 L288 330 L312 330 L322 270 C330 225 330 165 318 148 Z"></path>
      ${group("Dos / épaules",'<path d="M278 165 Q300 145 322 165 L318 235 Q300 250 282 235 Z"></path>',"dos / épaules",267,265)}
      ${group("Tout le corps",'<path d="M100 102 C72 140 72 300 100 350 M160 102 C188 140 188 300 160 350"></path>',"tout",173,352)}
      ${group("Champ autour",'<ellipse cx="130" cy="250" rx="112" ry="228" fill="none"></ellipse>',"champ",18,28)}
    </svg>`;
  }

  function fireTrajectoryForCycle(cycle) {
    return cycleFireReadings(cycle).map(x=>Number(x.value)).filter(Number.isFinite).slice(-8);
  }

  function trajectoryPolyline(values) {
    if (!values.length) return "";
    const n=Math.max(1,values.length-1);
    return values.map((v,i)=>`${Math.round(i/n*100)},${Math.round(30-(Math.max(0,Math.min(10,v))/10*26))}`).join(" ");
  }

  function renderPersonalMap() {
    const counts = personalMapCounts();
    const focus = personalMapFocus();
    const matches = personalMapMatchingCycles(focus);
    const maxQ = Math.max(1,...counts.qualities.map(x=>x.count));
    const trajectories = data.cycles.map(c=>({cycle:c,values:fireTrajectoryForCycle(c)})).filter(x=>x.values.length>=2).slice(0,8);
    const rated = toolRatingDefinitions().map(t=>({...t,rating:toolRating(t.id)})).filter(x=>x.rating!==0).sort((a,b)=>b.rating-a.rating);
    const zoneList = counts.zones.length ? `<div class="personal-zone-list" aria-label="Liste accessible des zones récurrentes">${counts.zones.map(item=>`<button class="${focus.type==="zone"&&focus.value===item.label?"active":""}" data-map-focus-type="zone" data-map-focus-value="${escapeAttr(item.label)}"><span>${escapeHtml(item.label)}</span><small>${item.count} cycle${item.count>1?"s":""}</small></button>`).join("")}</div>` : "";
    return `
      <div class="card personal-map">
        <div class="personal-map-head"><div><span class="eyebrow">Cartographie personnelle</span><h3>Voir les récurrences sans les transformer en verdict.</h3><p class="muted">La taille et l’intensité visuelle indiquent seulement combien de Cycles renseignés contiennent ce repère. Clique une zone ou une qualité pour retrouver les traversées associées.</p></div>${uiIcon("map",34)}</div>
        <div class="personal-map-grid">
          <div class="map-panel"><h4>Silhouette des récurrences</h4>${counts.zones.length ? `${renderPersonalBodyMap(counts.zones,focus)}${zoneList}` : `<p class="muted mini">Les zones apparaîtront après des Cycles où des signaux corporels ont été renseignés.</p>`}</div>
          <div class="grid">
            <div class="map-panel"><h4>Couronne des qualités retrouvées</h4>${counts.qualities.length ? `<div class="quality-crown">${counts.qualities.slice(0,12).map(item=>`<button class="quality-orb ${focus.type==="quality"&&focus.value===item.label?"active":""}" style="--quality-mix:${Math.max(12,Math.round(item.count/maxQ*48))}%" data-map-focus-type="quality" data-map-focus-value="${escapeAttr(item.label)}">${escapeHtml(item.label)} · ${item.count}</button>`).join("")}</div>` : `<p class="muted mini">Les qualités choisies dans les Cycles apparaîtront ici.</p>`}</div>
            <div class="map-panel"><h4>Trajectoires récentes du feu</h4><p class="muted mini">Une ligne relie les intensités notées dans un même Cycle. Descendre n’est pas une obligation ni un score de réussite.</p>${trajectories.length ? `<div class="trajectory-list">${trajectories.map(({cycle,values})=>`<div class="trajectory-row"><strong>${escapeHtml(visibleCycleTitle(cycle))}</strong><svg viewBox="0 0 100 32" preserveAspectRatio="none" aria-label="Trajectoire ${values.join(' vers ')}"><polyline points="${trajectoryPolyline(values)}"></polyline>${values.map((v,i)=>{const x=values.length===1?50:Math.round(i/(values.length-1)*100),y=Math.round(30-(v/10*26));return `<circle cx="${x}" cy="${y}" r="2.1"></circle>`}).join("")}</svg><small>${values[0]} → ${values[values.length-1]}</small></div>`).join("")}</div>` : `<p class="muted mini">Note au moins deux intensités dans un Cycle pour faire apparaître une trajectoire.</p>`}</div>
            <div class="map-panel"><h4>Outils évalués par toi</h4>${rated.length ? `<div class="tool-utility-strip">${rated.map(t=>`<span>${escapeHtml(t.label)} · ${t.rating===2?"souvent utile":t.rating===1?"parfois utile":"pas vraiment utile"}</span>`).join("")}</div>` : `<p class="muted mini">Les évaluations du Plan personnel apparaîtront ici, sans moyenne ni classement caché.</p>`}</div>
          </div>
        </div>
        <div class="map-focus-panel">${focus.type && focus.value ? `<strong>${focus.type==="zone"?"Zone":"Qualité"} : ${escapeHtml(focus.value)}</strong><p class="muted mini">${matches.length} Cycle(s) renseigné(s) avec ce repère.</p><div class="map-focus-cycles">${matches.slice(0,10).map(c=>`<button class="ghost" data-action="open-cycle" data-id="${escapeAttr(c.id)}">${escapeHtml(visibleCycleTitle(c))}</button>`).join("")}${matches.length>10?`<span class="muted mini">+ ${matches.length-10}</span>`:""}</div><div class="actions"><button class="ghost" data-action="clear-personal-map-focus">Effacer le focus</button></div>` : `<strong>Explorer la carte</strong><p class="muted mini">Clique une zone corporelle ou une qualité pour retrouver les Cycles associés.</p>`}</div>
      </div>`;
  }

          <label>2. Ce que cela touche

          <label>4. Mon prochain acte juste
            <textarea id="boundary-action-action" placeholder="Ex : partir, dire une phrase courte, demander, documenter, différer, ne rien faire aujourd’hui…">${escapeHtml(d.action || "")}</textarea>

            <button class="ghost" data-action="boundary-action-to-cycle">Créer un Cycle depuis ceci</button>
            <button class="ghost" data-action="boundary-action-clear">Effacer ce brouillon</button>
          </div>
        </div>
      </div>`;
  }

  function screenlessDraft() {

    data.toolDraft.screenless ||= {
      phase: "prepare",
      practice: "marche",
      duration: "0",
      startedAt: "",
      changed: "",
      remainingCharge: "",
      returningQuality: ""
    };
    return data.toolDraft.screenless;
  }

  function screenlessPracticeDefinition(id) {
    return {
      marche: {
        label: "Marche de feu",
        instruction: "Marche lentement. À chaque pas, laisse le corps rendre un peu de charge et garder une prochaine marche possible."

  function renderScreenlessTool() {
    if (!data.extensionsV3?.enabled?.screenlessMode) {
      return renderOutilShell("Mode sans écran", `
        <div class="card">
          <h3>Poser l’écran pendant une pratique courte</h3>

        </div>
      </div>

          <p class="muted">Mode sans écran</p>

  function renderCarnet() {
    const cycles = filteredCarnetCycles();
    const filters = carnetFilters();
    const advancedPatternsEnabled = data.extensionsV3?.enabled?.advancedPatterns === true;
    const allObservations = carnetObservations();
    const hiddenObservationIds = new Set(data.extensionsV3?.advancedPatterns?.hiddenObservationIds || []);
    const observations = allObservations.filter(observation => !hiddenObservationIds.has(observation.id));
    const hiddenObservationCount = allObservations.length - observations.length;
    const cycleMapEnabled = data.extensionsV3?.enabled?.cycleMap === true;
    const cycleMapGroupsList = cycleMapEnabled ? cycleMapGroups() : [];
    return `
      <section class="grid carnet-space">
        ${renderLastNotice()}
        <div class="card page-heading-card">
          <span class="eyebrow">Mémoire locale</span>
          <h2>Carnet des Feux</h2>
          <p class="muted">Cycles ouverts, en pause ou clôturés. Aucun échec : seulement des traversées à leur rythme.</p>
          <div class="actions">
            <button class="primary" data-action="new-cycle">Nouveau Cycle</button>
            ${data.extensionsV3?.enabled?.richPrint
              ? `<button class="ghost" data-action="open-print-preparation">Préparer impression / PDF</button>`

            </p>
            <div class="notice mini">

            </div>
            <div class="grid two">
              ${v3ExtensionDefinitions().map(extension => `
                <label class="choice">
                  <input type="checkbox" data-extension-toggle="${escapeAttr(extension.id)}" ${data.extensionsV3?.enabled?.[extension.id] ? "checked" : ""}>
                  <span>
                    <strong>${escapeHtml(extension.label)}</strong><br />
                    <span class="muted mini">${escapeHtml(extension.description)}</span>
                  </span>

            </div>
            ${data.extensionsV3?.enabled?.seals ? `

              </label>
              <p class="muted mini">Les sceaux restent visibles dans l’application et les exports JSON, même s’ils sont masqués à l’impression.</p>
            ` : ""}
            ${data.extensionsV3?.enabled?.languageProfiles ? renderLanguageProfileSettings() : ""}
            ${data.extensionsV3?.enabled?.companionMode ? `
              <div class="notice mini">
                <strong>Mode accompagnant actif</strong><br />
                Le bouton “Vue accompagnant” apparaît dans le Soin guidé. Cette vue ne rend aucune réponse intime ni titre sensible.
              </div>
              <label class="choice">
                <input type="checkbox" data-companion-setting="displayLockEnabled" ${data.extensionsV3?.companion?.displayLockEnabled ? "checked" : ""}>
                Demander la phrase REPRENDRE avant de réafficher la vue personnelle
              </label>
            ` : ""}
            ${data.extensionsV3?.enabled?.richPrint ? renderPrintPreparation() : ""}
          </div>
        </details>

        <details class="card sanctuary-panel" id="sanctuaire-data" data-details-key="sanctuaire-data">
          <summary>
            <span class="summary-title">Bibliothèques et données locales</span>
            <span class="summary-desc">Recherche de résonances, personnalisation, confidentialité, export et import JSON.</span>
          </summary>
          <div class="sanctuary-panel-body">
            <div class="grid two">
          <div class="library-panel">
            <h3>Bibliothèques internes</h3>
            <p class="muted">Les listes visibles restent courtes. Les entrées internes sont structurées avec tags pour enrichir progressivement le soin sans surcharger l’écran.</p>
            <label>Rechercher une porte de résonance</label>
            <input id="library-search" value="${escapeAttr(search)}" placeholder="Ex : honte, gorge, limite, collectif, enfant..." />
            <p class="muted mini">Tape au moins 2 lettres. Les résultats sont limités pour éviter l’effet catalogue.</p>
            <div class="actions">
              <button class="primary" data-action="library-search">Rechercher</button>
              ${search ? `<button class="ghost" data-action="library-search-clear">Effacer</button>` : ""}
            </div>
            ${search.trim().length < 2 ? `
              <div class="notice">La recherche reste volontairement sobre. Pendant un soin, les vagues restent filtrées à 10 phrases maximum.</div>
            ` : results.length ? `
              <div class="grid">
                ${results.map(result => `
                  <div class="notice">
                    <strong>${escapeHtml(result.type)}</strong><br />
                    ${escapeHtml(result.text)}
                    <div class="actions">
                      <button class="ghost" data-action="start-from-library" data-library-id="${escapeAttr(result.item.id)}" data-library-text="${escapeAttr(result.text)}" data-library-type="${escapeAttr(result.type)}">Commencer depuis cette résonance</button>
                    </div>
                  </div>
                `).join("")}
              </div>
            ` : `
              <div class="notice">Aucune entrée trouvée. Essaie un mot plus simple ou une zone du corps.</div>
            `}
            <details data-details-key="library-families">
              <summary>Familles</summary>
              <div class="pill-list">${libraryLabels("families").map(x => `<span class="choice">${escapeHtml(x)}</span>`).join("")}</div>
            </details>
            <details data-details-key="library-masks">
              <summary>Masques</summary>
              <div class="pill-list">${libraryLabels("masks").map(x => `<span class="choice">${escapeHtml(x)}</span>`).join("")}</div>
            </details>
            <details data-details-key="library-egregores">
              <summary>Égrégores / champs perçus — aperçu</summary>
              <div class="pill-list">${libraryLabels("egregores").slice(0, 12).map(x => `<span class="choice">${escapeHtml(x)}</span>`).join("")}</div>
            </details>
            <details data-details-key="library-structure">
              <summary>Structure interne</summary>
              <p class="muted mini">
                Les entrées contiennent maintenant id, famille, intensité, mode, zones, masques, égrégores, élément conseillé, tags et activation.
                Pendant un soin, seules les phrases utiles à la vague courante apparaissent.
              </p>
            </details>
            <details data-details-key="library-customization">
              <summary>Personnaliser les bibliothèques</summary>
              <p class="muted mini">Ces réglages agissent sur les suggestions. Les contenus restent locaux et exportables en JSON.</p>

              <div class="group-label" id="library-categories-label">Catégories actives</div>
              <div class="pill-list" role="group" aria-labelledby="library-categories-label">
                ${editableLibraryGroups().map(group => `
                  <label class="choice">
                    <input type="checkbox" data-library-toggle="${escapeAttr(group.key)}" ${libraryCategoryEnabled(group.key) ? "checked" : ""}>
                    ${escapeHtml(group.label)}
                  </label>
                `).join("")}
              </div>

              <select id="custom-library-key" ${editingEntry ? "disabled" : ""}>
                ${editableLibraryGroups().map(group => `<option value="${escapeAttr(group.key)}" ${(editingEntry?.key || "resonance") === group.key ? "selected" : ""}>${escapeHtml(group.label)}</option>`).join("")}

              <label>Texte ou libellé</label>
              <textarea id="custom-library-text" placeholder="Ex : Je peux poser une limite sans expliquer toute mon histoire.">${escapeHtml(editingEntry?.item.text || "")}</textarea>

              <label>Famille associée</label>
              <select id="custom-library-family">
                <option value="">Non précisée</option>

              <label>Mode recommandé</label>

                ${option("doux", "Doux", editingEntry?.item.mode || "doux")}

              <label>Intensité du langage</label>
              <select id="custom-library-intensity">
                ${option("doux", "Doux", editingEntry?.item.intensity || "doux")}
                ${option("moyen", "Moyen", editingEntry?.item.intensity || "doux")}
                ${option("direct", "Direct", editingEntry?.item.intensity || "doux")}
                ${option("très direct", "Très direct", editingEntry?.item.intensity || "doux")}
              </select>

              <label>Tags, séparés par des virgules</label>
              <input id="custom-library-tags" value="${escapeAttr((editingEntry?.item.tags || []).filter(tag => tag !== "personnalisé").join(", "))}" placeholder="Ex : limite, parole, ancrage" />

              <div class="actions">
                <button class="primary" data-action="${editingEntry ? "save-custom-library-edit" : "add-custom-library-entry"}">${editingEntry ? "Enregistrer les modifications" : "Ajouter cette entrée"}</button>
                ${editingEntry ? `<button class="ghost" data-action="cancel-custom-library-edit">Annuler la modification</button>` : ""}
              </div>

              <label>Gérer les entrées d’une catégorie</label>
              <select data-setting="libraryManageKey">
                ${editableLibraryGroups().map(group => option(group.key, group.label, manageKey)).join("")}
              </select>
              <p class="muted mini">Les entrées désactivées restent dans les données locales mais ne sont plus proposées pendant le soin.</p>

              <div class="grid">
                ${managedItems.slice(0, 16).map(item => `
                  <div class="notice mini ${item.active ? "" : "dangerBox"}">
                    <strong>${escapeHtml(item.text || item.label)}</strong><br />
                    ${escapeHtml(item.custom ? "Entrée personnelle" : "Entrée interne")} · ${escapeHtml(item.mode)} · ${escapeHtml(item.intensity)}
                    <div class="actions">
                      <button class="ghost" data-action="toggle-library-entry" data-library-key="${escapeAttr(manageKey)}" data-library-id="${escapeAttr(item.id)}">${item.active ? "Désactiver" : "Réactiver"}</button>
                      ${item.custom ? `
                        <button class="ghost" data-action="edit-custom-library-entry" data-library-key="${escapeAttr(manageKey)}" data-library-id="${escapeAttr(item.id)}">Modifier</button>
                        <button class="ghost" data-action="remove-custom-library-entry" data-library-key="${escapeAttr(manageKey)}" data-library-id="${escapeAttr(item.id)}">Retirer</button>
                      ` : ""}
                    </div>

              </div>
              ${managedItems.length > 16 ? `<p class="muted mini">${managedItems.length - 16} autre(s) entrée(s) non affichée(s). Utilise la recherche pour les retrouver.</p>` : ""}

              <div class="actions">
                <button class="ghost" data-action="export-library-pack">Exporter les bibliothèques personnalisables</button>
                <label class="choice">

                </label>

          <div>
            <h3>Données locales</h3>
            <p class="muted">Les données restent dans ce navigateur, via localStorage.</p>
            <label class="choice">
              <input type="checkbox" data-privacy-setting="maskSensitiveTitles" ${data.settings.privacy?.maskSensitiveTitles ? "checked" : ""}>
              Masquer les titres sensibles dans le Carnet
            </label>
            <label class="choice">
              <input type="checkbox" data-privacy-setting="localVeilEnabled" ${data.settings.privacy?.localVeilEnabled ? "checked" : ""}>
              Activer le voile local d’affichage
            </label>
            <p class="muted mini">
              Le masquage et le voile local protègent seulement l’affichage. Les données complètes restent disponibles localement et dans l’export complet.
              Le voile n’est pas un chiffrement : il sert à éviter une lecture immédiate sur l’écran.
            </p>
            <div class="actions">
              <button class="primary" data-action="export-json">Exporter JSON</button>
              <button class="ghost" data-action="export-anonymized-json">Exporter sans textes libres</button>
              <label class="choice">
                Importer JSON
                <input type="file" accept="application/json" data-action="import-json" style="display:none">
              </label>
              <button class="danger" data-action="reset-data">Tout effacer</button>
            </div>
            <p class="muted mini">
              L’export sans textes libres conserve les choix structurés utiles, comme les familles, zones, qualités et dates.
              Il réduit l’exposition des phrases écrites, mais n’est pas anonyme au sens strict.
            </p>

            <details data-details-key="local-traces">
              <summary>Suppression sélective des traces ponctuelles</summary>
              <p class="muted mini">

                Les Cycles de Feu restent conservés.
              </p>
              <div class="actions">
                <button class="ghost" data-action="clear-local-trace" data-trace-key="microSessions">Effacer micro-soins (${data.microSessions.length})</button>
                <button class="ghost" data-action="clear-local-trace" data-trace-key="bodyScans">Effacer scans corporels (${data.bodyScans.length})</button>
                <button class="ghost" data-action="clear-local-trace" data-trace-key="bodyMemorySessions">Effacer sas Mémoire (${data.bodyMemorySessions.length})</button>
                <button class="ghost" data-action="clear-local-trace" data-trace-key="authoritySessions">Effacer sas Autorité (${data.authoritySessions.length})</button>
                <button class="ghost" data-action="clear-local-trace" data-trace-key="screenlessSessions">Effacer pratiques sans écran (${data.screenlessSessions.length})</button>
                <button class="ghost" data-action="clear-local-trace" data-trace-key="groundingSessions">Effacer ancrages vivants (${data.adaptiveV4?.groundingSessions?.length || 0})</button>
                <button class="ghost" data-action="clear-local-trace" data-trace-key="standaloneActions">Effacer Limite & Action (${data.adaptiveV4?.standaloneActions?.length || 0})</button>
                <button class="danger" data-action="clear-all-local-traces">Effacer toutes les traces ponctuelles</button>
              </div>
            </details>
          </div>
            </div>
          </div>
        </details>
      </section>
    `;
  }

  function renderComprendre() {
    return `
      <details class="card sanctuary-panel" id="sanctuaire-comprendre" data-details-key="sanctuaire-comprendre">
        <summary>
          <span class="summary-title">Comprendre l’esprit de Feu Clair</span>
          <span class="summary-desc">
            Repères de sens, prudences et éclairages à consulter avant ou après une traversée.
          </span>
        </summary>
        <div class="sanctuary-panel-body">
          <p class="muted">
            Cette page sert à s’orienter avant ou après une traversée. Elle n’est pas une étape active de soin et ne demande rien d’ouvrir maintenant.
          </p>

        <div class="notice softBox">
          <strong>Feu Clair</strong> désigne une colère reconnue, traversée et rendue à sa fonction juste.
          Elle n’est ni niée, ni projetée, ni retournée contre soi. Elle redevient information, limite, courage, protection ou action claire.
        </div>

        <div class="understand-grid">
          <div class="understand-card">
            <h4>Charge, information, force</h4>
            <p class="mini">La charge brûle, obsède ou crispe. L’information montre ce qui est touché. La force ramène courage, limite, dignité ou action.</p>
          </div>
          <div class="understand-card">
            <h4>Restitution</h4>
            <p class="mini">Restituer ne nie pas ce qui a été vécu. Cela rend ce que le corps n’a plus à porter, tout en gardant l’information utile.</p>
          </div>
          <div class="understand-card">
            <h4>Clôturer</h4>
            <p class="mini">Fermer un soin n’est pas abandonner. C’est respecter le corps. Parfois, la phrase juste est : pas plus aujourd’hui.</p>
          </div>
        </div>

        <div class="understand-details">
          <details>
            <summary>Ce que l’application aide à faire</summary>
            <ul>
              <li>Reconnaître le feu sans s’y perdre.</li>
              <li>Distinguer charge, information et limite.</li>
              <li>Identifier les colères visibles, cachées, absorbées ou déguisées.</li>
              <li>Faire sortir la charge par le corps, la parole, l’écriture ou le geste.</li>
              <li>Rendre ce qui ne doit plus être porté, récupérer une qualité utile et poser une limite ou une non-action juste.</li>
              <li>Clôturer proprement au lieu de rester ouvert.</li>
            </ul>
          </details>

          <details>
            <summary>Ce que l’application ne cherche pas à faire</summary>
            <ul>
              <li>Forcer des souvenirs ou prouver une histoire.</li>
              <li>Décider à la place de l’utilisateur ou encourager une action impulsive.</li>
              <li>Justifier une violence, nourrir la colère ou tout nettoyer en une seule session.</li>
              <li>Remplacer le discernement intérieur ou le soutien humain si un thème est trop lourd.</li>
            </ul>
          </details>

          <details>
            <summary>Les formes possibles du feu</summary>
            <p><strong>Colère de limite :</strong> un espace, un corps, un temps, une parole ou un consentement a été franchi.</p>
            <p><strong>Colère d’injustice :</strong> quelque chose en soi refuse l’inversion, le mensonge ou l’abus.</p>
            <p><strong>Colère d’impuissance :</strong> on voit ce qui ne va pas, mais l’action semble trop grande ou impossible.</p>
            <p><strong>Colère ancienne :</strong> une situation présente réveille une mémoire non digérée.</p>
            <p><strong>Colère absorbée :</strong> une charge semble venir d’un champ familial, collectif, relationnel ou subtil.</p>
            <p><strong>Colère-masque :</strong> elle se cache derrière fuite, compulsion, jalousie, inertie, contrôle, cynisme ou pardon prématuré.</p>
            <p><strong>Colère sacrée :</strong> une force claire se lève pour protéger le vivant, sans chercher à humilier ou détruire.</p>
            <p><strong>Colère froide :</strong> retrait, coupure, mépris, silence ou figement plutôt qu’explosion.</p>
          </details>

          <details>
            <summary>Vraie colère, colère-masque, colère déplacée</summary>
            <p>Une colère peut être juste dans son fond, mais maladroite dans sa forme. Elle peut aussi se tromper de cible.</p>
            <ul>
              <li>Qu’est-ce qui est réellement touché ?</li>
              <li>Est-ce la bonne cible, une ancienne mémoire ou une charge qui ne m’appartient pas ?</li>
              <li>Une autre émotion est-elle cachée dessous ?</li>
            </ul>
          </details>

          <details>
            <summary>Pourquoi le corps est une porte d’entrée</summary>
            <p>
              Le corps peut répondre avant les mots. Une gorge serrée, une mâchoire tendue, un ventre figé, des mains agitées ou un dos lourd ne prouvent rien à eux seuls.
              Ce sont des portes d’entrée douces. La carte corporelle ne donne pas un diagnostic : elle aide à commencer là où quelque chose répond.
            </p>
          </details>

          <details>
            <summary>Pourquoi stabiliser avant de creuser</summary>
            <p>
              Quand l’intensité est forte, le corps a besoin de revenir au présent avant d’analyser. Stabiliser n’est pas éviter : c’est créer un contenant.
              Si le feu est trop haut, on revient aux pieds, au souffle, à la pièce, à l’eau, puis on choisit de continuer ou de fermer.
            </p>
          </details>

          <details>
            <summary>Sortir la charge, agir ensuite</summary>
            <p>
              Ce qui sort dans le soin n’est pas automatiquement destiné à être dit, envoyé ou fait.
              Une lettre brute, un cri, une phrase interdite ou une décharge corporelle servent d’abord à libérer la charge.
            </p>
            <p>L’action extérieure vient ensuite, si elle reste juste, claire et non destructrice.</p>
            <div class="notice mini">
              Parfois, l’action juste est de ne pas répondre, ne pas se justifier, ne pas convaincre, attendre que le feu redescende ou garder un message en quarantaine.
            </div>
          </details>

          <details>
            <summary>Mémoire du Corps</summary>
            <p>
              Certaines colères apparaissent comme tension, larmes, tremblement, vide, chaleur, froid, image, sensation ou verrouillage.
              Une charge peut être libérée sans connaître toute son histoire.
            </p>
            <p><strong>Souvenir clair :</strong> quelque chose est situé et reconnaissable.</p>
            <p><strong>Mémoire corporelle :</strong> le corps réagit sans histoire complète.</p>
            <p><strong>Image ou sensation symbolique :</strong> une forme ou une impression apparaît, sans conclusion immédiate.</p>
            <div class="notice mini">L’intensité indique une porte, pas une preuve.</div>
          </details>

          <details>
            <summary>Feu d’Autorité et responsabilité</summary>
            <p>
              Le Feu d’Autorité sert à poser une limite intérieure forte contre une charge, un lien, une emprise, une inversion ou une signature perçue comme étrangère.
              Il ne sert jamais à nourrir une violence réelle contre un être vivant présent.
            </p>
            <div class="notice mini">
              Je ne dirige pas ce feu contre un être vivant présent. Je le dirige contre la charge, le lien, l’inversion, l’emprise ou le programme qui ne respecte pas mon axe.
            </div>
            <p>Même si une mémoire, une influence, un champ ou une charge agit en moi, je reste gardien de mes actes.</p>
          </details>
        </div>

        <div class="notice softBox" style="margin-top:.85rem">
          Feu Clair ne demande pas de tout ouvrir. Il aide à traverser ce qui est mûr aujourd’hui, rendre ce qui peut être rendu maintenant,
          garder la force utile, puis revenir à une prochaine marche simple.
        </div>

        <div class="notice mini">
          Les archétypes ne sont pas des obligations ni des preuves. Ce sont des supports symboliques, limités à quelques suggestions contextuelles.
          Le soin reste pleinement valable en cadre sobre.
        </div>

        ${renderArchetypeGlossary()}

        <div class="actions">
          <button class="ghost" data-tab="boussole">J’ai compris l’esprit de Feu Clair — revenir à la Boussole</button>
        </div>
        </div>
      </details>
    `;
  }

  function buildCycleSummary(c, options = {}) {
    const s = c.answers;
    const a0 = s[0] || {};
    const a1 = s[1] || {};
    const a2 = s[2] || {};
    const a3 = s[3] || {};
    const a4 = s[4] || {};
    const a5 = s[5] || {};
    const a6 = s[6] || {};
    const a7 = s[7] || {};
    const a8 = s[8] || {};
    const a9 = s[9] || {};

    return [
      `Cycle : ${c.title}`,
      ``,
      `Intention : ${a0.intention || "—"}`,
      `Profondeur : ${a0.depth || "—"}`,
      `Intensité de départ : ${a1.intensity ?? "—"}/10`,
      ``,
      `Déclencheur : ${a2.trigger || "—"}`,
      `Contre quoi : ${a2.against || "—"}`,
      `Pour quoi : ${a2.forWhat || "—"}`,
      `Parking : ${a2.secondaryAngers || "—"}`,
      ``,
      `Familles : ${(a2.families || []).join(", ") || "—"}`,
      `Résonances : ${(a3.resonancePhrases || []).join(" / ") || "—"}`,
      `Masques : ${(a3.masks || []).join(", ") || "—"}`,
      `Appartenance : ${(a4.ownership || []).join(", ") || "—"}`,
      `Permission : ${a4.permissionPhrase || "—"}`,
      `Notes de discernement : ${a4.discernmentNotes || "—"}`,
      ``,
      `Faux nom possible : ${a5.falseName || "—"}`,
      `Vrai nom : ${a5.trueName || "—"}`,
      `Nom racine : ${a5.rootName || "—"}`,
      `Permission de nommage : ${a5.namingPermission || "—"}`,
      ``,
      `Sortie : ${a6.exit || "—"}`,
      `Phrase sortie : ${a6.exitPhrase || "—"}`,
      `Intensité après sortie : ${a6.intensityAfter || "—"}/10`,
      ``,
      `Élément : ${a7.element || "—"}`,
      `Ce que je rends : ${a7.whatIReturn || "—"}`,
      `Qualités récupérées : ${(a7.qualities || []).join(", ") || "—"}`,
      ``,
      `Limite intérieure : ${a8.innerBoundary || "—"}`,
      `Parole possible : ${a8.spokenBoundary || "—"}`,
      `Positionnement : ${a8.positioningPhrase || "—"}`,
      `Action / non-action : ${a8.action || a8.actionOption || "—"}`,
      `Message en quarantaine : ${a8.quarantineMessage || "—"}`,
      ``,
      ...(options.includeClosing === false ? [] : [
        `Clôture : ${a9.closingPreset || a9.closingPhrase || "—"}`,
        ...(data.extensionsV3?.enabled?.seals ? [`Sceau d’intention : ${sealDefinition(a9.sealId)?.label || "—"}`] : [])
      ]),
      `Intégration : ${(a9.integrationDone || []).join(", ") || "—"}`,
      `Prochaine marche douce : ${a9.nextGentleStep || "—"}`,
      ...(options.includeIntegration === false ? [] : [cycleFollowUpSummary(c)])
    ].join("\n");
  }

  function cycleFollowUpSummary(cycle) {
    const followUp = cycle.integrationFollowUp;
    if (!followUp) return "";
    const answers = followUp.answers || {};
    return [
      "",
      "Suivi d’intégration :",
      `Charge revenue : ${answers.chargeReturned || "—"}`,
      `Qualité encore présente : ${answers.qualityPresent || "—"}`,
      `Limite posée : ${answers.boundaryPlaced || "—"}`,

  function saveActiveToolDraft() {
    data.toolDraft ||= {};
    if (data.activeTab === "micro") data.toolDraft.micro = readMicroDraft();
    if (data.activeTool === "body-scan") data.toolDraft.bodyScan = readBodyScan();
    if (data.activeTool === "memory") data.toolDraft.memory = readBodyMemory();
    if (data.activeTool === "authority") data.toolDraft.authority = readAuthoritySession();
    if (data.activeTool === "screenless") data.toolDraft.screenless = readScreenlessDraft();
    if (data.activeTool === "grounding-live") data.toolDraft.groundingLive = readGroundingDraft();
    if (data.activeTool === "cold-review") data.toolDraft.coldReview = readColdReviewDraft();
    if (data.activeTool === "boundary-action") data.toolDraft.boundaryAction = readBoundaryActionDraft();
    saveData();
  }

  function readScreenlessDraft() {
    const current = screenlessDraft();
    return {
      ...current,
      practice: document.querySelector("#screenless-practice")?.value || current.practice,
      duration: document.querySelector("#screenless-duration")?.value || current.duration,
      changed: document.querySelector("#screenless-changed")?.value || current.changed,
      remainingCharge: document.querySelector("#screenless-remaining")?.value || current.remainingCharge,
      returningQuality: document.querySelector("#screenless-quality")?.value || current.returningQuality
    };
  }

  function startScreenlessTimerIfNeeded() {
    const timer = document.querySelector("[data-screenless-timer]");
    const draft = data.toolDraft?.screenless;
    if (!timer || !draft?.startedAt || Number(draft.duration) <= 0) return;
    const update = () => {
      const elapsed = Math.floor((Date.now() - new Date(draft.startedAt).getTime()) / 1000);
      const remaining = Math.max(0, Number(draft.duration) - elapsed);
      timer.textContent = `${String(Math.floor(remaining / 60)).padStart(2, "0")}:${String(remaining % 60).padStart(2, "0")}`;
      if (remaining === 0 && screenlessTimerId) {
        clearInterval(screenlessTimerId);
        screenlessTimerId = null;
      }
    };
    update();
    screenlessTimerId = setInterval(update, 1000);
  }

  function selectBodyMapZone(zone) {
    if (!zone) return;
    data.toolDraft ||= {};
    data.toolDraft.bodyScan = { ...readBodyScan(), zone };
    saveData();
    render();
  }

  function setBodyMapLinkedHighlight(zone, enabled) {
    document.querySelectorAll("[data-body-map-zone]").forEach(el => {
      if (el.dataset.bodyMapZone === zone) el.classList.toggle("linked-highlight", enabled);
    });
  }

  function handleAction(el) {
    const action = el.dataset.action;

    if (action === "reset-checkin") {
      data.adaptiveV4.checkIn = cloneData(DEFAULT_DATA.adaptiveV4.checkIn);
      saveData();
      render();
      return;
    }

    if (action === "use-pause-phrase-suggestion") {
      personalFirePlan().pausePhrase = "Je n’agis pas dans le feu. Je reviens quand je suis assez clair.";
      saveData();
      render();
      return;
    }

    if (action === "record-fire-reading") {
      const cycle = activeCycle();
      const range = document.querySelector("#fire-thermometer-range");
      if (cycle && range) {
        cycle.fireReadings ||= [];
        cycle.fireReadings.push({ id: uid("fire"), value: Number(range.value), label: fireReadingLabel(cycle), step: cycle.currentStep, at: nowISO() });
        cycle.fireReadings = cycle.fireReadings.slice(-20);
        cycle.updatedAt = nowISO();
        saveData();
        render();
      }
      return;
    }


    if (action === "start-grounding-live") {
      data.toolDraft ||= {};
      data.toolDraft.groundingLive = { ...readGroundingDraft(), phase: "practice", startedAt: nowISO(), afterState: "", note: "" };
      saveData();
      render();
      return;
    }

    if (action === "grounding-finish-now") {
      data.toolDraft.groundingLive = { ...groundingDraft(), phase: "return" };
      saveData();
      render();
      return;
    }

    if (action === "grounding-restart") {
      data.toolDraft.groundingLive = { ...groundingDraft(), phase: "prepare", startedAt: "", afterState: "", note: "" };
      saveData();
      render();
      return;
    }

    if (action === "save-grounding-session") {
      const d = readGroundingDraft();
      const session = { id: uid("ground"), duration: Number(d.duration)||90, durationLabel: `${Number(d.duration)||90}s`, rhythm: d.rhythm, afterState: d.afterState, afterStateLabel: groundingAfterStateLabel(d.afterState), note: d.note, createdAt: nowISO() };
      data.adaptiveV4.groundingSessions.unshift(session);
      data.adaptiveV4.groundingSessions = data.adaptiveV4.groundingSessions.slice(0,50);
      data.toolDraft.groundingLive = { phase:"prepare", duration:d.duration, rhythm:d.rhythm, startedAt:"", afterState:"", note:"" };
      data.lastNotice = { text: "Ancrage enregistré. Le bilan reste une observation, pas un score.", tone: "good", createdAt: nowISO() };
      saveData();
      setTab("boussole");
      return;
    }

    if (action === "grounding-close") {
      const d = groundingDraft();
      data.toolDraft.groundingLive = { phase:"prepare", duration:d.duration||"90", rhythm:d.rhythm||"natural", startedAt:"", afterState:"", note:"" };
      saveData();
      setTab("boussole");
      return;
    }

    if (action === "open-cold-review") {
      const cycle = data.cycles.find(c=>c.id===el.dataset.id);
      if (!cycle) return;
      data.toolDraft ||= {};
      data.toolDraft.coldReview = { cycleId: cycle.id };
      data.activeTab = "outils";
      data.activeTool = "cold-review";
      saveData();
      render();
      return;
    }

    if (action === "save-cold-review") {
      const draft = readColdReviewDraft();
      const cycle = data.cycles.find(c=>c.id===draft.cycleId);
      if (!cycle || cycle.rawTextsHidden) return;
      cycle.coldReview = { ...draft, updatedAt: nowISO() };
      cycle.updatedAt = nowISO();
      data.lastNotice = { text: "Relecture à froid enregistrée dans ce Cycle.", tone: "good", createdAt: nowISO() };
      saveData();
      render();
      return;
    }

    if (action === "cold-review-reset-draft") {
      const cycle = coldReviewCycle();
      data.toolDraft.coldReview = { cycleId: cycle?.id || "", trigger: cycle?.answers?.[2]?.trigger || "", earlySignals:"", interpretation:"", impulse:"", actionTaken:"", consequence:"", choicePoint:"", nextTime:"" };
      saveData();
      render();
      return;
    }

    if (action === "clear-personal-map-focus") {
      data.adaptiveV4.personalMapFocus = { type:"", value:"" };
      saveData();
      render();
      return;
    }

    if (action === "save-boundary-action") {
      const draft = readBoundaryActionDraft();
      if (!draft.fact && !draft.boundary && !draft.action) {
        data.lastNotice = { text: "Ajoute au moins un fait, une limite ou un prochain acte avant d’enregistrer.", tone: "danger", createdAt: nowISO() };
      } else {
        data.adaptiveV4.standaloneActions.unshift({ id: uid("limit"), ...draft, createdAt: nowISO() });
        data.adaptiveV4.standaloneActions = data.adaptiveV4.standaloneActions.slice(0, 50);
        data.lastNotice = { text: "Limite & Action enregistrée dans le Carnet.", tone: "good", createdAt: nowISO() };
      }
      data.toolDraft.boundaryAction = draft;
      saveData();
      render();
      return;
    }

    if (action === "boundary-action-clear") {
      data.toolDraft.boundaryAction = {};
      saveData();
      render();
      return;
    }

    if (action === "boundary-action-to-cycle") {
      const draft = readBoundaryActionDraft();
      const cycle = {
        id: uid("cycle"), title: draft.boundary ? `Limite — ${draft.boundary.slice(0, 52)}` : "Cycle depuis Limite & Action",
        status: "ouvert", currentStep: 0, createdAt: nowISO(), updatedAt: nowISO(), notes: "",
        answers: { 2: { trigger: draft.fact || "", forWhat: draft.touched || "" }, 8: { innerBoundary: draft.boundary || "", action: draft.action || "", quarantineMessage: draft.quarantineMessage || "" } }
      };
      data.cycles.unshift(cycle);
      data.activeCycleId = cycle.id;
      data.activeTab = "soin";
      saveData();
      render();
      return;
    }

    if (action === "delete-standalone-action") {
      data.adaptiveV4.standaloneActions = data.adaptiveV4.standaloneActions.filter(item => item.id !== el.dataset.id);
      saveData();
      render();
      return;
    }

    if (action === "toggle-theme") {
      data.settings.theme = data.settings.theme === "dark" ? "light" : "dark";
      saveData();
      render();
    }

    if (action === "activate-visual-body-map") {
      data.extensionsV3 ||= cloneData(DEFAULT_DATA.extensionsV3);
      data.extensionsV3.enabled ||= cloneData(DEFAULT_DATA.extensionsV3.enabled);
      data.extensionsV3.enabled.visualBodyMap = true;
      saveData();
      render();
    }

    if (action === "activate-screenless-mode") {
      data.extensionsV3 ||= cloneData(DEFAULT_DATA.extensionsV3);
      data.extensionsV3.enabled ||= cloneData(DEFAULT_DATA.extensionsV3.enabled);
      data.extensionsV3.enabled.screenlessMode = true;
      saveData();
      render();
    }

    if (action === "start-screenless-practice") {
      data.toolDraft.screenless = {
        ...readScreenlessDraft(),
        phase: "practice",
        startedAt: nowISO()
      };
      saveData();
      render();
    }

    if (action === "return-from-screenless") {
      data.toolDraft.screenless = { ...screenlessDraft(), phase: "return" };
      saveData();
      render();
    }

    if (action === "save-screenless-return") {
      const session = { ...readScreenlessDraft(), id: uid("screenless"), status: "terminé", createdAt: nowISO() };
      data.screenlessSessions ||= [];
      data.screenlessSessions.unshift(session);
      data.toolDraft.screenless = cloneData(DEFAULT_DATA.toolDraft?.screenless || {});
      setNotice("Pratique sans écran enregistrée et fermée proprement.");
      saveData();
      setTab("boussole");
    }

    if (action === "screenless-close") {
      data.toolDraft.screenless = { ...screenlessDraft(), phase: "prepare", startedAt: "" };
      setNotice("Mode sans écran fermé proprement. Rien d’autre n’a besoin d’être ouvert maintenant.");
      saveData();
      setTab("boussole");
    }

    if (action === "open-print-preparation") {
      if (!data.extensionsV3?.enabled?.richPrint) return;
      const c = activeCycle();
      if (c && !printPreferences().selectedCycleIds?.length) {
        printPreferences().selectedCycleIds = [c.id];
      }
      data.activeTab = "sanctuaire";
      openDetailsOnNextRender("sanctuaire:extensions-v3", "sanctuaire:rich-print-preparation");
      focusAfterRender("[data-details-key='rich-print-preparation']");
      saveData();
      render();
    }

    if (action === "open-rich-print") {
      data.extensionsV3 ||= cloneData(DEFAULT_DATA.extensionsV3);
      data.extensionsV3.enabled ||= cloneData(DEFAULT_DATA.extensionsV3.enabled);
      data.extensionsV3.enabled.richPrint = true;
      const c = activeCycle();
      if (c && !printPreferences().selectedCycleIds?.length) {
        printPreferences().selectedCycleIds = [c.id];
      }
      openDetailsOnNextRender("sanctuaire:extensions-v3", "sanctuaire:rich-print-preparation");
      focusAfterRender("[data-details-key='rich-print-preparation']");
      saveData();
      render();
    }

    if (action === "open-print-preview") {
      if (!data.extensionsV3?.enabled?.richPrint) return;
      printPreviewOpen = true;
      render();
    }

    if (action === "close-print-preview") {
      printPreviewOpen = false;
      openDetailsOnNextRender("sanctuaire:extensions-v3", "sanctuaire:rich-print-preparation");
      focusAfterRender("[data-details-key='rich-print-preparation']");
      render();
    }

    if (action === "open-sanctuary-section") {
      const key = el.dataset.sanctuaryKey;
      const target = el.dataset.sanctuaryTarget || "#sanctuaire-comprendre";
      data.activeTab = "sanctuaire";
      openDetailsOnNextRender(`sanctuaire:${key}`);
      focusAfterRender(target);
      saveData();
      render();
    }

    if (action === "open-companion-view") {
      if (!data.extensionsV3?.enabled?.companionMode) return;
      companionViewOpen = true;
      companionReturnLocked = false;
      render();
    }

    if (action === "leave-companion-view") {
      if (data.extensionsV3?.companion?.displayLockEnabled) {
        rememberDialogReturnFocus();
        companionReturnLocked = true;
      } else {
        companionViewOpen = false;
      }
      render();
    }

    return {
      word: document.querySelector("#micro-word")?.value || "",
      body: document.querySelector("#micro-body")?.value || "",
      element: document.querySelector("#micro-element")?.value || "",
      phrase: document.querySelector("#micro-phrase")?.value || "",
      closing: document.querySelector("#micro-closing")?.value || defaultClosingPhrase()
    };
  }

  function saveIntegrationFollowUp(cycleId, container) {
    const cycle = data.cycles.find(item => item.id === cycleId);
    if (!cycle || !container) return;
    const followUp = ensureIntegrationFollowUp(cycle);
    const previousSchedule = followUp.schedule;
    const value = field => container.querySelector(`[data-follow-up-field="${field}"]`)?.value || "";
    followUp.schedule = value("schedule") || "tomorrow";
    if (followUp.schedule !== previousSchedule || !followUp.dueAt) {
      followUp.dueAt = integrationDueAt(followUp.schedule);
    }
    followUp.answers = {
      chargeReturned: value("chargeReturned"),
      qualityPresent: value("qualityPresent"),
      boundaryPlaced: value("boundaryPlaced"),
      actionDone: value("actionDone"),
      bodyState: value("bodyState"),
      notes: value("notes")
    };
    followUp.updatedAt = nowISO();
    cycle.updatedAt = nowISO();
    setNotice("Suivi d’intégration enregistré dans le Carnet.");
    saveData();
    render();
  }

  function addCustomLibraryEntry() {
    const { key, text, family, mode, intensity, tags } = readCustomLibraryForm();

    if (!text) {
      alert("Ajout impossible : écris d’abord un texte ou un libellé.");
      return;
    }

    data.library[key] ||= [];
    const signature = slugify(text);
    if (data.library[key].some(item => slugify(normalizeLibraryItem(item, key).text || normalizeLibraryItem(item, key).label) === signature)) {
      setNotice("Cette entrée existe déjà dans cette bibliothèque. Aucun doublon n’a été ajouté.");
      render();
      return;
    }
    const entry = normalizeLibraryItem({
      id: `custom_${key}_${slugify(text).slice(0, 36) || Date.now()}`,
      label: text,
      text,
      family,
      mode,
      intensity,
      tags,
      active: true,
      custom: true,

  function saveCustomLibraryEdit() {
    const editing = editingCustomLibraryEntry();
    if (!editing) return;
    const values = readCustomLibraryForm();
    if (!values.text) {
      alert("Modification impossible : le texte ou libellé ne peut pas être vide.");
      return;
    }
    const duplicate = managedLibraryItems(editing.key).some(item => (
      item.id !== editing.item.id && slugify(item.text || item.label) === slugify(values.text)
    ));
    if (duplicate) {
      setNotice("Une autre entrée possède déjà ce texte. La modification n’a pas été enregistrée.", "danger");
      render();
      return;
    }
    const index = data.library[editing.key].findIndex(item => normalizeLibraryItem(item, editing.key).id === editing.item.id);
    if (index < 0) return;
    data.library[editing.key][index] = normalizeLibraryItem({
      ...data.library[editing.key][index],
      label: values.text,
      text: values.text,
      family: values.family,
      mode: values.mode,
      intensity: values.intensity,
      tags: values.tags,
      updatedAt: nowISO()
    }, editing.key);
    data.settings.libraryEditKey = "";
    data.settings.libraryEditId = "";
    setNotice("Entrée personnalisée modifiée.");
    saveData();
    render();
  }

  function toggleLibraryEntry(key, id) {
    if (!key || !id || !Array.isArray(data.library?.[key])) return;
    const index = data.library[key].findIndex(item => normalizeLibraryItem(item, key).id === id);
    if (index < 0) return;
    const current = normalizeLibraryItem(data.library[key][index], key);
    data.library[key][index] = { ...data.library[key][index], active: !current.active, updatedAt: nowISO() };
    setNotice(current.active ? "Entrée désactivée. Elle ne sera plus proposée pendant le soin." : "Entrée réactivée.");
    saveData();
    render();
  }

  function removeCustomLibraryEntry(key, id) {
    if (!key || !id || !Array.isArray(data.library?.[key])) return;
    const item = managedLibraryItems(key).find(entry => entry.id === id);
    if (!item?.custom) return;
    data.library[key] = data.library[key].filter(item => normalizeLibraryItem(item, key).id !== id);
    if (data.settings.libraryEditId === id) {
      data.settings.libraryEditKey = "";

  function clearLocalTrace(key) {
    const definitions = {
      microSessions: { label: "les micro-soins", get: () => data.microSessions || [], clear: () => { data.microSessions = []; } },
      bodyScans: { label: "les scans corporels", get: () => data.bodyScans || [], clear: () => { data.bodyScans = []; } },
      bodyMemorySessions: { label: "les sas Mémoire du Corps", get: () => data.bodyMemorySessions || [], clear: () => { data.bodyMemorySessions = []; } },
      authoritySessions: { label: "les sas Feu d’Autorité", get: () => data.authoritySessions || [], clear: () => { data.authoritySessions = []; } },
      screenlessSessions: { label: "les pratiques sans écran", get: () => data.screenlessSessions || [], clear: () => { data.screenlessSessions = []; } },
      groundingSessions: { label: "les ancrages vivants", get: () => data.adaptiveV4?.groundingSessions || [], clear: () => { data.adaptiveV4.groundingSessions = []; } },
      standaloneActions: { label: "les entrées Limite & Action", get: () => data.adaptiveV4?.standaloneActions || [], clear: () => { data.adaptiveV4.standaloneActions = []; } }
    };
    const definition = definitions[key];
    if (!definition) return;
    const count = definition.get().length;
    if (!count) {
      setNotice(`Aucune trace à effacer pour ${definition.label}.`);
      render();
      return;
    }
    if (!confirm(`Effacer ${definition.label} enregistrés localement ? Les Cycles de Feu ne seront pas supprimés.`)) return;
    definition.clear();
    setNotice(`${count} trace${count > 1 ? "s" : ""} effacée${count > 1 ? "s" : ""} pour ${definition.label}.`);
    saveData();
    render();
  }

  function importLibraryPack(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (imported?.app !== "feu-clair" || imported?.exportMode !== "pack de bibliothèques" || typeof imported?.library !== "object") {
          alert("Import impossible : ce JSON ne ressemble pas à un pack de bibliothèques Feu Clair.");
          return;
        }
        let added = 0;
        let skipped = 0;
        editableLibraryGroups().forEach(group => {
          const entries = Array.isArray(imported.library[group.key]) ? imported.library[group.key] : [];
          data.library[group.key] ||= [];
          entries.forEach(raw => {
            const item = normalizeLibraryItem({ ...raw, custom: true }, group.key);
            const signature = slugify(item.text || item.label);
            const exists = managedLibraryItems(group.key).some(existing => (
              existing.id === item.id || slugify(existing.text || existing.label) === signature
            ));
            if (!signature || exists) {
              skipped += 1;
              return;
            }
            item.id = item.id || uid(`custom_${group.key}`);
            item.createdAt ||= nowISO();
            item.updatedAt = nowISO();
            data.library[group.key].push(item);
            added += 1;
          });
        });
        setNotice(`${added} entrée${added > 1 ? "s" : ""} importée${added > 1 ? "s" : ""}. ${skipped} doublon${skipped > 1 ? "s" : ""} ignoré${skipped > 1 ? "s" : ""}.`);
        saveData();
        render();
      } catch (error) {
        alert("Import impossible : pack JSON invalide.");
      } finally {
        event.target.value = "";
      }
    };
    reader.readAsText(file);
  }

  function importJson(event) {
    const file = event.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (imported?.app === "feu-clair" && imported?.cycle) {
          if (!confirm("Importer ce Cycle dans le Carnet actuel ? Les données existantes seront conservées.")) return;
          const cycle = normalizeImportedCycle(imported.cycle);
          data.cycles.unshift(cycle);
          data.activeCycleId = cycle.id;
          data.activeTab = "carnet";
          setNotice("Cycle importé dans le Carnet.");
          saveData();
          render();
          return;
        }

        if (!looksLikeFeuClairFullExport(imported)) {
          alert("Import impossible : ce JSON ne ressemble pas à un export Feu Clair.");
          return;
        }
        if (["anonymisé", "sans textes libres"].includes(imported.exportMode)) {
          alert("Import impossible : un export sans textes libres sert à partager ou archiver, pas à restaurer les données complètes.");

        render();
      } catch (error) {
        alert("Import impossible : fichier JSON invalide.");
      } finally {
        event.target.value = "";
      }
