<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feu Clair — v2.16.0</title>

  <style>
    :root {
      --bg: #fbf7ef;
      --surface: #fffdf8;
      --surface-2: #f4eadf;
      --text: #2f2923;
      --muted: #756b61;
      --line: #e5d7c8;
      --accent: #c76f47;
      --accent-2: #e8b86d;
      --good: #679b78;
      --danger: #b15b5b;
      --shadow: 0 10px 28px rgba(70, 45, 25, 0.10);
      --radius: 18px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      --bg: #161412;
      --surface: #211d1a;
      --surface-2: #2c2621;
      --text: #f5eadc;
      --muted: #c9b7a2;
      --line: #44382f;
      --accent: #e08a5f;
      --accent-2: #f0c77a;
      --good: #8bc99c;
      --danger: #d07171;
      --shadow: 0 10px 28px rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, rgba(232,184,109,.22), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(199,111,71,.16), transparent 28rem),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: .72rem 1rem;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }

    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #25150d;
      font-weight: 700;
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--line);
    }

    button.ghost:hover {
      background: color-mix(in srgb, var(--surface-2) 72%, transparent);
    }

    button.danger {
      background: rgba(177,91,91,.15);
      color: var(--danger);
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 14px;
      padding: .75rem .85rem;
      outline: none;
    }

    textarea {
      min-height: 7rem;
      resize: vertical;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 1rem 0 .4rem;
    }

    small {
      color: var(--muted);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    header {
      padding: 1rem;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: .75rem;
      justify-content: space-between;
    }

    .brand h1 {
      font-size: 1.1rem;
      margin: 0;
    }

    .brand p {
      margin: .1rem 0 0;
      color: var(--muted);
      font-size: .86rem;
    }

    nav {
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      overflow-x: auto;
    }

    .tabs {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: .45rem;
      padding: .6rem 1rem;
    }

    .tab {
      white-space: nowrap;
      padding: .62rem .85rem;
      border-radius: 999px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
    }

    .tab.active {
      color: var(--text);
      border-color: var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    .grid {
      display: grid;
      gap: 1rem;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
    }

    .card h2, .card h3 {
      margin: 0 0 .6rem;
      color: var(--text);
    }

    h1, h2, h3, h4,
    label,
    summary,
    .choice,
    .summary,
    .notice,
    .brand h1 {
      color: var(--text);
    }

    .muted {
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
      margin-top: 1rem;
    }

    .library-panel .actions + .notice,
    .library-panel .actions + .grid,
    .library-panel .notice + details,
    .library-panel .grid + details,
    .library-panel details + details {
      margin-top: .85rem;
    }

    .library-panel details {
      padding-top: .15rem;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin: .5rem 0;
    }

    .choice {
      display: inline-flex;
      align-items: center;
      gap: .42rem;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: .55rem .7rem;
      cursor: pointer;
      user-select: none;
    }

    .choice input {
      width: auto;
    }

    .step-shell {
      display: grid;
      gap: 1rem;
    }

    .progress {
      display: flex;
      gap: .35rem;
      overflow-x: auto;
      padding-bottom: .25rem;
    }

    .path-guide {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      flex-wrap: wrap;
      padding: .75rem .85rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
    }

    .path-guide p {
      margin: 0;
    }

    .dot {
      min-width: 2.2rem;
      height: 2.2rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface);
      font-size: .8rem;
    }

    .dot.active {
      color: #25150d;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 800;
    }

    .dot.done {
      border-color: var(--good);
      color: var(--good);
    }

    .notice {
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--accent-2) 18%, var(--surface));
      border-radius: 14px;
      padding: .85rem;
      color: var(--text);
    }

    .notice h3 {
      margin: 0 0 .35rem;
      font-size: 1rem;
    }

    .dangerBox {
      border-left-color: var(--danger);
      background: color-mix(in srgb, var(--danger) 16%, var(--surface));
    }

    .softBox {
      border-left-color: var(--good);
      background: color-mix(in srgb, var(--good) 14%, var(--surface));
    }

    .summary {
      white-space: pre-wrap;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      color: var(--text);
    }

    .body-map {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .55rem;
      margin-top: .7rem;
    }

    .body-zone {
      width: 100%;
      text-align: left;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      padding: .72rem .8rem;
    }

    .body-zone small {
      display: block;
      margin-top: .18rem;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .85rem;
    }

    .tool-card {
      min-height: 10.5rem;
      width: 100%;
      display: grid;
      align-content: start;
      gap: .45rem;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .tool-card strong {
      display: block;
      font-size: 1.05rem;
      color: var(--text);
    }

    .tool-card span {
      display: block;
      color: var(--muted);
      line-height: 1.35;
    }

    .tool-card small {
      display: inline-block;
      width: fit-content;
      margin-top: .25rem;
      border-radius: 999px;
      padding: .28rem .55rem;
      background: color-mix(in srgb, var(--accent-2) 22%, var(--surface));
      color: var(--text);
    }

    .tool-card.body {
      background: color-mix(in srgb, #e6f2df 48%, var(--surface));
    }

    .tool-card.memory {
      background: color-mix(in srgb, #e8edf7 50%, var(--surface));
    }

    .tool-card.authority {
      background: color-mix(in srgb, #f7e3d5 52%, var(--surface));
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem;
    }

    .hidden {
      display: none !important;
    }

    .print-only {
      display: none;
    }

    .mini {
      font-size: .88rem;
    }

    .body-return-panel {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(31, 24, 19, .52);
      backdrop-filter: blur(5px);
    }

    .body-return-card {
      width: min(100%, 34rem);
      max-height: calc(100vh - 2rem);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.1rem;
      box-shadow: var(--shadow);
    }

    .body-return-card h2 {
      margin-top: 0;
    }

    .body-return-card ol {
      padding-left: 1.35rem;
    }

    @media (max-width: 760px) {
      header { padding: .8rem; }
      main { padding: .8rem; }
      .grid.two { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; }
      .actions button { flex: 1 1 auto; }
      .brand p { display: none; }
      .body-map { grid-template-columns: 1fr; }
      .tool-grid { grid-template-columns: 1fr; }
    }

    @media print {
      @page {
        margin: 14mm;
      }

      header, nav, .actions, .toolbar, button, input[type="file"], .body-return-panel {
        display: none !important;
      }

      html, body, .app {
        min-height: auto !important;
        height: auto !important;
      }

      body {
        margin: 0 !important;
        background: white !important;
        color: black !important;
      }

      .app {
        display: block !important;
      }

      main {
        display: block !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .grid,
      .grid.two,
      .step-shell {
        display: block !important;
      }

      .card {
        box-shadow: none;
        border: 1px solid #ddd;
        margin: 0 0 10mm;
        break-inside: auto;
        page-break-inside: auto;
      }

      .summary,
      .notice {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .print-only {
        display: block !important;
      }
    }

    [data-theme="dark"] button.ghost {
      background: color-mix(in srgb, var(--surface) 68%, #000 32%);
      border-color: color-mix(in srgb, var(--line) 82%, #000 18%);
      color: var(--muted);
    }

    [data-theme="dark"] button.ghost:hover {
      background: color-mix(in srgb, var(--surface-2) 78%, #000 22%);
      color: var(--text);
    }

    [data-theme="dark"] input,
    [data-theme="dark"] textarea,
    [data-theme="dark"] select,
    [data-theme="dark"] .choice,
    [data-theme="dark"] .summary,
    [data-theme="dark"] .notice {
      color: var(--text);
      border-color: var(--line);
    }

    [data-theme="dark"] input::placeholder,
    [data-theme="dark"] textarea::placeholder {
      color: color-mix(in srgb, var(--muted) 78%, transparent);
    }
  </style>
</head>

        { id: "r_enfant_2", text: "J’ai protégé les adultes au lieu d’être protégé.", family: "enfant", intensity: "très direct", mode: "intensif", zones: ["dos", "ventre"], masks: ["sauveur"], egregores: ["enfant-parentifie"], element: "terre", tags: ["enfance"], active: true },
        { id: "r_absorbee_1", text: "Ce feu ne semble pas entièrement à moi.", family: "absorbee", intensity: "doux", mode: "doux", zones: ["tout le corps"], masks: ["fascination-sombre"], egregores: ["collectif"], element: "terre", tags: ["restitution"], active: true },
        { id: "r_absorbee_2", text: "Je peux rendre la charge sans perdre l’information utile.", family: "absorbee", intensity: "doux", mode: "doux", zones: ["mains", "pieds"], masks: ["contrôle"], egregores: ["absorption"], element: "terre", tags: ["restitution"], active: true },
        { id: "r_masquee_1", text: "Cette colère se cache peut-être derrière une fuite, une compulsion ou une inertie.", family: "masquee", intensity: "moyen", mode: "profond", zones: ["ventre", "mains"], masks: ["fuite", "inertie"], egregores: ["auto-sabotage"], element: "air", tags: ["masque"], active: true },
        { id: "r_masquee_2", text: "Cette colère semble être une porte : dessous, une peur ou une tristesse demande peut-être à être reconnue.", family: "masquee", intensity: "doux", mode: "doux", zones: ["poitrine"], masks: ["contrôle"], egregores: ["honte"], element: "eau", tags: ["émotion cachée"], active: true },
        { id: "r_spirituelle_1", text: "Signature perçue comme étrangère, parasite, programmée ou non alignée : je discerne sans conclure trop vite.", family: "spirituelle", intensity: "direct", mode: "intensif", zones: ["tête", "plexus"], masks: ["guerre-spirituelle"], egregores: ["confusion-subtile"], element: "éther", tags: ["discernement"], active: true },
        { id: "r_spirituelle_2", text: "Je ne dirige pas ce feu contre un être vivant présent ; je le dirige contre la charge, le lien, l’inversion ou l’emprise perçue.", family: "spirituelle", intensity: "très direct", mode: "intensif", zones: ["mains", "pieds"], masks: ["vengeance"], egregores: ["emprise"], element: "feu", tags: ["sécurité"], active: true },
        { id: "r_collective_1", text: "Je rends le collectif au collectif : je garde mon action juste, pas toute la charge du monde.", family: "collective", intensity: "doux", mode: "doux", zones: ["épaules", "dos"], masks: ["sauveur"], egregores: ["désespoir-collectif"], element: "terre", tags: ["collectif"], active: true },
        { id: "r_collective_2", text: "Je réduis l’immensité à une prochaine marche possible.", family: "collective", intensity: "doux", mode: "doux", zones: ["jambes", "pieds"], masks: ["impuissance"], egregores: ["effondrement"], element: "terre", tags: ["action"], active: true },
        { id: "r_relationnel_1", text: "J’ai peut-être laissé le lien décider à la place de ma limite.", family: "limite", intensity: "moyen", mode: "doux", zones: ["poitrine", "gorge"], masks: ["gentillesse-forcee"], egregores: ["dependance-affective", "dette-affective"], element: "air", tags: ["lien", "limite"], active: true },
        { id: "r_relationnel_2", text: "Une fragilité autour de moi a peut-être été utilisée pour m’empêcher de dire non.", family: "limite", intensity: "direct", mode: "profond", zones: ["gorge", "dos"], masks: ["sauveur"], egregores: ["culpabilisation-fragilite"], element: "terre", tags: ["chantage émotionnel", "discernement"], active: true },
        { id: "r_fausse_lumiere_1", text: "La vraie paix ne me demande pas de nier ce qui a été blessé.", family: "spirituelle", intensity: "direct", mode: "profond", zones: ["poitrine", "plexus"], masks: ["pardon-premature"], egregores: ["paix-sans-verite"], element: "soleil", tags: ["fausse lumière", "vérité"], active: true },
        { id: "r_fausse_lumiere_2", text: "La douceur juste n’interdit pas la limite ; elle l’éclaire.", family: "spirituelle", intensity: "moyen", mode: "profond", zones: ["poitrine", "mains"], masks: ["spiritualisation"], egregores: ["douceur-interdit-limite"], element: "soleil", tags: ["limite", "spirituel"], active: true },
        { id: "r_corps_1", text: "Mon corps a peut-être dit non avant que ma tête ose comprendre.", family: "absorbee", intensity: "moyen", mode: "doux", zones: ["ventre", "mâchoire"], masks: ["inertie"], egregores: ["corps-controle", "gorge-verrouillee"], element: "terre", tags: ["corps", "consentement"], active: true },
        { id: "r_parole_3", text: "Ma parole n’a pas besoin d’être violente pour être ferme.", family: "parole", intensity: "doux", mode: "doux", zones: ["gorge"], masks: ["peur-rejet"], egregores: ["peur-blesser", "parole-confisquee"], element: "air", tags: ["parole", "fermeté"], active: true },
        { id: "r_addiction_1", text: "Ce comportement est peut-être une fausse porte pour un feu qui veut sortir.", family: "masquee", intensity: "direct", mode: "profond", zones: ["ventre", "mains"], masks: ["addiction"], egregores: ["anesthesie", "vide-interieur"], element: "terre", tags: ["inversion", "addiction"], active: true },
        { id: "r_jouissance_1", text: "Je distingue le plaisir vivant de l’intensité qui me vide après.", family: "masquee", intensity: "direct", mode: "profond", zones: ["ventre", "poitrine"], masks: ["jouissance-vide"], egregores: ["corps-utilise", "sexualite-blessee"], element: "eau", tags: ["discernement", "désir"], active: true },
        { id: "r_perversion_1", text: "Je ne confonds pas mon essence avec une inversion : je cherche la force saine capturée dessous.", family: "masquee", intensity: "très direct", mode: "intensif", zones: ["ventre", "plexus"], masks: ["fascination-sombre"], egregores: ["honte-corporelle", "emprise"], element: "feu", tags: ["inversion", "prudence"], active: true },
        { id: "r_enfant_3", text: "Avant les mots forts, je vérifie que la part enfant en moi est en sécurité pour entendre cela.", family: "enfant", intensity: "doux", mode: "profond", zones: ["ventre", "poitrine"], masks: ["enfant-adapte"], egregores: ["enfant-invisible"], element: "eau", tags: ["enfance", "sécurité"], active: true },
        { id: "r_collective_3", text: "Je peux voir le monde sans porter tout le monde dans mon système nerveux.", family: "collective", intensity: "doux", mode: "doux", zones: ["épaules", "dos"], masks: ["sauveur"], egregores: ["peur-mediatique", "scandale-permanent"], element: "terre", tags: ["collectif", "ancrage"], active: true },
        { id: "r_autorite_1", text: "Je rends la charge, je garde l’épée : mon autorité reste gardienne de mes actes.", family: "spirituelle", intensity: "direct", mode: "intensif", zones: ["mains", "plexus"], masks: ["vengeance"], egregores: ["guerre-spirituelle-permanente"], element: "feu", tags: ["autorité", "responsabilité"], active: true }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return cloneData(DEFAULT_DATA);
      const parsed = JSON.parse(raw);
      return mergeDefaults(DEFAULT_DATA, parsed);
    } catch (error) {
      console.warn("Données locales illisibles, retour aux données par défaut.", error);
      return cloneData(DEFAULT_DATA);
    }
  }

  function mergeDefaults(base, saved) {
    if (Array.isArray(base)) return Array.isArray(saved) ? saved : base;
    if (typeof base !== "object" || base === null) return saved ?? base;
    const out = { ...base, ...(saved || {}) };
    for (const key of Object.keys(base)) {
      out[key] = mergeDefaults(base[key], saved?.[key]);
    }
    return out;
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (error) {
      console.warn("Sauvegarde locale impossible.", error);
      data.lastNotice = {
        text: "Sauvegarde locale indisponible sur ce navigateur. Exporte un JSON si tu veux conserver cette session.",
        tone: "danger",
        createdAt: nowISO()
      };
      return false;
    }
  }

    } catch (error) {
      console.warn("Voile de session impossible à modifier.", error);

  function normalizeData(input) {
    const normalized = mergeDefaults(DEFAULT_DATA, input || {});
    normalized.version = APP_VERSION;
    normalized.settings = mergeDefaults(DEFAULT_DATA.settings, normalized.settings || {});
    normalized.settings.advancedContent = mergeDefaults(DEFAULT_DATA.settings.advancedContent, normalized.settings.advancedContent || {});
    normalized.cycles ||= [];
    normalized.cycles = normalized.cycles.map(cycle => ({
      ...cycle,
      status: CYCLE_STATUSES.includes(cycle?.status) ? cycle.status : "ouvert",
      answers: cycle?.answers && typeof cycle.answers === "object" ? cycle.answers : {}
    }));
    normalized.microSessions ||= [];
    normalized.bodyScans ||= [];
    normalized.bodyMemorySessions ||= [];
    normalized.authoritySessions ||= [];
    normalized.library = mergeLibraryDefaults(normalized.library || {});
    normalized.lastNotice ||= null;
    return normalized;
  }

  function mergeLibraryDefaults(savedLibrary) {
    const merged = {};
    Object.entries(DEFAULT_DATA.library).forEach(([key, defaultItems]) => {
      const savedItems = Array.isArray(savedLibrary?.[key]) ? savedLibrary[key] : [];
      const byId = new Map(savedItems.map(item => {
        const normalized = normalizeLibraryItem(item, key);
        return [normalized.id, normalized];
      }));
      merged[key] = defaultItems.map(item => {
        const normalizedDefault = normalizeLibraryItem(item, key);
        return byId.get(normalizedDefault.id) || normalizedDefault;
      });
      savedItems.forEach(item => {
        const normalized = normalizeLibraryItem(item, key);
        if (!merged[key].some(existing => existing.id === normalized.id)) merged[key].push(normalized);
      });
    });
    Object.keys(savedLibrary || {}).forEach(key => {
      if (!merged[key] && Array.isArray(savedLibrary[key])) {
        merged[key] = savedLibrary[key].map(item => normalizeLibraryItem(item, key));
      }
    });
    return merged;
  }

  function normalizeLibraryItem(item, fallbackPrefix = "item") {
    if (typeof item === "string") {
      return {
        id: slugify(item) || uid(fallbackPrefix),
        label: item,
        text: item,
        mode: "doux",
        intensity: "doux",
        tags: [],
        active: true,
        custom: false
      };
    }
    return {
      id: item?.id || slugify(item?.label || item?.text || fallbackPrefix) || uid(fallbackPrefix),
      label: item?.label || item?.text || "",
      text: item?.text || item?.label || "",
      family: item?.family || "",
      intensity: item?.intensity || "doux",
      mode: item?.mode || "doux",
      zones: item?.zones || [],
      masks: item?.masks || [],
      egregores: item?.egregores || [],
      element: item?.element || "",
      cue: item?.cue || "",
      tags: item?.tags || [],
      active: item?.active !== false,
      custom: item?.custom === true,
      createdAt: item?.createdAt || ""
    };
  }

  function libraryItems(key, options = {}) {
    const source = data.library?.[key] ?? DEFAULT_DATA.library[key] ?? [];
    if (Array.isArray(source)) {
      return dedupeLibraryItems(source
        .map(item => normalizeLibraryItem(item, key))
        .filter(item => item.active)
        .filter(item => options.ignoreCategoryToggle || libraryCategoryEnabled(key))
        .filter(item => options.includeSensitive || itemAllowedByArchetype(item, key))
        .filter(item => options.includeSensitive || itemAllowedByAdvancedContent(item, key)));
    }
    return [];
  }

  function dedupeLibraryItems(items) {
    const seen = new Set();
    return items.filter(item => {
      const signature = slugify(item.text || item.label || item.id);
      if (!signature) return true;
      if (seen.has(signature)) return false;
      seen.add(signature);
      return true;
    });
  }

  function libraryCategoryEnabled(key) {
    if (!Object.prototype.hasOwnProperty.call(data.settings.libraryEnabled || {}, key)) return true;
    return data.settings.libraryEnabled[key] !== false;
  }

  function itemAllowedByArchetype(item, key) {
    if (data.settings.archetypeMode !== "neutre") return true;
    const sensitiveWords = [
      "spirituel",
      "subtil",
      "éther",
      "ether",
      "signature-etrangere",
      "signature étrangère",
      "parasite",
      "programmée",
      "non alignée",
      "mikaël",
      "dragon",
      "source",
      "fausse lumière"
    ];
    const haystack = [
      key,
      item.id,
      item.label,
      item.text,
      item.family,
      item.element,
      item.mode,
      ...(item.tags || []),
      ...(item.egregores || [])
    ].join(" ").toLowerCase();
    return !sensitiveWords.some(word => haystack.includes(word));
  }

  function itemAllowedByAdvancedContent(item, key) {
    const settings = data.settings.advancedContent || DEFAULT_DATA.settings.advancedContent;
    const haystack = [
      key,
      item.id,
      item.label,
      item.text,
      item.family,
      item.intensity,
      item.mode,
      item.element,
      ...(item.tags || []),
      ...(item.masks || []),
      ...(item.egregores || [])
    ].join(" ").toLowerCase();

    const isVeryDirectWord = key === "boldWords" || (item.tags || []).includes("mots qui osent");
    if (!settings.veryDirectWords && isVeryDirectWord && (item.intensity === "très direct" || item.mode === "intensif")) return false;
    if (!settings.inversions && [
      "inversion",
      "addiction",
      "jouissance",
      "perversion",
      "fascination-sombre",
      "sexualite",
      "sexualité",
      "emprise"
    ].some(word => haystack.includes(word))) return false;
    if (!settings.childhoodDeep && [
      "enfant",
      "enfance",
      "mémoire",
      "memoire",
      "innocence"
    ].some(word => haystack.includes(word))) return false;
    if (!settings.bodyMemory && [
      "mémoire corporelle",
      "memoire corporelle",
      "toucher-non-respecte",
      "corps-utilise"
    ].some(word => haystack.includes(word))) return false;

  function librarySearchResults(query) {

    const groups = [

      ["Positionnement", libraryItems("positioningPhrases")],
      ["Action / non-action", libraryItems("actionOptions")]
    ];
    return groups.flatMap(([type, items]) => items.map(item => {
      const text = item.text || item.label || "";
      const haystack = [
        text,
        item.family,
        item.intensity,
        item.mode,
        item.element,
        ...(item.tags || []),
        ...(item.zones || []),
        ...(item.masks || []),
        ...(item.egregores || [])
      ].join(" ").toLowerCase();
      return haystack.includes(q) ? { type, text, item } : null;
    }).filter(Boolean)).slice(0, 12);
  }

      authority_session: "le Feu d’Autorité"
    };
    return labels[cycle?.entry?.source] || "une porte d’entrée";
  }

  function renderEntrySas(cycle, answers) {
    if (!cycleHasEntrySas(cycle)) return "";
    const canContinue = entrySasCanContinue(cycle);
    const alerts = entrySasAlertFlags(answers);
    return `
      <div class="notice ${canContinue ? "softBox" : ""}">
        <strong>Mini-sas depuis ${escapeHtml(entrySasSourceLabel(cycle))}</strong><br />
        Cette porte est une piste possible, pas une preuve. Avant d’aller plus loin, vérifions si ton feu est traversable maintenant.
      </div>

      <label>Intensité actuelle</label>
      <select data-field="intensity">
        <option value="" ${answers.intensity === "" || answers.intensity == null ? "selected" : ""}>Je ne sais pas encore</option>
        ${Array.from({ length: 11 }, (_, i) => option(String(i), `${i}/10`, String(answers.intensity ?? ""))).join("")}
      </select>

      <label>Stabilité actuelle</label>
      ${radios("entryStability", [
        "stable|Je me sens assez stable pour identifier doucement",
        "uncertain|Je ne sais pas encore",
        "unstable|Je ne me sens pas assez stable"
      ], answers.entryStability || "")}

      <label>Capacité à revenir au corps</label>
      ${radios("canReturnToBody", [
        "yes|Je peux revenir au corps maintenant",
        "uncertain|Je ne sais pas",
        "no|Je n’arrive pas à revenir au corps"
      ], answers.canReturnToBody || "")}

      <label>Points d’attention éventuels</label>
      ${checks("entryFlags", [
        "Confusion",
        "Envie de fuir",
        "Vide inquiétant",
        "Activation forte"
      ], answers.entryFlags)}

      ${canContinue ? `
        <div class="notice softBox">
          Le sas est suffisamment stable pour aller vers Identifier. Tu peux aussi rester ici ou fermer proprement.
        </div>
      ` : `
        <div class="notice dangerBox">
          ${alerts.length
            ? `Point d’attention : ${escapeHtml(alerts.join(", "))}.`
            : "Reste à Stabiliser tant que l’intensité, la stabilité ou le retour au corps ne sont pas assez clairs."}
          Tu peux utiliser “Retour au corps” ou fermer proprement pour aujourd’hui.
        </div>
      `}
    `;
  }

  function depthAllows(itemMode, depth) {
    const rank = { doux: 1, profond: 2, intensif: 3 };
    return (rank[itemMode] || 1) <= (rank[depth] || 1);
  }

  function resonanceWave(cycle) {
    const selected = selectedFamilyIds(getStepAnswers(2).families || []);
    const depth = currentDepth(cycle);
    const regulation = currentRegulation(cycle);
    const items = resonanceItems().filter(item => {
      const familyMatch = !selected.length || selected.includes(item.family) || selected.includes(item.label);
      const depthMatch = depthAllows(item.mode, depth);
      const regulationMatch = regulation === "tooActivated" ? item.intensity !== "très direct" : true;
      return familyMatch && depthMatch && regulationMatch;
    });
    return items.slice(0, RESONANCE_WAVE_LIMIT).map(item => item.text || item.label);
  }

  function renderRegulationNotice(cycle) {
    const mode = currentRegulation(cycle);
    if (mode === "numb") {
      return `
        <div class="notice softBox">
          <h3>Mode “je ne ressens rien”</h3>
          Rien à forcer. Lis par résonance, coche même une phrase lointaine si elle semble importante, puis reviens au corps.
          <div class="pill-list">
            ${libraryItems("numbPrompts").map(item => `<span class="choice">${escapeHtml(item.label)}</span>`).join("")}
          </div>
          <details>
            <summary>Détecteur de verrouillage</summary>
            <p class="mini"><strong>Vrai calme :</strong> ouvert, stable, respirant, libre.</p>
            <p class="mini"><strong>Verrou possible :</strong> vide, coupé, confus, somnolent, absent, irrité, ou envie soudaine de quitter.</p>
            <ul class="mini">
              <li>Qu’est-ce qui pourrait arriver si cette colère sortait ?</li>
              <li>Quelle loyauté serait menacée par ma vérité ?</li>
              <li>Quelle punition ancienne mon corps anticipe peut-être ?</li>
              <li>Quelle image de moi tomberait si je reconnaissais ce feu ?</li>
            </ul>
          </details>
        </div>
      `;
    }
    if (mode === "tooActivated") {
      return `
        <div class="notice dangerBox">
          <h3>Mode “je suis trop activé”</h3>
          Corps d’abord. Aucune décision extérieure maintenant. Tu peux fermer proprement à tout moment.
          <ol class="mini">
            ${libraryItems("strongCloseSteps").map(item => `<li>${escapeHtml(item.label)}</li>`).join("")}
          </ol>
          <div class="actions">
            <button class="danger" data-action="strong-close">Trop fort — je ferme maintenant</button>
          </div>
        </div>
      `;
    }
    return "";
  }

  function defaultClosingPhrase() {
    return libraryItems("closingPhrases")[0]?.text || "Cette charge est libérée maintenant. Si ce feu revient, il revient comme signal, non comme prison.";
  }

  function cycleCompletionHints(cycle) {
    const s = cycle.answers || {};
    const missing = [];
    if (!s[5]?.trueName && !s[5]?.rootName) missing.push("un nom du feu");
    if (!s[7]?.whatIReturn) missing.push("ce qui est rendu");
    if (!Array.isArray(s[7]?.qualities) || !s[7].qualities.length) missing.push("une qualité récupérée");
    if (!s[8]?.innerBoundary && !s[8]?.action) missing.push("une limite, action ou non-action");
    if (!s[9]?.closingPhrase && !s[9]?.closingPreset) missing.push("une phrase de clôture");
    return missing;
  }

  function cycleMiniSummary(c) {
    const s = c.answers || {};
    const a5 = s[5] || {};
    const a7 = s[7] || {};
    const a8 = s[8] || {};
    return [
      a5.trueName || a5.rootName ? `Feu : ${a5.trueName || a5.rootName}` : "",
      a7.whatIReturn ? `Rendu : ${a7.whatIReturn}` : "",
      Array.isArray(a7.qualities) && a7.qualities.length ? `Récupéré : ${a7.qualities.join(", ")}` : "",
      a8.action || a8.actionOption ? `Prochaine marche : ${a8.action || a8.actionOption}` : ""
    ].filter(Boolean).join("\n");
  }

  function visibleCycleTitle(cycle, index = 0) {
    if (cycle.rawTextsHidden) return `Cycle aux textes masqués${index ? ` ${index + 1}` : ""}`;
    if (!data.settings.privacy?.maskSensitiveTitles) return cycle.title || "Cycle sans titre";
    return `Cycle masqué ${index + 1}`;
  }

  function visibleStepLabel(stepIndex) {
    return stepIndex === 0 ? "Préparer" : `Étape ${stepIndex} — ${STEPS[stepIndex]}`;
  }

  function visibleStepProgress(stepIndex) {
    return stepIndex === 0 ? "Préparer" : `Étape ${stepIndex}/9 — ${STEPS[stepIndex]}`;
  }

  function anonymizedExportData() {
    return {
      app: "feu-clair",
      version: APP_VERSION,
      exportMode: "anonymisé",
      exportedAt: nowISO(),
      cycles: (data.cycles || []).map((cycle, index) => ({
        id: `cycle_${index + 1}`,
        title: `Cycle anonymisé ${index + 1}`,
        status: cycle.status || "",
        currentStep: Number.isFinite(cycle.currentStep) ? cycle.currentStep : 0,
        createdAt: cycle.createdAt || "",
        updatedAt: cycle.updatedAt || "",
        notes: "",
        answers: anonymizeAnswers(cycle.answers || {})
      })),
      microSessions: [],
      bodyScans: (data.bodyScans || []).map(scan => ({
        status: scan.status || "",
        createdAt: scan.createdAt || "",
        intensity: scan.intensity ?? null,
        family: scan.family || "",
        flags: scan.flags || []
      })),
      bodyMemorySessions: (data.bodyMemorySessions || []).map(memory => ({
        status: memory.status || "",
        createdAt: memory.createdAt || "",
        level: memory.level || "",
        kind: memory.kind || "",
        intensity: memory.intensity ?? null,
        guards: memory.guards || [],
        qualities: memory.qualities || [],
        afterState: memory.afterState || ""
      })),
      authoritySessions: (data.authoritySessions || []).map(session => ({
        status: session.status || "",
        createdAt: session.createdAt || "",
        intensity: session.intensity ?? null,
        targetType: session.targetType || "",
        guards: session.guards || [],
        qualities: session.qualities || []
      }))
    };
  }

  function cycleExportData(cycle, options = {}) {
    const anonymized = options.anonymized === true;
    const summaryOnly = options.summaryOnly === true;
    const withoutRawTexts = options.withoutRawTexts === true;
    const copy = cloneData(cycle);
    if (summaryOnly) {
      return {
        app: "feu-clair",
        version: APP_VERSION,
        exportMode: "cycle synthèse seulement",
        exportedAt: nowISO(),
        cycle: {
          id: copy.id,
          title: copy.title,
          status: copy.status,
          createdAt: copy.createdAt,
          updatedAt: copy.updatedAt,
          summary: buildCycleSummary(copy)
        }
      };
    }
    if (anonymized || withoutRawTexts) {
      copy.title = "Cycle anonymisé";
      copy.notes = "";
      copy.answers = anonymizeAnswers(copy.answers || {});
    }
    return {
      app: "feu-clair",
      version: APP_VERSION,
      exportMode: anonymized ? "cycle anonymisé" : withoutRawTexts ? "cycle sans textes bruts" : "cycle complet",
      exportedAt: nowISO(),
      cycle: copy
    };
  }

  function anonymizeAnswers(answers) {
    const keepKeys = new Set([
      "depth",
      "regulationMode",
      "intensity",
      "grounding",
      "families",
      "resonancePhrases",
      "masks",
      "bodySignals",
      "ownership",
      "permissionPhrase",
      "namingPermission",
      "exit",
      "intensityAfter",
      "element",
      "qualities",
      "positioningPhrase",
      "actionOption",
      "closingPreset",
      "integrationDone"
    ]);
    return Object.fromEntries(Object.entries(answers || {}).map(([step, values]) => [
      step,
      Object.fromEntries(Object.entries(values || {}).filter(([key]) => keepKeys.has(key)))
    ]));
  }

  function redactCycleRawTexts(cycle) {
    const textKeys = [
      "intention",
      "trigger",
      "against",
      "forWhat",
      "secondaryAngers",
      "discernmentNotes",
      "falseName",
      "trueName",
      "rootName",
      "exitPhrase",
      "whatIReturn",
      "innerBoundary",
      "spokenBoundary",
      "action",
      "quarantineMessage",
      "closingPhrase",
      "nextGentleStep",
      "bodyScanNotes",
      "bodyMemoryNotes"
    ];
    Object.values(cycle.answers || {}).forEach(stepAnswers => {
      textKeys.forEach(key => {
        if (typeof stepAnswers[key] === "string" && stepAnswers[key].trim()) {
          stepAnswers[key] = "[texte effacé]";
        }
      });
    });
    cycle.notes = "";
    cycle.updatedAt = nowISO();
  }

  function slugify(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function setNotice(text, tone = "soft") {
    data.lastNotice = {
      text,
      tone,
      createdAt: nowISO()
    };
    saveData();
  }

  function renderLastNotice() {
    if (!data.lastNotice?.text) return "";
    const toneClass = data.lastNotice.tone === "danger" ? "dangerBox" : "softBox";
    return `
      <div class="notice ${toneClass}">
        ${escapeHtml(data.lastNotice.text)}
      </div>
    `;
  }

  function setStep(stepIndex) {
    const c = activeCycle();
    if (!c) return;
    c.currentStep = Math.max(0, Math.min(STEPS.length - 1, stepIndex));
    c.updatedAt = nowISO();
    saveData();
    render();
  }

  function advanceStep() {
    const c = activeCycle();
    if (!c) return;
    if (c.currentStep === 1 && cycleHasEntrySas(c) && !entrySasCanContinue(c)) {
      setNotice("Le sas demande encore un peu de stabilisation. Vérifie l’intensité, le retour au corps et les points d’attention avant de continuer.", "danger");
      render();
      return;
    }
    setStep(c.currentStep + 1);
  }

  function getStepAnswers(stepIndex = activeCycle()?.currentStep ?? 0) {
    const c = activeCycle();
    if (!c) return {};
    c.answers[stepIndex] ||= {};
    return c.answers[stepIndex];
  }

  function setAnswer(stepIndex, key, value) {
    const c = activeCycle();
    if (!c) return;
    c.answers[stepIndex] ||= {};
    c.answers[stepIndex][key] = value;
    c.updatedAt = nowISO();
    saveData();
  }

  function render() {
    document.querySelector("#app").dataset.theme = data.settings.theme;
    if (data.settings.privacy?.localVeilEnabled && !localVeilUnlocked()) {
      renderTabs({ locked: true });
      document.querySelector("#view").innerHTML = renderLocalVeil();
      bindDynamicEvents();
      return;
    }
    renderTabs();

    const view = document.querySelector("#view");
    if (data.activeTab === "boussole") view.innerHTML = renderBoussole();
    if (data.activeTab === "soin") view.innerHTML = renderSoin();
    if (data.activeTab === "micro") view.innerHTML = renderMicroSoin();
    if (data.activeTab === "outils") view.innerHTML = renderOutils();
    if (data.activeTab === "carnet") view.innerHTML = renderCarnet();
    if (data.activeTab === "sanctuaire") view.innerHTML = renderSanctuaire();
    if (bodyReturnOpen) view.insertAdjacentHTML("beforeend", renderBodyReturnPanel());

    bindDynamicEvents();
  }

  function renderBodyReturnPanel() {
    return `
      <div class="body-return-panel" role="dialog" aria-modal="true" aria-labelledby="body-return-title">
        <div class="body-return-card">
          <h2 id="body-return-title">Retour au corps</h2>
          <p class="muted">Rien à comprendre maintenant. On revient ici.</p>
          <ol>
            <li>Ouvre les yeux.</li>
            <li>Nomme 3 objets visibles.</li>
            <li>Sens tes pieds au sol.</li>
            <li>Pose une main sur le cœur ou le ventre.</li>
            <li>Respire lentement.</li>
            <li>Dis intérieurement : “pas plus que ce que je peux porter maintenant”.</li>
          </ol>
          <div class="actions">
            <button class="primary" data-action="body-return-resume">Je reviens au soin</button>
            <button class="ghost" data-action="body-return-close-today">Je ferme pour aujourd’hui</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderTabs(options = {}) {
    const el = document.querySelector("#tabs");
    if (options.locked) {
      el.innerHTML = "";
      return;
    }
    el.innerHTML = tabs.map(tab => `
      <button class="tab ${data.activeTab === tab.id ? "active" : ""}" data-tab="${tab.id}">
        ${tab.label}
      </button>
    `).join("");
  }

  function renderLocalVeil() {
    return `
      <section class="grid">
        <div class="card">
          <h2>Voile local actif</h2>
          <p class="muted">
            L’affichage de Feu Clair est masqué pour cette session. Ce voile protège seulement contre un regard rapide :
            il ne chiffre pas les données et ne remplace pas la sécurité de l’appareil.
          </p>
          <label>Phrase d’ouverture</label>
          <input id="local-veil-input" placeholder="Tape OUVRIR" autocomplete="off" />
          <div class="actions">
            <button class="primary" data-action="unlock-local-veil">Ouvrir cette session</button>
          </div>
        </div>
      </section>
    `;
  }

  function renderBoussole() {
    const c = activeCycle();
    return `
      <section class="grid">
        ${renderLastNotice()}

        <div class="card">
          <h2>Où en est ton feu maintenant ?</h2>
          <p class="muted">Choisis une seule porte. L’application te montrera ensuite seulement la prochaine marche.</p>

          <div class="actions">
            <button class="primary" data-action="new-cycle">Commencer un Cycle de Feu</button>
            <button data-tab="micro">Faire un micro-soin</button>
            <button data-tab="outils" data-tool="body-scan">Scanner une zone du corps</button>
            <button data-tab="carnet">Voir le Carnet</button>
          </div>
        </div>

        <div class="grid two">
          <div class="card">
            <h3>Soin actif</h3>
            ${
              c ? `
                <p><strong>${escapeHtml(visibleCycleTitle(c))}</strong></p>
                <p class="muted mini">Statut : ${escapeHtml(c.status)} · ${escapeHtml(visibleStepProgress(c.currentStep))}</p>
                ${c.status === "à revisiter doucement" ? `
                  <div class="notice dangerBox mini">
                    Ce cycle a été fermé pendant une activation forte. Reprise douce recommandée : stabiliser avant de rouvrir.
                  </div>
                ` : ""}
                ${c.status === "à intégrer" ? `
                  <div class="notice softBox mini">
                    Cycle à intégrer : relire la synthèse, imprimer si utile, puis laisser le corps faire sa part.
                  </div>
                ` : ""}
                <div class="actions">
                  <button class="primary" data-tab="soin">Reprendre exactement ici</button>
                  <button class="ghost" data-action="close-cycle-soft">Fermer proprement pour aujourd’hui</button>
                </div>
              ` : `
                <p class="muted">Aucun Cycle de Feu actif pour l’instant.</p>
              `
            }
          </div>

          <div class="card">
            <h3>Règle de clarté</h3>
            <p>Une seule colère suffit pour cette traversée. Les autres peuvent attendre dans le Carnet, sans être perdues.</p>
            <p class="muted mini">La richesse est dans le chemin, pas dans le nombre de portes ouvertes en même temps.</p>
          </div>
        </div>
      </section>
    `;
  }

  function renderSoin() {
    const c = activeCycle();
    const oneStepMode = data.settings.oneStepMode !== false;
    const showFullPath = !oneStepMode || c?.showFullPath === true;
    if (!c) {
      return `
        <div class="card">
          <h2>Soin guidé</h2>
          <p class="muted">Aucun Cycle de Feu actif.</p>
          <button class="primary" data-action="new-cycle">Créer un Cycle de Feu</button>
        </div>
      `;
    }

    return `
      <section class="step-shell">
        ${renderLastNotice()}
        <div class="toolbar">
          <div>
            <strong>${escapeHtml(visibleCycleTitle(c))}</strong><br />
            <small>${escapeHtml(visibleStepProgress(c.currentStep))}</small>
          </div>
          <div class="actions" style="margin:0">
            <button class="ghost" data-action="body-return">Retour au corps</button>
            <button class="danger" data-action="strong-close">Trop fort — fermer</button>
            ${oneStepMode ? "" : `
              <button class="ghost" data-action="set-numb-mode">Je ne ressens rien</button>
              <button class="ghost" data-tab="boussole">Quitter</button>
            `}
          </div>
        </div>

        ${oneStepMode ? `
          <div class="path-guide">
            <p class="muted mini">L’application tient la carte. Toi, tu n’as besoin que de la prochaine marche.</p>
            <button class="ghost" data-action="toggle-full-path">${showFullPath ? "Replier le chemin" : "Voir le chemin complet"}</button>

            <button class="ghost" data-action="close-cycle-soft">Fermer proprement</button>

        </div>

    `;

  function renderStepPath(cycle) {
    return `
      <div class="progress" aria-label="Chemin complet du soin">

          <button
            class="dot ${index === cycle.currentStep ? "active" : ""} ${index < cycle.currentStep ? "done" : ""}"

            title="${escapeAttr(visibleStepLabel(index))}"
            aria-label="${escapeAttr(visibleStepLabel(index))}">
            ${index === 0 ? "P" : index}
          </button>
        `).join("")}
      </div>
    `;
  }

  function renderMaskedCycleStep(cycle) {
    return `
      <h2>Textes bruts masqués</h2>
      <p class="muted">
        Les réponses libres de ce Cycle sont cachées à l’écran. Les données restent présentes localement :
        ce masquage n’est pas un chiffrement.
      </p>
      <div class="notice">
        Étape actuelle : <strong>${escapeHtml(visibleStepProgress(cycle.currentStep))}</strong><br />

      </div>
      <div class="actions">
        <button class="primary" data-action="toggle-cycle-raw-visibility" data-id="${escapeAttr(cycle.id)}">Réafficher les textes bruts</button>
      </div>
    `;
  }

  function renderStep(cycle) {
    const step = cycle.currentStep;
    const a = getStepAnswers(step);

    if (step === 0) {
      return `
        <h2>Préparer le cadre</h2>
        <p class="muted">On ouvre un contenant simple : un nom, une intention, une profondeur.</p>

        <label>Nom du Cycle de Feu</label>
        <input data-cycle-title value="${escapeAttr(cycle.title)}" placeholder="Ex : Colère dans la gorge face à l’autorité" />

        <label>Intention du soin</label>
        <textarea data-field="intention" placeholder="Je veux reconnaître ce feu, libérer la charge, garder la force...">${escapeHtml(a.intention || "")}</textarea>

        <label>Profondeur pour cette session</label>
        <select data-field="depth">
          ${option("doux", "Doux — peu de phrases, fermeture rapide", a.depth)}
          ${option("profond", "Profond — exploration complète", a.depth)}
          ${option("intensif", "Intensif — direct, corporel, rituel", a.depth)}
        </select>

        <label>État de régulation</label>
        <select data-field="regulationMode">
          ${option("normal", "Je peux explorer doucement", a.regulationMode)}
          ${option("numb", "Je ne ressens rien — avancer par résonance", a.regulationMode)}
          ${option("tooActivated", "Je suis trop activé — fermer reste disponible", a.regulationMode)}
        </select>

        <div class="notice">
          Je n’entre pas ici pour nourrir la colère. J’entre ici pour l’entendre, l’exprimer, rendre la charge, et revenir plus libre.
        </div>
      `;
    }

    if (step === 1) {
      const intensity = Number(a.intensity || 0);
      return `
        <h2>Stabiliser le feu</h2>
        <p class="muted">Avant de creuser, on vérifie si le corps peut traverser maintenant.</p>

        ${cycleHasEntrySas(cycle) ? renderEntrySas(cycle, a) : `
          <label>Intensité actuelle : <strong>${intensity}/10</strong></label>
          <input type="range" min="0" max="10" data-field="intensity" value="${intensity}" />

          ${intensity >= 8 ? `
            <div class="notice dangerBox">
              Intensité haute. Corps d’abord, analyse ensuite. Ne prends aucune décision, n’envoie aucun message, ne cherche pas encore les grandes causes.
            </div>
          ` : `
            <div class="notice">
              Intensité traversable. Tu peux continuer doucement.
            </div>
          `}
        `}

        <label>Mini-ancrage effectué ?</label>
        ${checks("grounding", [
          "Pieds au sol",
          "Respiration lente",
          "Eau bue",
          "Regard autour de moi",
          "Mains sur cœur / ventre",
          "Je choisis de ne blesser personne"
        ], a.grounding)}

        <label>Si le corps parle difficilement</label>
        ${radios("regulationMode", [
          "normal|Je peux explorer doucement",
          "numb|Je ne ressens rien",
          "tooActivated|Je suis trop activé"
        ], a.regulationMode || "normal", true)}

        ${renderRegulationNotice(cycle)}

        ${currentRegulation(cycle) === "tooActivated" ? `
          <label>Fermeture forte effectuée</label>
          ${checks("strongCloseDone", libraryItems("strongCloseSteps").map(item => item.label), a.strongCloseDone)}
        ` : ""}
      `;
    }

    if (step === 2) {
      return `
        <h2>Identifier la colère visible</h2>
        <p class="muted">On nomme ce qui est déjà accessible, sans forcer la mémoire.</p>

        <label>Déclencheur apparent</label>
        <textarea data-field="trigger" placeholder="Ce qui a déclenché le feu...">${escapeHtml(a.trigger || "")}</textarea>

        <label>Contre quoi va ce feu ?</label>
        <textarea data-field="against" placeholder="Contre une situation, une parole, une injustice, un être, un système...">${escapeHtml(a.against || "")}</textarea>

        <label>Pour quoi se lève-t-il ?</label>
        <textarea data-field="forWhat" placeholder="Pour une limite, une dignité, une vérité, une protection...">${escapeHtml(a.forWhat || "")}</textarea>

        <label>Familles qui résonnent</label>
        ${checks("families", libraryLabels("families"), a.families)}

        <label>Colères secondaires à laisser au parking</label>
        <textarea data-field="secondaryAngers" placeholder="Autres feux aperçus, à ne pas ouvrir maintenant.">${escapeHtml(a.secondaryAngers || "")}</textarea>

        <div class="notice">
          Une seule colère suffit pour cette session. Les autres sont notées, pas perdues, pas ouvertes maintenant.
        </div>
      `;
    }

    if (step === 3) {
      const phrases = resonanceWave(cycle);
      const shown = phrases.length ? phrases : [
        "Je ne sais pas encore ce qui est là, mais mon corps peut répondre doucement.",
        "Je peux explorer par résonance sans forcer.",
        "Si rien ne bouge, cela peut être un calme, une fatigue ou un verrou."
      ];

      return `
        <h2>Éveiller la colère cachée</h2>
        <p class="muted">Lis lentement. Une phrase qui touche est une porte, pas une preuve. Vague limitée à ${RESONANCE_WAVE_LIMIT} phrases.</p>

        ${renderRegulationNotice(cycle)}

        <label>Phrases qui résonnent</label>
        ${checks("resonancePhrases", shown, a.resonancePhrases)}

        <label>Masques possibles du feu retourné</label>
        ${checks("masks", libraryLabels("masks"), a.masks)}

        <label>Ce que le corps répond</label>
        ${checks("bodySignals", [
          ...libraryLabels("zones"),
          "Larmes",
          "Froid",
          "Chaleur",
          "Vide",
          "Envie de fuir",
          "Envie de crier"
        ], a.bodySignals)}
      `;
    }

    if (step === 4) {
      return `
        <h2>Discerner ce qui m’appartient</h2>
        <p class="muted">On sépare la vérité utile de la charge inutile ou étrangère.</p>

        <label>Appartenance ressentie</label>
        ${checks("ownership", [
          "Personnel",
          "Ancien",
          "Enfant intérieur",
          "Familial / lignée",
          "Collectif",
          "Absorbé d’un autre être",
          "Spirituel / subtil",
          "Mélangé",
          "Je ne sais pas"
        ], a.ownership)}

        <label>Questions de clarté</label>
        <textarea data-field="discernmentNotes" placeholder="Est-ce proportionné ? Est-ce ancien ? Est-ce que cela me rend plus clair ou plus confus ?">${escapeHtml(a.discernmentNotes || "")}</textarea>

        <label>Permission utile maintenant</label>
        ${radios("permissionPhrase", libraryItems("permissionPhrases").map(item => item.text), a.permissionPhrase || "")}

        <div class="notice">
          Même si une influence, une mémoire ou un champ agit en moi, je reste gardien de mes actes.
        </div>
      `;
    }

    if (step === 5) {
      return `
        <h2>Trouver le vrai nom</h2>
        <p class="muted">Nommer juste permet souvent au feu de cesser de tourner en rond.</p>

        <label>Faux nom possible</label>
        <input data-field="falseName" value="${escapeAttr(a.falseName || "")}" placeholder="Ex : fatigue, jalousie, addiction, paresse, agacement..." />

        <label>Nom plus vrai</label>
        <input data-field="trueName" value="${escapeAttr(a.trueName || "")}" placeholder="Ex : colère d’avoir dû me taire..." />

        <label>Nom racine</label>
        <textarea data-field="rootName" placeholder="Ex : refus de continuer à porter ce qui n’est pas à moi...">${escapeHtml(a.rootName || "")}</textarea>

        <label>Permission pour nommer sans forcer</label>
        ${radios("namingPermission", libraryItems("permissionPhrases").map(item => item.text), a.namingPermission || "")}
      `;
    }

    if (step === 6) {
      const exit = a.exit || "";
      return `
        <h2>Faire sortir le feu</h2>
        <p class="muted">Ce qui sort ici n’est pas encore ce qui doit être envoyé, dit ou fait.</p>

        <label>Porte de sortie choisie</label>
        ${radios("exit", libraryLabels("exits"), exit)}

        ${exit ? `
          <div class="notice">
            Porte choisie : <strong>${escapeHtml(exit)}</strong><br />
            Fais une vague simple. Puis reviens ici noter ce qui a changé.
          </div>
        ` : ""}

        <label>Phrase courte à faire sortir</label>
        <input data-field="exitPhrase" value="${escapeAttr(a.exitPhrase || "")}" placeholder="Ex : Non. Stop. Je rends. Je reprends. Ce n’était pas juste." />

        <label>Intensité après sortie : <strong>${Number(a.intensityAfter || 0)}/10</strong></label>
        <input type="range" min="0" max="10" data-field="intensityAfter" value="${Number(a.intensityAfter || 0)}" />
      `;
    }

    if (step === 7) {
      return `
        <h2>Purifier et rendre la charge</h2>
        <p class="muted">On ne garde pas le poison. On garde l’information, la limite et la force.</p>

        <label>Élément de restitution</label>
        ${radios("element", libraryLabels("elements"), a.element || "")}

        <label>Ce que je rends</label>
        <textarea data-field="whatIReturn" placeholder="Honte, culpabilité, colère étrangère, obsession, charge collective...">${escapeHtml(a.whatIReturn || "")}</textarea>

        <label>Qualité récupérée</label>
        ${checks("qualities", libraryLabels("qualities"), a.qualities)}

        <div class="notice">
          Je rends la charge. Je garde la force. Je rends la rage. Je garde le courage.
        </div>
      `;
    }

    if (step === 8) {
      return `
        <h2>Se positionner dans la matière</h2>
        <p class="muted">Une colère traversée demande souvent une limite, une action ou une non-action claire.</p>

        <label>Limite intérieure</label>
        <textarea data-field="innerBoundary" placeholder="Ex : Je ne confonds plus paix et silence forcé.">${escapeHtml(a.innerBoundary || "")}</textarea>

        <label>Parole possible</label>
        <textarea data-field="spokenBoundary" placeholder="Ex : Je ne souhaite pas continuer cet échange dans ces conditions.">${escapeHtml(a.spokenBoundary || "")}</textarea>

        <label>Phrase de positionnement proposée</label>
        ${radios("positioningPhrase", libraryItems("positioningPhrases").map(item => item.text), a.positioningPhrase || "")}

        <label>Action concrète ou non-action juste</label>
        <textarea data-field="action" placeholder="Ex : ne pas répondre aujourd’hui, écrire demain, marcher, demander soutien, quitter un champ...">${escapeHtml(a.action || "")}</textarea>

        <label>Piste d’action / non-action</label>
        ${radios("actionOption", libraryItems("actionOptions").map(item => `${item.text}|${item.label}`), a.actionOption || "")}

        <label>Message en quarantaine, si besoin</label>
        <textarea data-field="quarantineMessage" placeholder="Brouillon à ne pas envoyer dans le feu.">${escapeHtml(a.quarantineMessage || "")}</textarea>
      `;
    }

    if (step === 9) {
      const summary = buildCycleSummary(cycle);
      const missing = cycleCompletionHints(cycle);
      return `
        <h2>Sceller et archiver</h2>
        <p class="muted">On ferme la session. Le feu peut revenir comme signal, non comme prison.</p>

        <div class="print-only">
          <h1>${escapeHtml(cycle.title)}</h1>
          <p>Feu Clair — synthèse de cycle · ${new Date(cycle.updatedAt).toLocaleDateString("fr-FR")}</p>
        </div>

        <div class="summary">${escapeHtml(summary)}</div>

        ${missing.length ? `
          <div class="notice">
            <strong>À compléter si possible, sans forcer :</strong> ${escapeHtml(missing.join(", "))}.<br />
            Tu peux quand même fermer proprement si le corps demande l’arrêt.
          </div>
        ` : `
          <div class="notice softBox">
            Les éléments essentiels sont présents pour une clôture claire.
          </div>
        `}

        <label>Phrase de clôture personnelle</label>
        <textarea data-field="closingPhrase" placeholder="Si cette énergie revient, elle revient comme signal. Je refuse l’ancien circuit.">${escapeHtml(a.closingPhrase || "")}</textarea>

        <label>Phrase de clôture proposée</label>
        ${radios("closingPreset", libraryItems("closingPhrases").map(item => item.text), a.closingPreset || "")}

        <label>Intégration après clôture</label>
        ${checks("integrationDone", libraryItems("integrationSteps").map(item => item.label), a.integrationDone)}

        <label>Prochaine marche douce</label>
        <textarea data-field="nextGentleStep" placeholder="Ex : ne rien rouvrir aujourd’hui, dormir, imprimer la synthèse, demander soutien demain.">${escapeHtml(a.nextGentleStep || "")}</textarea>

        <div class="actions">
          <button class="primary" data-action="archive-cycle">Clôturer ce Cycle</button>
          <button class="ghost" data-action="print">Imprimer / PDF</button>
        </div>
      `;
    }
  }

    const cycles = data.cycles;
    return `

        </div>

        ${cycles.length ? cycles.map((c, index) => `
          <div class="card">

              <div class="notice dangerBox mini">Reprise douce : commencer par Stabiliser, sans ouvrir une nouvelle couche trop vite.</div>
            ` : ""}
            ${c.rawTextsHidden ? `
              <div class="notice mini">Textes bruts masqués à l’écran pour ce Cycle.</div>
            ` : cycleMiniSummary(c) ? `<pre class="summary mini">${escapeHtml(cycleMiniSummary(c))}</pre>` : ""}
            <div class="actions">
              <button class="primary" data-action="open-cycle" data-id="${c.id}">Continuer</button>
              <button class="ghost" data-action="review-cycle" data-id="${c.id}">Relire la synthèse</button>

              <button class="ghost" data-action="export-cycle-anonymized-json" data-id="${c.id}">Exporter anonymisé</button>
              <button class="ghost" data-action="export-cycle-summary-json" data-id="${c.id}">Exporter synthèse avec textes</button>
              <button class="ghost" data-action="export-cycle-no-raw-json" data-id="${c.id}">Exporter sans textes bruts</button>
              <button class="ghost" data-action="duplicate-cycle" data-id="${c.id}">Dupliquer</button>
              <button class="ghost" data-action="toggle-cycle-raw-visibility" data-id="${c.id}">${c.rawTextsHidden ? "Réafficher les textes bruts" : "Masquer les textes bruts"}</button>

        `).join("") : `
          <div class="card">
            <p class="muted">Aucun Cycle de Feu enregistré.</p>
          </div>
        `}
      </section>
    `;
  }

  function buildCycleSummary(c) {
    const s = c.answers;
    const a2 = s[2] || {};
    const a3 = s[3] || {};
    const a4 = s[4] || {};
    const a5 = s[5] || {};
    const a6 = s[6] || {};
    const a7 = s[7] || {};
    const a8 = s[8] || {};
    const a9 = s[9] || {};

    return [
      `Cycle : ${c.title}`,
      ``,
      `Déclencheur : ${a2.trigger || "—"}`,
      `Contre quoi : ${a2.against || "—"}`,
      `Pour quoi : ${a2.forWhat || "—"}`,
      `Parking : ${a2.secondaryAngers || "—"}`,
      ``,
      `Familles : ${(a2.families || []).join(", ") || "—"}`,
      `Résonances : ${(a3.resonancePhrases || []).join(" / ") || "—"}`,
      `Masques : ${(a3.masks || []).join(", ") || "—"}`,
      `Appartenance : ${(a4.ownership || []).join(", ") || "—"}`,
      `Permission : ${a4.permissionPhrase || "—"}`,
      ``,
      `Vrai nom : ${a5.trueName || "—"}`,
      `Nom racine : ${a5.rootName || "—"}`,
      `Permission de nommage : ${a5.namingPermission || "—"}`,
      ``,
      `Sortie : ${a6.exit || "—"}`,
      `Phrase sortie : ${a6.exitPhrase || "—"}`,
      `Intensité après sortie : ${a6.intensityAfter || "—"}/10`,
      ``,
      `Élément : ${a7.element || "—"}`,
      `Ce que je rends : ${a7.whatIReturn || "—"}`,
      `Qualités récupérées : ${(a7.qualities || []).join(", ") || "—"}`,
      ``,
      `Limite intérieure : ${a8.innerBoundary || "—"}`,
      `Parole possible : ${a8.spokenBoundary || "—"}`,
      `Positionnement : ${a8.positioningPhrase || "—"}`,
      `Action / non-action : ${a8.action || a8.actionOption || "—"}`,
      ``,
      `Clôture : ${a9.closingPreset || a9.closingPhrase || "—"}`,
      `Intégration : ${(a9.integrationDone || []).join(", ") || "—"}`,
      `Prochaine marche douce : ${a9.nextGentleStep || "—"}`
    ].join("\n");
  }

  function bindDynamicEvents() {
    document.querySelectorAll("[data-tab]").forEach(el => {
      if (el.dataset.boundTab === "1") return;
      el.dataset.boundTab = "1";
      el.addEventListener("click", () => setTab(el.dataset.tab, el.dataset.tool || null, toolDraftFromDataset(el)));
    });

    document.querySelectorAll("[data-tool]").forEach(el => {
      if (el.dataset.tab) return;
      if (el.dataset.boundTool === "1") return;
      el.dataset.boundTool = "1";
      el.addEventListener("click", () => setTab("outils", el.dataset.tool, toolDraftFromDataset(el)));
    });

    document.querySelectorAll("[data-step]").forEach(el => {
      if (el.dataset.boundStep === "1") return;
      el.dataset.boundStep = "1";
      el.addEventListener("click", () => setStep(Number(el.dataset.step)));
    });

    document.querySelectorAll("[data-field]").forEach(el => {
      if (el.dataset.boundField === "1") return;
      el.dataset.boundField = "1";
      el.addEventListener("input", () => {
        const step = activeCycle()?.currentStep ?? 0;
        if (el.type === "checkbox") return;
        setAnswer(step, el.dataset.field, el.value);
        if (el.type === "range") render();
      });
      el.addEventListener("change", () => {
        const step = activeCycle()?.currentStep ?? 0;
        setAnswer(step, el.dataset.field, el.value);
        if (el.tagName === "SELECT" || el.type === "range") render();
      });
    });

    document.querySelectorAll("[data-check-group]").forEach(box => {
      if (box.dataset.boundCheckGroup === "1") return;
      box.dataset.boundCheckGroup = "1";
      box.addEventListener("change", () => {
        const step = activeCycle()?.currentStep ?? 0;
        const key = box.dataset.checkGroup;
        const values = [...box.querySelectorAll("input:checked")].map(i => i.value);
        setAnswer(step, key, values);
      });
    });

    document.querySelectorAll("[data-radio-group]").forEach(box => {
      if (box.dataset.boundRadioGroup === "1") return;
      box.dataset.boundRadioGroup = "1";
      box.addEventListener("change", () => {
        const step = activeCycle()?.currentStep ?? 0;
        const key = box.dataset.radioGroup;
        const selected = box.querySelector("input:checked");
        setAnswer(step, key, selected ? selected.value : "");
        render();
      });
    });

    document.querySelectorAll("[id^='micro-'], [id^='body-scan-'], [id^='memory-'], [id^='authority-'], [data-static-check-group]").forEach(el => {
      if (el.dataset.boundToolDraft === "1") return;
      el.dataset.boundToolDraft = "1";
      const eventName = el.tagName === "SELECT" || el.type === "checkbox" ? "change" : "input";
      el.addEventListener(eventName, saveActiveToolDraft);
    });

    document.querySelectorAll("[data-setting]").forEach(el => {
      if (el.dataset.boundSetting === "1") return;
      el.dataset.boundSetting = "1";
      el.addEventListener("change", () => {
        data.settings[el.dataset.setting] = el.type === "checkbox" ? el.checked : el.value;
        saveData();
        render();
      });
    });

    document.querySelectorAll("[data-library-toggle]").forEach(el => {
      if (el.dataset.boundLibraryToggle === "1") return;
      el.dataset.boundLibraryToggle = "1";
      el.addEventListener("change", () => {
        data.settings.libraryEnabled ||= cloneData(DEFAULT_DATA.settings.libraryEnabled);
        data.settings.libraryEnabled[el.dataset.libraryToggle] = el.checked;
        saveData();
        render();
      });
    });

    document.querySelectorAll("[data-advanced-setting]").forEach(el => {
      if (el.dataset.boundAdvancedSetting === "1") return;
      el.dataset.boundAdvancedSetting = "1";
      el.addEventListener("change", () => {
        data.settings.advancedContent ||= cloneData(DEFAULT_DATA.settings.advancedContent);
        data.settings.advancedContent[el.dataset.advancedSetting] = el.checked;
        saveData();
        render();
      });
    });

    document.querySelectorAll("[data-privacy-setting]").forEach(el => {
      if (el.dataset.boundPrivacySetting === "1") return;
      el.dataset.boundPrivacySetting = "1";
      el.addEventListener("change", () => {
        data.settings.privacy ||= cloneData(DEFAULT_DATA.settings.privacy);
        data.settings.privacy[el.dataset.privacySetting] = el.checked;
        if (el.dataset.privacySetting === "localVeilEnabled" && el.checked) {
          setLocalVeilUnlocked(true);
        }
        if (el.dataset.privacySetting === "localVeilEnabled" && !el.checked) {
          setLocalVeilUnlocked(false);
        }
        saveData();
        render();
      });
    });

    document.querySelectorAll("[data-cycle-title]").forEach(el => {
      if (el.dataset.boundCycleTitle === "1") return;
      el.dataset.boundCycleTitle = "1";
      el.addEventListener("input", () => updateCycle({ title: el.value || "Cycle sans titre" }));
    });

    document.querySelectorAll("[data-action]").forEach(el => {
      if (el.dataset.boundAction === "1") return;
      el.dataset.boundAction = "1";
      const action = el.dataset.action;

      if (action === "import-json") {
        el.addEventListener("change", importJson);
      } else {
        el.addEventListener("click", () => handleAction(el));
      }
    });
  }

  function saveActiveToolDraft() {
    data.toolDraft ||= {};
    if (data.activeTab === "micro") data.toolDraft.micro = readMicroDraft();
    if (data.activeTool === "body-scan") data.toolDraft.bodyScan = readBodyScan();
    if (data.activeTool === "memory") data.toolDraft.memory = readBodyMemory();
    if (data.activeTool === "authority") data.toolDraft.authority = readAuthoritySession();
    saveData();
  }

  function handleAction(el) {
    const action = el.dataset.action;

    if (action === "toggle-theme") {
      data.settings.theme = data.settings.theme === "dark" ? "light" : "dark";
      saveData();
      render();
    }

    if (action === "unlock-local-veil") {
      const value = (document.querySelector("#local-veil-input")?.value || "").trim().toUpperCase();
      if (value !== "OUVRIR") {
        alert("Tape OUVRIR pour lever le voile de cette session.");
        return;
      }
      setLocalVeilUnlocked(true);
      render();
    }

    if (action === "disable-local-veil") {
      data.settings.privacy ||= cloneData(DEFAULT_DATA.settings.privacy);
      data.settings.privacy.localVeilEnabled = false;
      setLocalVeilUnlocked(false);
      saveData();
      render();
    }

    if (action === "new-cycle") createCycle();

    if (action === "tools-list") {
      data.activeTab = "outils";
      data.activeTool = null;
      saveData();
      render();
    }

    if (action === "prev-step") setStep((activeCycle()?.currentStep || 0) - 1);

    if (action === "next-step") advanceStep();

    if (action === "toggle-full-path") {
      const c = activeCycle();
      if (!c) return;
      c.showFullPath = c.showFullPath !== true;
      c.updatedAt = nowISO();
      saveData();
      render();
    }

    if (action === "save-and-close") {
      updateCycle({ status: "en pause" });
      setTab("boussole");
    }

    if (action === "close-cycle-soft") {
      updateCycle({ status: "fermé pour aujourd’hui" });
      setTab("boussole");
    }

    if (action === "set-numb-mode") {
      const c = activeCycle();
      if (!c) return;
      c.regulationMode = "numb";
      c.answers[1] ||= {};
      c.answers[1].regulationMode = "numb";
      c.updatedAt = nowISO();
      saveData();
      render();
    }

    if (action === "strong-close") {
      const c = activeCycle();
      if (!c) return;
      const step = c.currentStep;
      c.status = "à revisiter doucement";
      c.regulationMode = "tooActivated";
      c.answers[step] ||= {};
      c.answers[step].closedBecauseTooActivated = true;
      c.answers[9] ||= {};
      c.answers[9].closingPreset ||= "Pas plus aujourd’hui. Je ferme proprement, je garde la force, je laisse le corps intégrer.";
      c.updatedAt = nowISO();
      data.lastNotice = {
        text: "Cycle fermé proprement. Pas plus aujourd’hui : le corps peut intégrer, et ce feu pourra être revisité doucement.",
