  function addCustomLibraryEntry() {
    const key = document.querySelector("#custom-library-key")?.value || "resonance";
    const text = (document.querySelector("#custom-library-text")?.value || "").trim();
    const family = document.querySelector("#custom-library-family")?.value || "";
    const mode = document.querySelector("#custom-library-mode")?.value || "doux";

    if (!text) {
      alert("Ajout impossible : écris d’abord un texte ou un libellé.");
      return;
    }

    data.library[key] ||= [];
    const signature = slugify(text);
    if (data.library[key].some(item => slugify(normalizeLibraryItem(item, key).text || normalizeLibraryItem(item, key).label) === signature)) {
      setNotice("Cette entrée existe déjà dans cette bibliothèque. Aucun doublon n’a été ajouté.");
      render();
      return;
    }
    const entry = normalizeLibraryItem({
      id: `custom_${key}_${slugify(text).slice(0, 36) || Date.now()}`,
      label: text,
      text,
      family,
      mode,
      intensity: mode === "intensif" ? "direct" : "doux",
      tags: ["personnalisé"],
      active: true,
      custom: true,
      createdAt: nowISO()
    }, key);

    if (data.library[key].some(item => normalizeLibraryItem(item, key).id === entry.id)) {
      entry.id = `${entry.id}_${Math.random().toString(16).slice(2, 6)}`;
    }

    data.library[key].push(entry);
    setNotice("Entrée personnalisée ajoutée au Sanctuaire. Elle reste locale et sera incluse dans l’export JSON.");
    saveData();
    render();
  }

  function removeCustomLibraryEntry(key, id) {
    if (!key || !id || !Array.isArray(data.library?.[key])) return;
    data.library[key] = data.library[key].filter(item => normalizeLibraryItem(item, key).id !== id);
    setNotice("Entrée personnalisée retirée.");
    saveData();
    render();
  }

  function clearLocalTrace(key) {
    const labels = {
      microSessions: "les micro-soins",
      bodyScans: "les scans corporels",
      bodyMemorySessions: "les sas Mémoire du Corps",
      authoritySessions: "les sas Feu d’Autorité"
    };
    if (!Object.prototype.hasOwnProperty.call(labels, key) || !Array.isArray(data[key])) return;
    const count = data[key].length;
    if (!count) {
      setNotice(`Aucune trace à effacer pour ${labels[key]}.`);
      render();
      return;
    }
    if (!confirm(`Effacer ${labels[key]} enregistrés localement ? Les Cycles de Feu ne seront pas supprimés.`)) return;
    data[key] = [];
    setNotice(`${count} trace${count > 1 ? "s" : ""} effacée${count > 1 ? "s" : ""} pour ${labels[key]}.`);
    saveData();
    render();
  }

  function clearAllLocalTraces() {
    const keys = ["microSessions", "bodyScans", "bodyMemorySessions", "authoritySessions"];
    const count = keys.reduce((sum, key) => sum + (Array.isArray(data[key]) ? data[key].length : 0), 0);
    if (!count) {
      setNotice("Aucune trace ponctuelle à effacer.");
      render();
      return;
    }
    if (!confirm("Effacer toutes les traces ponctuelles enregistrées localement ? Les Cycles de Feu seront conservés.")) return;
    keys.forEach(key => {
      data[key] = [];
    });
    setNotice(`${count} trace${count > 1 ? "s" : ""} ponctuelle${count > 1 ? "s" : ""} effacée${count > 1 ? "s" : ""}. Les Cycles restent conservés.`);
    saveData();
    render();
  }

  function exportJson(options = {}) {
    const payload = options.anonymized ? anonymizedExportData() : data;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = options.anonymized ? `feu-clair-export-anonymise-${date}.json` : `feu-clair-export-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportCycleJson(cycleId, options = {}) {
    const cycle = data.cycles.find(c => c.id === cycleId);
    if (!cycle) return;
    const payload = cycleExportData(cycle, options);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    const name = slugify(cycle.title || "cycle");
    a.href = url;
    a.download = options.summaryOnly
      ? `feu-clair-cycle-synthese-${name || "cycle"}-${date}.json`
      : options.withoutRawTexts
        ? `feu-clair-cycle-sans-textes-bruts-${name || "cycle"}-${date}.json`
        : options.anonymized
          ? `feu-clair-cycle-anonymise-${date}.json`
          : `feu-clair-cycle-${name || "cycle"}-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importJson(event) {
    const file = event.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (imported?.app === "feu-clair" && imported?.cycle) {
          if (!confirm("Importer ce Cycle dans le Carnet actuel ? Les données existantes seront conservées.")) return;
          const cycle = normalizeImportedCycle(imported.cycle);
          data.cycles.unshift(cycle);
          data.activeCycleId = cycle.id;
          data.activeTab = "carnet";
          setNotice("Cycle importé dans le Carnet.");
          saveData();
          render();
          return;
        }

        const looksLikeFullExport = imported?.app === "feu-clair"
          || Array.isArray(imported?.cycles)
          || imported?.settings
          || imported?.version;
        if (!looksLikeFullExport) {
          alert("Import impossible : ce JSON ne ressemble pas à un export Feu Clair.");
          return;
        }
        if (imported.exportMode === "anonymisé") {
          alert("Import impossible : un export anonymisé sert à partager ou archiver, pas à restaurer les données complètes.");
          return;
        }
        if (!confirm("Remplacer les données locales actuelles par ce fichier JSON ? Cette action écrase la session actuelle.")) return;
        data = normalizeData(imported);
        saveData();
        render();
      } catch (error) {
        alert("Import impossible : fichier JSON invalide.");
      } finally {
        event.target.value = "";
      }
    };
    reader.readAsText(file);
  }

  function normalizeImportedCycle(cycle) {
    const imported = cloneData(cycle || {});
    imported.id = uid("cycle");
    imported.title = imported.title || "Cycle importé";
    imported.status = CYCLE_STATUSES.includes(imported.status) ? imported.status : "ouvert";
    imported.currentStep = Number.isFinite(imported.currentStep) ? Math.max(0, Math.min(STEPS.length - 1, imported.currentStep)) : 0;
    imported.createdAt = imported.createdAt || nowISO();
    imported.updatedAt = nowISO();
    imported.answers = imported.answers && typeof imported.answers === "object" ? imported.answers : {};
    imported.notes = imported.notes || "";
    return imported;
  }

  function option(value, label, current) {
    const selected = value === current ? "selected" : "";
    return `<option value="${escapeAttr(value)}" ${selected}>${escapeHtml(label)}</option>`;
  }

  function checks(name, values, selected = []) {
    const current = Array.isArray(selected) ? selected : [];
    return `
      <div class="pill-list" data-check-group="${escapeAttr(name)}">
        ${values.map(v => `
          <label class="choice">
            <input type="checkbox" value="${escapeAttr(v)}" ${current.includes(v) ? "checked" : ""}>
            ${escapeHtml(v)}
          </label>
        `).join("")}
      </div>
    `;
  }

  function checksStatic(name, values, selected = []) {
    const current = Array.isArray(selected) ? selected : [];
    return `
      <div class="pill-list" data-static-check-group="${escapeAttr(name)}">
        ${values.map(v => `
          <label class="choice">
            <input type="checkbox" value="${escapeAttr(v)}" ${current.includes(v) ? "checked" : ""}>
            ${escapeHtml(v)}
          </label>
        `).join("")}
      </div>
    `;
  }

  function radios(name, values, selected = "") {
    return `
      <div class="pill-list" data-radio-group="${escapeAttr(name)}">
        ${values.map(v => {
          const parsed = parseChoice(v);
          return `
          <label class="choice">
            <input type="radio" name="${escapeAttr(name)}" value="${escapeAttr(parsed.value)}" ${selected === parsed.value || selected === parsed.label ? "checked" : ""}>
            ${escapeHtml(parsed.label)}
          </label>
        `}).join("")}
      </div>
    `;
  }

  function parseChoice(value) {
    if (typeof value !== "string") return { value: String(value ?? ""), label: String(value ?? "") };
    const parts = value.split("|");
    return parts.length > 1 ? { value: parts[0], label: parts.slice(1).join("|") } : { value, label: value };
  }

  function cloneData(value) {
    if (typeof structuredClone === "function") return structuredClone(value);
    return JSON.parse(JSON.stringify(value));
  }

  function readBodyScan() {
    const flags = [...document.querySelectorAll("[data-static-check-group='body-scan-flags'] input:checked")].map(input => input.value);
    const intensityRaw = document.querySelector("#body-scan-intensity")?.value || "";
    return {
      zone: document.querySelector("#body-scan-zone")?.value || "",
      sensation: document.querySelector("#body-scan-sensation")?.value || "",
      intensity: intensityRaw === "" ? null : Number(intensityRaw),
      signal: document.querySelector("#body-scan-signal")?.value || "",
      family: document.querySelector("#body-scan-family")?.value || "",
      flags
    };
  }

  function readBodyMemory() {
    const guards = [...document.querySelectorAll("[data-static-check-group='memory-guards'] input:checked")].map(input => input.value);
    const qualities = [...document.querySelectorAll("[data-static-check-group='memory-qualities'] input:checked")].map(input => input.value);
    return {
      level: document.querySelector("#memory-level")?.value || "effleurer",
      kind: document.querySelector("#memory-kind")?.value || "mémoire corporelle",
      zone: document.querySelector("#memory-zone")?.value || "",
      intensity: Number(document.querySelector("#memory-intensity")?.value || 0),
      note: document.querySelector("#memory-note")?.value || "",
      release: document.querySelector("#memory-release")?.value || "",
      qualities,
      afterState: document.querySelector("#memory-after-state")?.value || "à intégrer doucement",
      guards
    };
  }

  function readAuthoritySession() {
    const guards = [...document.querySelectorAll("[data-static-check-group='authority-guards'] input:checked")].map(input => input.value);
    const qualities = [...document.querySelectorAll("[data-static-check-group='authority-qualities'] input:checked")].map(input => input.value);
    return {
      targetType: document.querySelector("#authority-target-type")?.value || "charge",
      note: document.querySelector("#authority-note")?.value || "",
      intensity: Number(document.querySelector("#authority-intensity")?.value || 0),
      guards,
      qualities
    };
  }

  function createCycleFromBodyMemory(memory) {
    return {
      id: uid("cycle"),
      title: `Mémoire du Corps : ${memory.zone || "sas"}`,
      status: "ouvert",
      currentStep: 1,
      createdAt: nowISO(),
      updatedAt: nowISO(),
      entry: {
        source: "body_memory",
        requiresSas: true,
        zones: memory.zone ? [memory.zone] : [],
        intensity: memory.intensity,
        tags: [memory.kind, memory.level].filter(Boolean)
      },
      answers: {
        0: {
          intention: "Explorer une perception corporelle sans forcer une mémoire ni conclure à une preuve.",
          depth: memory.level === "traverser" ? "profond" : "doux",
          regulationMode: memory.intensity >= 7 ? "tooActivated" : "normal"
        },
        1: {
          intensity: memory.intensity,
          regulationMode: memory.intensity >= 7 ? "tooActivated" : "normal",
          grounding: memory.guards,
          entryStability: "",
          canReturnToBody: "",
          entryFlags: memory.intensity >= 7 ? ["Activation forte"] : []
        },
        2: {
          trigger: memory.zone,
          forWhat: "Discerner ce que ce signal corporel demande maintenant, sans forcer l’histoire.",
          bodyMemoryNotes: bodyMemorySummary(memory),
          families: []
        },
        4: {
          ownership: [memory.kind],
          discernmentNotes: "Sas Mémoire du Corps : perception à discerner, pas une preuve littérale."
        },
        7: {
          whatIReturn: memory.release,
          qualities: memory.qualities || []
        },
        9: {
          integrationDone: memory.afterState ? [memory.afterState] : [],
          closingPreset: memory.intensity >= 7
            ? "Pas plus aujourd’hui. Je ferme proprement, je garde la force, je laisse le corps intégrer."
            : defaultClosingPhrase()
        }
      }
    };
  }

  function bodyMemorySummary(memory) {
    return [
      `Niveau : ${memory.level}`,
      `Forme : ${memory.kind}`,
      `Zone : ${memory.zone || "—"}`,
      `Intensité : ${memory.intensity}/10`,
      `Note : ${memory.note || "—"}`,
      `Rendu possible : ${memory.release || "—"}`,
      `Qualités / parts qui reviennent : ${(memory.qualities || []).join(", ") || "—"}`,
      `État après : ${memory.afterState || "—"}`,
      `Garde-fous : ${memory.guards.join(", ") || "—"}`
    ].join("\n");
  }

  function createCycleFromAuthority(session) {
    const guarded = session.guards.includes("Je ne dirige pas ce feu contre un être vivant présent")
      && session.guards.includes("Je reste gardien de mes actes")
      && session.guards.includes("Je peux fermer maintenant");
    const needsStabilizing = session.intensity >= 7 || !guarded;
    return {
      id: uid("cycle"),
      title: `Feu d’Autorité : ${session.targetType || "charge"}`,
      status: "ouvert",
      currentStep: 1,
      createdAt: nowISO(),
      updatedAt: nowISO(),
      entry: {
        source: "authority_session",
        requiresSas: true,
        intensity: session.intensity,
        tags: [session.targetType].filter(Boolean)
      },
      answers: {
        0: {
          intention: "Diriger le feu symboliquement contre une charge, jamais contre un être vivant présent.",
          depth: "profond",
          regulationMode: needsStabilizing ? "tooActivated" : "normal"
        },
        1: {
          intensity: session.intensity,
          regulationMode: needsStabilizing ? "tooActivated" : "normal",
          grounding: session.guards,
          entryStability: "",
          canReturnToBody: session.guards.includes("Je garde une part de moi reliée au corps") ? "yes" : "",
          entryFlags: needsStabilizing ? ["Activation forte"] : []
        },
        2: {
          trigger: `Sas Feu d’Autorité : ${session.targetType}`,
          forWhat: "Discerner ce qui doit être rendu, coupé ou transmuté sans perdre la responsabilité des actes.",
          families: ["Colère spirituelle"],
          authorityNotes: authoritySummary(session)
        },
        4: {
          ownership: ["Signature à discerner"],
          discernmentNotes: "Feu d’Autorité : expression intérieure symbolique. Ne pas conclure à une cause unique."
        },
        7: {
          qualities: session.qualities || []
        },
        9: {
          closingPreset: "Même si une influence, une mémoire ou un champ agit en moi, je reste gardien de mes actes."
        }
      }
    };
  }

  function authoritySummary(session) {
    return [
      `Cible symbolique : ${session.targetType || "—"}`,
      `Intensité : ${session.intensity}/10`,
      `Formulation : ${session.note || "—"}`,
      `Garde-fous : ${session.guards.join(", ") || "—"}`,
      `Qualités à récupérer : ${(session.qualities || []).join(", ") || "—"}`
    ].join("\n");
  }

  function bodyScanNeedsStabilizing(scan) {
    const alertFlags = ["Confusion", "Envie de fuir", "Vide inquiétant", "Trop activé", "Je préfère fermer proprement"];
    if (scan.intensity === null) return true;
    if (scan.intensity >= 7) return true;
    if (scan.flags.some(flag => alertFlags.includes(flag))) return true;
    return !scan.flags.includes("Je me sens assez stable pour identifier doucement")
      || !scan.flags.includes("Je peux revenir au corps maintenant");
  }

  function createCycleFromBodyScan(scan) {
    const needsStabilizing = bodyScanNeedsStabilizing(scan);
    return {
      id: uid("cycle"),
      title: `Zone : ${scan.zone || "corps"}`,
      status: "ouvert",
      currentStep: needsStabilizing ? 1 : 2,
      createdAt: nowISO(),
      updatedAt: nowISO(),
      entry: {
        source: "body_scan",
        requiresSas: needsStabilizing,
        zones: scan.zone ? [scan.zone] : [],
        intensity: scan.intensity,
        tags: [scan.family].filter(Boolean)
      },
      answers: {
        0: {
          intention: "Explorer une zone du corps sans forcer l’histoire.",
          depth: "doux",
          regulationMode: needsStabilizing ? "tooActivated" : "normal"
        },
        1: {
          intensity: scan.intensity ?? "",
          regulationMode: needsStabilizing ? "tooActivated" : "normal",
          entryStability: scan.flags.includes("Je me sens assez stable pour identifier doucement") ? "stable" : "",
          canReturnToBody: scan.flags.includes("Je peux revenir au corps maintenant") ? "yes" : "",
          entryFlags: scan.flags.filter(flag => ["Confusion", "Envie de fuir", "Vide inquiétant", "Trop activé"].includes(flag))
            .map(flag => flag === "Trop activé" ? "Activation forte" : flag)
        },
        2: {
          trigger: scan.zone,
          forWhat: scan.signal || "Écouter ce que cette zone cherche à protéger.",
          families: scan.family ? [scan.family] : [],
          bodyScanNotes: bodyScanSummary(scan)
        },
        3: {
          bodySignals: scan.zone ? [scan.zone] : []
        }
      }
    };
  }

  function bodyScanSummary(scan) {
    return [
      `Zone : ${scan.zone || "—"}`,
      `Sensation : ${scan.sensation || "—"}`,
      `Intensité : ${scan.intensity === null ? "inconnue" : `${scan.intensity}/10`}`,
      `Signal : ${scan.signal || "—"}`,
      `Famille possible : ${scan.family || "—"}`,
      `État : ${scan.flags.join(", ") || "—"}`
    ].join("\n");
  }

  function escapeHtml(str) {
    return String(str ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(str) {
    return escapeHtml(str);
  }

  render();
})();
</script>
</body>
</html>
